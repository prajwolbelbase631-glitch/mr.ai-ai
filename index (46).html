 at the proper time. Organic manure such as compost and green manure should also be used. This balanced approach can maintain soil fertility while supporting good crop production."},{"g":"9","n":19,"c":"Materials Used in Agriculture","a":"materials used in agriculture agriculture materials कृषिमा प्रयोग हुने सामग्री कृषि सामग्री fertilizer and insecticide","t":"Materials Used in Agriculture – Exercise 4(e): What could be alternatives to farmers who do not want to use chemical fertilizer? Write advantages of that kind of fertilizer. | कृषिमा प्रयोग हुने सामग्री अभ्यास 4(e)","q":"What could be alternatives to farmers who do not want to use chemical fertilizer? Write advantages of that kind of fertilizer.","o":"4(e)","s":"","x":"Chapter: Materials Used in Agriculture (कृषिमा प्रयोग हुने सामग्री) – Class 9 Science. Exercise 4(e).\n\nFarmers can use **organic fertilizers** such as:\n- Compost manure\n- Green manure\n- Bone powder\n- Mustard cake powder\n\n**Advantages**\n1. They increase the fertility and organic matter of soil.\n2. They are biodegradable and cause less environmental pollution.\n3. They help maintain soil quality for a long time.\n4. Crops grown using organic manure can be nutritious and hygienic when properly managed."},{"g":"9","n":19,"c":"Materials Used in Agriculture","a":"materials used in agriculture agriculture materials कृषिमा प्रयोग हुने सामग्री कृषि सामग्री fertilizer and insecticide","t":"Materials Used in Agriculture – Exercise 4(f): What is chemical insecticide? Write any two examples. | कृषिमा प्रयोग हुने सामग्री अभ्यास 4(f)","q":"What is chemical insecticide? Write any two examples.","o":"4(f)","s":"","x":"Chapter: Materials Used in Agriculture (कृषिमा प्रयोग हुने सामग्री) – Class 9 Science. Exercise 4(f).\n\n**Chemical insecticides** are chemical compounds manufactured on an industrial scale and used to kill or control harmful insects that damage crops.\n\nExamples: 1. DDT 2. BHC"},{"g":"9","n":19,"c":"Materials Used in Agriculture","a":"materials used in agriculture agriculture materials कृषिमा प्रयोग हुने सामग्री कृषि सामग्री fertilizer and insecticide","t":"Materials Used in Agriculture – Exercise 4(g): What is bio-insecticide? Write any two examples. | कृषिमा प्रयोग हुने सामग्री अभ्यास 4(g)","q":"What is bio-insecticide? Write any two examples.","o":"4(g)","s":"","x":"Chapter: Materials Used in Agriculture (कृषिमा प्रयोग हुने सामग्री) – Class 9 Science. Exercise 4(g).\n\n**Bio-insecticides** are natural materials obtained mainly from plants or other biological sources that are used to control harmful insects.\n\nExamples: 1. Neem leaves/juice 2. Jholmol\n\nAsh is also an example of a bio-insecticide used traditionally by farmers."},{"g":"9","n":19,"c":"Materials Used in Agriculture","a":"materials used in agriculture agriculture materials कृषिमा प्रयोग हुने सामग्री कृषि सामग्री fertilizer and insecticide","t":"Materials Used in Agriculture – Exercise 4(h): \"Use of chemical insecticides should be replaced by the use of bio-insecticides.\" Justify this statement with two examples. | कृषिमा प्रयोग हुने सामग्री अभ्यास 4(h)","q":"\"Use of chemical insecticides should be replaced by the use of bio-insecticides.\" Justify this statement with two examples.","o":"4(h)","s":"","x":"Chapter: Materials Used in Agriculture (कृषिमा प्रयोग हुने सामग्री) – Class 9 Science. Exercise 4(h).\n\nBio-insecticides are generally safer for the environment and human health than excessive use of chemical insecticides. They cause less pollution and are less harmful to useful organisms.\n\n**Examples**\n1. **Neem:** Neem leaves or neem juice can be used to control harmful insects instead of chemical insecticides.\n2. **Titepati (mugwort):** Titepati can be used as a natural insect-control material.\n\nThus, where effective, bio-insecticides can reduce dependence on harmful chemical insecticides."},{"g":"9","n":19,"c":"Materials Used in Agriculture","a":"materials used in agriculture agriculture materials कृषिमा प्रयोग हुने सामग्री कृषि सामग्री fertilizer and insecticide","t":"Materials Used in Agriculture – Exercise 4(i): Write the importance of the use of chemical fertilizer and use of insecticides. | कृषिमा प्रयोग हुने सामग्री अभ्यास 4(i)","q":"Write the importance of the use of chemical fertilizer and use of insecticides.","o":"4(i)","s":"","x":"Chapter: Materials Used in Agriculture (कृषिमा प्रयोग हुने सामग्री) – Class 9 Science. Exercise 4(i).\n\n**Importance of chemical fertilizer:** Chemical fertilizers supply essential nutrients such as nitrogen, phosphorus and potassium. They are easily soluble in water, so plants can absorb nutrients quickly. They help improve plant growth and increase crop production.\n\n**Importance of insecticides:** Insecticides kill or control harmful insects that damage crops. They protect vegetables, fruits and other crops and help farmers obtain higher production."},{"g":"9","n":19,"c":"Materials Used in Agriculture","a":"materials used in agriculture agriculture materials कृषिमा प्रयोग हुने सामग्री कृषि सामग्री fertilizer and insecticide","t":"Materials Used in Agriculture – Exercise 4(j): Write any two slogans that help promote public awareness. | कृषिमा प्रयोग हुने सामग्री अभ्यास 4(j)","q":"Write any two slogans that help promote public awareness.","o":"4(j)","s":"","x":"Chapter: Materials Used in Agriculture (कृषिमा प्रयोग हुने सामग्री) – Class 9 Science. Exercise 4(j).\n\n1. \"Use fertilizer wisely, keep the soil healthy and productive.\"\n2. \"Choose safe insect control, protect our food, health and environment.\""},{"g":"9","n":19,"c":"Materials Used in Agriculture","a":"materials used in agriculture agriculture materials कृषिमा प्रयोग हुने सामग्री कृषि सामग्री fertilizer and insecticide","t":"Materials Used in Agriculture – Exercise 4(k): Write any two effects of excessive use of chemical insecticides with examples. | कृषिमा प्रयोग हुने सामग्री अभ्यास 4(k)","q":"Write any two effects of excessive use of chemical insecticides with examples.","o":"4(k)","s":"","x":"Chapter: Materials Used in Agriculture (कृषिमा प्रयोग हुने सामग्री) – Class 9 Science. Exercise 4(k).\n\n**1. Pollution of the environment:** Excessive chemical insecticides such as **DDT** can pollute soil, air and water and can harm aquatic organisms.\n\n**2. Harm to human health:** Exposure to chemical insecticides can affect the **nervous and glandular systems**. For example, DDT exposure can also cause health problems such as respiratory effects."},{"g":"9","n":19,"c":"Materials Used in Agriculture","a":"materials used in agriculture agriculture materials कृषिमा प्रयोग हुने सामग्री कृषि सामग्री fertilizer and insecticide","t":"Materials Used in Agriculture – Exercise 4(l): Write two examples of alternatives to chemical fertilizer and chemical insecticides used around you. | कृषिमा प्रयोग हुने सामग्री अभ्यास 4(l)","q":"Write two examples of alternatives to chemical fertilizer and chemical insecticides used around you.","o":"4(l)","s":"","x":"Chapter: Materials Used in Agriculture (कृषिमा प्रयोग हुने सामग्री) – Class 9 Science. Exercise 4(l).\n\n**Alternatives to chemical fertilizer:** 1. Compost manure 2. Green manure\n\n**Alternatives to chemical insecticides:** 1. Neem leaves/juice 2. Jholmol\n\nThese alternatives can help reduce excessive dependence on chemical agricultural materials."}];

var chats = [];        // list of {title, messages}
var currentChat = null;

function newChat() {
  currentChat = { title: "New chat", messages: [] };
  chats.unshift(currentChat);
  drawChats();
  show("home");
}

function drawChats() {
  var word = document.getElementById("search").value.toLowerCase();
  var html = "";
  for (var i = 0; i < chats.length; i++) {
    if (chats[i].title.toLowerCase().indexOf(word) === -1) continue;
    html += "<a href='#' class='chatitem' onclick='openChat(" + i + "); return false;'>" + safe(chats[i].title) + "</a>";
  }
  document.getElementById("chatlist").innerHTML = html || "<div class='small'>No chats yet</div>";
}

function openChat(i) { currentChat = chats[i]; show("home"); }

function words(text) {
  var list = text.toLowerCase().match(/[\p{L}\p{M}\p{N}]+/gu) || [];
  var skip = ["the","and","what","is","are","of","in","to","a","an","for","how","why","give","with","from","does","do","me","tell","about","explain","class","chapter","exercise","exercises","solve","all","science","grade"];
  return list.filter(function (w) { return w.length > 1 && skip.indexOf(w) === -1 && isNaN(w); });
}

function chapterName(n) { return n.c || n.t.split(" – ")[0]; }

// list of all chapters: {g: class, n: number, name: chapter name, count: items}
var chapters = [];
(function () {
  var seen = {};
  notes.forEach(function (n) {
    var key = n.g + "|" + chapterName(n);
    if (!seen[key]) { seen[key] = { g: n.g, n: n.n, name: chapterName(n), count: 0 }; chapters.push(seen[key]); }
    seen[key].count++;
  });
  chapters.sort(function (a, b) { return a.g === b.g ? a.n - b.n : a.g - b.g; });
})();

// number words so "first chapter" or "chapter one" also work
var numWords = ["one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
var ordWords = ["first","second","third","fourth","fifth","sixth","seventh","eighth","ninth","tenth","eleventh","twelfth","thirteenth","fourteenth","fifteenth","sixteenth","seventeenth","eighteenth","nineteenth"];
function toNumber(w) {
  if (/^\d+$/.test(w)) return +w;
  var k = numWords.indexOf(w);
  if (k === -1) k = ordWords.indexOf(w);
  return k === -1 ? 0 : k + 1;
}

// looks for "class 9", "chapter 5", "first chapter" or a chapter name inside the question
function chapterFromText(text) {
  var t = text.toLowerCase();
  var g = /((class|grade)\s*(10|ten|x)\b)|(10th\s*(class|grade))/.test(t) ? "10" : /((class|grade)\s*(9|nine|ix)\b)|(9th\s*(class|grade))/.test(t) ? "9" : "";
  var pat = "(\\d+|" + numWords.join("|") + "|" + ordWords.join("|") + ")";
  var m = t.match(new RegExp("(?:chapter|unit|lesson|ch\\.?)\\s*" + pat + "\\b")) ||
          t.match(new RegExp(pat + "(?:st|nd|rd|th)?\\s*(?:chapter|unit|lesson)"));
  var num = m ? toNumber(m[1]) : 0, found = null;
  chapters.forEach(function (c) {
    if (found || (g && c.g !== g)) return;
    var byName = t.indexOf(c.name.toLowerCase()) !== -1;
    var byNum = num && num === c.n && c.g === (g || "9");
    if (byName || byNum) found = c;
  });
  return { g: g, chap: found };
}

// true when the student wants the whole chapter ("class 9 chapter 1", "solve all exercises of ...")
function wantsWhole(text, f) {
  if (!f.chap) return false;
  var rest = words(text).filter(function (w) { return f.chap.name.toLowerCase().indexOf(w) === -1 && toNumber(w) === 0 && !/^(\d+)(st|nd|rd|th)$/.test(w); });
  return rest.length === 0 || /\ball\b|exercises|solve/i.test(text);
}

// builds the full chapter answer: every question with its answer, in order
var introLines = ["Let us go through all of these together, friend!", "Alright buddy, here are all of them one by one."];
var outroLines = ["That is real scientist thinking you have. Keep exploring!", "You think like a scientist! Keep asking why."];
function pickOne(list) { return list[Math.floor(Math.random() * list.length)]; }

function wholeChapter(c) {
  var h = pickOne(introLines) + "<br><b>All exercise answers</b>", lastSection = "";
  notes.forEach(function (n) {
    if (n.g !== c.g || chapterName(n) !== c.name) return;
    var body = n.x.replace(/^Chapter:[^\n]*\n+/, "");
    if (n.s && n.s !== lastSection) { lastSection = n.s; h += "<hr><h3>" + pretty(n.s) + "</h3>"; }
    h += "<hr><h4 style='margin-top:10px'>" + (n.o ? n.o + ". " : "") + pretty(n.q || n.t.split(" | ")[0]) + "</h4>" + pretty(body);
  });
  return h + "<hr><i>" + pickOne(outroLines) + "</i>";
}

// gives every note a score, returns the 2 best ones (also works for pasted questions with options, plurals, numbering)
function stem(w) { return w.length > 4 ? w.replace(/(ing|es|ed|s)$/, "") : w; }
function norm(t) { return " " + (t.toLowerCase().replace(/['’]/g, "").match(/[\p{L}\p{M}\p{N}]+/gu) || []).join(" ") + " "; }
function has(hay, tok) { return hay.indexOf(tok) !== -1 || (tok.length > 6 && hay.indexOf(tok.slice(0, tok.length - 3)) !== -1); }
function findAnswer(question, f) {
  var qw = words(question).map(stem), best = [], nq = norm(question);
  var need = (f.chap || f.g) ? 1 : Math.max(3, Math.ceil(qw.length * 0.7));
  if (qw.length === 0) return [];
  for (var i = 0; i < notes.length; i++) {
    var n = notes[i];
    if (f.g && n.g !== f.g) continue;
    if (f.chap && (n.g !== f.chap.g || chapterName(n) !== f.chap.name)) continue;
    if (!n._h) {
      n._h = " " + words(n.t + " " + n.q + " " + n.c + " " + n.a).map(stem).join(" ") + " ";
      n._b = " " + words(n.x).map(stem).join(" ") + " ";
      n._q = n.q ? norm(n.q) : "";
    }
    var score = 0;
    if (n._q.length > 20 && nq.indexOf(n._q) !== -1) score += 1000;      // the exact question was pasted
    for (var k = 0; k < qw.length; k++) {
      if (has(n._h, qw[k])) score += 3;
      if (has(n._b, qw[k])) score += 1;
    }
    if (score >= need) best.push({ note: n, score: score });
  }
  best.sort(function (a, b) { return b.score - a.score; });
  if (best.length && best[0].score >= 1000) best = best.filter(function (b) { return b.score >= 1000; });   // exact question: only that answer
  return best.slice(0, 2).map(function (b) { return b.note; });
}

// makes the note text safe and readable: **bold**, tables, diagram blocks, bullet lists and new lines
function pretty(text) {
  function esc(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function inl(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); }
  function cells(r) { return r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (c) { return inl(c.trim()); }); }
  var lines = String(text).split("\n"), out = "", buf = [], i = 0;
  function flush() {
    while (buf.length && buf[0] === "") buf.shift();
    while (buf.length && buf[buf.length - 1] === "") buf.pop();
    if (buf.length) out += buf.join("<br>");
    buf = [];
  }
  while (i < lines.length) {
    var ln = lines[i];
    if (/^\s*```/.test(ln)) {                                              // diagram / chart block
      var code = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i++]);
      i++; flush();
      out += "<pre class='code'>" + esc(code.join("\n")) + "</pre>";
    } else if (/^\s*\|.*\|\s*$/.test(ln) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {   // table
      var head = cells(ln), rows = []; i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(cells(lines[i++]));
      flush();
      out += "<div class='tblwrap'><table class='md'><thead><tr>" + head.map(function (c) { return "<th>" + c + "</th>"; }).join("") +
             "</tr></thead><tbody>" + rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + c + "</td>"; }).join("") + "</tr>"; }).join("") +
             "</tbody></table></div>";
    } else if (/^\s*[-•]\s+/.test(ln)) {                                   // bullet list
      var items = [];
      while (i < lines.length && /^\s*[-•]\s+/.test(lines[i])) items.push(inl(lines[i++].replace(/^\s*[-•]\s+/, "")));
      flush();
      out += "<ul class='md'><li>" + items.join("</li><li>") + "</li></ul>";
    } else { buf.push(inl(ln)); i++; }
  }
  flush();
  return out;
}

// returns Robo's reply when the message is everyday small talk, otherwise null
function smallTalk(text) {
  var t = " " + (text.toLowerCase().replace(/['’]/g, "").match(/[\p{L}\p{M}\p{N}]+/gu) || []).join(" ") + " ";
  if (t.length > 90) return null;                       // long messages go to the notes
  var hit = [], rest = t;
  talkRules.forEach(function (r) {
    for (var i = 0; i < r.p.length; i++) {
      var k = " " + r.p[i] + " ";
      if (t.indexOf(k) !== -1) { hit.push(r); rest = rest.split(k).join(" "); return; }
    }
  });
  if (!hit.length) return null;
  var ids = hit.map(function (r) { return r.id; });
  if (ids.indexOf("feeling") > -1) hit = hit.filter(function (r) { return r.id !== "thanks"; });
  // if a real question is mixed in ("hello robert what is heat"), let the notes answer it
  var left = words(rest).filter(function (w) { return talkFiller.indexOf(w) === -1; }).length;
  var lim = hit.some(function (r) { return !r.heavy || r.strict; }) ? 1 : 2;
  if (left >= lim) return null;
  var sel = document.getElementById("llang");
  var code = window.roboLangOverride || ((sel && liveOn) ? sel.value : (/[\u0900-\u097F]/.test(text) ? "ne" : "en"));
  var lang = code.indexOf("ne") === 0 ? "ne" : code.indexOf("hi") === 0 ? "hi" : "en";
  var parts = hit.slice(0, 2).map(function (r) {
    if (hit.length > 1 && r.short) return r.short(t, lang);
    return talkPick(r[lang] || r.en, t);
  });
  return parts.join(" ");
}

// "please welcome my judges" -> Robo says the welcome speech in Nepali (works typed, in Robo and in live talk)
function welcomeJudges(text) {
  var en = /judge/i.test(text) && /(welcome|greet|salute|honou?r|invite|introduce)/i.test(text);
  var ne = /(\u0928\u093f\u0930\u094d\u0923\u093e\u092f\u0915|\u091c\u091c)/.test(text) && /(\u0938\u094d\u0935\u093e\u0917\u0924|\u0935\u0947\u0932\u0915\u092e)/.test(text);

function send() {
  var box = document.getElementById("ask");
  var text = box.value.trim();
  if (text === "") return;
  if (!currentChat) newChat();
  if (currentChat.messages.length === 0) currentChat.title = text.replace(/\s+/g, " ").slice(0, 200);
  var f = chapterFromText(text);
  currentChat.messages.push({ who: "me", text: text });
  var chatty = fullForm(text) || welcomeJudges(text) || smallTalk(text);                   // hello, how are you, what is your name ...
  if (chatty) {
    currentChat.messages.push({ who: "ai", title: "Robo", text: chatty, talk: true });
    box.value = ""; drawChats(); show("home"); return;
  }
  if (wantsWhole(text, f)) {
    var c = f.chap;
    currentChat.messages.push({ who: "ai", title: "Class " + c.g + " Science" + (c.n < 99 ? " - Chapter " + c.n : "") + ": " + c.name, text: wholeChapter(c) });
  } else {
    var found = findAnswer(text, f);
    if (found.length === 0) {
      currentChat.messages.push({ who: "ai", title: "Not found", text: "I could not find that in the syllabus. Try other words, or ask for a chapter, for example: class 9 chapter 1." });
    }
    for (var i = 0; i < found.length; i++) {
      currentChat.messages.push({ who: "ai", title: "Class " + found[i].g + " Science: " + chapterName(found[i]), text: "<b>" + pretty(found[i].t.split(" | ")[0]) + "</b><br><br>" + pretty(found[i].x) });
    }
  }
  box.value = "";
  drawChats();
  show("home");
}

// ---------- 3. SCREENS ----------
function mark(name) {
  var ids = ["study", "quiz", "web", "robo"];
  for (var i = 0; i < ids.length; i++) document.getElementById("m-" + ids[i]).classList.toggle("on", ids[i] === name);
}

function show(name) {
  mark(name);
  var v = document.getElementById("view");
  if (name === "home") {
    if (currentChat && currentChat.messages.length > 0) {
      var h = "<div class='center wide'>";
      currentChat.messages.forEach(function (m, idx) {
        h += m.who === "me" ? "<div class='bubble me'>" + safe(m.text) + "</div>"
                            : "<div class='bubble ai'><h4>" + m.title + "</h4>" + m.text + toolsFor(idx) + "</div>";
      });
      v.innerHTML = h + "</div>";
      v.scrollTop = v.scrollHeight;
    } else {
      v.innerHTML = "<div class='center'><h2 style='text-align:center'>CurriculumX: Your Smart Buddy</h2>" +
        "<p style='text-align:center'><b>Welcome!</b></p></div>";
    }
  }
  document.getElementById("bar").style.display = name === "robo" ? "none" : "flex";
  if (name === "robo") showRobo();
  if (name === "study") showTimer();
  if (name === "quiz") { qNo = 0; score = 0; showQuestion(); }
  if (name === "web") showWeb();
}

// ---------- 4. SELF STUDY TIMER ----------
var seconds = 25 * 60, ticking = null;

function showTimer() {
  document.getElementById("view").innerHTML = "<div class='center'><h2>Self Study</h2>" +
    "<div class='timer' id='clock'></div>" +
    "<div class='row'><button class='go' style='padding:12px' onclick='startTimer()'>Start</button>" +
    "<button class='plain' onclick='stopTimer()'>Pause</button>" +
    "<button class='plain' onclick='resetTimer()'>Reset</button></div>" +
    "<p class='small'>25 minutes of study, then take a break.</p></div>";
  drawClock();
}
function drawClock() {
  var c = document.getElementById("clock");
  if (!c) return;
  var m = Math.floor(seconds / 60), s = seconds % 60;
  c.textContent = (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
function startTimer() {
  if (ticking) return;
  ticking = setInterval(function () {
    if (seconds > 0) seconds--; else stopTimer();
    drawClock();
  }, 1000);
}
function stopTimer() { clearInterval(ticking); ticking = null; }
function resetTimer() { stopTimer(); seconds = 25 * 60; drawClock(); }

// ---------- 5. QUIZ ----------
var qNo = 0, score = 0, done = false;

function showQuestion() {
  var v = document.getElementById("view");
  if (qNo >= questions.length) {
    v.innerHTML = "<div class='center'><h2>Quiz finished!</h2><p>Score: " + score + " / " + questions.length +
      "</p><button class='plain' onclick=\"show('quiz')\">Try again</button></div>";
    return;
  }
  var it = questions[qNo];
  var h = "<div class='center'><div class='small'>Question " + (qNo + 1) + " of " + questions.length + "</div><h3>" + it.q + "</h3>";
  for (var i = 0; i < it.options.length; i++) h += "<button class='opt' onclick='pick(" + i + ")'>" + it.options[i] + "</button>";
  v.innerHTML = h + "<div class='row'><button class='plain' style='padding:12px' onclick='quizAskVoice()'>Repeat question</button><button id='nx' class='go' style='padding:12px;display:none' onclick='qNo++;showQuestion()'>Next</button></div></div>";
  done = false;
}
function pick(i) {
  if (done) return;
  done = true;
  var b = document.querySelectorAll(".opt"), right = questions[qNo].answer;
  if (i === right) { score++; b[i].classList.add("right"); } else { b[i].classList.add("wrong"); b[right].classList.add("right"); }
  document.getElementById("nx").style.display = "block";
}

// ---------- 12. LIVE VOICE ASSISTANT (voice to voice) ----------
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var liveOn = false, muted = false, rec = null, liveState = "idle", speakTimer = null;

function setLive(state, label, text) {
  liveState = state;
  document.getElementById("orb").className = state;
  document.getElementById("lstate").textContent = label;
  if (text !== undefined) document.getElementById("ltext").innerHTML = text;
}

var connectTimer = null;
function openLive() {
  if (!SR) { alert("Voice input is not supported in this browser. Please open in Chrome, Edge or Safari."); return; }
  if (!currentChat) newChat();
  liveOn = true; muted = false;
  if (window.speechSynthesis) speechSynthesis.speak(new SpeechSynthesisUtterance(""));   // unlocks speech after the click
  document.getElementById("lmute").textContent = "Mute mic";
  document.getElementById("live").classList.add("on");
  setLive("connecting", "Connecting with Robo...", "");
  clearTimeout(connectTimer);
  connectTimer = setTimeout(function () {
    if (!liveOn) return;
    speak("Hello! I am Robo, your CurriculumX buddy. Ask me anything from your science book.", function () { listen(); });
  }, 6000);
}

function closeLive() {
  liveOn = false;
  clearTimeout(connectTimer);
  stopListening();
  if (window.speechSynthesis) speechSynthesis.cancel();
  document.getElementById("live").classList.remove("on");
  setLive("idle", "Tap to start");
  show("robo");
}

function liveLang() {
  stopListening();
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (liveOn && !muted) listen();
}

function toggleMute() {
  if (liveState === "connecting") return;
  muted = !muted;
  document.getElementById("lmute").textContent = muted ? "Unmute mic" : "Mute mic";
  if (muted) { stopListening(); setLive("idle", "Mic muted"); }
  else if (liveState !== "speaking" && liveState !== "thinking") listen();
}

// tap the orb: interrupt the assistant, or start / stop listening
function orbTap() {
  if (liveState === "connecting") return;
  if (liveState === "speaking") { speechSynthesis.cancel(); listen(); }
  else if (liveState === "listening") { stopListening(); setLive("idle", "Tap to talk"); }
  else { muted = false; document.getElementById("lmute").textContent = "Mute mic"; listen(); }
}

function stopListening() {
  if (rec) { rec.onend = rec.onerror = rec.onresult = null; try { rec.abort(); } catch (e) {} rec = null; }
}

function listen() {
  if (!liveOn || muted) return;
  stopListening();
  rec = new SR();
  rec.lang = document.getElementById("llang").value;
  rec.interimResults = true;
  rec.continuous = false;
  var finalText = "";
  rec.onresult = function (e) {
    var t = "";
    for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
    finalText = t;
    document.getElementById("ltext").innerHTML = "<b>" + safe(t) + "</b>";
  };
  rec.onerror = function (e) {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      setLive("idle", "Mic blocked", "Please allow microphone access in your browser, then tap the orb.");
      rec = null;
    }
  };
  rec.onend = function () {
    rec = null;
    if (!liveOn) return;
    if (finalText.trim()) liveAnswer(finalText.trim());
    else if (liveState === "listening") setTimeout(listen, 300);   // heard nothing, keep listening
  };
  try { rec.start(); setLive("listening", "Listening…"); } catch (e) {}
}

function safe(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

// make note text nice to hear: no stars, no brackets, no other-language title part
function spoken(html) {
  return html.replace(/<br>|<\/h[1-6]>|<hr>|<\/tr>|<\/li>|<\/pre>|<\/t[dh]>/g, ". ").replace(/<[^>]+>/g, " ").replace(/&amp;/g, "and").replace(/&lt;/g, "")
             .replace(/\*\*/g, "").replace(/[|•→↓↑=│├└─┌┐┘┬┴┼]/g, " ").replace(/\s+/g, " ").replace(/(\.\s*){2,}/g, ". ").trim();
}

function liveAnswer(text) {
  setLive("thinking", "Thinking…", "<b>" + safe(text) + "</b>");
  if (!currentChat) newChat();
  if (currentChat.messages.length === 0) currentChat.title = "Voice: " + text.replace(/\s+/g, " ").slice(0, 200);
  var before = currentChat.messages.length;
  var box = document.getElementById("ask");
  box.value = text; send();                       // reuse the normal answer logic, shows in chat too
  document.getElementById("live").classList.add("on");
  var msgs = currentChat.messages.slice(before + 1), reply = "";
  msgs.forEach(function (m) { if (reply.length < 700) reply += spoken((m.talk ? "" : m.title + ". ") + m.text) + " "; });
  if (/^not found/i.test(reply)) reply = "Sorry buddy, I could not find that in the syllabus. Try asking in other words.";
  var long = reply.length > 700;
  reply = reply.slice(0, 700);
  if (long) { reply = reply.replace(/[^.!?]*$/, "").trim() || reply; reply += " The full answer is in your chat."; }
  drawChats();
  speak(reply, function () { listen(); });
}

// speak in small pieces (Chrome stops long speech), then call done()
function speak(text, done) {
  if (!window.speechSynthesis) { if (done) done(); return; }
  stopListening();
  speechSynthesis.cancel();
  var parts = text.match(/[^.!?।]+[.!?।]?/g) || [text], i = 0, lang = document.getElementById("llang").value;
  if (/[\u0900-\u097F]/.test(text) && !/^(ne|hi)/.test(lang)) lang = "ne-NP";
  document.getElementById("ltext").innerHTML = safe(text);
  setLive("speaking", "Speaking… (tap to interrupt)");
  function next() {
    if (!liveOn) return;
    if (i >= parts.length) { if (done) done(); return; }
    var u = new SpeechSynthesisUtterance(parts[i++].trim());
    setVoice(u, lang); u.rate = 1;
    u.onend = next; u.onerror = function () { if (liveState === "speaking") next(); };
    speechSynthesis.speak(u);
  }
  next();
}

// start
drawChats();
show("home");

var subj = null, inQuiz = false, port = null, writer = null, reader = null, hwOn = false;

    try { await writer.close(); } catch (e) {}
    try { await port.close(); } catch (e) {}

    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });

    var dec = new TextDecoderStream(); port.readable.pipeTo(dec.writable); reader = dec.readable.getReader();

  } catch (e) { alert("Could not connect: " + e.message); }
}
async function hwLoop() {
  var buf = "";

    while (true) {

      buf += r.value; var p;
      while ((p = buf.indexOf("\n")) >= 0) { var l = buf.slice(0, p).trim(); buf = buf.slice(p + 1); if (l) onKey(l); }
    }
  } catch (e) {}
  hwOn = false; hwRefresh();
}

function onKey(k) {

  k = k.toUpperCase();

    if (subj === null) startSubj(i); else if (!done && qNo < questions.length) pick(i);
  } else if (k === "START") {

}

  v.innerHTML = h + "<div class='row'><button class='plain' style='padding:12px' onclick='quizAskVoice()'>Repeat question</button><button id='nx' class='go' style='padding:12px;display:none' onclick='qNo++;showQuestion()'>Next (START)</button></div><div id='hwbox'>" + hwBar() + "</div></div>";
  done = false;
  hwSend("Q|" + (qNo + 1) + "|" + questions.length + "|" + subj + "|" + score); quizAskVoice();

function pick(i) {

// ----- read aloud + copy buttons under every answer -----
var readingIdx = -1, readToken = 0;

function toolsFor(idx) {
  return "<div class='tools'><button class='tool tool-read' data-i='" + idx + "' onclick='readAloud(" + idx + ")'>" +
         (readingIdx === idx ? "Stop" : "Read aloud") + "</button>" +
         "<button class='tool' onclick='copyAns(" + idx + ",this)'>Copy</button></div>";
}
function refreshTools() {
  var b = document.querySelectorAll(".tool-read");
  for (var i = 0; i < b.length; i++) b[i].textContent = (+b[i].getAttribute("data-i") === readingIdx) ? "Stop" : "Read aloud";
}
function plainOf(m) {
  var d = document.createElement("div");
  d.innerHTML = (m.text || "").replace(/<br>|<\/h[1-6]>|<hr>|<\/tr>|<\/li>|<\/pre>/g, "\n").replace(/<\/t[dh]>/g, ". ");
  return ((m.title ? m.title + ".\n" : "") + d.textContent).replace(/(\.\s*){2,}/g, ". ");
}
function readAloud(i) {
  if (!window.speechSynthesis) { alert("Reading aloud is not supported in this browser."); return; }
  var was = readingIdx, token = ++readToken;
  speechSynthesis.cancel(); readingIdx = -1; refreshTools();
  if (was === i) return;

  if (!m) return;

  var parts = text.match(/[^.!?।]+[.!?।]?/g) || [text], chunks = [], cur = "";

    cur += p + " ";

}

  function dateLabel(k) {
    var p = k.split("-"), dt = new Date(+p[0], +p[1] - 1, +p[2]);
    return DAYS[dt.getDay()] + " " + (+p[2]) + " " + MONTHS[+p[1] - 1].slice(0, 3);
  }
  var h = "<div class='center'><h2>My study record</h2><p class='small' style='font-size:15px;color:var(--text)'>" + msg + "</p>" +
    "<div class='tiles'>" +
    "<div class='stat'>Today<b>" + fmtTime(today) + "</b></div>" +
    "<div class='stat'>Streak<b>" + streak + (streak === 1 ? " day" : " days") + "</b></div>" +
    "<div class='stat'>Last 7 days<b>" + fmtTime(s7) + "</b></div>" +
    "<div class='stat'>Last 30 days<b>" + fmtTime(s30) + "</b></div>" +
    "<div class='stat'>Last 12 months<b>" + fmtTime(total) + "</b></div>" +
    "<div class='stat'>Best day<b>" + (best ? fmtTime(best) : "-") + "</b>" + (bestK ? "<span class='small'>" + dateLabel(bestK) + "</span>" : "") + "</div>" +
    "</div><h3 style='margin-top:20px'>Month by month</h3>";
  for (var m = 0; m < 12; m++) {
    var first = new Date(now.getFullYear(), now.getMonth() - m, 1);
    var prefix = first.getFullYear() + "-" + p2(first.getMonth() + 1) + "-";
    var ks = Object.keys(studyLog).filter(function (k) { return k.indexOf(prefix) === 0 && studyLog[k] > 0; }).sort().reverse();
    var sum = 0; ks.forEach(function (k) { sum += studyLog[k]; });
    h += "<details class='mon'" + (m === 0 ? " open" : "") + "><summary>" + MONTHS[first.getMonth()] + " " + first.getFullYear() +
         " · " + fmtTime(sum) + " · " + ks.length + (ks.length === 1 ? " day" : " days") + "</summary>";
    if (!ks.length) h += "<div class='small'>No study recorded</div>";
    ks.forEach(function (k) {
      var w = Math.max(3, Math.round(studyLog[k] / (best || 1) * 100));
      h += "<div class='dayrow'><span class='d'>" + dateLabel(k) + "</span><span class='track'><div class='bar' style='width:" + w + "%'></div></span><span class='t'>" + fmtTime(studyLog[k]) + "</span></div>";
    });
    h += "</details>";
  }
  if (!studySaved) h += "<p class='small'>This browser is not allowing saved records, so they may be lost when you close the page.</p>";
  document.getElementById("view").innerHTML = h + "<div class='row'><button class='plain' onclick='showTimer()'>Back to timer</button></div></div>";
}

// ----- sidebar as real links (#study, #quiz ...) -----
var ROUTES = { "new": "new", "study": "study", "quiz": "quiz", "robo": "robo", "web": "web" };
function route(r) { if (r === "new") newChat(); else show(ROUTES[r] || "home"); }
function go(r) { if (location.hash.replace("#", "") === r) route(r); else location.hash = r; }
window.addEventListener("hashchange", function () { route(location.hash.replace("#", "") || "home"); });
(function () { var r = location.hash.replace("#", ""); if (r && r !== "new" && ROUTES[r]) route(r); })();
</script>
<script>
// ---------- ROBO TYPING MODE, FULL FORMS, QUIZ QUESTION VOICE ----------

// ----- full forms (CPU, RAM, USB ...) -----
var FULLFORMS = {
  cpu: ["Central Processing Unit", "It is the brain of the computer."],
  ram: ["Random Access Memory", "It is the temporary memory the computer uses while it is working."],
  rom: ["Read Only Memory", "It keeps its data even when the power is off."],
  alu: ["Arithmetic Logic Unit", "It does the calculations inside the CPU."],
  cu: ["Control Unit", "It controls the work of the CPU."],
  gpu: ["Graphics Processing Unit"], bios: ["Basic Input Output System"], os: ["Operating System"],
  usb: ["Universal Serial Bus"], led: ["Light Emitting Diode"], lcd: ["Liquid Crystal Display"],
  ssd: ["Solid State Drive"], hdd: ["Hard Disk Drive"], vga: ["Video Graphics Array"],
  hdmi: ["High Definition Multimedia Interface"], pc: ["Personal Computer"], cd: ["Compact Disc"],
  dvd: ["Digital Versatile Disc"], ai: ["Artificial Intelligence"], ict: ["Information and Communication Technology"],
  html: ["HyperText Markup Language"], css: ["Cascading Style Sheets"], http: ["HyperText Transfer Protocol"],
  https: ["HyperText Transfer Protocol Secure"], url: ["Uniform Resource Locator"], www: ["World Wide Web"],
  lan: ["Local Area Network"], wan: ["Wide Area Network"], isp: ["Internet Service Provider"],
  dns: ["Domain Name System"], ip: ["Internet Protocol"], sms: ["Short Message Service"],
  pdf: ["Portable Document Format"], gui: ["Graphical User Interface"], cli: ["Command Line Interface"],
  ui: ["User Interface"], ux: ["User Experience"], ide: ["Integrated Development Environment"],
  sql: ["Structured Query Language"], dbms: ["Database Management System"], cad: ["Computer Aided Design"],
  ocr: ["Optical Character Recognition"], pcb: ["Printed Circuit Board"], atm: ["Automated Teller Machine"],
  gps: ["Global Positioning System"], sim: ["Subscriber Identity Module"], pin: ["Personal Identification Number"],
  wifi: ["Wireless Fidelity", "Officially Wi-Fi is just a brand name, but people commonly say Wireless Fidelity."],
  dna: ["Deoxyribonucleic Acid"], rna: ["Ribonucleic Acid"], atp: ["Adenosine Triphosphate"],
  ph: ["potential of Hydrogen", "It tells how acidic or basic a solution is.", "pH"],
  hiv: ["Human Immunodeficiency Virus"], aids: ["Acquired Immuno Deficiency Syndrome"],
  gmo: ["Genetically Modified Organism"], ors: ["Oral Rehydration Solution"], bmi: ["Body Mass Index"],
  ecg: ["Electrocardiogram"], mri: ["Magnetic Resonance Imaging"], cfc: ["Chlorofluorocarbon"],
  lpg: ["Liquefied Petroleum Gas"], cng: ["Compressed Natural Gas"],
  laser: ["Light Amplification by Stimulated Emission of Radiation"],
  radar: ["Radio Detection And Ranging"], sonar: ["Sound Navigation And Ranging"],
  ac: ["Alternating Current"], dc: ["Direct Current"], emf: ["Electromotive Force"],
  mcb: ["Miniature Circuit Breaker"], ldr: ["Light Dependent Resistor"], uv: ["Ultraviolet"], ir: ["Infrared"],
  si: ["International System of Units", "It comes from the French name Systeme International."],
  nasa: ["National Aeronautics and Space Administration"], isro: ["Indian Space Research Organisation"],
  unesco: ["United Nations Educational, Scientific and Cultural Organization"],
  unicef: ["United Nations Children's Fund"], un: ["United Nations"], who: ["World Health Organization"],
  saarc: ["South Asian Association for Regional Cooperation"],
  see: ["Secondary Education Examination"], slc: ["School Leaving Certificate"],
  pan: ["Permanent Account Number"], vat: ["Value Added Tax"], gdp: ["Gross Domestic Product"]
};
var FF_TRIGGERS = [" full form "," fullform "," full forms "," ff "," stand for "," stands for "," abbreviation "," abbreviated "," expand "," long form "];

function fullForm(text) {
  var toks = text.toLowerCase().replace(/['’]/g, "").match(/[a-z0-9]+/g) || [];
  if (toks.length > 12) return null;
  var t = " " + toks.join(" ") + " ";
  if (!FF_TRIGGERS.some(function (k) { return t.indexOf(k) !== -1; })) return null;
  for (var i = 0; i < toks.length; i++) {
    if (Object.prototype.hasOwnProperty.call(FULLFORMS, toks[i])) {
      var e = FULLFORMS[toks[i]];
      return (e[2] || toks[i].toUpperCase()) + " stands for " + e[0] + "." + (e[1] ? " " + e[1] : "");
    }
  }
  // asked for a full form but it is not in the list: say so instead of guessing from the notes
  if (!/ (full form|fullform|ff|abbreviation|stands? for) /.test(t)) return null;
  var skip = " what is the full form forms fullform of ff stand stands for does do abbreviation abbreviated expand long tell me a an please its and or ";
  var cand = toks.filter(function (w) { return skip.indexOf(" " + w + " ") === -1; });
  if (cand.length === 1 && cand[0].length <= 6) return "Sorry buddy, I do not know the full form of " + cand[0].toUpperCase() + " yet.";
  return null;
}

// ----- speak a text from start to end (chunks), used by the Robo screen -----
function speakText(text, lang, done) {
  if (!window.speechSynthesis) { if (done) done(); return; }
  var token = ++readToken;
  if (/[\u0900-\u097F]/.test(text) && !/^(ne|hi)/.test(lang)) lang = "ne-NP";
  speechSynthesis.cancel(); readingIdx = -1; refreshTools();
  var parts = text.match(/[^.!?।]+[.!?।]?/g) || [text], k = 0;
  function next() {
    if (token !== readToken) return;
    if (k >= parts.length) { if (done) done(); return; }
    var u = new SpeechSynthesisUtterance(parts[k++].trim());
    setVoice(u, lang); u.rate = 1; u.volume = 1; u.onend = next; u.onerror = next;
    speechSynthesis.speak(u);
  }
  next();
}

// ----- Robo screen with a typing bar (no microphone needed) -----
var roboLang = "en-US", roboSpeech = "", roboHtml = "", roboLangOverride = null;

function showRobo() {
  roboLang = document.getElementById("llang").value;
  var opts = [["en-US", "English"], ["en-IN", "English (India)"], ["ne-NP", "नेपाली"], ["hi-IN", "हिन्दी"]].map(function (o) {
    return "<option value='" + o[0] + "'" + (o[0] === roboLang ? " selected" : "") + ">" + o[1] + "</option>";
  }).join("");
  document.getElementById("view").innerHTML = "<div class='center' style='text-align:center'>" +
    "<h2 style='margin-top:30px'>Mr.Belbase Robo</h2>" +
    "<p>Type your question. Robo shows the answer and says it out loud from the speaker.</p>" +
    "<div class='row'><input id='rask' style='flex:1;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font-size:16px;min-width:0' " +
    "placeholder='Ask Robo, for example: full form of CPU' onkeydown=\"if(event.key==='Enter')roboAsk()\">" +
    "<button class='go' style='flex:0 0 auto;padding:12px 22px' onclick='roboAsk()'>Ask</button></div>" +
    "<div class='row'><select id='rlang' onchange='setLang(this.value)' style='padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text)'>" + opts + "</select>" +
    "<button class='plain' onclick='roboSay()'>Say again</button><button class='plain' onclick='roboStop()'>Stop speaking</button></div>" +
    "<div id='rans' class='bubble ai' style='display:" + (roboHtml ? "block" : "none") + ";text-align:left;margin-top:16px'>" + roboHtml + "</div>" +
    (SR ? "<p class='small'>Have a microphone? <a href='#' style='color:var(--link)' onclick='openLive();return false'>Start live talk</a></p>" : "") +
    "</div>";
  var b = document.getElementById("rask"); if (b) b.focus();
}

function roboAsk() {
  var box = document.getElementById("rask");
  if (!box) return;
  var text = box.value.trim();
  if (!text) return;
  roboLang = document.getElementById("rlang").value;
  if (!currentChat) newChat();
  var before = currentChat.messages.length;
  roboLangOverride = roboLang;
  document.getElementById("ask").value = text;
  send();                                           // same answer logic as the chat, also saved in chats
  roboLangOverride = null;
  var msgs = currentChat.messages.slice(before + 1), html = "", sp = "";
  msgs.forEach(function (m) {
    html += "<h4>" + m.title + "</h4>" + m.text;
    sp += spoken((m.talk ? "" : m.title + ". ") + m.text) + " ";
  });
  if (/^not found/i.test(sp)) sp = "Sorry buddy, I could not find that in the syllabus. Try asking in other words.";
  if (sp.length > 1200) {
    sp = sp.slice(0, 1200).replace(/[^.!?]*$/, "").trim() || sp.slice(0, 1200);
    sp += " The full answer is in your chat.";
  }
  roboHtml = html; roboSpeech = sp;
  show("robo");
  roboSay();
}
function roboSay() { if (roboSpeech) speakText(roboSpeech, roboLang); }
function roboStop() { readToken++; if (window.speechSynthesis) speechSynthesis.cancel(); }

// ----- quiz: read the question (and options) out loud -----
function quizAskVoice() {
  var it = questions[qNo];
  if (!it) return;
  var txt = "Question " + (qNo + 1) + ". " + it.q.replace(/_{2,}/g, " blank ");
  for (var i = 0; i < it.options.length; i++) txt += ". " + "ABCD".charAt(i) + ", " + it.options[i];
  sayNow(txt + ".");
}
</script>
<script>
// ---------- LIVE VOICE QUIZ: say "let's play quiz" in live talk ----------
// Robo asks the subject, reads each question with options A to D, listens for the answer and keeps the score.
var LQ = { on: false, stage: "", subj: "", qs: [], i: 0, score: 0, saveLang: null, tries: 0 };

(function () {
  var sc = document.createElement("div");
  sc.id = "lscore";
  sc.style.cssText = "display:none;max-width:640px;width:100%;text-align:center;font-weight:bold;font-size:18px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)";
  var lt = document.getElementById("ltext");
  lt.parentNode.insertBefore(sc, lt);
})();

function lqEsc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function lqNorm(t) { return String(t).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, " ").replace(/\s+/g, " ").trim(); }
function lqSay(t) { return String(t).replace(/_{2,}/g, " blank "); }

function lqWants(text) {
  var t = lqNorm(text);
  return /\bqu[iy]zz?e?s?\b/.test(t) && /\b(play|start|begin|lets|let s|let us|want|take|ask|give)\b/.test(t) ||
         /\u0915\u094d\u0935\u093f\u091c/.test(text) && /(\u0916\u0947\u0932|\u0938\u0941\u0930\u0941)/.test(text);
}
function lqScore() {
  var b = document.getElementById("lscore");
  if (!LQ.on) { b.style.display = "none"; return; }
  b.style.display = "block";
  b.textContent = LQ.stage === "subject" ? "Quiz · choose a subject"
    : LQ.subj + " · Question " + Math.min(LQ.i + 1, LQ.qs.length) + " of " + LQ.qs.length + " · Score " + LQ.score + " / " + LQ.qs.length;
}
// speak, then show the given html (speak() writes plain text first)
function lqTalk(sayText, html, done) {
  speak(sayText, done);
  if (html) document.getElementById("ltext").innerHTML = html;
}

function lqStart() {
  LQ.on = true; LQ.stage = "subject"; LQ.score = 0; LQ.i = 0; LQ.qs = []; LQ.tries = 0;
  var sel = document.getElementById("llang");
  if (LQ.saveLang === null) LQ.saveLang = sel.value;
  sel.value = "en-IN";                                  // questions are in English, so listen and speak in English
  lqScore();
  var html = "<b>Which subject?</b><br>A. Science<br>B. Mathematics<br>C. Computer<br>D. Social Studies";
  lqTalk("Great, let's play a quiz. Which subject do you want? A, Science. B, Mathematics. C, Computer. Or D, Social Studies.", html, function () { listen(); });
}

function lqEnd(quit) {
  var n = LQ.qs.length, asked = quit ? LQ.i : n;
  var msg = quit ? "Okay, quiz stopped. Your score is " + LQ.score + " out of " + asked + "." :
                   "Quiz finished. You scored " + LQ.score + " out of " + n + ".";
  var html = "<b>" + (quit ? "Quiz stopped" : "Quiz finished") + "</b><br>Final score: " + LQ.score + " / " + (quit ? asked : n) +
             "<br><br>Say \"let's play quiz\" to play again.";
  LQ.stage = "done";
  var sb = document.getElementById("lscore");
  sb.style.display = "block"; sb.textContent = "Final score " + LQ.score + " / " + (quit ? asked : n);
  document.getElementById("llang").value = LQ.saveLang || "en-US";
  LQ.saveLang = null; LQ.on = false;
  lqTalk(msg + " Say, let's play quiz, to play again.", html, function () { listen(); });
  sb.style.display = "block";
}

function lqSubject(text) {
  var t = lqNorm(text), v = null;
  if (/science|\u0935\u093f\u091c\u094d\u091e\u093e\u0928/.test(t) || /science/.test(t) || /^(a|option a|first|1|one)$/.test(t)) v = "Science";
  else if (/math|\u0917\u0923\u093f\u0924/.test(t) || /^(b|bee|be|option b|second|2|two)$/.test(t)) v = "Mathematics";
  else if (/computer|\u0915\u092e\u094d\u092a\u094d\u092f\u0941\u091f\u0930/.test(t) || /^(c|see|sea|option c|third|3|three)$/.test(t)) v = "Computer";
  else if (/social|\u0938\u093e\u092e\u093e\u091c\u093f\u0915/.test(t) || /^(d|dee|option d|fourth|4|four|for)$/.test(t)) v = "Social Studies";
  return v;
}

function lqPrepare(subj) {
  var bank = BANK[subj].slice(), a = bank.length;
  while (a > 1) { var j = Math.floor(Math.random() * a--), tmp = bank[a]; bank[a] = bank[j]; bank[j] = tmp; }
  LQ.subj = subj; LQ.qs = bank.slice(0, Math.min(10, bank.length)); LQ.i = 0; LQ.score = 0;
}

function lqAsk() {
  var it = LQ.qs[LQ.i];
  LQ.stage = "answer"; LQ.tries = 0;
  lqScore();
  var say = "Question " + (LQ.i + 1) + ". " + lqSay(it.q);
  var html = "<b>Question " + (LQ.i + 1) + ". " + lqEsc(it.q) + "</b>";
  for (var k = 0; k < it.options.length; k++) {
    say += ". " + "ABCD".charAt(k) + ", " + it.options[k];
    html += "<br>" + "ABCD".charAt(k) + ". " + lqEsc(it.options[k]);
  }
  lqTalk(say + ".", html, function () { listen(); });
}

// work out which option (0 to 3) was said: a letter, a number, or the option text
function lqPick(text, it) {
  var t = lqNorm(text).replace(/\b(option|answer|number|letter|is|it s|its|the|my|i|say|choose|select|pick|final|please)\b/g, " ").replace(/\s+/g, " ").trim();
  if (/^(a|ay|eh|hey|first|1|1st|one)$/.test(t)) return 0;
  if (/^(b|bee|be|bi|second|2|2nd|two|too|to)$/.test(t)) return 1;
  if (/^(c|see|sea|cee|si|third|3|3rd|three)$/.test(t)) return 2;
  if (/^(d|dee|di|fourth|4|4th|four|for)$/.test(t)) return 3;
  if (t.length >= 3) {
    var hit = -1, many = false;
    it.options.forEach(function (o, k) {
      var n = lqNorm(o);
      if (n === t || (n.length >= 3 && (t.indexOf(n) >= 0 || n.indexOf(t) >= 0))) { if (hit >= 0) many = true; hit = k; }
    });
    if (hit >= 0 && !many) return hit;
  }
  return -1;
}

function lqAnswer(text) {
  var t = lqNorm(text);
  if (/^(stop|quit|exit|end|cancel)( the)?( quiz)?$/.test(t) || /\b(stop|quit|exit|end|cancel)\b.*\bquiz\b/.test(t)) { lqEnd(true); return; }
  if (LQ.stage === "subject") {
    var subj = lqSubject(text);
    if (!subj) { lqTalk("Sorry, I did not get that. Say Science, Mathematics, Computer, or Social Studies.", null, function () { listen(); }); return; }
    lqPrepare(subj);
    var n = LQ.qs.length;
    LQ.stage = "intro";
    lqScore();
    lqTalk(subj + " quiz. " + n + " questions. I will read each question and the options A, B, C, D. Say the letter to answer. Here we go.", "<b>" + lqEsc(subj) + " quiz</b><br>" + n + " questions", function () { lqAsk(); });
    return;
  }
  if (LQ.stage !== "answer") { lqStart(); return; }
  var it = LQ.qs[LQ.i];
  if (/\b(repeat|again|once more|say that again)\b/.test(t)) { lqAsk(); return; }
  var pick = lqPick(text, it);
  if (/\b(skip|next question|pass|dont know|don t know)\b/.test(t)) pick = -2;
  if (pick === -1) {
    LQ.tries++;
    if (LQ.tries >= 3) pick = -2;
    else { lqTalk("Please say A, B, C or D.", null, function () { listen(); }); return; }
  }
  var right = it.answer, ok = pick === right, say;
  if (ok) { LQ.score++; say = pickOne(praiseLines); }
  else say = (pick === -2 ? "Skipped. " : "Wrong answer. ") + "The correct answer is " + "ABCD".charAt(right) + ", " + it.options[right] + ".";
  LQ.i++;
  lqScore();
  say += " Your score is " + LQ.score + " out of " + LQ.i + ".";
  var html = (ok ? "<b>Correct</b>" : "<b>" + (pick === -2 ? "Skipped" : "Wrong") + "</b><br>Correct answer: " + "ABCD".charAt(right) + ". " + lqEsc(it.options[right])) +
             "<br>Score: " + LQ.score + " / " + LQ.i;
  lqTalk(say, html, function () { if (LQ.i >= LQ.qs.length) lqEnd(false); else lqAsk(); });
}

// take over live talk while the quiz runs (or when asked to start)
var _liveAnswerBeforeQuiz = liveAnswer;
liveAnswer = function (text) {
  if (LQ.on) { lqAnswer(text); return; }
  if (lqWants(text)) { lqStart(); return; }
  _liveAnswerBeforeQuiz(text);
};

// leaving live talk ends the quiz and restores the language
var _closeLiveBeforeQuiz = closeLive;
closeLive = function () {
  if (LQ.saveLang !== null) { document.getElementById("llang").value = LQ.saveLang; LQ.saveLang = null; }
  LQ.on = false; LQ.stage = "";
  document.getElementById("lscore").style.display = "none";
  _closeLiveBeforeQuiz();
};
</script>
