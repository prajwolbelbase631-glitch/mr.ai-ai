pe with examples.","q":"What is permanent tissue? Describe in brief about its type with examples.","o":"4(d)","s":"5.1 Tissue","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.1 Tissue. Exercise 4(d).\n\nPermanent tissue is formed when meristematic tissue loses its capacity of cell division. Generally, cell division does not occur in permanent tissue. Its cells have fixed shapes and sizes.\n\nThere are three types:\n\n**1. Simple permanent tissue**\nIt is made of similar types of cells. Examples: Parenchyma, Collenchyma, Sclerenchyma.\n\n**2. Complex permanent tissue**\nIt is made of different types of living and dead cells. Examples: Xylem, Phloem.\n\n**3. Special tissue**\nIt is formed by modification of simple tissue and performs specific functions such as secretion and excretion. Examples: Glandular tissue, Lactiferous tissue."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.1 Tissue – Exercise 4(e): Draw a neat and labeled diagram of sclerenchyma, collenchyma and parenchyma and prepare a list of their functions.","q":"Draw a neat and labeled diagram of sclerenchyma, collenchyma and parenchyma and prepare a list of their functions.","o":"4(e)","s":"5.1 Tissue","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.1 Tissue. Exercise 4(e).\n\n**Parenchyma – functions:**\n- Helps to prepare food.\n- Helps in food storage.\n- Aerenchyma helps hydrophytes to float in water.\n\n**Collenchyma – functions:**\n- Provides mechanical strength.\n- Provides flexibility.\n- Some collenchyma containing chloroplast helps in photosynthesis.\n\n**Sclerenchyma – functions:**\n- Makes the plant strong and straight.\n- Provides mechanical strength.\n- Provides flexibility.\n\n**Diagram:** Draw the textbook diagrams of **Parenchyma, Collenchyma and Sclerenchyma** and label their parts."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.1 Tissue – Exercise 4(f): Write the functions of epithelial tissue.","q":"Write the functions of epithelial tissue.","o":"4(f)","s":"5.1 Tissue","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.1 Tissue. Exercise 4(f).\n\nThe functions of epithelial tissue are:\n\n1. Covering\n2. Protecting\n3. Secreting\n4. Excreting\n5. Absorbing"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.1 Tissue – Exercise 4(g): Prepare a chart of animal tissue and write their location.","q":"Prepare a chart of animal tissue and write their location.","o":"4(g)","s":"5.1 Tissue","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.1 Tissue. Exercise 4(g).\n\n| Animal tissue | Type | Location |\n|---|---|---|\n| Epithelial tissue | Pavement epithelium | Outer covering of heart, liver and kidney |\n| Epithelial tissue | Cubical epithelium | Nephrons of kidney, thyroid gland, ducts of excretory glands, inner layer of uterus and alveoli of lung |\n| Epithelial tissue | Columnar epithelium | Gall bladder and salivary gland |\n| Muscular tissue | Skeletal muscle | Attached to bones |\n| Muscular tissue | Cardiac muscle | Wall of heart |\n| Muscular tissue | Smooth muscle | Stomach, intestine, ureter and blood vessels |\n| Connective tissue | Fibrous tissue | Dermis, around blood vessels, muscles, kidney, liver and glands |\n| Connective tissue | Adipose tissue | Dermis and around internal organs |\n| Connective tissue | Bone | Skull, limbs and vertebral column |\n| Connective tissue | Cartilage | Nose, ear, neck, vertebrae and sides of long bones |\n| Connective tissue | Blood | Circulates throughout the body |\n| Connective tissue | Lymph | Intercellular spaces and lymphatic ducts |\n| Nervous tissue | Neuron | Brain, spinal cord and nerves |"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.1 Tissue – Exercise 4(h): Observe the figure and answer: identify the figure, name parts A–D, function of the tissue, importance of the tissue in plants.","q":"Observe the figure and answer: identify the figure, name parts A–D, function of the tissue, importance of the tissue in plants.","o":"4(h)","s":"5.1 Tissue","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.1 Tissue. Exercise 4(h).\n\nThis question is based on a figure in the textbook, so the answer depends on what the figure shows. Look at the figure and:\n\n- (i) Identify the figure (which tissue is shown).\n- (ii) Name the labelled parts A, B, C and D.\n- (iii) Write the function of that tissue.\n- (iv) Write the importance of that tissue in plants.\n\nUse the textbook description of the tissue shown in the figure."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.1 Tissue – Exercise 4(i): Observe the figure of muscular tissues and answer: names, one organ each, one function each.","q":"Observe the figure of muscular tissues and answer: names, one organ each, one function each.","o":"4(i)","s":"5.1 Tissue","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.1 Tissue. Exercise 4(i).\n\n**(i) Name of the given muscular tissues**\n- A. Skeletal muscular tissue\n- B. Cardiac muscular tissue\n- C. Smooth muscular tissue\n\n**(ii) One organ each where these tissues are present**\n- Skeletal muscle: attached to bones.\n- Cardiac muscle: heart.\n- Smooth muscle: stomach.\n\n**(iii) One function of each tissue**\n- Skeletal muscular tissue: produces movement of the body.\n- Cardiac muscular tissue: contracts and relaxes regularly to produce heartbeat and pump blood.\n- Smooth muscular tissue: produces involuntary movement in organs such as the stomach and intestine."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.1 Tissue – Exercise 4(j): Study the figure and answer: identify the figure, name a, b and c, write their functions.","q":"Study the figure and answer: identify the figure, name a, b and c, write their functions.","o":"4(j)","s":"5.1 Tissue","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.1 Tissue. Exercise 4(j).\n\nThis question is based on a figure in the textbook, so the answer depends on what the figure shows. Look at the figure and:\n\n- (i) Identify the figure.\n- (ii) Write the names of the labelled parts a, b and c.\n- (iii) Write the function of parts a, b and c.\n\nUse the textbook description of the structure shown."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.2 Human Nervous System – Exercise 1(a): Which one is the right order in case of meninges (outer to inner)?","q":"Which one is the right order in case of meninges (outer to inner)?","o":"1(a)","s":"5.2 Human Nervous System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.2 Human Nervous System. Exercise 1(a).\n\n**Answer: (iv) Dura matter, arachnoid and pia matter**"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.2 Human Nervous System – Exercise 1(b): Which part of nervous system is in ash colour?","q":"Which part of nervous system is in ash colour?","o":"1(b)","s":"5.2 Human Nervous System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.2 Human Nervous System. Exercise 1(b).\n\n**Answer: (ii) Cyton**"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.2 Human Nervous System – Exercise 1(c): What is the part of brain when injured person can suffer in coma stage?","q":"What is the part of brain when injured person can suffer in coma stage?","o":"1(c)","s":"5.2 Human Nervous System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.2 Human Nervous System. Exercise 1(c).\n\n**Answer: (iii) Cerebrum**"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.2 Human Nervous System – Exercise 1(d): Which nerve transmits the message from different parts of body to brain?","q":"Which nerve transmits the message from different parts of body to brain?","o":"1(d)","s":"5.2 Human Nervous System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.2 Human Nervous System. Exercise 1(d).\n\n**Answer: (ii) Sensory nerve**"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.2 Human Nervous System – Exercise 1(e): Which part of nervous system controls the reflex action?","q":"Which part of nervous system controls the reflex action?","o":"1(e)","s":"5.2 Human Nervous System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.2 Human Nervous System. Exercise 1(e).\n\n**Answer: (iv) Spinal cord**"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.2 Human Nervous System – Exercise 2(a): Give reason: A person suffers in a coma stage when the large brain is healed (injured).","q":"Give reason: A person suffers in a coma stage when the large brain is healed (injured).","o":"2(a)","s":"5.2 Human Nervous System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.2 Human Nervous System. Exercise 2(a).\n\nThe large brain is the cerebrum. It controls and coordinates various activities of the body and is involved in consciousness, thought, memory, speech and hearing. Therefore, when the cerebrum is injured, consciousness may be lost and the person may suffer a coma stage."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.2 Human Nervous System – Exercise 2(b): Give reason: The hand is withdrawn suddenly when a hot object is touched by finger.","q":"Give reason: The hand is withdrawn suddenly when a hot object is touched by finger.","o":"2(b)","s":"5.2 Human Nervous System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.2 Human Nervous System. Exercise 2(b).\n\nTouching a hot object produces a stimulus. The sensory nerve carries the impulse from the receptor to the spinal cord. The motor nerve then carries the impulse to the muscles, causing the hand to withdraw immediately. This sudden and involuntary response is called reflex action."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.2 Human Nervous System – Exercise 2(c): Give reason: Spinal cord is known as the center of reflex action.","q":"Give reason: Spinal cord is known as the center of reflex action.","o":"2(c)","s":"5.2 Human Nervous System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.2 Human Nervous System. Exercise 2(c).\n\nThe spinal cord controls reflex action. When a person touches a hot object, the impulse is processed through the spinal cord and a response is produced immediately. Therefore, the spinal cord is known as the center of reflex action."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.2 Human Nervous System – Exercise 3(a): Differentiate between cranial and spinal nerves.","q":"Differentiate between cranial and spinal nerves.","o":"3(a)","s":"5.2 Human Nervous System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.2 Human Nervous System. Exercise 3(a).\n\n| Cranial nerves | Spinal nerves |\n|---|---|\n| They arise from the brain. | They arise from the spinal cord. |\n| There are 12 pairs. | There are 31 pairs. |\n| They communicate between the brain and organs of the head such as tongue, eyes, ears and nose. | They transmit and receive impulses between the spinal cord and different parts of the body. |"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.2 Human Nervous System – Exercise 3(b): Differentiate between sensory and motor nerves.","q":"Differentiate between sensory and motor nerves.","o":"3(b)","s":"5.2 Human Nervous System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.2 Human Nervous System. Exercise 3(b).\n\n| Sensory nerve | Motor nerve |\n|---|---|\n| It is also called afferent nerve. | It is also called efferent nerve. |\n| It carries nerve impulses from receptor to brain or spinal cord. | It carries nerve impulses from brain or spinal cord to different parts of the body. |\n| It carries information toward the central nervous system. | It carries messages away from the central nervous system. |"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.2 Human Nervous System – Exercise 3(c): Differentiate between cerebrum and cerebellum.","q":"Differentiate between cerebrum and cerebellum.","o":"3(c)","s":"5.2 Human Nervous System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.2 Human Nervous System. Exercise 3(c).\n\n| Cerebrum | Cerebellum |\n|---|---|\n| It is the largest part of the brain. | It is the second largest part of the brain. |\n| It covers about 80% of the brain. | It covers about 10% of the brain. |\n| It controls various activities of the body. | It coordinates muscular movement. |\n| It controls consciousness, thought, speech, memory and hearing. | It maintains body equilibrium and posture. |\n| It controls analysis, synthesis and prediction of facts. | It controls voluntary movement and muscular tone. |"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.2 Human Nervous System – Exercise 3(d): Differentiate between sympathetic and parasympathetic nervous system.","q":"Differentiate between sympathetic and parasympathetic nervous system.","o":"3(d)","s":"5.2 Human Nervous System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.2 Human Nervous System. Exercise 3(d).\n\n| Sympathetic nervous system | Parasympathetic nervous system |\n|---|---|\n| It prepares the body to face emergency situations. | It restores and prevents the effects of the sympathetic system. |\n| It increases heart rate and lung rate. | It decreases heart rate and blood pressure. |\n| It increases blood pressure and heartbeat. | It brings heart rate and respiration toward normal after an emergency. |\n| It helps produce more energy during emergency situations. | It helps restore general body conditions after an emergency. |"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.2 Human Nervous System – Exercise 4(a): Sketch a neat diagram of brain and label its different parts.","q":"Sketch a neat diagram of brain and label its different parts.","o":"4(a)","s":"5.2 Human Nervous System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.2 Human Nervous System. Exercise 4(a).\n\nThe main parts of the brain described in the textbook are:\n\n1. Cerebrum\n2. Cerebellum\n3. Medulla oblongata\n\nThe brain is covered by three layers of meninges:\n\n1. Dura matter\n2. Arachnoid\n3. Pia matter\n\n**Diagram:** Draw the textbook **Fig. 5.22 Brain** and label the parts."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.2 Human Nervous System – Exercise 4(b): What is the function of medulla oblongata? Explain.","q":"What is the function of medulla oblongata? Explain.","o":"4(b)","s":"5.2 Human Nervous System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.2 Human Nervous System. Exercise 4(b).\n\nMedulla oblongata controls involuntary actions of the body.\n\nIts functions are:\n\n1. It regulates respiration.\n2. It controls vomiting.\n3. It controls coughing.\n4. It controls sneezing.\n5. It controls swallowing.\n6. It regulates contraction and relaxation of blood vessels.\n7. It helps in the secretion of hormones, digestive juices and saliva."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.2 Human Nervous System – Exercise 4(c): What is the function of autonomic nervous system? Describe with a diagram.","q":"What is the function of autonomic nervous system? Describe with a diagram.","o":"4(c)","s":"5.2 Human Nervous System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.2 Human Nervous System. Exercise 4(c).\n\nThe autonomic nervous system controls involuntary actions of organs such as the heart, kidney and lungs. It controls certain muscles and glands during both sleep and wakefulness.\n\nIt has two parts:\n\n**1. Sympathetic nervous system**\nIt prepares the body for emergency situations. It increases the rate of heart and lungs, increases blood pressure and heartbeat and helps produce more energy.\n\n**2. Parasympathetic nervous system**\nIt restores and prevents the effects of the sympathetic nervous system. It decreases heartbeat and blood pressure and helps bring heart rate and respiration back toward normal after an emergency.\n\n**Concept diagram:**\n\n```text\nAutonomic nervous system\n├── Sympathetic nervous system\n└── Parasympathetic nervous system\n```"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.2 Human Nervous System – Exercise 4(d): Discuss the way of reflex action that occurs when we touch hot object.","q":"Discuss the way of reflex action that occurs when we touch hot object.","o":"4(d)","s":"5.2 Human Nervous System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.2 Human Nervous System. Exercise 4(d).\n\nWhen a hot object is touched, the skin receives the stimulus through its nerve tip, which acts as a receptor.\n\nThe impulse follows this path:\n\n**Hot object → Receptor → Sensory nerve → Spinal cord → Connecting nerve → Motor nerve → Muscle → Hand withdrawn**\n\nThe receptor receives the stimulus. The sensory nerve carries the impulse to the spinal cord. The connecting nerve coordinates the impulse. The motor nerve carries the impulse to the muscles. The muscles then withdraw the hand.\n\nThis is a sudden and involuntary response called reflex action."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.2 Human Nervous System – Exercise 4(e): What is nervous system? Describe its type in brief.","q":"What is nervous system? Describe its type in brief.","o":"4(e)","s":"5.2 Human Nervous System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.2 Human Nervous System. Exercise 4(e).\n\nThe system made by a group of specific organs that receives information from the surroundings and coordinates the activities of the body is called the nervous system.\n\nIt consists of the brain, spinal cord and nerve cells.\n\nThe human nervous system has three parts:\n\n**1. Central nervous system**\nIt consists of the brain and spinal cord.\n\n**2. Peripheral nervous system**\nIt communicates between the central nervous system and different parts of the body. It consists of cranial nerves and spinal nerves.\n\n**3. Autonomic nervous system**\nIt controls involuntary actions of organs such as the heart, kidney and lungs. It consists of the sympathetic nervous system and the parasympathetic nervous system."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.2 Human Nervous System – Exercise 4(f): Write the functions of the small brain, large brain and spinal cord.","q":"Write the functions of the small brain, large brain and spinal cord.","o":"4(f)","s":"5.2 Human Nervous System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.2 Human Nervous System. Exercise 4(f).\n\n**Large brain – Cerebrum**\n- Controls and coordinates various activities of the body.\n- Controls speech, memory and hearing.\n- Controls consciousness and thought.\n- Helps in analysis, synthesis and prediction.\n- Finds the sensation of odour.\n\n**Small brain – Cerebellum**\n- Coordinates the timing of muscular movement.\n- Maintains body equilibrium during walking.\n- Controls voluntary movement.\n- Maintains muscular tone and posture.\n\n**Spinal cord**\n- Communicates between different parts of the body and brain.\n- Acts as the center for reflex action."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.2 Human Nervous System – Exercise 4(g): What is neuron? Draw a neat diagram and label its different parts and also write the functions of each part.","q":"What is neuron? Draw a neat diagram and label its different parts and also write the functions of each part.","o":"4(g)","s":"5.2 Human Nervous System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.2 Human Nervous System. Exercise 4(g).\n\nA neuron is the smallest unit of nervous tissue.\n\nThe main parts are:\n\n**Cell body**\nThe middle part of a neuron is called the cell body. It is ash in colour.\n\n**Dendrites**\nDendrites are branched structures. They conduct stimuli from other nerve cells toward the cell body.\n\n**Axon**\nAxon is the long single branch of the cell body. It carries impulses toward other neurons.\n\n**Myelin sheath**\nThe axon is covered by a myelin sheath.\n\n**Nerve ending**\nThe nerve ending transmits the impulse to other neurons.\n\n**Diagram:** Draw and label the textbook **Fig. 5.20 Neuron**."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.2 Human Nervous System – Exercise 4(h): Describe the reflex action with examples.","q":"Describe the reflex action with examples.","o":"4(h)","s":"5.2 Human Nervous System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.2 Human Nervous System. Exercise 4(h).\n\nReflex action is a sudden and involuntary response to a stimulus.\n\nExamples:\n\n1. Withdrawing the hand after touching a hot object.\n2. Supporting ourselves with our hands when we suddenly slip while walking.\n3. Blinking of eyes when something enters the eyes.\n\nReflex action is controlled by the spinal cord. The special pathway through which the impulse travels during reflex action is called the reflex arc."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.2 Human Nervous System – Exercise 4(i): Study the diagram and answer: name the parts A, B, C, write their functions, and what happens when part C is injured.","q":"Study the diagram and answer: name the parts A, B, C, write their functions, and what happens when part C is injured.","o":"4(i)","s":"5.2 Human Nervous System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.2 Human Nervous System. Exercise 4(i).\n\nThis question is based on a figure in the textbook, so the answer depends on what the figure shows. Look at the diagram and:\n\n- (i) Name the parts indicated (A, B and C).\n- (ii) Write the function of A, B and C.\n- (iii) Write what happens when part C is injured.\n\nUse the textbook description of the structures shown in the diagram."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.3 Human Glandular System – Exercise 1(a): Which hormone controls the blood sugar level?","q":"Which hormone controls the blood sugar level?","o":"1(a)","s":"5.3 Human Glandular System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.3 Human Glandular System. Exercise 1(a).\n\n**Answer: (ii) Insulin**"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.3 Human Glandular System – Exercise 1(b): Which hormone is responsible for ripening of fruit?","q":"Which hormone is responsible for ripening of fruit?","o":"1(b)","s":"5.3 Human Glandular System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.3 Human Glandular System. Exercise 1(b).\n\n**Answer: (i) Ethylene**"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.3 Human Glandular System – Exercise 1(c): Which hormone causes apical dominance?","q":"Which hormone causes apical dominance?","o":"1(c)","s":"5.3 Human Glandular System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.3 Human Glandular System. Exercise 1(c).\n\n**Answer: (ii) Auxin**"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.3 Human Glandular System – Exercise 1(d): Which gland is called master gland?","q":"Which gland is called master gland?","o":"1(d)","s":"5.3 Human Glandular System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.3 Human Glandular System. Exercise 1(d).\n\n**Answer: (iii) Pituitary gland**"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.3 Human Glandular System – Exercise 1(e): Which hormone controls and develops the male sexuality?","q":"Which hormone controls and develops the male sexuality?","o":"1(e)","s":"5.3 Human Glandular System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.3 Human Glandular System. Exercise 1(e).\n\n**Answer: (iii) Testosterone**"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.3 Human Glandular System – Exercise 1(f): Which hormone is involved in ripening of fruit and abscission of leaf?","q":"Which hormone is involved in ripening of fruit and abscission of leaf?","o":"1(f)","s":"5.3 Human Glandular System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.3 Human Glandular System. Exercise 1(f).\n\n**Answer: (i) Ethylene**"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.3 Human Glandular System – Exercise 2(a): Give reason: Pancreas is called mixed gland.","q":"Give reason: Pancreas is called mixed gland.","o":"2(a)","s":"5.3 Human Glandular System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.3 Human Glandular System. Exercise 2(a).\n\nPancreas is called a mixed gland because it produces both hormones and enzymes. It produces pancreatic juice containing digestive enzymes and also produces insulin and glucagon hormones."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.3 Human Glandular System – Exercise 2(b): Give reason: Pituitary gland is called master gland.","q":"Give reason: Pituitary gland is called master gland.","o":"2(b)","s":"5.3 Human Glandular System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.3 Human Glandular System. Exercise 2(b).\n\nPituitary gland is called the master gland because it produces stimulating hormones and growth hormones. It coordinates and controls the functions of other glands."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.3 Human Glandular System – Exercise 2(c): Give reason: Hormone is called chemical messenger.","q":"Give reason: Hormone is called chemical messenger.","o":"2(c)","s":"5.3 Human Glandular System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.3 Human Glandular System. Exercise 2(c).\n\nHormones are produced by endocrine glands and are carried through the blood to different parts of the body. They stimulate and regulate body cells and functions of other glands. Therefore, hormones are called chemical messengers."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.3 Human Glandular System – Exercise 2(d): Give reason: The function of glucagon and insulin is opposite to each other.","q":"Give reason: The function of glucagon and insulin is opposite to each other.","o":"2(d)","s":"5.3 Human Glandular System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.3 Human Glandular System. Exercise 2(d).\n\nInsulin decreases the sugar level in the blood, whereas glucagon increases the sugar level in the blood. Since they perform opposite functions, they are called antagonistic hormones."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.3 Human Glandular System – Exercise 2(e): Give reason: Enzyme is known as biological catalyst.","q":"Give reason: Enzyme is known as biological catalyst.","o":"2(e)","s":"5.3 Human Glandular System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.3 Human Glandular System. Exercise 2(e).\n\nEnzymes are present in secretions of glands such as exocrine glands and help in chemical processes such as digestion. They act as biological catalysts."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.3 Human Glandular System – Exercise 3(a): Differentiate between exocrine and endocrine gland.","q":"Differentiate between exocrine and endocrine gland.","o":"3(a)","s":"5.3 Human Glandular System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.3 Human Glandular System. Exercise 3(a).\n\n| Exocrine gland | Endocrine gland |\n|---|---|\n| Its secretion is transferred through a separate duct. | Its secretion is released into the blood. |\n| Its secretion acts at the respective place. | Its hormone is carried through blood to another part of the body. |\n| Examples: sweat gland, salivary gland and tear gland. | Examples: pituitary, thyroid, parathyroid and adrenal glands. |\n| They produce secretions such as enzymes and juices. | They produce hormones. |"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.3 Human Glandular System – Exercise 3(b): Differentiate between cytokinin and auxin.","q":"Differentiate between cytokinin and auxin.","o":"3(b)","s":"5.3 Human Glandular System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.3 Human Glandular System. Exercise 3(b).\n\n| Cytokinin | Auxin |\n|---|---|\n| It is a plant growth hormone. | It is a plant growth hormone. |\n| It is found in excessive amount in root tips, embryo and fruits. | It is produced in the tip of the shoot. |\n| It helps in growth and development of plants. | It helps the shoot tip grow toward light. |\n| It is used with auxin in tissue culture to initiate root and shoot growth. | It is used with cytokinin in tissue culture to initiate root and shoot growth. |\n| It helps regulate plant growth. | It helps in apical dominance and phototropism. |"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.3 Human Glandular System – Exercise 3(c): Differentiate between parathyroid and thyroid gland.","q":"Differentiate between parathyroid and thyroid gland.","o":"3(c)","s":"5.3 Human Glandular System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.3 Human Glandular System. Exercise 3(c).\n\n| Parathyroid gland | Thyroid gland |\n|---|---|\n| It is located at the back of the thyroid gland. | It is located inside the neck. |\n| There are four parathyroid glands. | It is a thyroid gland in the neck region. |\n| It produces parathermone hormone. | It produces thyroxine hormone. |\n| Parathermone increases calcium level in blood. | Thyroxine is one of the hormones produced by the thyroid gland. |"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.3 Human Glandular System – Exercise 4(a): What is gland? Prepare a chart of its type with examples.","q":"What is gland? Prepare a chart of its type with examples.","o":"4(a)","s":"5.3 Human Glandular System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.3 Human Glandular System. Exercise 4(a).\n\nA gland is a structure that produces and secretes substances such as hormones, enzymes and juices.\n\n**Classification of glands**\n\n```text\nGland\n├── Exocrine gland: Sweat gland, Salivary gland, Tear gland\n├── Endocrine gland: Pituitary gland, Thyroid gland, Parathyroid gland, Adrenal gland\n└── Mixed gland: Pancreas, Gonads\n```"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.3 Human Glandular System – Exercise 4(b): What are plant hormones? Write.","q":"What are plant hormones? Write.","o":"4(b)","s":"5.3 Human Glandular System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.3 Human Glandular System. Exercise 4(b).\n\nPlant hormones are chemical messengers that regulate the growth and development of plants.\n\nThe plant growth hormones mentioned in the textbook are:\n\n1. Auxin\n2. Gibberellin\n3. Cytokinin\n4. Ethylene\n5. Brassinosteroid\n\nThey help in processes such as growth and development, fruit initiation, fruit ripening and seed dispersal."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.3 Human Glandular System – Exercise 4(c): Draw the diagram of endocrine glands in human body.","q":"Draw the diagram of endocrine glands in human body.","o":"4(c)","s":"5.3 Human Glandular System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.3 Human Glandular System. Exercise 4(c).\n\nThe endocrine glands shown in the textbook diagram are:\n\n- Pineal\n- Hypothalamus\n- Pituitary\n- Parathyroids\n- Thyroid\n- Thymus\n- Adrenals\n- Pancreas\n- Ovaries\n- Testes\n\n**Diagram:** Draw the textbook **Fig. 5.27 Endocrine glands** and label these glands."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.3 Human Glandular System – Exercise 4(d): Describe in short about pituitary gland.","q":"Describe in short about pituitary gland.","o":"4(d)","s":"5.3 Human Glandular System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.3 Human Glandular System. Exercise 4(d).\n\nThe pituitary gland is pea-shaped and is located inside the skull at the lower part of the brain.\n\nIt mainly produces stimulating hormones and growth hormones. These hormones help in physical and mental growth and stimulate other glands.\n\nIt coordinates and controls the functions of other glands, so it is called the **master gland**."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.3 Human Glandular System – Exercise 4(e): Enlist the plant hormones.","q":"Enlist the plant hormones.","o":"4(e)","s":"5.3 Human Glandular System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.3 Human Glandular System. Exercise 4(e).\n\nThe plant growth hormones given in the textbook are:\n\n1. Auxin\n2. Gibberellin\n3. Cytokinin\n4. Ethylene\n5. Brassinosteroid"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.3 Human Glandular System – Exercise 4(f): Write the application of plant hormones.","q":"Write the application of plant hormones.","o":"4(f)","s":"5.3 Human Glandular System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.3 Human Glandular System. Exercise 4(f).\n\nThe applications of plant hormones given in the textbook are:\n\n1. Auxin and cytokinin are mixed artificially during tissue culture to initiate roots and promote shoot growth.\n2. Proper balance of auxin and cytokinin helps maintain rapid growth and development of plants.\n3. Plant hormones are important in producing quality fruits and vegetables.\n4. They are used for the production of unseasonable vegetables.\n\nThe textbook also warns that excessive use of synthetic hormones in fruits and vegetables can create serious health hazards."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.3 Human Glandular System – Exercise 4(g): Explain the pancreas with diagram.","q":"Explain the pancreas with diagram.","o":"4(g)","s":"5.3 Human Glandular System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.3 Human Glandular System. Exercise 4(g).\n\nPancreas is one of the largest glands in the human body. It is located behind the stomach in the loop of the duodenum. It is about 12–15 cm long.\n\nIt is a **mixed gland** because it produces both pancreatic juice and hormones.\n\n**Pancreatic juice**\nPancreatic juice contains different types of enzymes that help in digestion.\n\n**Hormones**\nThe pancreas produces:\n- **Insulin:** Balances the sugar level in blood.\n- **Glucagon:** Increases the sugar level in blood.\n\nInsulin and glucagon perform opposite functions and are therefore called antagonistic hormones.\n\n**Diagram:** Draw the textbook **Fig. 5.30 Pancreas** and label the pancreas and duodenum."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.3 Human Glandular System – Exercise 4(h): What effect is seen in human body if excessive hormone is secreted? Describe with examples.","q":"What effect is seen in human body if excessive hormone is secreted? Describe with examples.","o":"4(h)","s":"5.3 Human Glandular System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.3 Human Glandular System. Exercise 4(h).\n\nIrregular or excessive production of hormones can cause various problems in the body.\n\nExamples from the textbook include:\n\n**Growth hormone**\nExcess production of growth hormone causes a person to become very tall, called **gigantism**.\n\n**Parathermone**\nExcess production can increase calcium level in the blood and may cause problems such as tumour and kidney stone.\n\n**Adrenaline**\nExcess production of adrenaline increases blood pressure.\n\n**Insulin**\nExcess insulin decreases glucose in blood and may result in anxiety, fainting and brain haemorrhage."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.3 Human Glandular System – Exercise 4(i): Describe the interrelationship between glandular system and nervous system with examples.","q":"Describe the interrelationship between glandular system and nervous system with examples.","o":"4(i)","s":"5.3 Human Glandular System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.3 Human Glandular System. Exercise 4(i).\n\nThe nervous system and glandular system both coordinate and regulate activities of the body.\n\nThe nervous system receives information from the environment and coordinates body activities through the brain, spinal cord and nerves. The glandular system produces hormones that regulate body functions.\n\nFor example, the pituitary gland is controlled through the brain and produces hormones that stimulate and control other glands. Hormones also regulate growth, reproduction and other body activities.\n\nThus, both systems work together to control and coordinate the functions of the body."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.3 Human Glandular System – Exercise 4(j): Observe the diagram and answer: name the hormone in the diagram, hormone produced by each gland with one function, which hormone is responsible for tetany.","q":"Observe the diagram and answer: name the hormone in the diagram, hormone produced by each gland with one function, which hormone is responsible for tetany.","o":"4(j)","s":"5.3 Human Glandular System","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.3 Human Glandular System. Exercise 4(j).\n\n**(a) Name of the hormone in the diagram**\nThis question is based on a diagram in the textbook, so the hormone depends on what the diagram shows.\n\n**(b) Hormone produced by each gland with one function**\n\n| Gland | Hormone | One function |\n|---|---|---|\n| Pituitary | Growth hormone, stimulating hormones | Physical and mental growth and stimulation of other glands |\n| Thyroid | Thyroxine | Regulates body functions through thyroid hormone |\n| Parathyroid | Parathermone | Increases calcium level in blood |\n| Adrenal | Adrenaline | Prepares the body for sudden emergency or danger |\n| Pancreas | Insulin | Balances blood sugar |\n| Pancreas | Glucagon | Increases blood sugar |\n| Testes | Testosterone | Helps produce sperm and male secondary sexual characteristics |\n| Ovary | Oestrogen | Helps development of female sexual characteristics |\n| Ovary | Progesterone | Helps in female reproductive functions |\n\n**(c) Which hormone is responsible for tetany?**\n**Answer: Parathermone.**\nDecreased secretion of parathermone decreases the calcium level in blood and causes muscle spasms called **tetany**."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process शरीर संरचना शारीरिक संरचना तथा जीवन प्रक्रिया","t":"5.4 Plant Hormone – important points | शरीर संरचना तथा जीवन प्रक्रिया","q":"","o":"","s":"","x":"Chapter: Body Structure and Life Process – Class 9 Science. 5.4 Plant Hormone.\n\n**Plant growth hormones** = hormones that regulate growth and development of plants.\n\n- **Auxin** = helps the shoot tip grow towards light and causes apical dominance.\n- **Cytokinin** = helps growth and development and is used with auxin in tissue culture.\n- **Ethylene** = involved in fruit ripening and leaf abscission.\n- Other plant hormones: gibberellin and brassinosteroid."},{"g":"9","n":6,"c":"Nature and Environment","a":"प्रकृति र वातावरण प्रकृति तथा वातावरण nature and environment ecosystem पारिस्थितिक प्रणाली","t":"Nature and Environment – Exercise 1(a): Which of the given organisms is decomposer? | प्रकृति र वातावरण अभ्यास 1(a)","q":"Which of the given organisms is decomposer?","o":"1(a)","s":"","x":"Chapter: Nature and Environment (प्रकृति र वातावरण) – Class 9 Science. Exercise 1(a).\n\n**Answer: (iii) Mushroom**"},{"g":"9","n":6,"c":"Nature and Environment","a":"प्रकृति र वातावरण प्रकृति तथा वातावरण nature and environment ecosystem पारिस्थितिक प्रणाली","t":"Nature and Environment – Exercise 1(b): What is the relationship made between producer and consumer on the basis of nutrition supply? | प्रकृति र वातावरण अभ्यास 1(b)","q":"What is the relationship made between producer and consumer on the basis of nutrition supply?","o":"1(b)","s":"","x":"Chapter: Nature and Environment (प्रकृति र वातावरण) – Class 9 Science. Exercise 1(b).\n\n**Answer: (ii) Food chain**"},{"g":"9","n":6,"c":"Nature and Environment","a":"प्रकृति र वातावरण प्रकृति तथा वातावरण nature and environment ecosystem पारिस्थितिक प्रणाली","t":"Nature and Environment – Exercise 1(c): Which type of interaction is found in lichens of tree bark? | प्रकृति र वातावरण अभ्यास 1(c)","q":"Which type of interaction is found in lichens of tree bark?","o":"1(c)","s":"","x":"Chapter: Nature and Environment (प्रकृति र वातावरण) – Class 9 Science. Exercise 1(c).\n\n**Answer: (i) Mutualism**"},{"g":"9","n":6,"c":"Nature and Environment","a":"प्रकृति र वातावरण प्रकृति तथा वातावरण nature and environment ecosystem पारिस्थितिक प्रणाली","t":"Nature and Environment – Exercise 1(d): In biotic interaction, prey sucks the food from host. What happens in this interaction? | प्रकृति र वातावरण अभ्यास 1(d)","q":"In biotic interaction, prey sucks the food from host. What happens in this interaction?","o":"1(d)","s":"","x":"Chapter: Nature and Environment (प्रकृति र वातावरण) – Class 9 Science. Exercise 1(d).\n\n**Answer: (i) Only one organism is benefited**"},{"g":"9","n":6,"c":"Nature and Environment","a":"प्रकृति र वातावरण प्रकृति तथा वातावरण nature and environment ecosystem पारिस्थितिक प्रणाली","t":"Nature and Environment – Exercise 1(e): Which one is the first nutrition level? | प्रकृति र वातावरण अभ्यास 1(e)","q":"Which one is the first nutrition level?","o":"1(e)","s":"","x":"Chapter: Nature and Environment (प्रकृति र वातावरण) – Class 9 Science. Exercise 1(e).\n\n**Answer: (i) Green plants**"},{"g":"9","n":6,"c":"Nature and Environment","a":"प्रकृति र वातावरण प्रकृति तथा वातावरण nature and environment ecosystem पारिस्थितिक प्रणाली","t":"Nature and Environment – Exercise 2(a): Give reason: The ecosystem is disturbed if decomposer is absent. | प्रकृति र वातावरण अभ्यास 2(a)","q":"Give reason: The ecosystem is disturbed if decomposer is absent.","o":"2(a)","s":"","x":"Chapter: Nature and Environment (प्रकृति र वातावरण) – Class 9 Science. Exercise 2(a).\n\nDecomposers such as bacteria and fungi decompose the dead bodies of plants and animals into simple molecules and mix them into the soil. Plants absorb these nutrients from the soil. If decomposers are absent, dead organisms will not be decomposed and nutrients will not return to the soil. Therefore, the ecosystem becomes disturbed."},{"g":"9","n":6,"c":"Nature and Environment","a":"प्रकृति र वातावरण प्रकृति तथा वातावरण nature and environment ecosystem पारिस्थितिक प्रणाली","t":"Nature and Environment – Exercise 2(b): Give reason: The grassland ecosystem is imbalanced if the number of primary consumers, insects, is increased excessively. | प्रकृति र वातावरण अभ्यास 2(b)","q":"Give reason: The grassland ecosystem is imbalanced if the number of primary consumers, insects, is increased excessively.","o":"2(b)","s":"","x":"Chapter: Nature and Environment (प्रकृति र वातावरण) – Class 9 Science. Exercise 2(b).\n\nPrimary consumers depend on producers such as grasses for food. If their number increases excessively, they consume a large amount of grass. This reduces the number of producers and disturbs the balance between producers and consumers. Therefore, the grassland ecosystem becomes imbalanced."},{"g":"9","n":6,"c":"Nature and Environment","a":"प्रकृति र वातावरण प्रकृति तथा वातावरण nature and environment ecosystem पारिस्थितिक प्रणाली","t":"Nature and Environment – Exercise 2(c): Give reason: In the food chain, generally the number of producers is more than consumers. | प्रकृति र वातावरण अभ्यास 2(c)","q":"Give reason: In the food chain, generally the number of producers is more than consumers.","o":"2(c)","s":"","x":"Chapter: Nature and Environment (प्रकृति र वातावरण) – Class 9 Science. Exercise 2(c).\n\nProducers are the first trophic level and are the primary source of food and energy for all other organisms. A large number of producers are required to provide food and energy to consumers of higher trophic levels. Therefore, generally, the number of producers is greater than the number of consumers."},{"g":"9","n":6,"c":"Nature and Environment","a":"प्रकृति र वातावरण प्रकृति तथा वातावरण nature and environment ecosystem पारिस्थितिक प्रणाली","t":"Nature and Environment – Exercise 2(d): Give reason: In mutualism, both organisms are benefited. | प्रकृति र वातावरण अभ्यास 2(d)","q":"Give reason: In mutualism, both organisms are benefited.","o":"2(d)","s":"","x":"Chapter: Nature and Environment (प्रकृति र वातावरण) – Class 9 Science. Exercise 2(d).\n\nMutualism is a long-term relationship in which both organisms are mutually benefited. For example, a bird gets nectar from a flower and helps the flower in pollination. Therefore, both organisms benefit from the relationship."},{"g":"9","n":6,"c":"Nature and Environment","a":"प्रकृति र वातावरण प्रकृति तथा वातावरण nature and environment ecosystem पारिस्थितिक प्रणाली","t":"Nature and Environment – Exercise 2(e): Give reason: The environment is fresh where ecosystem is balanced. | प्रकृति र वातावरण अभ्यास 2(e)","q":"Give reason: The environment is fresh where ecosystem is balanced.","o":"2(e)","s":"","x":"Chapter: Nature and Environment (प्रकृति र वातावरण) – Class 9 Science. Exercise 2(e).\n\nA balanced ecosystem maintains proper relationships between producers, consumers, decomposers and abiotic components. Decomposers decompose dead organisms and return nutrients to the soil, while producers, consumers and other components maintain the energy and material cycle. Therefore, a balanced ecosystem keeps the environment clean and fresh."},{"g":"9","n":6,"c":"Nature and Environment","a":"प्रकृति र वातावरण प्रकृति तथा वातावरण nature and environment ecosystem पारिस्थितिक प्रणाली","t":"Nature and Environment – Exercise 3(a): Write the difference between producer and consumer. | प्रकृति र वातावरण अभ्यास 3(a)","q":"Write the difference between producer and consumer.","o":"3(a)","s":"","x":"Chapter: Nature and Environment (प्रकृति र वातावरण) – Class 9 Science. Exercise 3(a).\n\n| Producer | Consumer |\n|---|---|\n| Producers prepare their own food. | Consumers cannot prepare their own food. |\n| They are mainly green plants and chlorophyll-bearing organisms. | They depend on producers or other organisms for food. |\n| They convert inorganic matter into organic matter. | They obtain food by consuming other organisms. |\n| Examples: green plants, phytoplankton, cyanobacteria and diatoms. | Examples: grasshopper, rabbit, frog, tiger and lion. |"},{"g":"9","n":6,"c":"Nature and Environment","a":"प्रकृति र वातावरण प्रकृति तथा वातावरण nature and environment ecosystem पारिस्थितिक प्रणाली","t":"Nature and Environment – Exercise 3(b): Write the difference between grassland ecosystem and pond ecosystem. | प्रकृति र वातावरण अभ्यास 3(b)","q":"Write the difference between grassland ecosystem and pond ecosystem.","o":"3(b)","s":"","x":"Chapter: Nature and Environment (प्रकृति र वातावरण) – Class 9 Science. Exercise 3(b).\n\n| Grassland ecosystem | Pond ecosystem |\n|---|---|\n| It is an ecosystem found on open land and grassland. | It is an ecosystem found in water. |\n| Its important abiotic components include air, soil, minerals, solar energy, humidity and water. | Its abiotic components include water, minerals, soil, light, heat, oxygen, carbon dioxide and nitrogen. |\n| Grasses and other green plants are producers. | Algae, phytoplankton, Pistia and Hydrilla are producers. |\n| Examples of primary consumers are insects, grasshoppers, rabbits and deer. | Examples include zooplankton, small fish, tadpoles and earthworms. |\n| Frogs, birds, jackals and wolves are secondary consumers. | Frogs, crabs and large fish are secondary consumers. |\n| Snake, tiger, leopard and lion can be tertiary consumers. | Snake can be a tertiary consumer when it eats frogs. |"},{"g":"9","n":6,"c":"Nature and Environment","a":"प्रकृति र वातावरण प्रकृति तथा वातावरण nature and environment ecosystem पारिस्थितिक प्रणाली","t":"Nature and Environment – Exercise 3(c): Write the difference between food chain and food web. | प्रकृति र वातावरण अभ्यास 3(c)","q":"Write the difference between food chain and food web.","o":"3(c)","s":"","x":"Chapter: Nature and Environment (प्रकृति र वातावरण) – Class 9 Science. Exercise 3(c).\n\n| Food chain | Food web |\n|---|---|\n| It is a linear transfer of energy from producer to higher-level consumers. | It is a complex network formed by the interconnection of many food chains. |\n| It has a single feeding pathway. | It has many interconnected feeding pathways. |\n| It shows who eats whom in a particular sequence. | It shows several possible food sources and relationships. |\n| It is comparatively simple. | It is complex. |"},{"g":"9","n":6,"c":"Nature and Environment","a":"प्रकृति र वातावरण प्रकृति तथा वातावरण nature and environment ecosystem पारिस्थितिक प्रणाली","t":"Nature and Environment – Exercise 3(d): Write the difference between biotic and abiotic components. | प्रकृति र वातावरण अभ्यास 3(d)","q":"Write the difference between biotic and abiotic components.","o":"3(d)","s":"","x":"Chapter: Nature and Environment (प्रकृति र वातावरण) – Class 9 Science. Exercise 3(d).\n\n| Biotic components | Abiotic components |\n|---|---|\n| They are living components of an ecosystem. | They are non-living components of an ecosystem. |\n| They include plants, animals, fungi, bacteria and microbes. | They include air, water, soil, light, heat, temperature and humidity. |\n| They perform life processes. | They provide physical conditions and materials required by living organisms. |\n| Examples: plants, humans, animals and bacteria. | Examples: air, water, soil and solar energy. |"},{"g":"9","n":6,"c":"Nature and Environment","a":"प्रकृति र वातावरण प्रकृति तथा वातावरण nature and environment ecosystem पारिस्थितिक प्रणाली","t":"Nature and Environment – Exercise 3(e): Write the difference between mutualism and commensalism. | प्रकृति र वातावरण अभ्यास 3(e)","q":"Write the difference between mutualism and commensalism.","o":"3(e)","s":"","x":"Chapter: Nature and Environment (प्रकृति र वातावरण) – Class 9 Science. Exercise 3(e).\n\n| Mutualism | Commensalism |\n|---|---|\n| Both organisms are benefited. | One organism is benefited while the other is neither benefited nor harmed. |\n| Both organisms have a mutually beneficial relationship. | The host organism is unaffected. |\n| Example: bird and flower. | Example: heron and cow. |\n| Lichen is also an example given in the textbook. | Barnacles attached to whales are an example. |"},{"g":"9","n":6,"c":"Nature and Environment","a":"प्रकृति र वातावरण प्रकृति तथा वातावरण nature and environment ecosystem पारिस्थितिक प्रणाली","t":"Nature and Environment – Exercise 3(f): Write the difference between parasitism and mutualism. | प्रकृति र वातावरण अभ्यास 3(f)","q":"Write the difference between parasitism and mutualism.","o":"3(f)","s":"","x":"Chapter: Nature and Environment (प्रकृति र वातावरण) – Class 9 Science. Exercise 3(f).\n\n| Parasitism | Mutualism |\n|---|---|\n| One organism is benefited and the other is harmed. | Both organisms are benefited. |\n| The parasite obtains food from the host. | Both organisms have a mutually beneficial relationship. |\n| Example: tapeworm and animal. | Example: bird and flower. |\n| Flea, mosquito and bed bug are external parasites. | Bacteria in the human digestive tract can have a mutual relationship with humans. |"},{"g":"9","n":6,"c":"Nature and Environment","a":"प्रकृति र वातावरण प्रकृति तथा वातावरण nature and environment ecosystem पारिस्थितिक प्रणाली","t":"Nature and Environment – Exercise 4(a): List out the abiotic factors in ecosystem and describe each in brief. | प्रकृति र वातावरण अभ्यास 4(a)","q":"List out the abiotic factors in ecosystem and describe each in brief.","o":"4(a)","s":"","x":"Chapter: Nature and Environment (प्रकृति र वातावरण) – Class 9 Science. Exercise 4(a).\n\nThe main abiotic factors are:\n\n**1. Air:** Air contains gases such as nitrogen, oxygen, carbon dioxide and water vapour. Plants use carbon dioxide during photosynthesis and release oxygen. Animals and plants use oxygen during respiration and release carbon dioxide. Water vapour is important in the water cycle.\n\n**2. Solar energy:** Solar energy provides heat and light required for life. Plants use solar energy to prepare food by photosynthesis. Solar heat helps maintain atmospheric temperature and the water cycle. The amount of solar energy also affects climate, rainfall and food production.\n\n**3. Water:** Water is essential for plants and animals. It is necessary for photosynthesis, body building and various biochemical processes. Plants and animals obtain water from different sources such as ponds, lakes, wells, waterfalls, rivers and seas.\n\n**4. Soil:** Soil contains minerals and organic matter and chemicals such as nitrogen, phosphorus and potassium. Plants absorb water and minerals from soil for their growth and development. Soil also provides habitat or settlement for humans and other animals."},{"g":"9","n":6,"c":"Nature and Environment","a":"प्रकृति र वातावरण प्रकृति तथा वातावरण nature and environment ecosystem पारिस्थितिक प्रणाली","t":"Nature and Environment – Exercise 4(b): Describe the role of decomposer in ecosystem. | प्रकृति र वातावरण अभ्यास 4(b)","q":"Describe the role of decomposer in ecosystem.","o":"4(b)","s":"","x":"Chapter: Nature and Environment (प्रकृति र वातावरण) – Class 9 Science. Exercise 4(b).\n\nDecomposers are bacteria, fungi and other microbes present in the soil.\n\nThey decompose the dead bodies of plants and animals and convert them into simple molecules. These simple substances mix with the soil and are absorbed by plants as nutrients.\n\nThus, decomposers:\n- Decompose dead organisms.\n- Return nutrients to the soil.\n- Help plants obtain nutrients.\n- Clean the environment.\n- Maintain the balance of the ecosystem.\n\nTherefore, decomposers are essential for the continuous operation of the ecosystem."},{"g":"9","n":6,"c":"Nature and Environment","a":"प्रकृति र वातावरण प्रकृति तथा वातावरण nature and environment ecosystem पारिस्थितिक प्रणाली","t":"Nature and Environment – Exercise 4(c): Describe the grassland ecosystem in brief with a diagram. | प्रकृति र वातावरण अभ्यास 4(c)","q":"Describe the grassland ecosystem in brief with a diagram.","o":"4(c)","s":"","x":"Chapter: Nature and Environment (प्रकृति र वातावरण) – Class 9 Science. Exercise 4(c).\n\nA grassland ecosystem is formed by the interrelationship between biotic and abiotic factors in open land and grassland.\n\n**Abiotic factors:** Air, soil, minerals, solar energy, humidity, water. Plants use water, carbon dioxide and solar energy to prepare food. Living beings take oxygen from air during respiration and release carbon dioxide. Soil provides water and minerals to plants.\n\n**Biotic factors:**\n1. **Producers:** Green plants and grasses. They prepare food using water, carbon dioxide and solar energy.\n2. **Primary consumers:** Herbivores that depend on grasses. Examples: insects, grasshoppers, earthworms, rabbits, deer.\n3. **Secondary consumers:** Depend on primary consumers. Examples: frogs, birds, jackals, wolves.\n4. **Tertiary consumers:** Depend on secondary consumers. Examples: snake, tiger, leopard, lion.\n5. **Decomposers:** Bacteria and fungi decompose dead organisms and convert them into simple molecules that mix with the soil.\n\n**Simple diagram:**\n```text\nSolar energy\n     ↓\nGrass / Green plants (Producer)\n     ↓\nGrasshopper / Rabbit / Deer (Primary consumer)\n     ↓\nFrog / Bird / Jackal (Secondary consumer)\n     ↓\nSnake / Tiger / Leopard / Lion (Tertiary consumer)\n     ↓\nBacteria + Fungi (Decomposer)\n     ↓\nNutrients in soil\n     ↓\nGreen plants\n```"},{"g":"9","n":6,"c":"Nature and Environment","a":"प्रकृति र वातावरण प्रकृति तथा वातावरण nature and environment ecosystem पारिस्थितिक प्रणाली","t":"Nature and Environment – Exercise 4(d): What effect are seen when the number of frogs is increased in pond ecosystem? Explain. | प्रकृति र वातावरण अभ्यास 4(d)","q":"What effect are seen when the number of frogs is increased in pond ecosystem? Explain.","o":"4(d)","s":"","x":"Chapter: Nature and Environment (प्रकृति र वातावरण) – Class 9 Science. Exercise 4(d).\n\nFrogs are secondary consumers in the pond ecosystem. They depend on primary consumers such as small organisms and insects for food.\n\nIf the number of frogs increases excessively, the number of their food organisms decreases. This disturbs the relationship between primary consumers and secondary consumers. It can also affect organisms at other trophic levels and disturb the balance of the pond ecosystem.\n\nTherefore, an excessive increase in the number of frogs can disturb the pond ecosystem."},{"g":"9","n":6,"c":"Nature and Environment","a":"प्रकृति र वातावरण प्रकृति तथा वातावरण nature and environment ecosystem पारिस्थितिक प्रणाली","t":"Nature and Environment – Exercise 4(e): The farmer works on the land and kills all of the mice that ate rice but rice production is very less after killing the mice. Why does the production of rice decrease? Describe with your illustration. | प्रकृति र वातावरण अभ्यास 4(e)","q":"The farmer works on the land and kills all of the mice that ate rice but rice production is very less after killing the mice. Why does the production of rice decrease? Describe with your illustration.","o":"4(e)","s":"","x":"Chapter: Nature and Environment (प्रकृति र वातावरण) – Class 9 Science. Exercise 4(e).\n\nMice are primary consumers in a food chain because they feed on producers such as rice.\n\nIf all the mice are killed, the organisms that feed on mice, such as owls and other predators, lose an important food source. This disturbs the food chain and affects the balance of the ecosystem.\n\nA food chain can be illustrated as:\n\n**Rice → Mouse → Owl**\n\nRice is the producer, mouse is the primary consumer and owl is a higher-level consumer.\n\nWhen mice are removed, the food chain is disturbed. Therefore, the ecological balance is affected and rice production may decrease."},{"g":"9","n":6,"c":"Nature and Environment","a":"प्रकृति र वातावरण प्रकृति तथा वातावरण nature and environment ecosystem पारिस्थितिक प्रणाली","t":"Nature and Environment – Exercise 4(f): Describe the food chain in a pond with a figure. | प्रकृति र वातावरण अभ्यास 4(f)","q":"Describe the food chain in a pond with a figure.","o":"4(f)","s":"","x":"Chapter: Nature and Environment (प्रकृति र वातावरण) – Class 9 Science. Exercise 4(f).\n\nA food chain is the linear transfer of energy from a producer to the higher-level consumers through eating and being eaten.\n\nIn a pond:\n\n**Phytoplankton / Algae → Zooplankton → Small fish → Large fish → Snake**\n\n- Phytoplankton and algae are producers.\n- Zooplankton are primary consumers.\n- Small fish are primary consumers.\n- Large fish can act as secondary consumers.\n- Snake can act as a tertiary consumer.\n\nThe energy is transferred from one trophic level to the next through feeding.\n\n**Pond food-chain diagram:**\n```text\nSolar energy\n     ↓\nPhytoplankton / Algae\n     ↓\nZooplankton\n     ↓\nSmall fish\n     ↓\nLarge fish\n     ↓\nSnake\n```"},{"g":"9","n":6,"c":"Nature and Environment","a":"प्रकृति र वातावरण प्रकृति तथा वातावरण nature and environment ecosystem पारिस्थितिक प्रणाली","t":"Nature and Environment – Exercise 4(g): In an ecosystem, the balance cycle is operated among producer, consumer, decomposer and environment. The ecosystem is disturbed if any one component is imbalanced. Prove this statement with reason. | प्रकृति र वातावरण अभ्यास 4(g)","q":"In an ecosystem, the balance cycle is operated among producer, consumer, decomposer and environment. The ecosystem is disturbed if any one component is imbalanced. Prove this statement with reason.","o":"4(g)","s":"","x":"Chapter: Nature and Environment (प्रकृति र वातावरण) – Class 9 Science. Exercise 4(g).\n\nAn ecosystem works through the continuous interrelationship between producers, consumers, decomposers and abiotic components.\n\nProducers prepare food using solar energy and abiotic substances such as water and carbon dioxide. Consumers obtain food from producers or other consumers. When plants and animals die, decomposers such as bacteria and fungi decompose their dead bodies into simple molecules and return nutrients to the soil.\n\nIf any component becomes imbalanced, the relationship among other components is also disturbed.\n\nFor example, if decomposers are absent, dead organisms are not decomposed and nutrients do not return to the soil. This affects producers and then consumers.\n\nSimilarly, excessive primary consumers can reduce producers, while a decrease in consumers can affect organisms that depend on them for food.\n\nTherefore, every component is interrelated and necessary for maintaining the balance of an ecosystem."},{"g":"9","n":6,"c":"Nature and Environment","a":"प्रकृति र वातावरण प्रकृति तथा वातावरण nature and environment ecosystem पारिस्थितिक प्रणाली","t":"Nature and Environment – Exercise 4(h): State the types of ecological interaction. Explain each with examples. | प्रकृति र वातावरण अभ्यास 4(h)","q":"State the types of ecological interaction. Explain each with examples.","o":"4(h)","s":"","x":"Chapter: Nature and Environment (प्रकृति र वातावरण) – Class 9 Science. Exercise 4(h).\n\nThe major types of ecological interaction described in the textbook are:\n\n**1. Symbiosis / Mutualism:** A long-term relationship in which both organisms are mutually benefited.\nExample: A bird takes nectar from a flower and helps in pollination. Other examples: bacteria in the human digestive tract, clownfish and sea anemones.\n\n**2. Commensalism:** One organism is benefited while the other is neither benefited nor harmed.\nExample: A heron gets insects disturbed by a grazing cow. The heron benefits while the cow is neither benefited nor harmed. Other examples: a spider making a net in a tree, barnacles attached to whales.\n\n**3. Parasitism:** One organism is benefited while the other is harmed. The organism that obtains food is the parasite and the organism from which it obtains food is the host.\nExamples: flea sucking blood from animals, mosquito sucking blood, tapeworm living inside an animal's intestine, louse sucking human blood.\n\n**4. Competition:** Organisms compete for the same resources such as food and shelter.\nExamples: sea sponges and corals compete for food in the ocean; wolf and bear compete for hunting organisms.\n\n**5. Predation:** A carnivore kills another animal to obtain food.\nExamples: leopard kills deer; owl hunts mouse; tiger hunts other animals."},{"g":"9","n":6,"c":"Nature and Environment","a":"प्रकृति र वातावरण प्रकृति तथा वातावरण nature and environment ecosystem पारिस्थितिक प्रणाली","t":"Nature and Environment – Exercise 4(i): Isolate the type of ecological interaction from the given examples: i. Bee and bumble bee take flower nectar; ii. Spider makes the net in tree; iii. Barn swallow makes the nest in home; iv. Bed bug, flea and mosquito survive by sucking blood from animals; v. Tapeworm and roundworm live inside the body of animals. | प्रकृति र वातावरण अभ्यास 4(i)","q":"Isolate the type of ecological interaction from the given examples: i. Bee and bumble bee take flower nectar; ii. Spider makes the net in tree; iii. Barn swallow makes the nest in home; iv. Bed bug, flea and mosquito survive by sucking blood from animals; v. Tapeworm and roundworm live inside the body of animals.","o":"4(i)","s":"","x":"Chapter: Nature and Environment (प्रकृति र वातावरण) – Class 9 Science. Exercise 4(i).\n\n**i. Bee and bumble bee take flower nectar → Competition.** Both depend on flowers for nectar, so they compete for the same food source.\n\n**ii. Spider makes the net in tree → Commensalism.** The spider obtains a place to make its net, while the tree is neither benefited nor harmed.\n\n**iii. Barn swallow makes the nest in home → Commensalism.** The bird obtains shelter or a place for nesting, while the structure used by it is not necessarily benefited or harmed.\n\n**iv. Bed bug, flea and mosquito survive by sucking blood from animals → Parasitism.** They obtain food by sucking blood from another organism and harm the host.\n\n**v. Tapeworm and roundworm live inside the body of animals → Parasitism.** They live inside the host and obtain food from it, benefiting themselves while harming the host."},{"g":"9","n":6,"c":"Nature and Environment","a":"प्रकृति र वातावरण प्रकृति तथा वातावरण nature and environment ecosystem पारिस्थितिक प्रणाली","t":"Nature and Environment – Exercise 4(j): Study the ecosystem given in the picture and answer: i. Identify the producer and consumer from the diagram. ii. How do producers prepare food? iii. The number of producers is more in this system, why? iv. Explain the role of decomposer in this system. v. Write the benefits of balanced ecosystem. | प्रकृति र वातावरण अभ्यास 4(j)","q":"Study the ecosystem given in the picture and answer: i. Identify the producer and consumer from the diagram. ii. How do producers prepare food? iii. The number of producers is more in this system, why? iv. Explain the role of decomposer in this system. v. Write the benefits of balanced ecosystem.","o":"4(j)","s":"","x":"Chapter: Nature and Environment (प्रकृति र वातावरण) – Class 9 Science. Exercise 4(j).\n\nNote: The exact picture is not included in the textbook text, so the organisms shown cannot be identified with certainty. The answers follow the concepts of the chapter.\n\n**i. Identify the producer and consumer from the diagram.**\nProducer: green plants or other chlorophyll-bearing organisms shown in the diagram.\nConsumer: animals that depend directly or indirectly on the producers for food.\n\n**ii. How do producers prepare food?**\nProducers prepare food by **photosynthesis** using carbon dioxide and water in the presence of solar energy.\n\n**iii. The number of producers is more in this system, why?**\nProducers are the first trophic level and are the primary source of food and energy for all other organisms. Therefore, a large number of producers are required to support consumers at higher trophic levels.\n\n**iv. Explain the role of decomposer in this system.**\nDecomposers such as bacteria and fungi decompose dead organisms into simple molecules. These molecules mix with the soil and are absorbed by plants as nutrients. In this way, decomposers help maintain the nutrient cycle and clean the environment.\n\n**v. Write the benefits of balanced ecosystem.**\nA balanced ecosystem:\n- Maintains proper relationships among organisms.\n- Maintains the flow of energy.\n- Maintains nutrient cycling.\n- Provides suitable conditions for living organisms.\n- Helps maintain a clean and fresh environment.\n- Maintains the natural balance between producers, consumers and decomposers."},{"g":"9","n":6,"c":"Nature and Environment","a":"प्रकृति र वातावरण प्रकृति तथा वातावरण nature and environment ecosystem पारिस्थितिक प्रणाली","t":"Nature and Environment – Project Work A: Pond and grassland ecosystem chart. | प्रकृति र वातावरण परियोजना कार्य","q":"Project Work A: Pond and grassland ecosystem chart.","o":"Project A","s":"","x":"Chapter: Nature and Environment (प्रकृति र वातावरण) – Class 9 Science. Project Work A.\n\n**Pond ecosystem**\n- Abiotic factors: water, soil, minerals, light, heat, oxygen, carbon dioxide, nitrogen\n- Producer: algae, phytoplankton, Pistia, Hydrilla\n- Primary consumer: zooplankton, Cyclops, Daphnia, beetles, molluscs, small fish, tadpoles, earthworms\n- Secondary consumer: frog, crab, large fish\n- Tertiary consumer: snake\n- Decomposer: bacteria and fungi\n\n**Grassland ecosystem**\n- Abiotic factors: air, soil, minerals, solar energy, humidity, water\n- Producer: grass and other green plants\n- Primary consumer: insects, grasshoppers, earthworms, rabbits, deer\n- Secondary consumer: frogs, birds, jackals, wolves\n- Tertiary consumer: snake, tiger, leopard, lion\n- Decomposer: bacteria and fungi"},{"g":"9","n":6,"c":"Nature and Environment","a":"प्रकृति र वातावरण प्रकृति तथा वातावरण nature and environment ecosystem पारिस्थितिक प्रणाली","t":"Nature and Environment – Project Work B: Types of biotic interaction. | प्रकृति र वातावरण परियोजना कार्य","q":"Project Work B: Types of biotic interaction.","o":"Project B","s":"","x":"Chapter: Nature and Environment (प्रकृति र वातावरण) – Class 9 Science. Project Work B.\n\nThe major biotic interactions from the chapter are:\n\n| Interaction | Effect | Example |\n|---|---|---|\n| Mutualism | Both organisms benefit | Bird and flower |\n| Commensalism | One benefits, other is unaffected | Heron and cow |\n| Parasitism | One benefits, other is harmed | Tapeworm and animal |\n| Competition | Organisms compete for resources | Wolf and bear |\n| Predation | One organism kills another for food | Leopard and deer |\n\nThese interactions are interrelated because organisms depend on one another for food, shelter, movement, reproduction and survival. Changes in one population can affect other organisms and may disturb the balance of the ecosystem."},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 1(a): In a velocity-time graph, which value is given by the slope of the line? | बल र गति अभ्यास 1(a)","q":"In a velocity-time graph, which value is given by the slope of the line?","o":"1(a)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 1(a).\n\n**Answer: iii) Acceleration**\n\nThe slope of a velocity-time graph represents acceleration."},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 1(b): Which of the following is a displacement-time graph? | बल र गति अभ्यास 1(b)","q":"Which of the following is a displacement-time graph?","o":"1(b)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 1(b).\n\n**Answer: The graph showing displacement on the y-axis and time on the x-axis with a straight sloping line for uniform motion.**\n\nAccording to the chapter, a displacement-time graph has displacement on the y-axis and time on the x-axis."},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 1(c): Stepping down from a running bus is dangerous. On which basis can this be justified? | बल र गति अभ्यास 1(c)","q":"Stepping down from a running bus is dangerous. On which basis can this be justified?","o":"1(c)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 1(c).\n\n**Answer: ii) Inertia of motion**\n\nWhen a person steps down from a moving bus, the lower part of the body comes to rest with the ground, but the upper part tends to continue moving due to inertia of motion. Therefore, the person may fall forward."},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 1(d): Which statement about action and reaction is true? | बल र गति अभ्यास 1(d)","q":"Which statement about action and reaction is true?","o":"1(d)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 1(d).\n\n**Answer: iv. Act on different objects**\n\nAction and reaction are equal in magnitude and opposite in direction, but they act on different objects."},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 1(e): Which of the following is an application of elasticity? | बल र गति अभ्यास 1(e)","q":"Which of the following is an application of elasticity?","o":"1(e)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 1(e).\n\n**Answer: iv. Hitting the shuttle cock with a badminton racket**\n\nThe racket bends slightly when it hits the shuttlecock and tends to regain its original shape. This property is related to elasticity."},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 1(f): A loaded truck and a car are moving with the same velocity. If equal braking forces are applied, which statement is true? | बल र गति अभ्यास 1(f)","q":"A loaded truck and a car are moving with the same velocity. If equal braking forces are applied, which statement is true?","o":"1(f)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 1(f).\n\n**Answer: ii. Distance covered by the car is less than the distance covered by the truck.**\n\nThe loaded truck has greater mass. For the same force, acceleration is inversely proportional to mass. Therefore, the truck has less retardation and covers a greater distance before stopping."},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 2(i): State the differences: Displacement-time graph and velocity-time graph. | बल र गति अभ्यास 2(i)","q":"State the differences: Displacement-time graph and velocity-time graph.","o":"2(i)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 2(i).\n\n| Displacement-time graph | Velocity-time graph |\n|---|---|\n| Displacement is plotted on the y-axis. | Velocity is plotted on the y-axis. |\n| Time is plotted on the x-axis. | Time is plotted on the x-axis. |\n| Its slope represents velocity. | Its slope represents acceleration. |\n| It gives information about displacement and velocity. | It gives information about velocity and acceleration. |"},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 2(ii): State the differences: Inertia of rest and inertia of motion. | बल र गति अभ्यास 2(ii)","q":"State the differences: Inertia of rest and inertia of motion.","o":"2(ii)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 2(ii).\n\n| Inertia of rest | Inertia of motion |\n|---|---|\n| It is the tendency of an object at rest to remain at rest. | It is the tendency of a moving object to continue moving with the same velocity. |\n| Example: Mangoes fall when the branches of a mango tree are shaken. | Example: A passenger tends to move forward when a moving bus suddenly stops. |\n| Example: Dust is removed from a carpet by beating it. | Example: A bag placed on the floor of a moving bus moves forward when the bus suddenly stops. |"},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 2(iii): State the differences: Elasticity and plasticity. | बल र गति अभ्यास 2(iii)","q":"State the differences: Elasticity and plasticity.","o":"2(iii)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 2(iii).\n\n| Elasticity | Plasticity |\n|---|---|\n| Elasticity is the property of matter by which it regains its original shape and size after removing the deforming force. | Plasticity is the property of matter by which it retains its deformed shape even after removing the deforming force. |\n| The change is temporary. | The change is permanent. |\n| A rubber band shows elasticity. | Mud shows plasticity. |\n| A restoring force develops. | A restoring force does not develop. |"},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 3(i): Give reason: It takes different times to bring a motorcycle, car, bus, train, etc. moving with uniform velocity into the rest position. | बल र गति अभ्यास 3(i)","q":"Give reason: It takes different times to bring a motorcycle, car, bus, train, etc. moving with uniform velocity into the rest position.","o":"3(i)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 3(i).\n\nThe inertia of an object depends upon its mass.
