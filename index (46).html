:"4(j)","s":"","x":"Chapter: Honey Bee (मौरी) – Class 10 Science, SEE. Exercise 4(j).\n\nThe process is called **parthenogenesis**."},{"g":"10","n":3,"c":"Honey Bee","a":"honeybee मौरी मौरीपालन मौरी पालन","t":"Honey Bee – Exercise 4(k): When a farmer practises bee farming, income of other farmers in that locality also increases. Justify. | मौरी अभ्यास 4(k)","q":"When a farmer practises bee farming, income of other farmers in that locality also increases. Justify.","o":"4(k)","s":"","x":"Chapter: Honey Bee (मौरी) – Class 10 Science, SEE. Exercise 4(k).\n\nHoney bees help in **pollination** while collecting nectar from flowers. Pollination helps plants produce more crops. Therefore, when bee farming is practised in an area, nearby agricultural crops can receive more pollination and farmers can get increased crop production and income."},{"g":"10","n":3,"c":"Honey Bee","a":"honeybee मौरी मौरीपालन मौरी पालन","t":"Honey Bee – Exercise 4(l): Explain the relationship between beekeeping and agricultural production. | मौरी अभ्यास 4(l)","q":"Explain the relationship between beekeeping and agricultural production.","o":"4(l)","s":"","x":"Chapter: Honey Bee (मौरी) – Class 10 Science, SEE. Exercise 4(l).\n\nHoney bees play an important role in pollination. While sucking nectar from flowers, they carry out pollination in plants.\n\nIf beekeepers move bees away because of a lack of pasture land, the number of bees visiting nearby flowering crops decreases. As a result, pollination decreases and crop production can also decrease.\n\nTherefore, **beekeeping and agricultural production are closely related**, because honey bees help in pollination and increased crop production."},{"g":"10","n":3,"c":"Honey Bee","a":"honeybee मौरी मौरीपालन मौरी पालन","t":"Honey Bee – Exercise 4(m): Complete the concept map (bee, parthenogenesis, fertilization, drone, queen, worker). | मौरी अभ्यास 4(m)","q":"Complete the concept map (bee, parthenogenesis, fertilization, drone, queen, worker).","o":"4(m)","s":"","x":"Chapter: Honey Bee (मौरी) – Class 10 Science, SEE. Exercise 4(m).\n\nThe key concepts from the textbook are:\n\n```text\n                 Bee\n                  │\n        ┌─────────┴─────────┐\n        │                   │\nParthenogenesis         Fertilization\n        │                   │\n   Unfertilized          Fertilized\n       egg                   egg\n        │                   │\n        ↓              ┌────┴────┐\n     Drone            Queen    Worker\n        │\n      Fertile\n```\n\nMore specifically, the textbook states that **drones develop from unfertilized eggs by parthenogenesis**, while **queen and worker bees develop from fertilized eggs**."},{"g":"9","n":1,"c":"Scientific Study","a":"scientific study वैज्ञानिक अध्ययन scientific learning","t":"Scientific Study – Exercise 1(i): Which branch does the veterinary profession belong to? | वैज्ञानिक अध्ययन अभ्यास 1(i)","q":"Which branch does the veterinary profession belong to?","o":"1(i)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 9 Science. Exercise 1(i).\n\n**Answer: (b) Biology**"},{"g":"9","n":1,"c":"Scientific Study","a":"scientific study वैज्ञानिक अध्ययन scientific learning","t":"Scientific Study – Exercise 1(ii): Which field of science does Johann Gregor Mendel represent? | वैज्ञानिक अध्ययन अभ्यास 1(ii)","q":"Which field of science does Johann Gregor Mendel represent?","o":"1(ii)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 9 Science. Exercise 1(ii).\n\n**Answer: (c) Biology**"},{"g":"9","n":1,"c":"Scientific Study","a":"scientific study वैज्ञानिक अध्ययन scientific learning","t":"Scientific Study – Exercise 1(iii): Which one is the least count when measured from scale? | वैज्ञानिक अध्ययन अभ्यास 1(iii)","q":"Which one is the least count when measured from scale?","o":"1(iii)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 9 Science. Exercise 1(iii).\n\n**Answer: (b) Millimeter**"},{"g":"9","n":1,"c":"Scientific Study","a":"scientific study वैज्ञानिक अध्ययन scientific learning","t":"Scientific Study – Exercise 1(iv): How is 0.000024 expressed in scientific notation? | वैज्ञानिक अध्ययन अभ्यास 1(iv)","q":"How is 0.000024 expressed in scientific notation?","o":"1(iv)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 9 Science. Exercise 1(iv).\n\n**Answer: (d) 2.4 × 10⁻⁵**"},{"g":"9","n":1,"c":"Scientific Study","a":"scientific study वैज्ञानिक अध्ययन scientific learning","t":"Scientific Study – Exercise 1(v): What is the value of the Giga prefix? | वैज्ञानिक अध्ययन अभ्यास 1(v)","q":"What is the value of the Giga prefix?","o":"1(v)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 9 Science. Exercise 1(v).\n\n**Answer: (d) 10⁹**"},{"g":"9","n":1,"c":"Scientific Study","a":"scientific study वैज्ञानिक अध्ययन scientific learning","t":"Scientific Study – Exercise 2(a): How is scientific study done? Explain. | वैज्ञानिक अध्ययन अभ्यास 2(a)","q":"How is scientific study done? Explain.","o":"2(a)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 9 Science. Exercise 2(a).\n\nScientific study is done systematically by following these steps:\n\n1. Observation and curiosity\n2. Question for research\n3. Hypothesis building\n4. Experimental work and data collection\n5. Result and conclusion\n6. Hypothesis testing\n7. Preparation and communication of the report\n\nIf the hypothesis is not justified, it is modified and the process is repeated."},{"g":"9","n":1,"c":"Scientific Study","a":"scientific study वैज्ञानिक अध्ययन scientific learning","t":"Scientific Study – Exercise 2(b): Enlist the fields of science. | वैज्ञानिक अध्ययन अभ्यास 2(b)","q":"Enlist the fields of science.","o":"2(b)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 9 Science. Exercise 2(b).\n\nThe main fields of science are:\n\n1. Biology\n2. Physics\n3. Chemistry\n4. Geology\n5. Astronomy\n6. Environmental science\n7. Agriculture and other interdisciplinary fields"},{"g":"9","n":1,"c":"Scientific Study","a":"scientific study वैज्ञानिक अध्ययन scientific learning","t":"Scientific Study – Exercise 2(c): Describe the interrelationship among the fields of science with examples. | वैज्ञानिक अध्ययन अभ्यास 2(c)","q":"Describe the interrelationship among the fields of science with examples.","o":"2(c)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 9 Science. Exercise 2(c).\n\nDifferent fields of science are interrelated because one field often uses the knowledge of another field.\n\nFor example:\n- **Biology + Chemistry = Biochemistry**\n- **Physics + Engineering = Engineering physics**\n- **Biology + Technology = Biotechnology**\n- **Science + Agriculture = Agricultural science**\n- **Science + Environment = Environmental science**\n\nThus, different fields work together to solve scientific and technological problems."},{"g":"9","n":1,"c":"Scientific Study","a":"scientific study वैज्ञानिक अध्ययन scientific learning","t":"Scientific Study – Exercise 2(d): What is the value of experiment in scientific study? Explain with examples. | वैज्ञानिक अध्ययन अभ्यास 2(d)","q":"What is the value of experiment in scientific study? Explain with examples.","o":"2(d)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 9 Science. Exercise 2(d).\n\nExperiment is important because it helps to collect **data and evidence** and to test a hypothesis.\n\nFor example, in studying the acidity and basicity of substances, experiments are performed and their **pH values** are collected. The data are then analysed to obtain a conclusion."},{"g":"9","n":1,"c":"Scientific Study","a":"scientific study वैज्ञानिक अध्ययन scientific learning","t":"Scientific Study – Exercise 2(e): Enlist the safety measures while conducting experimental work. | वैज्ञानिक अध्ययन अभ्यास 2(e)","q":"Enlist the safety measures while conducting experimental work.","o":"2(e)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 9 Science. Exercise 2(e).\n\n1. Perform experiments in the presence of a teacher.\n2. Use a lab coat, safety glasses and gloves.\n3. Inform the teacher immediately if an accident occurs.\n4. Know the proper use of laboratory devices.\n5. Take chemicals in adequate amounts.\n6. Follow safety precautions while handling chemicals.\n7. Keep doors and windows open when necessary.\n8. Inform the teacher before using concentrated acid.\n9. Clean the laboratory after the experiment.\n10. Wash hands with soap and water after the experiment.\n\n**Important:** When diluting concentrated acid, the acid should be added slowly to water, not water to acid."},{"g":"9","n":1,"c":"Scientific Study","a":"scientific study वैज्ञानिक अध्ययन scientific learning","t":"Scientific Study – Exercise 2(f): Define scientific notation. | वैज्ञानिक अध्ययन अभ्यास 2(f)","q":"Define scientific notation.","o":"2(f)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 9 Science. Exercise 2(f).\n\nScientific notation is a method of expressing very large or very small numbers in the form of a coefficient multiplied by a power of 10.\n\n**Example:** 600000 = 6 × 10⁵ and 0.000001 = 1 × 10⁻⁶"},{"g":"9","n":1,"c":"Scientific Study","a":"scientific study वैज्ञानिक अध्ययन scientific learning","t":"Scientific Study – Exercise 2(g): Why is metric prefix important? Describe with examples. | वैज्ञानिक अध्ययन अभ्यास 2(g)","q":"Why is metric prefix important? Describe with examples.","o":"2(g)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 9 Science. Exercise 2(g).\n\nMetric prefixes are important because they make it easy to express very large and very small measurements.\n\nExamples:\n- kilo = 10³\n- mega = 10⁶\n- giga = 10⁹\n- milli = 10⁻³\n- micro = 10⁻⁶\n- nano = 10⁻⁹\n\nFor example: 1 kilogram = 1000 g = 10³ g."},{"g":"9","n":1,"c":"Scientific Study","a":"scientific study वैज्ञानिक अध्ययन scientific learning","t":"Scientific Study – Exercise 2(h): Explain in brief about least count in measurement. | वैज्ञानिक अध्ययन अभ्यास 2(h)","q":"Explain in brief about least count in measurement.","o":"2(h)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 9 Science. Exercise 2(h).\n\nThe **least count** is the smallest quantity that can be measured by a measuring instrument.\n\nExamples:\n- Scale = 1 mm = 0.1 cm\n- Digital stopwatch = 0.01 second\n- Protractor = 1°\n\nLeast count helps to obtain more accurate measurements."},{"g":"9","n":1,"c":"Scientific Study","a":"scientific study वैज्ञानिक अध्ययन scientific learning","t":"Scientific Study – Exercise 2(i): Express the given numbers in scientific notation: (i) 1230000, (ii) 0.00042, (iii) 0.00000001, (iv) 300000000. | वैज्ञानिक अध्ययन अभ्यास 2(i)","q":"Express the given numbers in scientific notation: (i) 1230000, (ii) 0.00042, (iii) 0.00000001, (iv) 300000000.","o":"2(i)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 9 Science. Exercise 2(i).\n\n**(i)** 1230000 = **1.23 × 10⁶**\n**(ii)** 0.00042 = **4.2 × 10⁻⁴**\n**(iii)** 0.00000001 = **1 × 10⁻⁸**\n**(iv)** 300000000 = **3 × 10⁸**"},{"g":"9","n":2,"c":"Classification of Living Beings","a":"classification of living beings classification of living things जीवहरूको वर्गीकरण जीवको वर्गीकरण","t":"Classification of Living Beings – Exercise 1(a): Which kingdom does blue-green algae belong to? | जीवहरूको वर्गीकरण अभ्यास 1(a)","q":"Which kingdom does blue-green algae belong to?","o":"1(a)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 9 Science. Exercise 1(a).\n\n**Answer: (a) Monera**"},{"g":"9","n":2,"c":"Classification of Living Beings","a":"classification of living beings classification of living things जीवहरूको वर्गीकरण जीवको वर्गीकरण","t":"Classification of Living Beings – Exercise 1(b): What characteristic makes Euglena different from other animals? | जीवहरूको वर्गीकरण अभ्यास 1(b)","q":"What characteristic makes Euglena different from other animals?","o":"1(b)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 9 Science. Exercise 1(b).\n\n**Answer: (a) Presence of chlorophyll**"},{"g":"9","n":2,"c":"Classification of Living Beings","a":"classification of living beings classification of living things जीवहरूको वर्गीकरण जीवको वर्गीकरण","t":"Classification of Living Beings – Exercise 1(c): Who is the founder of the binomial system of nomenclature? | जीवहरूको वर्गीकरण अभ्यास 1(c)","q":"Who is the founder of the binomial system of nomenclature?","o":"1(c)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 9 Science. Exercise 1(c).\n\n**Answer: (a) Carolus Linnaeus**"},{"g":"9","n":2,"c":"Classification of Living Beings","a":"classification of living beings classification of living things जीवहरूको वर्गीकरण जीवको वर्गीकरण","t":"Classification of Living Beings – Exercise 1(d): Which kingdom does an organism without a definite nucleus belong to? | जीवहरूको वर्गीकरण अभ्यास 1(d)","q":"Which kingdom does an organism without a definite nucleus belong to?","o":"1(d)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 9 Science. Exercise 1(d).\n\n**Answer: (a) Monera**"},{"g":"9","n":2,"c":"Classification of Living Beings","a":"classification of living beings classification of living things जीवहरूको वर्गीकरण जीवको वर्गीकरण","t":"Classification of Living Beings – Exercise 1(e): Which is an example of a prokaryotic microorganism? | जीवहरूको वर्गीकरण अभ्यास 1(e)","q":"Which is an example of a prokaryotic microorganism?","o":"1(e)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 9 Science. Exercise 1(e).\n\n**Answer: (a) Azotobacter**"},{"g":"9","n":2,"c":"Classification of Living Beings","a":"classification of living beings classification of living things जीवहरूको वर्गीकरण जीवको वर्गीकरण","t":"Classification of Living Beings – Exercise 2(a): Give reason: The five-kingdom system is more appropriate and scientific than the two-kingdom system. | जीवहरूको वर्गीकरण अभ्यास 2(a)","q":"Give reason: The five-kingdom system is more appropriate and scientific than the two-kingdom system.","o":"2(a)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 9 Science. Exercise 2(a).\n\nThe five-kingdom system is more appropriate because it:\n- Separates prokaryotes and eukaryotes.\n- Separates unicellular and multicellular organisms.\n- Separates photosynthetic algae and non-photosynthetic fungi.\n- Includes living organisms more properly.\n\nThe five-kingdom system was proposed by **R. H. Whittaker in 1969**."},{"g":"9","n":2,"c":"Classification of Living Beings","a":"classification of living beings classification of living things जीवहरूको वर्गीकरण जीवको वर्गीकरण","t":"Classification of Living Beings – Exercise 2(b): Give reason: Fungi are also called saprophytes. | जीवहरूको वर्गीकरण अभ्यास 2(b)","q":"Give reason: Fungi are also called saprophytes.","o":"2(b)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 9 Science. Exercise 2(b).\n\nFungi are called saprophytes because they obtain their nutrition from **dead and decaying organic matter**."},{"g":"9","n":2,"c":"Classification of Living Beings","a":"classification of living beings classification of living things जीवहरूको वर्गीकरण जीवको वर्गीकरण","t":"Classification of Living Beings – Exercise 2(c): Give reason: Protista are more advanced than Monera. (The source text prints the two names the other way round.) | जीवहरूको वर्गीकरण अभ्यास 2(c)","q":"Give reason: Protista are more advanced than Monera. (The source text prints the two names the other way round.)","o":"2(c)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 9 Science. Exercise 2(c).\n\nNote: The source text prints this exercise with the names reversed. The chapter facts are:\n- **Monera** are prokaryotic microorganisms (no definite nucleus).\n- **Protista** are eukaryotic, mostly unicellular organisms (definite nucleus present).\n\nBecause Protista have a definite nucleus and are eukaryotic, they are considered more advanced than Monera."},{"g":"9","n":2,"c":"Classification of Living Beings","a":"classification of living beings classification of living things जीवहरूको वर्गीकरण जीवको वर्गीकरण","t":"Classification of Living Beings – Exercise 3(a): Write the difference between prokaryotes and eukaryotes. | जीवहरूको वर्गीकरण अभ्यास 3(a)","q":"Write the difference between prokaryotes and eukaryotes.","o":"3(a)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 9 Science. Exercise 3(a).\n\n| Prokaryotes | Eukaryotes |\n|---|---|\n| Definite nucleus is absent. | Definite nucleus is present. |\n| Example: Bacteria | Example: Amoeba |"},{"g":"9","n":2,"c":"Classification of Living Beings","a":"classification of living beings classification of living things जीवहरूको वर्गीकरण जीवको वर्गीकरण","t":"Classification of Living Beings – Exercise 3(b): Write the difference between two-kingdom system and five-kingdom system. | जीवहरूको वर्गीकरण अभ्यास 3(b)","q":"Write the difference between two-kingdom system and five-kingdom system.","o":"3(b)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 9 Science. Exercise 3(b).\n\n| Two-kingdom system | Five-kingdom system |\n|---|---|\n| Living beings are divided into two kingdoms. | Living beings are divided into five kingdoms. |\n| Prokaryotes and eukaryotes are not clearly separated. | Prokaryotes and eukaryotes are separated. |\n| Unicellular and multicellular organisms are not clearly separated. | They are separated more systematically. |"},{"g":"9","n":2,"c":"Classification of Living Beings","a":"classification of living beings classification of living things जीवहरूको वर्गीकरण जीवको वर्गीकरण","t":"Classification of Living Beings – Exercise 3(c): Write the difference between Monera and Protista. | जीवहरूको वर्गीकरण अभ्यास 3(c)","q":"Write the difference between Monera and Protista.","o":"3(c)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 9 Science. Exercise 3(c).\n\n| Monera | Protista |\n|---|---|\n| Prokaryotic | Eukaryotic |\n| Definite nucleus absent | Definite nucleus present |\n| Mostly microorganisms | Mostly unicellular organisms |\n| Example: Bacteria | Example: Amoeba |"},{"g":"9","n":2,"c":"Classification of Living Beings","a":"classification of living beings classification of living things जीवहरूको वर्गीकरण जीवको वर्गीकरण","t":"Classification of Living Beings – Exercise 3(d): Write the difference between Protista and Fungi. | जीवहरूको वर्गीकरण अभ्यास 3(d)","q":"Write the difference between Protista and Fungi.","o":"3(d)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 9 Science. Exercise 3(d).\n\n| Protista | Fungi |\n|---|---|\n| Mostly unicellular | Unicellular or multicellular |\n| Eukaryotic | Eukaryotic |\n| Examples: Amoeba, Euglena | Examples: Yeast, Mushroom |"},{"g":"9","n":2,"c":"Classification of Living Beings","a":"classification of living beings classification of living things जीवहरूको वर्गीकरण जीवको वर्गीकरण","t":"Classification of Living Beings – Exercise 3(e): Write the difference between yeast and mushroom. | जीवहरूको वर्गीकरण अभ्यास 3(e)","q":"Write the difference between yeast and mushroom.","o":"3(e)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 9 Science. Exercise 3(e).\n\n| Yeast | Mushroom |\n|---|---|\n| Unicellular fungus | Multicellular fungus |\n| Usually microscopic | Usually visible to naked eye |\n| Example of fungus used in fermentation | Used as food and for other purposes |"},{"g":"9","n":2,"c":"Classification of Living Beings","a":"classification of living beings classification of living things जीवहरूको वर्गीकरण जीवको वर्गीकरण","t":"Classification of Living Beings – Exercise 3(f): Write the difference between genus and species. | जीवहरूको वर्गीकरण अभ्यास 3(f)","q":"Write the difference between genus and species.","o":"3(f)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 9 Science. Exercise 3(f).\n\n| Genus | Species |\n|---|---|\n| Group of species having maximum similar characteristics | Group of similar organisms capable of reproduction with each other |\n| Higher than species | Smallest unit of taxonomy |\n| Example: Homo | Example: Homo sapiens |"},{"g":"9","n":2,"c":"Classification of Living Beings","a":"classification of living beings classification of living things जीवहरूको वर्गीकरण जीवको वर्गीकरण","t":"Classification of Living Beings – Exercise 3(g): Write the difference between kingdom and phylum. | जीवहरूको वर्गीकरण अभ्यास 3(g)","q":"Write the difference between kingdom and phylum.","o":"3(g)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 9 Science. Exercise 3(g).\n\n| Kingdom | Phylum |\n|---|---|\n| Higher taxonomic rank | Rank below kingdom |\n| Contains many organisms | Contains organisms with more similar characteristics |\n| Example: Animalia | Example: Chordata |"},{"g":"9","n":2,"c":"Classification of Living Beings","a":"classification of living beings classification of living things जीवहरूको वर्गीकरण जीवको वर्गीकरण","t":"Classification of Living Beings – Exercise 3(h): Write the difference between mushroom and bacteria. | जीवहरूको वर्गीकरण अभ्यास 3(h)","q":"Write the difference between mushroom and bacteria.","o":"3(h)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 9 Science. Exercise 3(h).\n\n| Mushroom | Bacteria |\n|---|---|\n| Fungi | Monera |\n| Eukaryotic | Prokaryotic |\n| Usually multicellular | Usually unicellular |\n| Example of decomposer | Can be autotrophic, parasitic, saprophytic or symbiotic |"},{"g":"9","n":2,"c":"Classification of Living Beings","a":"classification of living beings classification of living things जीवहरूको वर्गीकरण जीवको वर्गीकरण","t":"Classification of Living Beings – Exercise 4(a): What is the binomial system of nomenclature? | जीवहरूको वर्गीकरण अभ्यास 4(a)","q":"What is the binomial system of nomenclature?","o":"4(a)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 9 Science. Exercise 4(a).\n\nThe system of giving two names to an organism, consisting of its **genus name and species name**, is called the binomial system of nomenclature.\n\nThe first letter of the genus is written in capital form and the species begins with a small letter."},{"g":"9","n":2,"c":"Classification of Living Beings","a":"classification of living beings classification of living things जीवहरूको वर्गीकरण जीवको वर्गीकरण","t":"Classification of Living Beings – Exercise 4(b): Write the scientific names of human beings, garden pea, mustard and leopard. | जीवहरूको वर्गीकरण अभ्यास 4(b)","q":"Write the scientific names of human beings, garden pea, mustard and leopard.","o":"4(b)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 9 Science. Exercise 4(b).\n\n- Human beings = *Homo sapiens*\n- Garden pea = *Pisum sativum*\n- Mustard = *Brassica campestris*\n- Leopard = *Panthera pardus*"},{"g":"9","n":2,"c":"Classification of Living Beings","a":"classification of living beings classification of living things जीवहरूको वर्गीकरण जीवको वर्गीकरण","t":"Classification of Living Beings – Exercise 4(c): What are genus and species? Clarify. | जीवहरूको वर्गीकरण अभ्यास 4(c)","q":"What are genus and species? Clarify.","o":"4(c)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 9 Science. Exercise 4(c).\n\n**Genus:** A group of species having maximum similar characteristics is called genus.\n\n**Species:** A group of similar organisms capable of reproduction with each other is called species. It is the smallest unit of taxonomy."},{"g":"9","n":2,"c":"Classification of Living Beings","a":"classification of living beings classification of living things जीवहरूको वर्गीकरण जीवको वर्गीकरण","t":"Classification of Living Beings – Exercise 4(d): Write the five kingdoms and two examples of each. | जीवहरूको वर्गीकरण अभ्यास 4(d)","q":"Write the five kingdoms and two examples of each.","o":"4(d)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 9 Science. Exercise 4(d).\n\n| Kingdom | Examples |\n|---|---|\n| Monera | Bacteria, Nostoc |\n| Protista | Amoeba, Euglena |\n| Fungi | Mushroom, Yeast |\n| Plantae | Fern, Maize |\n| Animalia | Human, Cow |\n\nThe five kingdoms are **Monera, Protista, Fungi, Plantae and Animalia**."},{"g":"9","n":2,"c":"Classification of Living Beings","a":"classification of living beings classification of living things जीवहरूको वर्गीकरण जीवको वर्गीकरण","t":"Classification of Living Beings – Exercise 4(e): Present the characteristics of kingdom Monera with examples. | जीवहरूको वर्गीकरण अभ्यास 4(e)","q":"Present the characteristics of kingdom Monera with examples.","o":"4(e)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 9 Science. Exercise 4(e).\n\nCharacteristics of Monera:\n1. They are prokaryotic microorganisms.\n2. They do not have a well-defined nucleus.\n3. DNA acts as genetic material.\n4. They can survive in adverse conditions.\n5. They may be autotrophic, parasitic, saprophytic or symbiotic.\n6. Examples are bacteria, Rhizobium, Nostoc and Anabaena.\n\nMonera includes **Archaebacteria, Eubacteria and Cyanobacteria**."},{"g":"9","n":2,"c":"Classification of Living Beings","a":"classification of living beings classification of living things जीवहरूको वर्गीकरण जीवको वर्गीकरण","t":"Classification of Living Beings – Exercise 4(f): Write the features of kingdom Protista with examples. | जीवहरूको वर्गीकरण अभ्यास 4(f)","q":"Write the features of kingdom Protista with examples.","o":"4(f)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 9 Science. Exercise 4(f).\n\n1. They are eukaryotic.\n2. They are mostly unicellular.\n3. Their cells have a definite nucleus.\n4. They have locomotory organs such as pseudopodia, cilia and flagella.\n5. They reproduce by sexual and asexual methods.\n6. Examples are Amoeba, Euglena and Paramecium."},{"g":"9","n":2,"c":"Classification of Living Beings","a":"classification of living beings classification of living things जीवहरूको वर्गीकरण जीवको वर्गीकरण","t":"Classification of Living Beings – Exercise 4(g): Clarify the properties of kingdom Fungi with examples. | जीवहरूको वर्गीकरण अभ्यास 4(g)","q":"Clarify the properties of kingdom Fungi with examples.","o":"4(g)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 9 Science. Exercise 4(g).\n\n1. Fungi are achlorophyllous.\n2. They may be unicellular or multicellular.\n3. They are generally saprotrophic.\n4. Their body is made of mycelium.\n5. Their body is thalloid.\n6. They reproduce sexually and asexually.\n7. They store food as glycogen.\n8. Examples are Mucor, Yeast and Mushroom.\n\nFungi may be **saprotrophic, parasitic or symbiotic**."},{"g":"9","n":2,"c":"Classification of Living Beings","a":"classification of living beings classification of living things जीवहरूको वर्गीकरण जीवको वर्गीकरण","t":"Classification of Living Beings – Exercise 4(h): Write the kingdom of the following organisms. | जीवहरूको वर्गीकरण अभ्यास 4(h)","q":"Write the kingdom of the following organisms.","o":"4(h)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 9 Science. Exercise 4(h).\n\nNote: The complete list of organisms for this figure-based question is not visible in the textbook text, so the answer is not guessed. Use the kingdom rules: bacteria and Nostoc → Monera; Amoeba and Euglena → Protista; Yeast and mushroom → Fungi; ferns and maize → Plantae; humans and cows → Animalia."},{"g":"9","n":2,"c":"Classification of Living Beings","a":"classification of living beings classification of living things जीवहरूको वर्गीकरण जीवको वर्गीकरण","t":"Classification of Living Beings – Exercise 4(i): Clarify the interrelationship among various taxa in the hierarchy of classification. | जीवहरूको वर्गीकरण अभ्यास 4(i)","q":"Clarify the interrelationship among various taxa in the hierarchy of classification.","o":"4(i)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 9 Science. Exercise 4(i).\n\nThe taxonomic hierarchy is:\n\n**Kingdom → Phylum/Division → Class → Order → Family → Genus → Species**\n\nThe higher taxon contains more organisms, while the lower taxon contains fewer organisms with greater similarity.\n\nExample of human: **Animalia → Chordata → Mammalia → Primates → Hominidae → Homo → Homo sapiens**"},{"g":"9","n":2,"c":"Classification of Living Beings","a":"classification of living beings classification of living things जीवहरूको वर्गीकरण जीवको वर्गीकरण","t":"Classification of Living Beings – Exercise 4(j): Identify the kingdoms in the given diagram and write three properties. | जीवहरूको वर्गीकरण अभ्यास 4(j)","q":"Identify the kingdoms in the given diagram and write three properties.","o":"4(j)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 9 Science. Exercise 4(j).\n\nNote: The diagram is not visible in the textbook text, so the labelled organisms cannot be identified reliably. Identify each organism from the printed diagram and use the kingdom characteristics given in questions 4(e), 4(f) and 4(g)."},{"g":"9","n":3,"c":"Mushroom","a":"mushroom mushrooms च्याउ chyau","t":"Mushroom – Exercise 1(a): Why is mushroom called saprophytic? | च्याउ अभ्यास 1(a)","q":"Why is mushroom called saprophytic?","o":"1(a)","s":"","x":"Chapter: Mushroom (च्याउ) – Class 9 Science. Exercise 1(a).\n\n**Answer: (b) It takes its food from dead and decaying matter.**"},{"g":"9","n":3,"c":"Mushroom","a":"mushroom mushrooms च्याउ chyau","t":"Mushroom – Exercise 1(b): What are the main components found in mushroom? | च्याउ अभ्यास 1(b)","q":"What are the main components found in mushroom?","o":"1(b)","s":"","x":"Chapter: Mushroom (च्याउ) – Class 9 Science. Exercise 1(b).\n\n**Answer: (a) Minerals, vitamins, protein**"},{"g":"9","n":3,"c":"Mushroom","a":"mushroom mushrooms च्याउ chyau","t":"Mushroom – Exercise 1(c): Which mushroom is used to prepare medicine for cancer? | च्याउ अभ्यास 1(c)","q":"Which mushroom is used to prepare medicine for cancer?","o":"1(c)","s":"","x":"Chapter: Mushroom (च्याउ) – Class 9 Science. Exercise 1(c).\n\n**Answer: (a) Red mushroom**"},{"g":"9","n":3,"c":"Mushroom","a":"mushroom mushrooms च्याउ chyau","t":"Mushroom – Exercise 1(d): What is the name of the sterile cell in hymenium? | च्याउ अभ्यास 1(d)","q":"What is the name of the sterile cell in hymenium?","o":"1(d)","s":"","x":"Chapter: Mushroom (च्याउ) – Class 9 Science. Exercise 1(d).\n\n**Answer: (c) Paraphysis**"},{"g":"9","n":3,"c":"Mushroom","a":"mushroom mushrooms च्याउ chyau","t":"Mushroom – Exercise 1(e): Where are basidiospores located? | च्याउ अभ्यास 1(e)","q":"Where are basidiospores located?","o":"1(e)","s":"","x":"Chapter: Mushroom (च्याउ) – Class 9 Science. Exercise 1(e).\n\n**Answer: (a) Hymenium**"},{"g":"9","n":3,"c":"Mushroom","a":"mushroom mushrooms च्याउ chyau","t":"Mushroom – Exercise 2(a): Give reason: Mushroom is called saprophytic. | च्याउ अभ्यास 2(a)","q":"Give reason: Mushroom is called saprophytic.","o":"2(a)","s":"","x":"Chapter: Mushroom (च्याउ) – Class 9 Science. Exercise 2(a).\n\nMushroom is called saprophytic because it obtains its food from **dead and decaying organic matter**."},{"g":"9","n":3,"c":"Mushroom","a":"mushroom mushrooms च्याउ chyau","t":"Mushroom – Exercise 2(b): Give reason: Mushroom is both beneficial and harmful to human beings. | च्याउ अभ्यास 2(b)","q":"Give reason: Mushroom is both beneficial and harmful to human beings.","o":"2(b)","s":"","x":"Chapter: Mushroom (च्याउ) – Class 9 Science. Exercise 2(b).\n\nMushroom is beneficial because it contains protein, vitamins, minerals and fibres and is used as food and medicine.\n\nSome wild mushrooms are poisonous and may cause serious illness or death. Therefore, unknown wild mushrooms should not be consumed."},{"g":"9","n":3,"c":"Mushroom","a":"mushroom mushrooms च्याउ chyau","t":"Mushroom – Exercise 2(c): Give reason: Patients of high blood pressure, diabetes and heart disease are encouraged to consume mushroom. | च्याउ अभ्यास 2(c)","q":"Give reason: Patients of high blood pressure, diabetes and heart disease are encouraged to consume mushroom.","o":"2(c)","s":"","x":"Chapter: Mushroom (च्याउ) – Class 9 Science. Exercise 2(c).\n\nMushrooms contain nutritious substances such as proteins, vitamins, minerals and fibres and are described in the textbook as having medicinal value. Therefore, the textbook encourages their consumption."},{"g":"9","n":3,"c":"Mushroom","a":"mushroom mushrooms च्याउ chyau","t":"Mushroom – Exercise 2(d): Give reason: Precaution is followed while consuming wild mushrooms. | च्याउ अभ्यास 2(d)","q":"Give reason: Precaution is followed while consuming wild mushrooms.","o":"2(d)","s":"","x":"Chapter: Mushroom (च्याउ) – Class 9 Science. Exercise 2(d).\n\nIt is difficult to identify edible and poisonous wild mushrooms by appearance alone. The textbook states that confirmation requires laboratory testing. Therefore, unknown wild mushrooms should not be consumed."},{"g":"9","n":3,"c":"Mushroom","a":"mushroom mushrooms च्याउ chyau","t":"Mushroom – Exercise 3(a): Differentiate between edible and poisonous mushroom. | च्याउ अभ्यास 3(a)","q":"Differentiate between edible and poisonous mushroom.","o":"3(a)","s":"","x":"Chapter: Mushroom (च्याउ) – Class 9 Science. Exercise 3(a).\n\n| Edible mushroom | Poisonous mushroom |\n|---|---|\n| Can be safely consumed when properly identified and certified. | Can cause poisoning. |\n| Used as food. | Should not be consumed. |\n| Examples include Kanya and Gobre mushrooms. | Some wild mushrooms may be poisonous. |"},{"g":"9","n":3,"c":"Mushroom","a":"mushroom mushrooms च्याउ chyau","t":"Mushroom – Exercise 3(b): Differentiate between primary and secondary mycelium. | च्याउ अभ्यास 3(b)","q":"Differentiate between primary and secondary mycelium.","o":"3(b)","s":"","x":"Chapter: Mushroom (च्याउ) – Class 9 Science. Exercise 3(b).\n\n| Primary mycelium | Secondary mycelium |\n|---|---|\n| Develops from germination of a basidiospore. | Develops by fusion of two opposite-strain primary mycelia. |\n| Contains one nucleus. | Contains two nuclei. |\n| It is monokaryotic. | It is dikaryotic. |"},{"g":"9","n":3,"c":"Mushroom","a":"mushroom mushrooms च्याउ chyau","t":"Mushroom – Exercise 3(c): Differentiate between paraphysis and basidium. | च्याउ अभ्यास 3(c)","q":"Differentiate between paraphysis and basidium.","o":"3(c)","s":"","x":"Chapter: Mushroom (च्याउ) – Class 9 Science. Exercise 3(c).\n\n| Paraphysis | Basidium |\n|---|---|\n| Sterile cell | Reproductive cell |\n| Does not form basidiospores | Forms basidiospores |\n| Found in hymenium | Found in hymenium |"},{"g":"9","n":3,"c":"Mushroom","a":"mushroom mushrooms च्याउ chyau","t":"Mushroom – Exercise 4(1): Write the names of nutrients found in mushrooms. | च्याउ अभ्यास 4(1)","q":"Write the names of nutrients found in mushrooms.","o":"4(1)","s":"","x":"Chapter: Mushroom (च्याउ) – Class 9 Science. Exercise 4(1).\n\nMushrooms contain:\n- Protein\n- Vitamins\n- Minerals\n- Fibre\n- Amino acids\n\nThe textbook specifically describes mushrooms as sources of protein, vitamins and minerals."},{"g":"9","n":3,"c":"Mushroom","a":"mushroom mushrooms च्याउ chyau","t":"Mushroom – Exercise 4(2): Describe the medicinal value of mushrooms. | च्याउ अभ्यास 4(2)","q":"Describe the medicinal value of mushrooms.","o":"4(2)","s":"","x":"Chapter: Mushroom (च्याउ) – Class 9 Science. Exercise 4(2).\n\nMushrooms have medicinal value and are described in the textbook as being associated with health benefits. Red mushroom is used in preparation of medicines mentioned in the chapter for conditions including asthma, diabetes, cancer, piles and respiratory diseases."},{"g":"9","n":3,"c":"Mushroom","a":"mushroom mushrooms च्याउ chyau","t":"Mushroom – Exercise 4(3): \"Mushroom is significant for human health and income.\" Write with facts. | च्याउ अभ्यास 4(3)","q":"\"Mushroom is significant for human health and income.\" Write with facts.","o":"4(3)","s":"","x":"Chapter: Mushroom (च्याउ) – Class 9 Science. Exercise 4(3).\n\nMushroom is significant because:\n1. It contains protein.\n2. It contains vitamins.\n3. It contains minerals.\n4. It contains fibre.\n5. It is used as food.\n6. It has medicinal value.\n7. It can be cultivated commercially.\n8. Mushroom products such as sukuti and pickle can provide income.\n\nThus, mushroom has both nutritional and economic importance."},{"g":"9","n":3,"c":"Mushroom","a":"mushroom mushrooms च्याउ chyau","t":"Mushroom – Exercise 4(4): How is mushroom farmed at home by simple technology? | च्याउ अभ्यास 4(4)","q":"How is mushroom farmed at home by simple technology?","o":"4(4)","s":"","x":"Chapter: Mushroom (च्याउ) – Class 9 Science. Exercise 4(4).\n\n1. Collect good-quality hay.\n2. Cut it into small pieces.\n3. Boil the hay for about 15–20 minutes.\n4. Dry the boiled hay.\n5. Put the hay into a plastic bag in layers.\n6. Put mushroom seed in each layer.\n7. Press the layers properly.\n8. Make holes in the plastic bag.\n9. Keep the bag in a suitable dark place.\n10. Sprinkle water when necessary.\n11. Mushroom starts appearing after about 10 days.\n12. It becomes mature at around 25 days and can be harvested."},{"g":"9","n":3,"c":"Mushroom","a":"mushroom mushrooms च्याउ chyau","t":"Mushroom – Exercise 4(5): Enlist the products of mushrooms. | च्याउ अभ्यास 4(5)","q":"Enlist the products of mushrooms.","o":"4(5)","s":"","x":"Chapter: Mushroom (च्याउ) – Class 9 Science. Exercise 4(5).\n\nMushroom can be used to prepare:\n- Sukuti\n- Pickle\n- Ketchup\n- Soup\n- Mushroom powder"},{"g":"9","n":3,"c":"Mushroom","a":"mushroom mushrooms च्याउ chyau","t":"Mushroom – Exercise 4(6): Describe the method of preparation of mushroom sukuti. | च्याउ अभ्यास 4(6)","q":"Describe the method of preparation of mushroom sukuti.","o":"4(6)","s":"","x":"Chapter: Mushroom (च्याउ) – Class 9 Science. Exercise 4(6).\n\n1. Wash the mushrooms properly.\n2. Cut them into small pieces.\n3. Boil them.\n4. Dry them in the sun, by fire or in an oven.\n5. Pack them in an airtight container after proper drying.\n6. Store them in a suitable place."},{"g":"9","n":3,"c":"Mushroom","a":"mushroom mushrooms च्याउ chyau","t":"Mushroom – Exercise 4(7): Write the properties of poisonous mushrooms. | च्याउ अभ्यास 4(7)","q":"Write the properties of poisonous mushrooms.","o":"4(7)","s":"","x":"Chapter: Mushroom (च्याउ) – Class 9 Science. Exercise 4(7).\n\nThe textbook lists some mushrooms that are **suspected** to be poisonous based on appearance, but also warns that appearance alone is not a reliable confirmation.\n\nSome described features are:\n1. Light-grey colour\n2. White gills\n3. Volva at the base of the stipe\n4. Red stalk and pileus\n5. Smooth pileus without insect infection\n6. Yellow secretion when the pileus is pressed\n\nConfirmation requires laboratory testing."},{"g":"9","n":3,"c":"Mushroom","a":"mushroom mushrooms च्याउ chyau","t":"Mushroom – Exercise 4(8): Draw a diagram of a mushroom and label its parts. | च्याउ अभ्यास 4(8)","q":"Draw a diagram of a mushroom and label its parts.","o":"4(8)","s":"","x":"Chapter: Mushroom (च्याउ) – Class 9 Science. Exercise 4(8).\n\nThe main parts to label are:\n- **Pileus** — the umbrella-like upper part\n- **Gills**\n- **Stipe** — the stalk\n- **Mycelium** — the vegetative part below the soil\n- **Hyphae**"},{"g":"9","n":3,"c":"Mushroom","a":"mushroom mushrooms च्याउ chyau","t":"Mushroom – Exercise 4(9): Describe the life cycle of mushroom. | च्याउ अभ्यास 4(9)","q":"Describe the life cycle of mushroom.","o":"4(9)","s":"","x":"Chapter: Mushroom (च्याउ) – Class 9 Science. Exercise 4(9).\n\n**Basidiospore → Germination → Primary mycelium → Fusion of opposite strains → Secondary mycelium → Mushroom → Basidiospores**\n\nA basidiospore germinates under favourable conditions and forms primary mycelium. Two opposite-strain primary mycelia fuse to form secondary dikaryotic mycelium. It develops into a mature mushroom. Basidiospores are formed in the hymenium and are dispersed, completing the life cycle."},{"g":"9","n":3,"c":"Mushroom","a":"mushroom mushrooms च्याउ chyau","t":"Mushroom – Exercise 4(10): Observe the diagram and answer: A. Label the parts and write one function each. B. Where are basidiospores? C. Separate the parts into fruiting body and mycelium. | च्याउ अभ्यास 4(10)","q":"Observe the diagram and answer: A. Label the parts and write one function each. B. Where are basidiospores? C. Separate the parts into fruiting body and mycelium.","o":"4(10)","s":"","x":"Chapter: Mushroom (च्याउ) – Class 9 Science. Exercise 4(10).\n\n**A. Parts and functions**\n- **Pileus** — protects the reproductive structures.\n- **Gills** — contain the hymenium and basidiospores.\n- **Stipe** — supports the pileus.\n- **Mycelium** — absorbs water and organic food.\n- **Hyphae** — form the mycelium.\n\n**B.** Basidiospores are present in the **hymenium of the gills**.\n\n**C.** Fruiting body: pileus, gills and stipe. Mycelium part: mycelium and hyphae."},{"g":"9","n":3,"c":"Mushroom","a":"mushroom mushrooms च्याउ chyau","t":"Mushroom – Exercise 4(11): Section of gills: A. Write the names of parts. B. What is the difference between A and B? C. How is basidiospore formed? | च्याउ अभ्यास 4(11)","q":"Section of gills: A. Write the names of parts. B. What is the difference between A and B? C. How is basidiospore formed?","o":"4(11)","s":"","x":"Chapter: Mushroom (च्याउ) – Class 9 Science. Exercise 4(11).\n\n**A. Names of parts:** The main layers are trama, sub-hymenium and hymenium. The hymenium contains **basidium and paraphysis**.\n\n**B.** The figure labels A and B are not visible in the textbook text, so they cannot be identified reliably without the diagram.\n\n**C. Formation of basidiospore:** Two haploid nuclei fuse to form a diploid nucleus in the basidium. The nucleus undergoes meiosis and forms four haploid nuclei. Four sterigmata develop at the tip of the basidium, and one nucleus enters each sterigma. A basidiospore is then formed on each sterigma."},{"g":"9","n":4,"c":"Evolution","a":"विकास क्रमविकास evolution क्रम विकास","t":"Evolution – Exercise 1(i): Who is the founder of the theory of natural selection? | क्रमविकास अभ्यास 1(i)","q":"Who is the founder of the theory of natural selection?","o":"1(i)","s":"","x":"Chapter: Evolution (क्रमविकास) – Class 9 Science. Exercise 1(i).\n\n**Answer: (a) Charles Darwin**"},{"g":"9","n":4,"c":"Evolution","a":"विकास क्रमविकास evolution क्रम विकास","t":"Evolution – Exercise 1(ii): Which one is the example of homologous organ? | क्रमविकास अभ्यास 1(ii)","q":"Which one is the example of homologous organ?","o":"1(ii)","s":"","x":"Chapter: Evolution (क्रमविकास) – Class 9 Science. Exercise 1(ii).\n\n**Answer: (a) Our hand and fore leg of horse**"},{"g":"9","n":4,"c":"Evolution","a":"विकास क्रमविकास evolution क्रम विकास","t":"Evolution – Exercise 1(iii): In which rock are fossils found? | क्रमविकास अभ्यास 1(iii)","q":"In which rock are fossils found?","o":"1(iii)","s":"","x":"Chapter: Evolution (क्रमविकास) – Class 9 Science. Exercise 1(iii).\n\n**Answer: (a) Sedimentary**"},{"g":"9","n":4,"c":"Evolution","a":"विकास क्रमविकास evolution क्रम विकास","t":"Evolution – Exercise 1(iv): What is the process called for the appearance of new characters in offspring due to change in genetic structure? | क्रमविकास अभ्यास 1(iv)","q":"What is the process called for the appearance of new characters in offspring due to change in genetic structure?","o":"1(iv)","s":"","x":"Chapter: Evolution (क्रमविकास) – Class 9 Science. Exercise 1(iv).\n\n**Answer: (b) Mutation**"},{"g":"9","n":4,"c":"Evolution","a":"विकास क्रमविकास evolution क्रम विकास","t":"Evolution – Exercise 2(a): Give reason: The evidences from fossils are taken as a strong basis of evolution. | क्रमविकास अभ्यास 2(a)","q":"Give reason: The evidences from fossils are taken as a strong basis of evolution.","o":"2(a)","s":"","x":"Chapter: Evolution (क्रमविकास) – Class 9 Science. Exercise 2(a).\n\nFossils are the traces, parts and signs of past animals and plants found in sedimentary rocks. They provide information about living beings that existed millions of years ago. The fossils of simple structured organisms are found in the lower layers of sedimentary rock and the fossils of mammals are found in the upper layers. This shows the development of living beings from simple to complex structures. Therefore, fossil evidence is considered a strong basis of evolution."},{"g":"9","n":4,"c":"Evolution","a":"विकास क्रमविकास evolution क्रम विकास","t":"Evolution – Exercise 2(b): Give reason: The number of birth of new offspring is excessive though population of organism is not increasing. | क्रमविकास अभ्यास 2(b)","q":"Give reason: The number of birth of new offspring is excessive though population of organism is not increasing.","o":"2(b)","s":"","x":"Chapter: Evolution (क्रमविकास) – Class 9 Science. Exercise 2(b).\n\nAccording to Darwin, every organism has the power of reproduction and produces many offspring. If all offspring survived, their population would increase geometrically. However, food and shelter are limited, so organisms struggle for existence. Many organisms cannot survive and become extinct. Therefore, although many new offspring are born, the population does not increase excessively."},{"g":"9","n":4,"c":"Evolution","a":"विकास क्रमविकास evolution क्रम विकास","t":"Evolution – Exercise 2(c): Give reason: Variation is not only the cause of the origin of species. | क्रमविकास अभ्यास 2(c)","q":"Give reason: Variation is not only the cause of the origin of species.","o":"2(c)","s":"","x":"Chapter: Evolution (क्रमविकास) – Class 9 Science. Exercise 2(c).\n\nVariation produces differences in the characters of organisms. Favorable variations can help organisms survive and can be transferred to the next generation. However, according to the textbook, mutation also causes variation, and natural selection is not the only cause of speciation. Therefore, variation alone is not considered the only cause of the origin of species."},{"g":"9","n":4,"c":"Evolution","a":"विकास क्रमविकास evolution क्रम विकास","t":"Evolution – Exercise 2(d): Give reason: Human, monkey, horse and birds are considered to have evolved from the same ancestor. | क्रमविकास अभ्यास 2(d)","q":"Give reason: Human, monkey, horse and birds are considered to have evolved from the same ancestor.","o":"2(d)","s":"","x":"Chapter: Evolution (क्रमविकास) – Class 9 Science. Exercise 2(d).\n\nThere are similarities in the body structures and early embryonic stages of different vertebrates. Comparative anatomy, homologous organs and embryonic evidence help to show relationships among organisms. Therefore, these organisms are considered to have evolved from ancestral organisms."},{"g":"9","n":4,"c":"Evolution","a":"विकास क्रमविकास evolution क्रम विकास","t":"Evolution – Exercise 3(A): Write the difference: Variation and Mutation. | क्रमविकास अभ्यास 3(A)","q":"Write the difference: Variation and Mutation.","o":"3(A)","s":"","x":"Chapter: Evolution (क्रमविकास) – Class 9 Science. Exercise 3(A).\n\n| Variation | Mutation |\n|---|---|\n| Variation is the difference in characters among individuals of a species. | Mutation is the development of new characters in offspring due to chromosomal change. |\n| It may occur due to genetic and environmental factors. | It occurs due to changes in chromosomes or genes. |\n| It may be somatogenic, blastogenic or environmental. | It is a sudden and discontinuous variation. |\n| Acquired muscular strength and intelligence are examples of somatogenic variation. | Six fingers, split lip baby, two-headed baby and hairless mice are examples of mutation. |"},{"g":"9","n":4,"c":"Evolution","a":"विकास क्रमविकास evolution क्रम विकास","t":"Evolution – Exercise 3(B): Write the difference: Darwinism and Hugo De Vries Theory. | क्रमविकास अभ्यास 3(B)","q":"Write the difference: Darwinism and Hugo De Vries Theory.","o":"3(B)","s":"","x":"Chapter: Evolution (क्रमविकास) – Class 9 Science. Exercise 3(B).\n\n| Darwinism | Hugo De Vries Theory |\n|---|---|\n| Charles Darwin proposed the theory. | Hugo De Vries proposed the mutation theory. |\n| It is also called the theory of natural selection. | It is called the theory of mutation. |\n| It explains evolution through enormous fertility, struggle for existence, variation and heredity, natural selection and origin of new species. | It explains that mutation is an important basis of evolution. |\n| Favorable variations are selected by nature. | New characters appear suddenly due to mutation. |\n| New species develop through the long process of variation and natural selection. | New species originate from mutation and mass variation. |"},{"g":"9","n":4,"c":"Evolution","a":"विकास क्रमविकास evolution क्रम विकास","t":"Evolution – Exercise 3(C): Write the difference: Homologous and Analogous organs. | क्रमविकास अभ्यास 3(C)","q":"Write the difference: Homologous and Analogous organs.","o":"3(C)","s":"","x":"Chapter: Evolution (क्रमविकास) – Class 9 Science. Exercise 3(C).\n\n| Homologous organs | Analogous organs |\n|---|---|\n| Organs having the same embryonic origin but different functions are called homologous organs. | Organs having the same function but different embryonic origins are called analogous organs. |\n| They have similar basic structures. | Their internal structures are different. |\n| Human hand, fore leg of horse, wing of bat and paddle of whale are examples. | Wings of insects, bats and birds are examples. |\n| They provide evidence of common ancestry. | They show that organisms have different ancestral groups. |"},{"g":"9","n":4,"c":"Evolution","a":"विकास क्रमविकास evolution क्रम विकास","t":"Evolution – Exercise 3(D): Write the difference: Fossil and Vestigial organs. | क्रमविकास अभ्यास 3(D)","q":"Write the difference: Fossil and Vestigial organs.","o":"3(D)","s":"","x":"Chapter: Evolution (क्रमविकास) – Class 9 Science. Exercise 3(D).\n\n| Fossil | Vestigial organs |\n|---|---|\n| Fossils are traces, parts and signs of past animals and plants found in sedimentary rocks. | Vestigial organs are organs that are inactive or less functional due to disuse. |\n| They provide information about organisms that existed millions of years ago. | They reflect the characteristics of ancestors. |\n| They are studied in paleontology or paleobotany. | They are found in different animals and plants. |\n| Example: fossils of algae and mammals. | Examples: vermiform appendix, tail vertebrae and ear muscles in humans. |"},{"g":"9","n":4,"c":"Evolution","a":"विकास क्रमविकास evolution क्रम विकास","t":"Evolution – Exercise 4(1): What is evolution? | क्रमविकास अभ्यास 4(1)","q":"What is evolution?","o":"4(1)","s":"","x":"Chapter: Evolution (क्रमविकास) – Class 9 Science. Exercise 4(1).\n\nEvolution is the process of changing the body structure of an organism from a simple to a complex form, resulting in the development of new species."},{"g":"9","n":4,"c":"Evolution","a":"विकास क्रमविकास evolution क्रम विकास","t":"Evolution – Exercise 4(2): What is called a fossil? How does it prove the evidences of evolution? | क्रमविकास अभ्यास 4(2)","q":"What is called a fossil? How does it prove the evidences of evolution?","o":"4(2)","s":"","x":"Chapter: Evolution (क्रमविकास) – Class 9 Science. Exercise 4(2).\n\nThe traces, parts and signs of past animals and plants found in sedimentary rocks are called fossils.\n\nFossils provide information about organisms that lived millions of years ago. Fossils of simple organisms are found in the lower layers of sedimentary rocks, while fossils of mammals are found in the upper layers. This shows the development of organisms from simple to complex structures. Therefore, fossils provide strong evidence of evolution."},{"g":"9","n":4,"c":"Evolution","a":"विकास क्रमविकास evolution क्रम विकास","t":"Evolution – Exercise 4(3): How is fossil formed? Explain. | क्रमविकास अभ्यास 4(3)","q":"How is fossil formed? Explain.","o":"4(3)","s":"","x":"Chapter: Evolution (क्रमविकास) – Class 9 Science. Exercise 4(3).\n\nFossils are formed mainly in sedimentary rocks. When living organisms die, their bodies are carried by rivers together with soil, sand and gravel. These materials finally reach a large lake or ocean and are deposited there. The deposition continues and layers are formed at the bottom of the lake or ocean.\n\nThese layers gradually become sedimentary rocks over millions of years. The soft parts and muscles of the organisms decompose, while bones and cellulose remain in their original places. These remaining parts form traces in the rock layers, which are called fossils."},{"g":"9","n":4,"c":"Evolution","a":"विकास क्रमविकास evolution क्रम विकास","t":"Evolution – Exercise 4(4): What are the evidences of evolution? Describe with examples. | क्रमविकास अभ्यास 4(4)","q":"What are the evidences of evolution? Describe with examples.","o":"4(4)","s":"","x":"Chapter: Evolution (क्रमविकास) – Class 9 Science. Exercise 4(4).\n\nThe main evidences of evolution described in the textbook are:\n\n**a) Evidence from fossils**\nFossils are the traces and remains of past organisms found in sedimentary rocks. They provide information about organisms that lived millions of years ago. Fossils of simple organisms are found in lower layers, while fossils of complex organisms are found in upper layers.\n\n**b) Evidence from comparative morphology and anatomy**\nThe body structures of organisms show similarities that indicate relationships among them.\n- **Homologous organs:** same embryonic origin but different functions. Human hand, fore leg of horse, wing of bat and paddle of whale are examples.\n- **Analogous organs:** same function but different embryonic origins. Wings of insects, bats and birds are examples.\n\n**c) Evidence from vestigial organs**\nVestigial organs are inactive or less functional organs. Examples in humans include tail vertebrae, ear muscles, vermiform appendix and nictitating membrane. They reflect the characteristics of ancestors.\n\n**d) Evidence from bridge animals**\nBridge animals have features connecting two different groups. Platypus, Archaeopteryx and Protopterus are examples of bridge animals. They are also called connecting links.\n\n**e) Embryonic evidence**\nThe early embryos of fish, salamander, tortoise, hen and human show similarities. This suggests that vertebrates may have originated from a common ancestor."},{"g":"9","n":4,"c":"Evolution","a":"विकास क्रमविकास evolution क्रम विकास","t":"Evolution – Exercise 4(5): Describe Darwin's theory of evolution. | क्रमविकास अभ्यास 4(5)","q":"Describe Darwin's theory of evolution.","o":"4(5)","s":"","x":"Chapter: Evolution (क्रमविकास) – Class 9 Science. Exercise 4(5).\n\nCharles Darwin proposed the theory of evolution, which is also called the theory of natural selection. Its main concepts are:\n\n**1. Enormous fertility:** Every organism has the power of reproduction. If all offspring survived, their population would increase rapidly.\n\n**2. Struggle for existence:** Excessive reproduction creates competition for limited food and shelter. Organisms struggle for food, shelter and reproduction. Successful organisms survive, while unsuccessful organisms become extinct.\n\n**3. Variation and heredity:** Individuals of the same species have differences in their characters. These differences are called variations. Variations may occur due to environmental and genetic reasons. Favorable variations can be transferred to the next generation.\n\n**4. Natural selection:** Organisms with favorable characters can survive in the environment, while organisms with unfavorable characters decline. Nature selects organisms having favorable characters.\n\n**5. Origin of new species:** If favorable characters continue to be transferred to offspring for a long time, new characters develop. When these characters become completely different from the ancestors, a new species is considered to have evolved."},{"g":"9","n":4,"c":"Evolution","a":"विकास क्रमविकास evolution क्रम विकास","t":"Evolution – Exercise 4(6): What is natural selection? Describe. | क्रमविकास अभ्यास 4(6)","q":"What is natural selection? Describe.","o":"4(6)","s":"","x":"Chapter: Evolution (क्रमविकास) – Class 9 Science. Exercise 4(6).\n\nNatural selection is the process in which organisms having characters adaptable to the environment survive, while organisms having unfavorable characters decline.\n\nAccording to Darwin, favorable characters are developed through survival and are transferred to offspring. Over a long period, new favorable characters develop in organisms. These characters help organisms survive in their environment. This process is called natural selection."},{"g":"9","n":4,"c":"Evolution","a":"विकास क्रमविकास evolution क्रम विकास","t":"Evolution – Exercise 4(7): According to Darwin, how is a new species originated? Explain. | क्रमविकास अभ्यास 4(7)","q":"According to Darwin, how is a new species originated? Explain.","o":"4(7)","s":"","x":"Chapter: Evolution (क्रमविकास) – Class 9 Science. Exercise 4(7).\n\nAccording to Darwin, organisms have variations in their characters. Favorable variations help organisms survive in the environment. These favorable characters are transferred to the next generation.\n\nIf this process continues for a long time, new characters gradually appear in the offspring. When the new characters become completely different from those of their ancestors, a new species is considered to have evolved. Two or more new species can evolve from the same ancestor."},{"g":"9","n":4,"c":"Evolution","a":"विकास क्रमविकास evolution क्रम विकास","t":"Evolution – Exercise 4(8): Write the properties of mutation. | क्रमविकास अभ्यास 4(8)","q":"Write the properties of mutation.","o":"4(8)","s":"","x":"Chapter: Evolution (क्रमविकास) – Class 9 Science. Exercise 4(8).\n\nThe properties of mutation given in the textbook are:\n\n1. Mutation is an important basis of evolution and helps in the origin of new species.\n2. New characters appear suddenly in mutation.\n3. The new characters produced by mutation are transferred to the next generation.\n4. Organisms with favorable variations are selected for survival, while organisms with unfavorable variations disappear.\n5. New species can originate from mass variation."},{"g":"9","n":4,"c":"Evolution","a":"विकास क्रमविकास evolution क्रम विकास","t":"Evolution – Exercise 4(9): How does mutation help in evolution? | क्रमविकास अभ्यास 4(9)","q":"How does mutation help in evolution?","o":"4(9)","s":"","x":"Chapter: Evolution (क्रमविकास) – Class 9 Science. Exercise 4(9).\n\nMutation produces new characters suddenly in organisms. These characters can be transferred to the next generation. If the characters are favorable to the environment, the organism can survive and reproduce. Over generations, such changes can contribute to the origin of new species. Therefore, mutation is an important basis of evolution."},{"g":"9","n":4,"c":"Evolution","a":"विकास क्रमविकास evolution क्रम विकास","t":"Evolution – Exercise 4(10): Mutation is not only the main factor but it is only one additional factor, clarify it. | क्रमविकास अभ्यास 4(10)","q":"Mutation is not only the main factor but it is only one additional factor, clarify it.","o":"4(10)","s":"","x":"Chapter: Evolution (क्रमविकास) – Class 9 Science. Exercise 4(10).\n\nMutation produces sudden changes in the characters of organisms and is an important basis of evolution. However, the textbook states that natural selection is not the only cause of speciation because mutation also causes variation in organisms.\n\nTherefore, mutation is an important factor in evolution, but it is not the only factor responsible for the origin of new species. Other processes such as variation and natural selection are also involved in evolution."},{"g":"9","n":4,"c":"Evolution","a":"विकास क्रमविकास evolution क्रम विकास","t":"Evolution – Exercise 4(11): Explain Darwin's theory of struggle for survival and survival for fittest. | क्रमविकास अभ्यास 4(11)","q":"Explain Darwin's theory of struggle for survival and survival for fittest.","o":"4(11)","s":"","x":"Chapter: Evolution (क्रमविकास) – Class 9 Science. Exercise 4(11).\n\nAccording to Darwin, organisms produce many offspring. If all of them survived, the population would increase excessively. But food and shelter are limited. Therefore, organisms have to compete and struggle for food, shelter and reproduction.\n\nThe struggle may occur among organisms of the same group or among different groups. Organisms that have favorable characters and are successful in the struggle survive, while organisms that cannot survive become extinct. Thus, organisms better adapted to the environment survive."},{"g":"9","n":4,"c":"Evolution","a":"विकास क्रमविकास evolution क्रम विकास","t":"Evolution – Exercise 4(12): Discuss how Darwinism is criticized. | क्रमविकास अभ्यास 4(12)","q":"Discuss how Darwinism is criticized.","o":"4(12)","s":"","x":"Chapter: Evolution (क्रमविकास) – Class 9 Science. Exercise 4(12).\n\nDarwinism has been criticized for the following reasons:\n\n1. It does not clearly explain how evolution of organisms occurs from variation.\n2. It cannot explain why favorable variations occur only in some organisms while unfavorable variations occur in others.\n3. Natural selection is not the only cause of speciation because mutation also causes variation.\n4. If only beneficial characters developed through natural selection, harmful characters would not develop, but harmful characters are also found."},{"g":"9","n":4,"c":"Evolution","a":"विकास क्रमविकास evolution क्रम विकास","t":"Evolution – Exercise 4(13): Prove that the organism in the modern era is developed from past primitive unicellular and multicellular organisms with the help of study of fossils. | क्रमविकास अभ्यास 4(13)","q":"Prove that the organism in the modern era is developed from past primitive unicellular and multicellular organisms with the help of study of fossils.","o":"4(13)","s":"","x":"Chapter: Evolution (क्रमविकास) – Class 9 Science. Exercise 4(13).\n\nFossils provide information about organisms that existed millions of years ago. Fossils of simple structured organisms such as algae are found in the lower layers of sedimentary rocks, while fossils of complex organisms such as mammals are found in the upper layers.\n\nThe fossil record shows a progression from simple organisms to complex organisms. The textbook also describes the development of unicellular organisms, multicellular organisms, simple invertebrates, vertebrates and more complex animals and plants.\n\nTherefore, the study of fossils provides strong evidence that modern organisms developed from past simple and primitive organisms through the process of evolution."},{"g":"9","n":4,"c":"Evolution","a":"विकास क्रमविकास evolution क्रम विकास","t":"Evolution – Exercise 4(14): Study the diagram and answer the given questions. (a) What is shown in the diagram? (b) Which classes are connected in diagram? (c) How can this diagram provide additional evidences of evolution? | क्रमविकास अभ्यास 4(14)","q":"Study the diagram and answer the given questions. (a) What is shown in the diagram? (b) Which classes are connected in diagram? (c) How can this diagram provide additional evidences of evolution?","o":"4(14)","s":"","x":"Chapter: Evolution (क्रमविकास) – Class 9 Science. Exercise 4(14).\n\nNote: The actual diagram for this question is not included in the textbook text, so the exact diagram and the classes connected in it cannot be identified.\n\n**(a) What is shown in the diagram?** The exact diagram is required to answer this accurately.\n\n**(b) Which classes are connected in the diagram?** The exact classes cannot be identified because the diagram is not present in the provided text.\n\n**(c) How can this diagram provide additional evidences of evolution?** If the diagram is the bridge-animal / connecting-link diagram discussed in the chapter, it can provide evidence of evolution by showing relationships between two different groups of organisms."},{"g":"9","n":4,"c":"Evolution","a":"विकास क्रमविकास evolution क्रम विकास","t":"Evolution – Exercise 4(15): Study the diagram and answer the following questions. A. What changes occur in the given diagram? B. Do these characters appear in all organisms? C. What are the reasons behind these characters? D. How does this character help in evolution? E. Write any three merits from this change. | क्रमविकास अभ्यास 4(15)","q":"Study the diagram and answer the following questions. A. What changes occur in the given diagram? B. Do these characters appear in all organisms? C. What are the reasons behind these characters? D. How does this character help in evolution? E. Write any three merits from this change.","o":"4(15)","s":"","x":"Chapter: Evolution (क्रमविकास) – Class 9 Science. Exercise 4(15).\n\nNote: The actual diagram for this question is not included in the textbook text, so the exact changes and characters shown in the diagram cannot be determined.\n\n**A. What changes occur in the given diagram?** The exact changes depend on the missing diagram.\n\n**B. Do these characters appear in all organisms?** The textbook explains that variations occur among organisms and that every member of a species does not have exactly the same characters. The exact answer for the diagram requires seeing it.\n\n**C. What are the reasons behind these characters?** According to the chapter, variation can occur due to genetic reasons and environmental effects. Mutation occurs due to changes in genetic structure and may be caused by chemicals and radiation.\n\n**D. How does this character help in evolution?** Favorable variations can help organisms survive and may be transferred to the next generation. Such changes can contribute to evolution.\n\n**E. Write any three merits from this change.** The exact three merits depend on the missing diagram and cannot be identified accurately without seeing it."},{"g":"9","n":4,"c":"Evolution","a":"विकास क्रमविकास evolution क्रम विकास","t":"Evolution – Exercise 4(16): Compare between Lamarckism and Darwinism. | क्रमविकास अभ्यास 4(16)","q":"Compare between Lamarckism and Darwinism.","o":"4(16)","s":"","x":"Chapter: Evolution (क्रमविकास) – Class 9 Science. Exercise 4(16).\n\n| Lamarckism | Darwinism |\n|---|---|\n| Lamarck proposed the theory. | Charles Darwin proposed the theory. |\n| It explains evolution mainly through direct environmental effect, use and disuse of organs, and inheritance of acquired characters. | It explains evolution through enormous fertility, struggle for existence, variation and heredity, natural selection and origin of new species. |\n| Environmental changes create the need for modifications in organisms. | Organisms naturally show variations among individuals. |\n| Use of an organ makes it more developed, while disuse makes it less developed. | Organisms with favorable variations survive and unfavorable ones decline. |\n| Acquired characters are considered to be inherited by offspring. | Favorable variations are transferred to the next generation. |\n| Lamarck explained the evolution of the long neck of giraffe through continuous use and elongation of the neck. | Darwin explained evolution through variation, struggle for existence and natural selection. |\n| The textbook states that Lamarck's theory does not seem true and leaves questions about whether organisms can develop organs by their own will and whether all acquired characters can be transferred. | Darwinism is also criticized because it does not fully explain the origin of variation and why favorable and unfavorable variations occur. |"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.1 Tissue – Exercise 1(i): Which one is the type of tissue with cell division capacity?","q":"Which one is the type of tissue with cell division capacity?","o":"1(i)","s":"5.1 Tissue","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.1 Tissue. Exercise 1(i).\n\n**Answer: (d) Meristematic tissue**"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.1 Tissue – Exercise 1(ii): Which tissue is located in inner surface of kidney and duct of salivary gland?","q":"Which tissue is located in inner surface of kidney and duct of salivary gland?","o":"1(ii)","s":"5.1 Tissue","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.1 Tissue. Exercise 1(ii).\n\n**Answer: (c) Cuboidal epithelium**"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.1 Tissue – Exercise 1(iii): Where does meristematic tissue lie in plants?","q":"Where does meristematic tissue lie in plants?","o":"1(iii)","s":"5.1 Tissue","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.1 Tissue. Exercise 1(iii).\n\n**Answer: (a) Tip of root and (b) Tip of stem and branch**\n\nThe textbook states that apical meristem is located at the tip of stem and root."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.1 Tissue – Exercise 1(iv): In which organ is cardiac muscle found?","q":"In which organ is cardiac muscle found?","o":"1(iv)","s":"5.1 Tissue","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.1 Tissue. Exercise 1(iv).\n\n**Answer: (c) Heart**"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.1 Tissue – Exercise 1(v): What is the use of vascular tissue by plants?","q":"What is the use of vascular tissue by plants?","o":"1(v)","s":"5.1 Tissue","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.1 Tissue. Exercise 1(v).\n\n**Answer: (c) Conduction of water and food**"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.1 Tissue – Exercise 2(a): Give reason: Blood is called liquid connective tissue.","q":"Give reason: Blood is called liquid connective tissue.","o":"2(a)","s":"5.1 Tissue","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.1 Tissue. Exercise 2(a).\n\nBlood is called liquid connective tissue because it is a liquid tissue that connects and coordinates different parts of the body. It circulates various materials from one part of the body to another. It contains plasma, red blood cells, white blood cells and platelets."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.1 Tissue – Exercise 2(b): Give reason: The height of plant does not grow while cutting.","q":"Give reason: The height of plant does not grow while cutting.","o":"2(b)","s":"5.1 Tissue","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.1 Tissue. Exercise 2(b).\n\nThe height of a plant does not increase when its tip is cut because apical meristem is present at the tip of the stem and root. Apical meristem increases the length of the stem and root. When the tip containing apical meristem is broken or cut, the height of the plant does not increase."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.1 Tissue – Exercise 2(c): Give reason: White matter is released when leaf of Lalupate (Poinsettia) is detached.","q":"Give reason: White matter is released when leaf of Lalupate (Poinsettia) is detached.","o":"2(c)","s":"5.1 Tissue","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.1 Tissue. Exercise 2(c).\n\nLalupate contains lactiferous tissue. This tissue secretes a milk-like liquid called latex. Therefore, when the leaf of Lalupate is detached, white latex is released."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.1 Tissue – Exercise 2(d): Give reason: Xylem is known as complex permanent tissue.","q":"Give reason: Xylem is known as complex permanent tissue.","o":"2(d)","s":"5.1 Tissue","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.1 Tissue. Exercise 2(d).\n\nXylem is called complex permanent tissue because it is made up of different types of cells. It has four components: vessels, tracheids, xylem fibres and xylem parenchyma. It conducts water and minerals from the root to different parts of the plant."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.1 Tissue – Exercise 3(i): Differentiate between muscular tissue and connective tissue.","q":"Differentiate between muscular tissue and connective tissue.","o":"3(i)","s":"5.1 Tissue","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.1 Tissue. Exercise 3(i).\n\n| Muscular tissue | Connective tissue |\n|---|---|\n| It produces movement by contraction and relaxation. | It connects different tissues and organs. |\n| It is made of long, thread-like muscle fibres. | Its cells are distributed in different parts of the body. |\n| Its main function is movement of the body. | Its main functions are support and interrelationship between cells and tissues. |\n| Examples are skeletal, cardiac and smooth muscles. | Examples are fibrous, adipose, bone, cartilage, blood and lymph. |"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.1 Tissue – Exercise 3(ii): Differentiate between xylem and phloem.","q":"Differentiate between xylem and phloem.","o":"3(ii)","s":"5.1 Tissue","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.1 Tissue. Exercise 3(ii).\n\n| Xylem | Phloem |\n|---|---|\n| Xylem is mainly made of dead cells. | Phloem is made of living cells. |\n| It has vessels, tracheids, xylem fibres and xylem parenchyma. | It has sieve tubes, companion cells, phloem fibres and phloem parenchyma. |\n| It conducts water and minerals. | It transports prepared food. |\n| It conducts water from roots to different parts of the plant. | It transports prepared food from leaves to different parts of the plant. |\n| It is also known as wood. | It is also known as bast. |"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.1 Tissue – Exercise 3(iii): Differentiate between meristematic tissue and permanent tissue.","q":"Differentiate between meristematic tissue and permanent tissue.","o":"3(iii)","s":"5.1 Tissue","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.1 Tissue. Exercise 3(iii).\n\n| Meristematic tissue | Permanent tissue |\n|---|---|\n| It is made of actively dividing cells. | It is formed when meristematic cells lose their cell division capacity. |\n| Cell division takes place actively. | Generally, cell division does not take place. |\n| Cells have thin walls, large nuclei and dense cytoplasm. | Cells have fixed shape and size. |\n| It is found in growth areas of plants. | It is found in different permanent parts of plants. |\n| Its main function is growth and development. | It performs functions such as protection, support, conduction, food preparation and storage. |"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.1 Tissue – Exercise 3(iv): Differentiate between sclerenchyma and collenchyma.","q":"Differentiate between sclerenchyma and collenchyma.","o":"3(iv)","s":"5.1 Tissue","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.1 Tissue. Exercise 3(iv).\n\n| Sclerenchyma | Collenchyma |\n|---|---|\n| It is made of thick-walled dead cells. | It is made of thick-walled living cells. |\n| Protoplasm is absent. | Living protoplasm is present. |\n| Cells are elongated, narrow and spindle-shaped. | Cellulose and pectin are deposited at the corners of the cell wall. |\n| It is found in roots, stems, leaf veins, fruits and hard seed coats. | It is found in the epidermis of stem and petiole of leaf. |\n| It provides mechanical strength and helps the plant remain strong and straight. | It provides mechanical strength and flexibility. |"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.1 Tissue – Exercise 4(a): What is life process? Describe with examples.","q":"What is life process? Describe with examples.","o":"4(a)","s":"5.1 Tissue","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.1 Tissue. Exercise 4(a).\n\nThe various activities necessary for the continuity of the life cycle of an organism are called life processes.\n\nExamples of life processes are:\n\n- Nutrition\n- Respiration\n- Photosynthesis\n- Circulation\n- Excretion\n- Reproduction\n\nIn advanced animals, different systems are developed to perform these life processes."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.1 Tissue – Exercise 4(b): Plot the concept map of classification of plant tissue and animal tissue with examples.","q":"Plot the concept map of classification of plant tissue and animal tissue with examples.","o":"4(b)","s":"5.1 Tissue","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.1 Tissue. Exercise 4(b).\n\n**Classification of tissues**\n\n```text\nTissue\n├── Plant tissue\n│   ├── Meristematic tissue\n│   │   ├── Apical meristem\n│   │   ├── Lateral meristem\n│   │   └── Intercalary meristem\n│   └── Permanent tissue\n│       ├── Simple permanent tissue: Parenchyma, Collenchyma, Sclerenchyma\n│       ├── Complex permanent tissue: Xylem, Phloem\n│       └── Special tissue: Glandular tissue, Lactiferous tissue\n└── Animal tissue\n    ├── Epithelial tissue\n    ├── Muscular tissue: Skeletal, Cardiac, Smooth\n    ├── Connective tissue: Soft connective tissue, Hard connective tissue, Fluid connective tissue\n    └── Nervous tissue\n```"},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.1 Tissue – Exercise 4(c): Explain the meristematic tissue with a diagram.","q":"Explain the meristematic tissue with a diagram.","o":"4(c)","s":"5.1 Tissue","x":"Chapter: Body Structure and Life Process – Class 9 Science. Section 5.1 Tissue. Exercise 4(c).\n\nMeristematic tissues are tissues made up of actively dividing cells. They have thin cell walls, large nuclei and dense cytoplasm with no intercellular spaces. They are found in the growth areas of plants. Their main function is the growth and development of plants.\n\nOn the basis of location, meristematic tissue is of three types:\n\n**1. Apical meristem**\nIt is found at the tip of the stem and root. It increases the length of the stem and root.\n\n**2. Lateral meristem**\nIt is found at the lateral side of the root and stem. It increases the girth or diameter of the plant.\n\n**3. Intercalary meristem**\nIt is found at either side of the nodes. It increases the length of the internode.\n\n**Diagram:** Draw the textbook diagram of meristematic tissue showing **apical meristem, lateral meristem and intercalary meristem**."},{"g":"9","n":5,"c":"Body Structure and Life Process","a":"body structure life process","t":"Body Structure and Life Process – 5.1 Tissue – Exercise 4(d): What is permanent tissue? Describe in brief about its ty
