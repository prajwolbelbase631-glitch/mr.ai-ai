Vehicles such as a motorcycle, car, bus and train have different masses. A heavier object has greater inertia. Therefore, different amounts of time and force are required to bring them into the rest position."},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 3(ii): Give reason: On shaking the branches of a tree, the leaves and fruits fall. | बल र गति अभ्यास 3(ii)","q":"Give reason: On shaking the branches of a tree, the leaves and fruits fall.","o":"3(ii)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 3(ii).\n\nThe branches move suddenly when they are shaken, but the leaves and fruits tend to remain in their previous state of rest due to inertia of rest. Therefore, they become detached from the branches and fall down."},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 3(iii): Give reason: The bag placed on the aisle of a bus moves forward during the bus ride. | बल र गति अभ्यास 3(iii)","q":"Give reason: The bag placed on the aisle of a bus moves forward during the bus ride.","o":"3(iii)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 3(iii).\n\nWhen the moving bus suddenly stops, the bag tends to continue moving in the same direction due to inertia of motion. Therefore, it moves forward."},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 3(iv): Give reason: Strong support should be provided while firing a bullet from a gun. | बल र गति अभ्यास 3(iv)","q":"Give reason: Strong support should be provided while firing a bullet from a gun.","o":"3(iv)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 3(iv).\n\nWhen a bullet is fired, the gun exerts a force on the bullet in the forward direction. According to Newton's third law, the bullet exerts an equal and opposite force on the gun. Therefore, the gun recoils backward. Strong support is required to resist this backward motion."},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 3(v): Give reason: When two rubber balls of the same size are dropped on the floor, one is seen to bounce more than the other. | बल र गति अभ्यास 3(v)","q":"Give reason: When two rubber balls of the same size are dropped on the floor, one is seen to bounce more than the other.","o":"3(v)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 3(v).\n\nThe elasticity of objects depends on their composition. The two rubber balls may have different elasticities. The ball having greater elasticity regains its original shape more effectively and therefore bounces more."},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 3(vi): Give reason: A rubber band should not be stretched beyond a certain limit. | बल र गति अभ्यास 3(vi)","q":"Give reason: A rubber band should not be stretched beyond a certain limit.","o":"3(vi)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 3(vi).\n\nWhen the deforming force exceeds a certain limit, the rubber band cannot regain its original shape and becomes permanently deformed. Therefore, it should not be stretched beyond a certain limit."},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 4(i): Define average velocity and acceleration. | बल र गति अभ्यास 4(i)","q":"Define average velocity and acceleration.","o":"4(i)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 4(i).\n\n**Average velocity:** The total displacement of an object in a particular direction divided by the total time taken is called average velocity.\n\nAverage velocity = Displacement / Time\n\n**Acceleration:** The change in velocity per unit time is called acceleration.\n\na = (v − u) / t\n\nWhere u = initial velocity, v = final velocity, t = time, a = acceleration."},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 4(ii): Prove the equations related to linear motion: a) v = u + at, b) v² = u² + 2as, c) s = ut + ½at². | बल र गति अभ्यास 4(ii)","q":"Prove the equations related to linear motion: a) v = u + at, b) v² = u² + 2as, c) s = ut + ½at².","o":"4(ii)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 4(ii).\n\n**a) v = u + at**\n\nWe know a = (v − u) / t\n\nTherefore at = v − u\n\nSo **v = u + at**. Hence, the first equation of motion is proved.\n\n**b) v² = u² + 2as**\n\nFor uniformly accelerated motion, s = ((u + v) / 2) × t\n\nFrom v = u + at, we get t = (v − u) / a\n\nSubstituting this value of t:\ns = ((u + v) / 2) × ((v − u) / a)\ns = (u + v)(v − u) / 2a\n2as = v² − u²\n\nTherefore **v² = u² + 2as**. Hence proved.\n\n**c) s = ut + ½at²**\n\nWe know s = ((u + v) / 2) × t and v = u + at\n\nSubstituting:\ns = ((u + (u + at)) / 2) × t\ns = ((2u + at) / 2) × t\n\nTherefore **s = ut + ½at²**. Hence proved."},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 4(iii): Draw the displacement-time graph and velocity-time graph for uniform velocity. | बल र गति अभ्यास 4(iii)","q":"Draw the displacement-time graph and velocity-time graph for uniform velocity.","o":"4(iii)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 4(iii).\n\n**Displacement-time graph:** For uniform velocity, displacement increases equally in equal intervals of time. Therefore, the graph is a straight sloping line.\n\n```text\nDisplacement\n     |\n     |        /\n     |      /\n     |    /\n     |  /\n     |/\n     +---------------- Time\n```\n\n**Velocity-time graph:** For uniform velocity, velocity remains constant with time. Therefore, the graph is a line parallel to the time axis.\n\n```text\nVelocity\n     |\n     |----------------\n     |\n     |\n     |\n     +---------------- Time\n```"},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 4(iv): Plot the displacement-time graph from the given table, describe the nature of motion and find the average velocity in the first 4 seconds. (Time: 0, 2, 4, 6, 8, 10, 12, 14 s; Displacement: 0, 4, 8, 8, 12, 8, 4, 0 m) | बल र गति अभ्यास 4(iv)","q":"Plot the displacement-time graph from the given table, describe the nature of motion and find the average velocity in the first 4 seconds. (Time: 0, 2, 4, 6, 8, 10, 12, 14 s; Displacement: 0, 4, 8, 8, 12, 8, 4, 0 m)","o":"4(iv)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 4(iv).\n\n| Time (s) | 0 | 2 | 4 | 6 | 8 | 10 | 12 | 14 |\n|---|---|---|---|---|---|---|---|---|\n| Displacement (m) | 0 | 4 | 8 | 8 | 12 | 8 | 4 | 0 |\n\nPoints to plot: (0,0), (2,4), (4,8), (6,8), (8,12), (10,8), (12,4), (14,0). The graph consists of different straight-line segments.\n\n**Nature of motion**\n- 0–4 s: displacement increases uniformly, so the object moves with **uniform positive velocity**.\n- 4–6 s: displacement remains constant, so the object is **at rest**.\n- 6–8 s: displacement increases uniformly, so the object moves with **uniform positive velocity**.\n- 8–14 s: displacement decreases uniformly, so the object moves in the **opposite direction with uniform velocity**.\n\n**Average velocity during the first 4 seconds**\ns₁ = 0 m, s₂ = 8 m, t = 4 s\nAverage velocity = (s₂ − s₁) / t = (8 − 0) / 4 = **2 m/s**\n\nThe slope of the first 4-second segment is therefore **2 m/s**."},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 4(v): Hare and tortoise graph: rewrite the story according to the graph. | बल र गति अभ्यास 4(v)","q":"Hare and tortoise graph: rewrite the story according to the graph.","o":"4(v)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 4(v).\n\nNote: The graph of the hare and tortoise is not visible in the textbook text, so the exact positions and times cannot be read reliably. The complete story cannot be rewritten accurately without the figure.\n\nThe story should be rewritten according to the graph by identifying:\n- when the hare and tortoise start,\n- when the hare moves faster,\n- when the hare stops,\n- when the tortoise continues moving,\n- when the tortoise overtakes the hare,\n- and their final positions.\n\n(For a displacement-time graph: a steep sloping line = fast motion, a horizontal line = at rest, a gentle slope = slow motion.)"},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 4(vi): Define inertia. Give two examples each of inertia of rest and inertia of motion. | बल र गति अभ्यास 4(vi)","q":"Define inertia. Give two examples each of inertia of rest and inertia of motion.","o":"4(vi)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 4(vi).\n\n**Inertia:** The inability of a body to change by itself its state of rest or uniform motion in a straight line is called inertia.\n\n**Examples of inertia of rest**\n1. Dust in a carpet can be removed by hanging it and beating it with a stick.\n2. When the branches of a mango tree are shaken, the mangoes fall.\n\n**Examples of inertia of motion**\n1. A passenger tends to move forward when a moving bus suddenly stops.\n2. A bag placed in a moving bus tends to continue moving forward when the bus suddenly stops."},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 4(vii): Mention the relation between mass and inertia. | बल र गति अभ्यास 4(vii)","q":"Mention the relation between mass and inertia.","o":"4(vii)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 4(vii).\n\nThe inertia of an object depends upon its mass.\n\n**Inertia increases as mass increases and decreases as mass decreases.**\n\nTherefore, Inertia ∝ Mass."},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 4(viii): State Newton's first law of motion. | बल र गति अभ्यास 4(viii)","q":"State Newton's first law of motion.","o":"4(viii)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 4(viii).\n\nAccording to Newton's first law of motion, an object at rest remains at rest, and an object that is moving continues to move straight with constant velocity unless a resultant force acts on it.\n\nIt is also known as the **law of inertia**."},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 4(ix): Give two examples that show the resultant force changing the state of motion of objects. | बल र गति अभ्यास 4(ix)","q":"Give two examples that show the resultant force changing the state of motion of objects.","o":"4(ix)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 4(ix).\n\n1. When a football is kicked, the force applied by the foot changes the football from rest to motion.\n2. When brakes are applied to a moving vehicle, the force of the brakes and friction changes its motion and brings it to rest."},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 4(x): Explain why bus accidents are more probable on winding roads in mountainous areas. | बल र गति अभ्यास 4(x)","q":"Explain why bus accidents are more probable on winding roads in mountainous areas.","o":"4(x)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 4(x).\n\nA moving bus has inertia of motion and tends to continue moving in the same direction with the same velocity. On a winding road, the direction of the bus changes frequently. A resultant force is required to change its direction.\n\nIf the bus is moving with high velocity, it becomes more difficult to change its state of motion suddenly. Therefore, if the driver cannot provide the required force and control the direction properly, the bus may continue in its previous direction and an accident may occur."},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 4(xi): State Newton's second law of motion and prove F = ma. | बल र गति अभ्यास 4(xi)","q":"State Newton's second law of motion and prove F = ma.","o":"4(xi)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 4(xi).\n\n**Newton's second law:** The acceleration produced on an object by applying a force is directly proportional to the force applied and inversely proportional to the mass of the object.\n\nTherefore, a ∝ F when mass remains constant.\nAlso, a ∝ 1/m when force remains constant.\n\nCombining, a ∝ F/m\n\nTherefore F ∝ ma\n\nSo F = kma\n\nAccording to the definition of one newton, k = 1.\n\nTherefore **F = ma**. Hence proved."},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 4(xii): State Newton's third law of motion. | बल र गति अभ्यास 4(xii)","q":"State Newton's third law of motion.","o":"4(xii)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 4(xii).\n\n**Every action has an equal but opposite reaction.**\n\nWhen an object A exerts a force on object B, object B exerts an equal force on A in the opposite direction.\n\nAction and reaction act on **different objects**."},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 4(xiii): Give two examples of daily life activities based on each of the three laws of motion. | बल र गति अभ्यास 4(xiii)","q":"Give two examples of daily life activities based on each of the three laws of motion.","o":"4(xiii)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 4(xiii).\n\n**Newton's first law**\n1. A passenger falls backward when a stationary bus suddenly starts.\n2. A passenger moves forward when a moving bus suddenly stops.\n\n**Newton's second law**\n1. It is easier to push an empty wheelbarrow than a loaded wheelbarrow.\n2. A vehicle gets greater acceleration when greater force is applied by its engine.\n\n**Newton's third law**\n1. A boat moves forward when the boatman pushes water backward.\n2. A swimmer moves forward by pushing water backward."},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 4(xiv): Find any two uses each of the first, second and third laws of motion. | बल र गति अभ्यास 4(xiv)","q":"Find any two uses each of the first, second and third laws of motion.","o":"4(xiv)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 4(xiv).\n\n| Newton's law | Use | Explanation |\n|---|---|---|\n| First law | Seat belts in vehicles | Seat belts help prevent passengers from continuing forward due to inertia of motion when a vehicle suddenly stops. |\n| First law | Shaking a carpet | Dust tends to remain at rest while the carpet is moved, so the dust separates from the carpet. |\n| Second law | Vehicle acceleration | Increasing the force of an engine produces greater acceleration when mass remains constant. |\n| Second law | Pushing a wheelbarrow | A lighter wheelbarrow requires less force to produce acceleration than a loaded one. |\n| Third law | Swimming | The swimmer pushes water backward and water pushes the swimmer forward. |\n| Third law | Rowing a boat | The boatman pushes water backward and water applies an opposite force that moves the boat forward. |"},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 4(xv): Separate actions and reactions in daily activities. | बल र गति अभ्यास 4(xv)","q":"Separate actions and reactions in daily activities.","o":"4(xv)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 4(xv).\n\n| Activity | Action | Reaction |\n|---|---|---|\n| Rowing a boat | Boatman pushes water backward. | Water pushes the boat forward. |\n| Swimming | Swimmer pushes water backward. | Water pushes the swimmer forward. |\n| Bouncing a ball | Ball pushes the ground. | Ground pushes the ball upward. |\n| Launching a rocket | Rocket pushes gases downward. | Gases push the rocket upward. |\n| Flying of a bird | Wings push air downward. | Air pushes the bird upward. |\n| Firing a bullet | Gun pushes the bullet forward. | Bullet pushes the gun backward. |"},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 4(xvi): Define elasticity and plasticity with examples. | बल र गति अभ्यास 4(xvi)","q":"Define elasticity and plasticity with examples.","o":"4(xvi)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 4(xvi).\n\n**Elasticity:** Elasticity is the property of matter by which it regains its original shape and size when the deforming force is removed.\nExample: rubber band and steel spring.\n\n**Plasticity:** Plasticity is the property of matter by which it retains its extended or deformed shape even after the deforming force is removed.\nExample: mud can be shaped into a brick or other forms and retains its shape."},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 5(a): Numerical: A plane starting from rest accelerates at 1.5 m/s² south for 30 s. Find its final velocity and displacement. | बल र गति अभ्यास 5(a)","q":"Numerical: A plane starting from rest accelerates at 1.5 m/s² south for 30 s. Find its final velocity and displacement.","o":"5(a)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 5(a).\n\nGiven: u = 0, a = 1.5 m/s², t = 30 s\n\n**Final velocity**\nv = u + at = 0 + (1.5)(30)\n**v = 45 m/s** (south)\n\n**Displacement**\ns = ut + ½at² = 0 + ½(1.5)(30)² = 0.75 × 900\n**s = 675 m** (south)\n\nTherefore, the displacement is **675 m south** and the final velocity is **45 m/s south**."},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 5(b): Numerical: A stone is dropped from a bridge and takes 2 s to reach the water. Find the height of the bridge. | बल र गति अभ्यास 5(b)","q":"Numerical: A stone is dropped from a bridge and takes 2 s to reach the water. Find the height of the bridge.","o":"5(b)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 5(b).\n\nGiven: u = 0, g = 9.8 m/s², t = 2 s\n\ns = ut + ½gt² = 0 + ½(9.8)(2)² = 4.9 × 4\n**s = 19.6 m**\n\nTherefore, the height of the bridge is **19.6 m**."},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 5(c): Numerical: Suraj (50 kg) rides a bicycle (12 kg) with acceleration 2 m/s². Find the resultant force. | बल र गति अभ्यास 5(c)","q":"Numerical: Suraj (50 kg) rides a bicycle (12 kg) with acceleration 2 m/s². Find the resultant force.","o":"5(c)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 5(c).\n\nMass of Suraj = 50 kg, mass of bicycle = 12 kg\nTotal mass m = 50 + 12 = 62 kg\nAcceleration a = 2 m/s²\n\nUsing Newton's second law, F = ma\nF = 62 × 2\n**F = 124 N**\n\nTherefore, the resultant force is **124 N**."},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 5(d): Numerical: A car of mass 1500 kg slows from 72 km/h to 10 km/h over 50 m. Find the resultant force on the car. | बल र गति अभ्यास 5(d)","q":"Numerical: A car of mass 1500 kg slows from 72 km/h to 10 km/h over 50 m. Find the resultant force on the car.","o":"5(d)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 5(d).\n\nGiven: m = 1500 kg, s = 50 m\nInitial velocity u = 72 km/h = 72 / 3.6 = 20 m/s\nFinal velocity v = 10 km/h = 10 / 3.6 = 2.78 m/s\n\nUsing v² = u² + 2as:\n(2.78)² = (20)² + 2a(50)\n7.73 = 400 + 100a\n100a = 7.73 − 400\na = −3.92 m/s² (≈ −3.9 m/s²; negative sign = retardation)\n\nUsing F = ma:\nF = 1500 × 3.9\n**F ≈ 5850 N**, acting opposite to the direction of motion.\n\n(Without rounding a, F = 1500 × 3.92 ≈ 5884 N. The textbook answer of 5850 N uses a ≈ 3.9 m/s², so the answer is consistent.)"},{"g":"9","n":7,"c":"Force and Motion","a":"force and motion बल र गति बल तथा गति newton's laws laws of motion","t":"Force and Motion – Exercise 5(e): Velocity-time graph of the bus: identify segments of uniform velocity, uniform acceleration, variable acceleration and retardation; the segment where velocity changes rapidly; acceleration between C and D; displacement from C to D. | बल र गति अभ्यास 5(e)","q":"Velocity-time graph of the bus: identify segments of uniform velocity, uniform acceleration, variable acceleration and retardation; the segment where velocity changes rapidly; acceleration between C and D; displacement from C to D.","o":"5(e)","s":"","x":"Chapter: Force and Motion (बल र गति) – Class 9 Science. Exercise 5(e).\n\nNote: The graph itself is not visible in the textbook text, so the exact coordinates of points C and D cannot be read reliably.\n\n**i. Segments of uniform velocity, uniform acceleration, variable acceleration and retardation**\nThese must be identified directly from the slopes and shapes of the velocity-time graph.\n\n**ii. Segment where velocity changes rapidly**\nAmong segments having uniform acceleration, the segment with the **greater slope** has the more rapid change in velocity.\n\n**iii. Acceleration between C and D**\na = (v_D − v_C) / (t_D − t_C)\n\n**iv. Displacement from C to D**\nDisplacement is the **area under the velocity-time graph** between C and D. The printed answer is **70 m due East**.\n\n**Important graph rules (velocity-time graph)**\n- Horizontal line → uniform velocity\n- Straight upward line → uniform acceleration\n- Straight downward line → uniform retardation\n- Curved line → variable acceleration\n- Slope → acceleration\n- Area under the graph → displacement"},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 1(a): Why is a single fixed pulley used even when it does not have a mechanical advantage? | सरल यन्त्र अभ्यास 1(a)","q":"Why is a single fixed pulley used even when it does not have a mechanical advantage?","o":"1(a)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 1(a).\n\n**Answer: iv) To change the direction of force**\n\nA single fixed pulley changes the direction of the applied force. Its velocity ratio and ideal mechanical advantage are 1."},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 1(b): Which of the following is the velocity ratio of a three pulley system? | सरल यन्त्र अभ्यास 1(b)","q":"Which of the following is the velocity ratio of a three pulley system?","o":"1(b)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 1(b).\n\nVR = number of segments of rope used to support the load. For three pulleys, VR = 3.\n\n**Answer: iii) Three**"},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 1(c): A 6-metre-long wooden plank is used to lift a load up to a 2-metre height. What is the velocity ratio? | सरल यन्त्र अभ्यास 1(c)","q":"A 6-metre-long wooden plank is used to lift a load up to a 2-metre height. What is the velocity ratio?","o":"1(c)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 1(c).\n\nFor an inclined plane, VR = Length / Height = 6 / 2 = 3\n\n**Answer: iii) Three**"},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 1(d): What is the efficiency of a perfect machine? | सरल यन्त्र अभ्यास 1(d)","q":"What is the efficiency of a perfect machine?","o":"1(d)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 1(d).\n\nA perfect machine has 100% efficiency.\n\n**Answer: i) 100%**"},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 1(e): From which simple machines is a wheelbarrow with a single wheel formed? | सरल यन्त्र अभ्यास 1(e)","q":"From which simple machines is a wheelbarrow with a single wheel formed?","o":"1(e)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 1(e).\n\nA wheelbarrow consists of a wheel and axle and lever.\n\n**Answer: i) Wheel and axle, and lever**"},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 2(a): Give differences: Pulley and wheel and axle. | सरल यन्त्र अभ्यास 2(a)","q":"Give differences: Pulley and wheel and axle.","o":"2(a)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 2(a).\n\n| Pulley | Wheel and axle |\n|---|---|\n| A pulley consists of a wheel with a groove around it and rotates about its axis. | A wheel and axle consists of two cylinders fitted on a common axis. |\n| It is mainly used to lift loads and/or change the direction of force. | It is used to magnify force or increase the speed of doing work. |\n| A rope passes through the groove of the pulley. | The rope is wound around the wheel and axle. |\n| Examples: flagpole, drawing water from a well. | Examples: doorknob, bicycle pedal, kite reel. |"},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 2(b): Give differences: VR and MA. | सरल यन्त्र अभ्यास 2(b)","q":"Give differences: VR and MA.","o":"2(b)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 2(b).\n\n| Velocity Ratio (VR) | Mechanical Advantage (MA) |\n|---|---|\n| It is the ratio of velocity or distance moved by effort to velocity or distance moved by load. | It is the ratio of load to effort. |\n| VR = ED / LD | MA = Load / Effort |\n| It has no unit. | It has no unit. |\n| It depends on the distances moved by effort and load. | It depends on the load and effort. |"},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 2(c): Give differences: Jackscrew and axe. | सरल यन्त्र अभ्यास 2(c)","q":"Give differences: Jackscrew and axe.","o":"2(c)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 2(c).\n\n| Jackscrew | Axe |\n|---|---|\n| A jackscrew is a specific form of an inclined plane. | An axe is a wedge, which is a specific form of an inclined plane. |\n| It has a sharp thread-like structure formed by joining two inclined planes spirally. | It has two inclined planes meeting at a sharp edge. |\n| It is used to lift loads and tighten objects. | It is used to split wood and cut objects. |"},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 2(d): Give differences: Input work and output work. | सरल यन्त्र अभ्यास 2(d)","q":"Give differences: Input work and output work.","o":"2(d)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 2(d).\n\n| Input work | Output work |\n|---|---|\n| It is the work done by the effort on the machine. | It is the work done by the load on the machine. |\n| Input work = Effort × Effort distance | Output work = Load × Load distance |\n| It is the work supplied to the machine. | It is the useful work obtained from the machine. |\n| It is greater than output work in a real machine. | It is less than input work in a real machine. |"},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 3(a): Give reason: Winding roads are made in the hilly region. | सरल यन्त्र अभ्यास 3(a)","q":"Give reason: Winding roads are made in the hilly region.","o":"3(a)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 3(a).\n\nWinding roads increase the length of the road while keeping the height approximately the same. Therefore, the slope of the road decreases and less effort is needed to move heavy loads upward. Hence, winding roads are made in hilly regions."},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 3(b): Give reason: Crane is a complex machine. | सरल यन्त्र अभ्यास 3(b)","q":"Give reason: Crane is a complex machine.","o":"3(b)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 3(b).\n\nA crane performs complicated work such as lifting and transporting heavy loads. It is made by combining different simple machines such as levers and pulleys. Therefore, a crane is a complex machine."},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 3(c): Give reason: No machine has 100% efficiency. | सरल यन्त्र अभ्यास 3(c)","q":"Give reason: No machine has 100% efficiency.","o":"3(c)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 3(c).\n\nIn a real machine, some input work is wasted due to friction. It is converted into heat, sound and other less useful forms. Therefore, output work is always less than input work and no real machine has 100% efficiency."},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 3(d): Give reason: Mechanical advantage is always less than the velocity ratio in a real machine. | सरल यन्त्र अभ्यास 3(d)","q":"Give reason: Mechanical advantage is always less than the velocity ratio in a real machine.","o":"3(d)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 3(d).\n\nThe efficiency of a real machine is less than 100% due to friction.\n\nη = (MA / VR) × 100%\n\nSince efficiency is less than 100%, MA < VR.\n\nTherefore, mechanical advantage is always less than velocity ratio in a real machine."},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 3(e): Give reason: The wheel and axle is a continuous lever. | सरल यन्त्र अभ्यास 3(e)","q":"Give reason: The wheel and axle is a continuous lever.","o":"3(e)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 3(e).\n\nIn a wheel and axle, the centre of the common axis acts as the fulcrum. The effort and load act at different distances from the axis. The wheel and axle continuously rotate through 360°. Therefore, it is called a **continuous lever**."},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 4(a): What is a simple machine? Mention its advantages. | सरल यन्त्र अभ्यास 4(a)","q":"What is a simple machine? Mention its advantages.","o":"4(a)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 4(a).\n\nA **simple machine** is a simple tool that helps us to do work faster, with greater comfort and with less effort.\n\nThe four main types of simple machines are:\n1. Lever\n2. Pulley\n3. Wheel and axle\n4. Inclined plane\n\nWedge and screw are specific forms of an inclined plane.\n\n**Advantages of simple machines**\n- They help us to do work with less effort.\n- They make work easier and more comfortable.\n- They help us to do work faster.\n- They can magnify force.\n- Some simple machines can change the direction of force.\n- Some can increase the speed of doing work."},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 4(b): What is a complex machine? Describe with an example. | सरल यन्त्र अभ्यास 4(b)","q":"What is a complex machine? Describe with an example.","o":"4(b)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 4(b).\n\nA **complex machine** is a machine formed by combining different types of simple machines to perform complicated work.\n\nComplex machines help us to do complicated work with less effort, in less time and with greater ease.\n\n**Example: Crane.** A crane is a complex machine because it is made by combining simple machines such as lever and pulley. It is used to lift and transport heavy materials."},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 4(c): Define an inclined plane with its examples. | सरल यन्त्र अभ्यास 4(c)","q":"Define an inclined plane with its examples.","o":"4(c)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 4(c).\n\nAn **inclined plane** is a slanted surface used to lift a heavy load to a certain height with less effort.\n\nExamples:\n- Sloping plank used to load and unload materials from trucks.\n- Winding roads on mountains.\n- Staircases.\n\nFor an inclined plane: **VR = Length / Height**"},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 4(d): What is a wedge? Write its importance with examples. | सरल यन्त्र अभ्यास 4(d)","q":"What is a wedge? Write its importance with examples.","o":"4(d)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 4(d).\n\nA **wedge** is a simple machine having a flat and broad surface at one end and a sharp edge formed by two inclined planes meeting at the other end. It is a specific form of an inclined plane.\n\n**Importance:** A wedge makes cutting, chopping and splitting easier by overcoming resistance.\n\n**Examples:** knife, axe, chulesi and other cutting tools."},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 4(e): What is a screw? Give examples of its use in daily life. | सरल यन्त्र अभ्यास 4(e)","q":"What is a screw? Give examples of its use in daily life.","o":"4(e)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 4(e).\n\nA **screw** is a specific form of an inclined plane formed by wrapping an inclined plane spirally around a cylindrical object. The distance between two successive threads is called **pitch**.\n\n**Uses of screw**\n- Joining blocks of wood.\n- Lifting loads using a jackscrew.\n- Tightening sheets of metal using nuts and bolts.\n- Screw nails used in daily life.\n\nFor a screw: **VR = 2πR / P**, where R is the radius of the screw head and P is the pitch."},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 4(f): Define the types of pulley with labelled diagrams. | सरल यन्त्र अभ्यास 4(f)","q":"Define the types of pulley with labelled diagrams.","o":"4(f)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 4(f).\n\nThere are three types of pulley systems:\n\n**1. Fixed pulley:** A fixed pulley is fixed at a rigid place. It does not move from its position but rotates freely. It is mainly used to **change the direction of force**. For a single fixed pulley, **VR = 1**.\n\n```text\n        Support\n          |\n       ┌──O──┐\n       │pulley│\n       └──┬──┘\n          |\n     Load |      Effort\n       [L]↓       ↓ E\n```\n\n**2. Movable pulley:** A movable pulley moves along with the load. It cannot change the direction of the applied force. For a single movable pulley, **VR = 2**. The load is supported by two segments of the rope.\n\n```text\n       Support\n          |\n          |\n          O  ← fixed end of rope\n         / \\\n        /   \\\n       |  O  | ← movable pulley\n       | [L] |\n           \\\n            ↓ Effort\n```\n\n**3. Combined pulley:** A combined pulley system consists of both fixed and movable pulleys (at least one fixed and one movable pulley). Increasing the number of pulleys in a combined pulley system reduces the effort required and increases mechanical advantage.\n\n```text\n       Support\n          |\n        O       ← Fixed pulley\n       / \\\n      /   \\\n     O     \\\n    / \\     ↓ Effort\n   [L]\n```"},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 4(g): Describe the methods to calculate MA and VR in screw and wedge. | सरल यन्त्र अभ्यास 4(g)","q":"Describe the methods to calculate MA and VR in screw and wedge.","o":"4(g)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 4(g).\n\n**Screw**\n\nMA = Load / Effort\n\nThe effort distance in one complete rotation is the circumference of the screw head: ED = 2πR\nThe load distance is the pitch: LD = P\n\nTherefore, **VR = 2πR / P**\n\nWhen the pitch is decreased, the velocity ratio increases and the screw becomes easier to operate.\n\n**Wedge**\n\nMA = Load / Effort\n\nWhen the wedge completely penetrates the object:\n- Effort distance = length/depth of wedge (H)\n- Load distance = thickness of broad edge (L)\n\nTherefore, **VR = H / L**\n\nThus, **MA = Load / Effort** and **VR = Effort distance / Load distance**."},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 4(h): How do we increase MA and VR in an inclined plane? Give examples. | सरल यन्त्र अभ्यास 4(h)","q":"How do we increase MA and VR in an inclined plane? Give examples.","o":"4(h)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 4(h).\n\nFor an inclined plane, VR = Length / Height\n\n**To increase VR:** For the same height, increase the length of the inclined plane. For example, a longer ramp has greater velocity ratio than a shorter ramp of the same height.\n\n**To increase MA:** A longer inclined plane with the same height requires less effort to lift the same load. Therefore, the mechanical advantage can be increased by making the slope gentler.\n\n**Examples:**\n- Long ramps used for loading heavy materials into trucks.\n- Winding roads in mountainous regions.\n- Longer ramps used for moving heavy objects to a higher level."},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 4(i): The efficiency of a machine is 75%. What does it mean? | सरल यन्त्र अभ्यास 4(i)","q":"The efficiency of a machine is 75%. What does it mean?","o":"4(i)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 4(i).\n\nEfficiency is given by: η = (Output work / Input work) × 100%\n\nIf the efficiency is 75%, it means that **75% of the input energy/work is utilized as useful output work**, while the remaining **25% is wasted**, mainly due to friction and converted into heat, sound and other less useful forms."},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 4(j): A perfect machine is almost impossible in our life. Describe with reason. | सरल यन्त्र अभ्यास 4(j)","q":"A perfect machine is almost impossible in our life. Describe with reason.","o":"4(j)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 4(j).\n\nA perfect machine has 100% efficiency. In a perfect machine, Input work = Output work and MA = VR.\n\nHowever, in a practical machine, friction is always present. Some input work is wasted in overcoming friction and is converted into heat, sound and other forms of energy. Therefore, output work is always less than input work.\n\nHence, a machine with exactly 100% efficiency is practically impossible."},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 4(k): Explain, with a figure, the method to calculate velocity ratio in wheel and axle. | सरल यन्त्र अभ्यास 4(k)","q":"Explain, with a figure, the method to calculate velocity ratio in wheel and axle.","o":"4(k)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 4(k).\n\nA wheel and axle consists of a larger cylinder called the **wheel** and a smaller cylinder called the **axle**, fitted on a common axis.\n\n```text\n             Effort\n               ↓\n          ______________\n        /                \\\n       |      WHEEL       |  Radius = R\n        \\________________/\n              |\n              |  AXLE\n              |  Radius = r\n              O\n              |\n             Load\n```\n\nWhen the wheel and axle make one complete rotation:\n- Effort distance = circumference of wheel = 2πR\n- Load distance = circumference of axle = 2πr\n\nVR = Effort distance / Load distance = 2πR / 2πr\n\nHence, **VR = R / r**\n\nTherefore, the ratio of the radius of the wheel to the radius of the axle gives the velocity ratio."},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 4(l): Identify the simple machines from which each complex machine is made: i) Sewing machine, ii) Stapler machine, iii) Bicycle, iv) Domestic flour mill. | सरल यन्त्र अभ्यास 4(l)","q":"Identify the simple machines from which each complex machine is made: i) Sewing machine, ii) Stapler machine, iii) Bicycle, iv) Domestic flour mill.","o":"4(l)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 4(l).\n\n**i) Sewing machine:** made from combinations of simple machines including wheel and axle and lever.\n\n**ii) Stapler machine:** works using a lever.\n\n**iii) Bicycle:** contains wheel and axle, levers and other simple-machine components.\n\n**iv) Domestic flour mill:** mainly uses the principle of wheel and axle."},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 5(a): Numerical: An inclined plane of length 20 m and height 5 m is used to lift a 90 kg load with an effort of 300 N. Find MA, VR and efficiency. | सरल यन्त्र अभ्यास 5(a)","q":"Numerical: An inclined plane of length 20 m and height 5 m is used to lift a 90 kg load with an effort of 300 N. Find MA, VR and efficiency.","o":"5(a)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 5(a).\n\nLoad L = 90 × 10 = 900 N, Effort E = 300 N, length l = 20 m, height h = 5 m\n\n**Mechanical Advantage:** MA = Load / Effort = 900 / 300 = **3**\n\n**Velocity Ratio:** VR = Length / Height = 20 / 5 = **4**\n\n**Efficiency:** η = (MA / VR) × 100% = (3 / 4) × 100% = **75%**\n\nTherefore: **MA = 3, VR = 4, η = 75%**"},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 5(b): Numerical: A four-pulley system with 80% efficiency lifts a load of 1000 N. Find the effort, MA, input work and output work (load lifted 6 m). | सरल यन्त्र अभ्यास 5(b)","q":"Numerical: A four-pulley system with 80% efficiency lifts a load of 1000 N. Find the effort, MA, input work and output work (load lifted 6 m).","o":"5(b)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 5(b).\n\nGiven: Load = 1000 N, η = 80%, number of pulleys = 4, so VR = 4, load distance LD = 6 m\n\n**i. Force required to uplift 1000 N load**\nη = (MA / VR) × 100\n80 = (MA / 4) × 100\nMA = 3.2\n\nMA = Load / Effort → 3.2 = 1000 / E\n**E = 312.5 N**\n\n**ii. Mechanical advantage:** **MA = 3.2**\n\n**iii. Input work and output work**\nVR = ED / LD → 4 = ED / 6 → ED = 24 m\n\nInput work = Effort × Effort distance = 312.5 × 24 = **7500 J**\nOutput work = Load × Load distance = 1000 × 6 = **6000 J**\n\nTherefore: **Effort = 312.5 N, MA = 3.2, Input work = 7500 J, Output work = 6000 J**"},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 5(c): Numerical: A wheel and axle has wheel radius 20 cm and axle radius 5 cm. An effort of 250 N lifts a load of 500 N. Find MA, VR and efficiency. | सरल यन्त्र अभ्यास 5(c)","q":"Numerical: A wheel and axle has wheel radius 20 cm and axle radius 5 cm. An effort of 250 N lifts a load of 500 N. Find MA, VR and efficiency.","o":"5(c)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 5(c).\n\nGiven: R = 20 cm, r = 5 cm, E = 250 N, L = 500 N\n\n**Mechanical Advantage:** MA = Load / Effort = 500 / 250 = **2**\n\n**Velocity Ratio:** VR = R / r = 20 / 5 = **4**\n\n**Efficiency:** η = (MA / VR) × 100% = (2 / 4) × 100% = **50%**\n\nTherefore: **MA = 2, VR = 4, η = 50%**"},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Simple Machine – Exercise 5(d): Numerical: A wedge has width 6 cm and vertical height 12 cm. An effort of 300 N overcomes a resistance of 500 N. Find MA, VR and efficiency. | सरल यन्त्र अभ्यास 5(d)","q":"Numerical: A wedge has width 6 cm and vertical height 12 cm. An effort of 300 N overcomes a resistance of 500 N. Find MA, VR and efficiency.","o":"5(d)","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Exercise 5(d).\n\nGiven: width of wedge L = 6 cm, height/depth H = 12 cm, effort E = 300 N, load/resistance = 500 N\n\n**Mechanical Advantage:** MA = Load / Effort = 500 / 300 = **1.67**\n\n**Velocity Ratio:** VR = Effort distance / Load distance = H / L = 12 / 6 = **2**\n\n**Efficiency:** η = (MA / VR) × 100% = (1.67 / 2) × 100% = **83.33%**\n\nTherefore: **MA = 1.67, VR = 2, η = 83.33%**"},{"g":"9","n":8,"c":"Simple Machine","a":"simple machine simple machines सरल यन्त्र सरल मेसिन","t":"Chapter 8 Simple Machine – Important formulas | सरल यन्त्र","q":"","o":"","s":"","x":"Chapter: Simple Machine (सरल यन्त्र) – Class 9 Science. Important formulas.\n\n**Important formulas from Chapter 8 (Simple Machine)**\n\n- MA = Load / Effort\n- VR = Effort distance / Load distance\n- Efficiency η = (Output work / Input work) × 100%\n- Efficiency η = (MA / VR) × 100%\n- Inclined plane: VR = Length / Height\n- Single fixed pulley: VR = 1\n- Single movable pulley: VR = 2\n- Pulley system: VR = number of rope segments supporting the load\n- Screw: VR = 2πR / P\n- Wedge: VR = H / L\n- Wheel and axle: VR = R / r\n\nA real machine has efficiency less than 100% because of friction. A perfect machine would have 100% efficiency, but such a machine is practically impossible."},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Energy – Exercise 1(a): Which is the non-renewable source of energy? | ऊर्जा अभ्यास 1(a)","q":"Which is the non-renewable source of energy?","o":"1(a)","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Exercise 1(a).\n\n**Answer: iii) Kerosene**"},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Energy – Exercise 1(b): Which of the following technologies is not included in solar technology? | ऊर्जा अभ्यास 1(b)","q":"Which of the following technologies is not included in solar technology?","o":"1(b)","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Exercise 1(b).\n\nNote: The figure/options for this question are not visible in the textbook text, so the exact option cannot be identified.\n\nSolar technologies discussed in the chapter: solar panel, solar lamp, solar dryer, solar water heater and solar cooker. The correct answer is the option that is not one of these."},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Energy – Exercise 1(c): Which is the group of bio-energy? | ऊर्जा अभ्यास 1(c)","q":"Which is the group of bio-energy?","o":"1(c)","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Exercise 1(c).\n\n**Answer: iii) Dung cake, biogas, alcohol, husk**"},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Energy – Exercise 1(d): Which of the following gases are constituents of biogas? | ऊर्जा अभ्यास 1(d)","q":"Which of the following gases are constituents of biogas?","o":"1(d)","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Exercise 1(d).\n\n**Answer: iii) Nitrogen, carbon dioxide, methane, hydrogen sulphide**"},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Energy – Exercise 2(i): Give differences: Renewable and non-renewable sources of energy. | ऊर्जा अभ्यास 2(i)","q":"Give differences: Renewable and non-renewable sources of energy.","o":"2(i)","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Exercise 2(i).\n\n| Renewable source | Non-renewable source |\n|---|---|\n| These sources are continuously produced in nature and can be quickly replaced. | These sources are exhausted after continuous use and cannot be reproduced within a short period. |\n| They can be used continuously. | They cannot be used forever. |\n| Examples: solar energy, wind energy, hydroelectricity, wood, dung cake and biogas. | Examples: coal, mineral oil and natural gas. |"},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Energy – Exercise 2(ii): Give differences: Solar energy and bioenergy. | ऊर्जा अभ्यास 2(ii)","q":"Give differences: Solar energy and bioenergy.","o":"2(ii)","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Exercise 2(ii).\n\n| Solar energy | Bioenergy |\n|---|---|\n| The heat and light received by the earth directly from the sun is called solar energy. | Energy obtained from animal wastes and parts of plants is called bioenergy. |\n| It is obtained directly or indirectly from the sun. | It is obtained from organic materials of living beings. |\n| Examples: sunlight, solar heat. | Examples: firewood, dung cake and straw. |"},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Energy – Exercise 2(iii): Give differences: Carbonized briquette and non-carbonized briquette. | ऊर्जा अभ्यास 2(iii)","q":"Give differences: Carbonized briquette and non-carbonized briquette.","o":"2(iii)","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Exercise 2(iii).\n\n| Carbonized briquette | Non-carbonized briquette |\n|---|---|\n| It is a compressed brick of charcoal. | It is made by compressing biomass without carbonizing it. |\n| Charcoal is produced by burning carbon-containing materials with insufficient oxygen. | Biomass such as sawdust, paper, husk and agricultural waste is compressed. |\n| Clay, molasses or plant starch can be used as binders. | Compressing machines such as piston press, screw press and roller press can be used. |\n| Example: charcoal briquette. | Example: dung cake. |"},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Energy – Exercise 2(iv): Give differences: Natural gas and biogas. | ऊर्जा अभ्यास 2(iv)","q":"Give differences: Natural gas and biogas.","o":"2(iv)","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Exercise 2(iv).\n\n| Natural gas | Biogas |\n|---|---|\n| Natural gas is a non-renewable source of energy. | Biogas is a renewable source of energy. |\n| It is a fossil fuel. | It is produced by decomposition of organic materials in the absence of oxygen. |\n| It is obtained from natural sources. | It is especially produced from animal dung in rural areas. |\n| It cannot be quickly replaced after exhaustion. | It can be continuously produced from organic materials. |"},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Energy – Exercise 3(i): Give reason: The sun is the ultimate source of energy. | ऊर्जा अभ्यास 3(i)","q":"Give reason: The sun is the ultimate source of energy.","o":"3(i)","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Exercise 3(i).\n\nThe sun is the ultimate source of energy because most of the energy sources available on the earth, such as hydroelectricity, wind energy, bioenergy and fossil fuels, are formed by transforming solar energy. Therefore, almost all types of energy are directly or indirectly derived from the sun."},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Energy – Exercise 3(ii): Give reason: The use of renewable sources of energy must be increased. | ऊर्जा अभ्यास 3(ii)","q":"Give reason: The use of renewable sources of energy must be increased.","o":"3(ii)","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Exercise 3(ii).\n\nRenewable sources of energy are continuously produced in nature and can be quickly replaced. They do not get exhausted even after continuous use. Their increased use can reduce dependence on non-renewable sources such as coal, mineral oil and natural gas."},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Energy – Exercise 3(iii): Give reason: Solar vehicles are a better alternative in the context of Nepal. | ऊर्जा अभ्यास 3(iii)","q":"Give reason: Solar vehicles are a better alternative in the context of Nepal.","o":"3(iii)","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Exercise 3(iii).\n\nSolar energy is a renewable source of energy. Solar energy can be converted into electrical energy using solar panels. Therefore, solar vehicles can reduce the use of petroleum products and help use renewable energy."},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Energy – Exercise 3(iv): Give reason: Hydroelectricity is the most appropriate source of energy for Nepal. | ऊर्जा अभ्यास 3(iv)","q":"Give reason: Hydroelectricity is the most appropriate source of energy for Nepal.","o":"3(iv)","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Exercise 3(iv).\n\nNepal has water resources in the form of rivers, lakes and reservoirs. Hydroelectricity is produced by using flowing water to rotate a turbine connected to a generator. It is a renewable and pollution-free source of energy and is cheaper in the long run."},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Energy – Exercise 3(v): Give reason: Biogas is the most suitable alternative energy source in our rural village. | ऊर्जा अभ्यास 3(v)","q":"Give reason: Biogas is the most suitable alternative energy source in our rural village.","o":"3(v)","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Exercise 3(v).\n\nBiogas can be produced from animal dung and other organic materials. It can be used for cooking and lighting. It produces little smoke, reduces the use of firewood, saves forests and produces fertilizer as a by-product. Therefore, it is suitable for rural areas."},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Energy – Exercise 4(a): Define the source of energy with examples. | ऊर्जा अभ्यास 4(a)","q":"Define the source of energy with examples.","o":"4(a)","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Exercise 4(a).\n\nAny object that can give a useful form of energy is called a **source of energy**.\n\nExamples are coal, diesel, kerosene, natural gas, hydroelectricity, petrol, wood, dung cake and solar energy."},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Energy – Exercise 4(b): What is thermonuclear fusion? | ऊर्जा अभ्यास 4(b)","q":"What is thermonuclear fusion?","o":"4(b)","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Exercise 4(b).\n\nThe process of joining hydrogen atoms to form helium atoms in the presence of high pressure and high temperature is called **thermonuclear fusion**.\n\nThis process takes place in the core of the Sun and releases a large amount of energy in the form of radiation."},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Energy – Exercise 4(c): Write the necessary conditions for nuclear fusion in the Sun. | ऊर्जा अभ्यास 4(c)","q":"Write the necessary conditions for nuclear fusion in the Sun.","o":"4(c)","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Exercise 4(c).\n\nThe necessary conditions for thermonuclear fusion in the Sun are:\n\n1. **An enormous amount of hydrogen:** The Sun contains a massive amount of hydrogen gas.\n2. **High temperature:** The high temperature of the Sun creates free protons.\n3. **High pressure:** The high pressure in the core of the Sun brings the protons together for fusion."},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Energy – Exercise 4(d): Justify that the following sources of energy are the product of solar energy: i) Hydroelectricity, ii) Fossil fuel, iii) Wind energy. | ऊर्जा अभ्यास 4(d)","q":"Justify that the following sources of energy are the product of solar energy: i) Hydroelectricity, ii) Fossil fuel, iii) Wind energy.","o":"4(d)","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Exercise 4(d).\n\n**i) Hydroelectricity:** Solar energy causes the evaporation of water from lakes, rivers, ponds and seas. Water vapour condenses to form clouds and rainfall occurs. Rainwater flows through rivers or collects in reservoirs. The water collected in reservoirs is used to produce hydroelectricity. Therefore, hydroelectricity is an indirect form of solar energy.\n\n**ii) Fossil fuel:** Green plants absorb solar energy during photosynthesis and convert it into chemical energy stored in plants. Fossil fuels such as coal, petrol, diesel and natural gas are formed from dead plants and animals buried in the earth for millions of years. Therefore, fossil fuels are products of solar energy.\n\n**iii) Wind energy:** The Sun heats the air near the earth's surface. The hot air becomes lighter and moves upward and is replaced by cool air from another place. This movement of air produces wind energy. Therefore, wind energy is also a product of solar energy."},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Energy – Exercise 4(e): Describe the process of energy production in the Sun. | ऊर्जा अभ्यास 4(e)","q":"Describe the process of energy production in the Sun.","o":"4(e)","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Exercise 4(e).\n\nThe Sun contains a huge amount of hydrogen. Its core has extremely high temperature and pressure.\n\nAt this high temperature, electrons separate from hydrogen atoms and form hydrogen ions or protons. The high pressure brings these protons together. Hydrogen nuclei fuse together to form helium.\n\nIn the overall process, four hydrogen atoms fuse to form one helium atom, producing a large amount of energy. This energy is released in the form of radiation and reaches the earth as solar energy.\n\n**Overall process: 4 Hydrogen atoms → 1 Helium atom + energy**"},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Energy – Exercise 4(f): Describe with a diagram the working principle of any two equipment based on solar technology. | ऊर्जा अभ्यास 4(f)","q":"Describe with a diagram the working principle of any two equipment based on solar technology.","o":"4(f)","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Exercise 4(f).\n\n**1. Solar panel**\n\nA solar panel consists of many photovoltaic cells. These cells are mainly made of silicon. When sunlight strikes the silicon atoms, free electrons are produced. The accumulation of free electrons creates an electric potential difference between the two terminals of the cell. A series combination of photovoltaic cells increases the current.\n\n```text\n        Sunlight\n           ↓\n     ┌─────────────┐\n     │ Solar Panel │\n     │ Photovoltaic│\n     │    Cells    │\n     └──────┬──────┘\n            ↓\n       Electrical\n         Energy\n            ↓\n    Electric appliances\n```\n\n**2. Solar water heater**\n\nIn a solar water heater, evacuated tubes are connected to a water tank. Cold water enters the tubes from the lower part. Solar radiation heats the water. Hot water has lower density and collects in the upper part of the tank, while cold water moves into the tubes.\n\n```text\n             Water Tank\n        ┌─────────────────┐\n        │   Hot Water ↑   │\n        └───────┬─────────┘\n                │\n       Evacuated Tubes\n        ╲  ╲  ╲  ╲  ╲\n         * * * * *\n          Solar Energy\n                ↓\n          Water is heated\n```"},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Energy – Exercise 4(g): What is an alternative source of energy? Give any two examples. | ऊर्जा अभ्यास 4(g)","q":"What is an alternative source of energy? Give any two examples.","o":"4(g)","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Exercise 4(g).\n\nThe sources of energy that can be used instead of traditional sources of energy are called **alternative sources of energy**.\n\nExamples:\n1. Solar energy\n2. Wind energy\n\nOther examples include bioenergy and biogas."},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Energy – Exercise 4(h): Identify the equipment from the given figure and also mention their working principle. | ऊर्जा अभ्यास 4(h)","q":"Identify the equipment from the given figure and also mention their working principle.","o":"4(h)","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Exercise 4(h).\n\nNote: The figures referred to in the question are not visible in the textbook text, so the exact equipment cannot be identified.\n\nThe chapter discusses these solar technologies:\n- **Solar panel:** converts solar energy into electrical energy.\n- **Solar lamp:** photovoltaic cells convert solar energy into electrical energy used by the LED.\n- **Solar dryer:** uses solar heat to dry food and other materials.\n- **Solar water heater:** uses solar radiation to heat water.\n- **Solar cooker:** uses a concave mirror to concentrate solar heat for cooking."},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Energy – Exercise 4(i): What is biofuel? | ऊर्जा अभ्यास 4(i)","q":"What is biofuel?","o":"4(i)","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Exercise 4(i).\n\nThe chapter describes bioenergy as energy obtained from animal wastes and parts of plants. Fuels obtained from such biological materials are called **biofuels**.\n\nExamples include fuels obtained from firewood, dung cake, straw and other plant materials."},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Energy – Exercise 4(j): Give any four examples of biofuel. | ऊर्जा अभ्यास 4(j)","q":"Give any four examples of biofuel.","o":"4(j)","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Exercise 4(j).\n\nFour examples are:\n1. Firewood\n2. Dung cake\n3. Straw\n4. Biogas"},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Energy – Exercise 4(k): Why are briquettes used? Write any two advantages of it. | ऊर्जा अभ्यास 4(k)","q":"Why are briquettes used? Write any two advantages of it.","o":"4(k)","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Exercise 4(k).\n\n**Uses of briquettes:** Briquettes are used:\n- To heat rooms in winter.\n- To cook food and boil water.\n- To incubate baby chicks in poultry farms.\n- To dry vegetables, mushrooms, wool, etc. in industries.\n\n**Any two advantages:**\n1. They release less smoke, so they reduce air pollution.\n2. They reduce the use of firewood and thus help save forests.\n\nOther advantages include easy transportation, more heat production and the use of agricultural residues."},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Energy – Exercise 4(l): How is biogas produced? Explain the construction of the biogas plant with an appropriate diagram. | ऊर्जा अभ्यास 4(l)","q":"How is biogas produced? Explain the construction of the biogas plant with an appropriate diagram.","o":"4(l)","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Exercise 4(l).\n\nBiogas is produced by the decomposition of organic materials in the absence of oxygen. In rural areas, it is especially produced from animal dung.\n\nA biogas plant mainly consists of a **mixer, dome and outlet chamber**.\n\nThe dung is mixed with water in the mixing tank to form slurry. The slurry passes through the inlet pipe into the digester. In the digester, the organic matter decomposes in the absence of oxygen and produces biogas. The gas is collected in the dome and supplied for use through the outlet pipe.\n\nThe pressure of the gas pushes the slurry into the outlet chamber. When the outlet chamber becomes full, the slurry passes into the compost pit, where it can be used as fertilizer.\n\n**Diagram:**\n```text\n              Gas for cooking/lighting\n                       ↑\n                 ┌───────────┐\n                 │    Dome   │\n                 │  Biogas   │\n                 └─────┬─────┘\n                       │\nDung + Water           │\n     ↓                 │\n┌──────────┐       ┌───────────┐\n│  Mixer   │──────→│  Digester │\n└──────────┘       │           │\n                   │  Slurry   │\n                   └─────┬─────┘\n                         ↓\n                   ┌───────────┐\n                   │   Outlet  │\n                   │  Chamber  │\n                   └─────┬─────┘\n                         ↓\n                   Compost Pit\n                         ↓\n                     Fertilizer\n```"},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Energy – Exercise 4(m): Write any two advantages of biogas as a source of energy. | ऊर्जा अभ्यास 4(m)","q":"Write any two advantages of biogas as a source of energy.","o":"4(m)","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Exercise 4(m).\n\n1. The use of biogas is smoke-free, so it reduces air pollution.\n2. It displaces the use of firewood and thus saves forests.\n\nOther advantages are that it can be used for lighting and its by-product can be used as good-quality fertilizer."},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Energy – Exercise 4(n): Describe any two alternative sources of energy used in your surroundings. | ऊर्जा अभ्यास 4(n)","q":"Describe any two alternative sources of energy used in your surroundings.","o":"4(n)","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Exercise 4(n).\n\n**1. Solar energy:** Solar energy is obtained from the heat and light of the Sun. Solar panels can convert solar energy into electrical energy. Solar energy is also used in solar water heaters, solar lamps, solar dryers and solar cookers.\n\n**2. Biogas:** Biogas is produced by the decomposition of organic materials in the absence of oxygen. In rural areas, it is mainly produced from animal dung. It can be used for cooking and lighting. The remaining slurry can be used as fertilizer."},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Energy – Exercise 4(o): Essay: Potential of development of alternative energy in Nepal. | ऊर्जा अभ्यास 4(o)","q":"Essay: Potential of development of alternative energy in Nepal.","o":"4(o)","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Exercise 4(o).\n\n**Potential of Development of Alternative Energy in Nepal**\n\nNepal has a good possibility of developing alternative sources of energy. Solar energy, hydroelectricity, wind energy, bioenergy and biogas can be used as alternatives to traditional and non-renewable sources of energy.\n\nNepal has many rivers and water resources, so there is a high possibility of producing hydroelectricity. Hydroelectricity is renewable and pollution-free. Solar energy can also be used in many parts of Nepal through solar panels, solar water heaters, solar dryers, solar lamps and solar cookers.\n\nBiogas is especially useful in rural areas because animal dung and other organic materials are easily available. It can be used for cooking and lighting, while its by-product can be used as fertilizer. Wind energy can also be developed in windy areas such as Mustang. Wind turbines can be used to produce electricity.\n\nThe Alternative Energy Promotion Centre (AEPC) was established on November 3, 1996, to develop and promote renewable and alternative sources of energy in Nepal. It supports technologies such as biogas, solar panels, solar dryers, solar cookers and windmills.\n\nThe development and use of alternative energy can reduce the use of petroleum products and firewood, reduce air pollution, save forests and support economic activities. Therefore, Nepal has significant potential for the development and use of alternative energy."},{"g":"9","n":9,"c":"Energy","a":"energy ऊर्जा alternative energy वैकल्पिक ऊर्जा","t":"Chapter 9 Energy – Important formulae and key processes | ऊर्जा","q":"","o":"","s":"","x":"Chapter: Energy (ऊर्जा) – Class 9 Science. Important formulae.\n\n**Important formulae / key processes from Chapter 9 (Energy)**\n\n- Efficiency (η) = (Output work / Input work) × 100%\n- Solar energy → Solar panel → Electrical energy\n- Biogas: Organic materials + absence of oxygen → Biogas + slurry\n- Thermonuclear fusion: 4 Hydrogen atoms → 1 Helium atom + Energy"},{"g":"9","n":10,"c":"Wave","a":"wave waves तरङ्ग तरंग","t":"Wave – Exercise 1(a): Which is an example of a longitudinal wave? | तरङ्ग अभ्यास 1(a)","q":"Which is an example of a longitudinal wave?","o":"1(a)","s":"","x":"Chapter: Wave (तरङ्ग) – Class 9 Science. Exercise 1(a).\n\n**Answer: i) Sound wave**"},{"g":"9","n":10,"c":"Wave","a":"wave waves तरङ्ग तरंग","t":"Wave – Exercise 1(b): Which statement is completely true for waves having longer wavelengths? | तरङ्ग अभ्यास 1(b)","q":"Which statement is completely true for waves having longer wavelengths?","o":"1(b)","s":"","x":"Chapter: Wave (तरङ्ग) – Class 9 Science. Exercise 1(b).\n\n**Answer: iv) It has a longer period.**"},{"g":"9","n":10,"c":"Wave","a":"wave waves तरङ्ग तरंग","t":"Wave – Exercise 1(c): Which group of waves is arranged according to increasing wavelength? | तरङ्ग अभ्यास 1(c)","q":"Which group of waves is arranged according to increasing wavelength?","o":"1(c)","s":"","x":"Chapter: Wave (तरङ्ग) – Class 9 Science. Exercise 1(c).\n\n**Answer: iii) Ultraviolet ray, Violet ray, red light, infrared ray**"},{"g":"9","n":10,"c":"Wave","a":"wave waves तरङ्ग तरंग","t":"Wave – Exercise 1(d): Which electromagnetic wave is used in the remote control technology of a television? | तरङ्ग अभ्यास 1(d)","q":"Which electromagnetic wave is used in the remote control technology of a television?","o":"1(d)","s":"","x":"Chapter: Wave (तरङ्ग) – Class 9 Science. Exercise 1(d).\n\n**Answer: ii) Infrared wave**"},{"g":"9","n":10,"c":"Wave","a":"wave waves तरङ्ग तरंग","t":"Wave – Exercise 1(e): Hari slips on the stairs and suffers from some external head injuries. Which technology is used for in-depth checkups of brain injury? | तरङ्ग अभ्यास 1(e)","q":"Hari slips on the stairs and suffers from some external head injuries. Which technology is used for in-depth checkups of brain injury?","o":"1(e)","s":"","x":"Chapter: Wave (तरङ्ग) – Class 9 Science. Exercise 1(e).\n\n**Answer: ii) CT scan**"},{"g":"9","n":10,"c":"Wave","a":"wave waves तरङ्ग तरंग","t":"Wave – Exercise 1(f): Which sentence is related to ultrasonography and X-ray imaging? | तरङ्ग अभ्यास 1(f)","q":"Which sentence is related to ultrasonography and X-ray imaging?","o":"1(f)","s":"","x":"Chapter: Wave (तरङ्ग) – Class 9 Science. Exercise 1(f).\n\n**Answer: iv) One is used to check bones; the other is used to check soft organs.**"},{"g":"9","n":10,"c":"Wave","a":"wave waves तरङ्ग तरंग","t":"Wave – Exercise 2(a): Differentiate between longitudinal wave and transverse wave. | तरङ्ग अभ्यास 2(a)","q":"Differentiate between longitudinal wave and transverse wave.","o":"2(a)","s":"","x":"Chapter: Wave (तरङ्ग) – Class 9 Science. Exercise 2(a).\n\n| Longitudinal wave | Transverse wave |\n|---|---|\n| The direction of wave transmission and vibration is the same. | The direction of wave transmission and vibration are perpendicular to each other. |\n| It travels in the form of compression and rarefaction. | It travels in the form of crest and trough. |\n| It can be produced in solid, liquid and gas. | It can be produced in solid and liquid but not in gas. |\n| Sound wave is an example. | Water-surface wave and rope wave are examples. |"},{"g":"9","n":10,"c":"Wave","a":"wave waves तरङ्ग तरंग","t":"Wave – Exercise 2(b): Differentiate between electromagnetic wave and mechanical wave. | तरङ्ग अभ्यास 2(b)","q":"Differentiate between electromagnetic wave and mechanical wave.","o":"2(b)","s":"","x":"Chapter: Wave (तरङ्ग) – Class 9 Science. Exercise 2(b).\n\n| Electromagnetic wave | Mechanical wave |\n|---|---|\n| It does not require a medium to travel. | It requires a medium to travel. |\n| It can travel through vacuum. | It cannot travel through vacuum. |\n| It is a transverse wave. | It can be longitudinal or transverse. |\n| Energy is transmitted without a medium. | Energy is transmitted through vibration of molecules of a medium. |\n| Example: light wave, X-ray, radio wave. | Example: sound wave. |"},{"g":"9","n":10,"c":"Wave","a":"wave waves तरङ्ग तरंग","t":"Wave – Exercise 2(c): Differentiate between traditional X-ray photography and CT scan. | तरङ्ग अभ्यास 2(c)","q":"Differentiate between traditional X-ray photography and CT scan.","o":"2(c)","s":"","x":"Chapter: Wave (तरङ्ग) – Class 9 Science. Exercise 2(c).\n\n| Traditional X-ray photography | CT scan |\n|---|---|\n| It produces an image based on shadows formed by X-rays. | It uses X-rays and computer processing to produce images. |\n| The X-ray machine is positioned at a certain distance from the patient. | The X-ray source rotates around the patient. |\n| It mainly produces a traditional X-ray photograph. | It produces 2D cross-sectional and 3D images. |\n| It is useful for checking fractured bones, teeth, infections, tumors and arterial blockage. | It is useful for checking internal wounds, blood clots, tumors and conditions of the lungs and brain. |"},{"g":"9","n":10,"c":"Wave","a":"wave waves तरङ्ग तरंग","t":"Wave – Exercise 2(d): Differentiate between infrared and ultraviolet rays. | तरङ्ग अभ्यास 2(d)","q":"Differentiate between infrared and ultraviolet rays.","o":"2(d)","s":"","x":"Chapter: Wave (तरङ्ग) – Class 9 Science. Exercise 2(d).\n\n| Infrared rays | Ultraviolet rays |\n|---|---|\n| Their frequency is less than red light. | Their frequency is higher than visible light. |\n| Their wavelength is comparatively longer. | Their wavelength is shorter. |\n| They produce a sensation of heat when high-intensity rays strike the body. | Long exposure can cause sunburn and high exposure may cause skin cancer. |\n| Used in remote controls, thermal cameras and radiation thermometers. | Used for sterilization, SODIS and formation of vitamin D. |"},{"g":"9","n":10,"c":"Wave","a":"wave waves तरङ्ग तरंग","t":"Wave – Exercise 3(a): Give reason: When a rope is fixed at one end and the other end is moved up and down continuously, the wave produced is called a transverse wave. | तरङ्ग अभ्यास 3(a)","q":"Give reason: When a rope is fixed at one end and the other end is moved up and down continuously, the wave produced is called a transverse wave.","o":"3(a)","s":"","x":"Chapter: Wave (तरङ्ग) – Class 9 Science. Exercise 3(a).\n\nWhen one end of the rope is moved up and down, the molecules of the rope vibrate up and down while the wave moves forward. Thus, the direction of vibration is perpendicular to the direction of wave transmission. Therefore, the wave is called a **transverse wave**."},{"g":"9","n":10,"c":"Wave","a":"wave waves तरङ्ग तरंग","t":"Wave – Exercise 3(b): Give reason: As the distance from the epicenter of a seismic wave during an earthquake increases, a lesser effect is felt. | तरङ्ग अभ्यास 3(b)","q":"Give reason: As the distance from the epicenter of a seismic wave during an earthquake increases, a lesser effect is felt.","o":"3(b)","s":"","x":"Chapter: Wave (तरङ्ग) – Class 9 Science. Exercise 3(b).\n\nA seismic wave transmits energy from the place where the earthquake occurs. As the wave travels farther from the epicenter, its energy decreases. Therefore, a lesser effect is felt as the distance from the epicenter increases."},{"g":"9","n":10,"c":"Wave","a":"wave waves तरङ्ग तरंग","t":"Wave – Exercise 3(c): Give reason: In a CT scan, the source of the X-ray is kept in such a way that it rotates around the patient. | तरङ्ग अभ्यास 3(c)","q":"Give reason: In a CT scan, the source of the X-ray is kept in such a way that it rotates around the patient.","o":"3(c)","s":"","x":"Chapter: Wave (तरङ्ग) – Class 9 Science. Exercise 3(c).\n\nThe X-ray source rotates around the patient to collect information from different angles. The computer processes this information to prepare 2D cross-sectional images and detailed 3D images of the internal organs."},{"g":"9","n":10,"c":"Wave","a":"wave waves तरङ्ग तरंग","t":"Wave – Exercise 3(d): Give reason: Although a CT scan gives a detailed three-dimensional report of internal organs, ultrasonography is used to check the fetus in the uterus. | तरङ्ग अभ्यास 3(d)","q":"Give reason: Although a CT scan gives a detailed three-dimensional report of internal organs, ultrasonography is used to check the fetus in the uterus.","o":"3(d)","s":"","x":"Chapter: Wave (तरङ्ग) – Class 9 Science. Exercise 3(d).\n\nUltrasonography uses ultrasound waves and does not harm the cells of the body. It can be used to observe the size, condition, movement and abnormalities of a fetus. Therefore, it is used to check the fetus in the uterus."},{"g":"9","n":10,"c":"Wave","a":"wave waves तरङ्ग तरंग","t":"Wave – Exercise 4(a): What is a wave? | तरङ्ग अभ्यास 4(a)","q":"What is a wave?","o":"4(a)","s":"","x":"Chapter: Wave (तरङ्ग) – Class 9 Science. Exercise 4(a).\n\nA **wave is a periodic disturbance that transmits energy.**"},{"g":"9","n":10,"c":"Wave","a":"wave waves तरङ्ग तरंग","t":"Wave – Exercise 4(b): Draw a detailed and well-labelled diagram of a wave produced on the water surface and sound wave transmitted when we speak. | तरङ्ग अभ्यास 4(b)","q":"Draw a detailed and well-labelled diagram of a wave produced on the water surface and sound wave transmitted when we speak.","o":"4(b)","s":"","x":"Chapter: Wave (तरङ्ग) – Class 9 Science. Exercise 4(b).\n\n**Water surface wave:** A water surface wave is a **transverse wave**. It consists of crests and troughs.\n\n```text\n                 Crest\n                   ↓\n              /\\          /\\\n             /  \\        /  \\\n            /    \\      /    \\\n-----------/------\\----/------\\----------- Mean position\n          /        \\  /        \\\n         /          \\/          \\\n        ↓                         ↓\n      Trough                    Trough\n\n        ←------ Wavelength λ ------→\n```\n\nThe raised part is the **crest**, the depressed part is the **trough**, and the maximum displacement from the mean position is the **amplitude**.\n\n**Sound wave:** Sound is a **longitudinal wave**. It travels through compressions and rarefactions.\n\n```text\n      Compression        Rarefaction       Compression\n     |||||||||||||        | | | | |       |||||||||||||
