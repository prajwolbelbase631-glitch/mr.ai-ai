\n        ↑                    ↑                  ↑\n     Cramped             Spread out          Cramped\n\n────────────────────────────────────────────────────→\n                 Direction of wave\n```"},{"g":"9","n":10,"c":"Wave","a":"wave waves तरङ्ग तरंग","t":"Wave – Exercise 4(c): What is the electromagnetic spectrum? | तरङ्ग अभ्यास 4(c)","q":"What is the electromagnetic spectrum?","o":"4(c)","s":"","x":"Chapter: Wave (तरङ्ग) – Class 9 Science. Exercise 4(c).\n\nThe entire range of electromagnetic waves from very low frequency to very high frequency is called the **electromagnetic spectrum**.\n\nThe main parts are:\n\n**Radio waves → Microwaves → Infrared → Visible light → Ultraviolet → X-rays → Gamma rays**\n\nRadio waves have the longest wavelength and least frequency, whereas gamma rays have the shortest wavelength and maximum frequency."},{"g":"9","n":10,"c":"Wave","a":"wave waves तरङ्ग तरंग","t":"Wave – Exercise 4(d): Mention the waves having maximum and minimum frequencies in the electromagnetic spectrum. Give two uses of each. | तरङ्ग अभ्यास 4(d)","q":"Mention the waves having maximum and minimum frequencies in the electromagnetic spectrum. Give two uses of each.","o":"4(d)","s":"","x":"Chapter: Wave (तरङ्ग) – Class 9 Science. Exercise 4(d).\n\n**Minimum frequency: Radio waves.** Two uses:\n1. Communication signals in radio and television.\n2. Radio telescopes are used to study the universe.\n\n**Maximum frequency: Gamma rays.** Two uses:\n1. Destroying cancer cells through radiotherapy.\n2. Sterilizing surgical equipment."},{"g":"9","n":10,"c":"Wave","a":"wave waves तरङ्ग तरंग","t":"Wave – Exercise 4(e): X-ray photograph and CT scan photo of the pelvic region: i) Distinguish X-ray photograph and CT scan photo. ii) Mention the steps to check from both technologies. iii) Write the uses of X-ray photography and CT scan. | तरङ्ग अभ्यास 4(e)","q":"X-ray photograph and CT scan photo of the pelvic region: i) Distinguish X-ray photograph and CT scan photo. ii) Mention the steps to check from both technologies. iii) Write the uses of X-ray photography and CT scan.","o":"4(e)","s":"","x":"Chapter: Wave (तरङ्ग) – Class 9 Science. Exercise 4(e).\n\n**i) Distinguish X-ray photograph and CT scan photo**\n\n- **X-ray photograph:** produced by passing X-rays through the body and forming an image based on the shadows produced by different tissues.\n- **CT scan photo:** produced by collecting X-ray information from different angles and processing the information with a computer. It produces 2D cross-sectional images and can also produce detailed 3D images.\n\n**ii) Steps to check from both technologies**\n\n*X-ray photography*\n1. The patient is positioned at a certain distance in front of the X-ray machine.\n2. The X-ray machine is turned on.\n3. X-rays pass through the patient's body.\n4. The X-rays strike the film or electronic recording device.\n5. Shadows are recorded to produce the X-ray photograph.\n\n*CT scan*\n1. The patient is placed inside the doughnut-shaped CT machine.\n2. The X-ray source rotates around the patient.\n3. X-rays are directed at the required body part from different angles.\n4. Detectors collect the information.\n5. A computer processes the information.\n6. 2D cross-sectional images are prepared.\n7. The slices can be combined to form a 3D image.\n\n**iii) Uses**\n\n*X-ray photography:* to check fractured bones; to check roots of teeth; to identify infections; to detect tumors; to identify arterial blockage.\n\n*CT scan:* to check internal wounds; to detect blood clots; to detect tumors; to examine the lungs; to examine the brain; to identify changes and irregularities inside the body."},{"g":"9","n":10,"c":"Wave","a":"wave waves तरङ्ग तरंग","t":"Wave – Exercise 4(f): Mention any four uses of the reflection of sound. | तरङ्ग अभ्यास 4(f)","q":"Mention any four uses of the reflection of sound.","o":"4(f)","s":"","x":"Chapter: Wave (तरङ्ग) – Class 9 Science. Exercise 4(f).\n\nFour uses are:\n1. Bats use reflected ultrasound for echolocation.\n2. Dolphins use echolocation to find invisible locations in water.\n3. SONAR is used to calculate distance and measure the depth of the sea.\n4. Ultrasonography uses reflected ultrasound to examine internal organs.\n\nOther uses include ultrasonic rulers, burglar alarms and ultrasonic sensors in car parking."},{"g":"9","n":10,"c":"Wave","a":"wave waves तरङ्ग तरंग","t":"Wave – Exercise 4(g): Rohan calculated the distance between his house and his neighbor's house using reflection of sound. Describe his method. | तरङ्ग अभ्यास 4(g)","q":"Rohan calculated the distance between his house and his neighbor's house using reflection of sound. Describe his method.","o":"4(g)","s":"","x":"Chapter: Wave (तरङ्ग) – Class 9 Science. Exercise 4(g).\n\nRohan can use an ultrasonic ruler based on the reflection of sound.\n\nFirst, an ultrasound is sent from a sender towards the neighboring house. The sound wave strikes the house and is reflected back. A receiver receives the reflected sound.\n\nThe time interval between sending the ultrasound and receiving the reflected wave is measured. Using the time taken and the velocity of sound, the distance between the houses can be calculated.\n\nThe principle is: **Distance = velocity × time**\n\nSince the sound travels to the house and returns, the measured time is for a round trip. So the one-way distance is d = (v × t) / 2."},{"g":"9","n":10,"c":"Wave","a":"wave waves तरङ्ग तरंग","t":"Wave – Exercise 4(h): Prepare a model of security technology based on sound reflection. | तरङ्ग अभ्यास 4(h)","q":"Prepare a model of security technology based on sound reflection.","o":"4(h)","s":"","x":"Chapter: Wave (तरङ्ग) – Class 9 Science. Exercise 4(h).\n\nA security alarm can be made using an **ultrasound sender and receiver**.\n\nThe sender continuously sends ultrasound waves toward the area being protected. When an object or person comes in the path, the ultrasound is reflected. The receiver detects the reflected ultrasound and the system can activate an alarm.\n\n**Diagram**\n```text\n        Ultrasound\n        Sender\n          │\n          │ )))))))))))))\n          │\n          ↓\n     ┌───────────┐\n     │  Object / │\n     │  Person   │\n     └───────────┘\n          ↑\n          │ ((((((((((((\n          │ Reflected\n          │ ultrasound\n       Receiver\n          │\n          ↓\n       Controller\n          │\n          ↓\n        Alarm\n```\n\nThis principle is used in security alarms such as burglar alarms and ultrasonic sensors used in car parking."},{"g":"9","n":10,"c":"Wave","a":"wave waves तरङ्ग तरंग","t":"Wave – Exercise 4(i): What is acoustic protection? Write its uses. | तरङ्ग अभ्यास 4(i)","q":"What is acoustic protection? Write its uses.","o":"4(i)","s":"","x":"Chapter: Wave (तरङ्ग) – Class 9 Science. Exercise 4(i).\n\n**Acoustic protection** is the technology of using soft and porous materials on walls to absorb unnecessary sound waves and control the reflection of sound.\n\n**Uses:** It is used in cinema halls, music rooms, seminar halls and recording studios.\n\nWalls can be made rough or foam boards can be attached to walls for acoustic protection."},{"g":"9","n":10,"c":"Wave","a":"wave waves तरङ्ग तरंग","t":"Wave – Exercise 4(j): What is ultrasonography? Mention its procedure and uses. | तरङ्ग अभ्यास 4(j)","q":"What is ultrasonography? Mention its procedure and uses.","o":"4(j)","s":"","x":"Chapter: Wave (तरङ्ग) – Class 9 Science. Exercise 4(j).\n\n**Ultrasonography** is a technology used to examine the internal organs of the body using **ultrasound waves**.\n\n**Procedure**\n1. A device called a **transducer** produces high-frequency ultrasound.\n2. The ultrasound is directed towards internal organs.\n3. The ultrasound reflects from different layers of the body.\n4. The transducer receives the reflected ultrasound.\n5. A computer collects and analyzes the intensity and time interval of the reflected waves.\n6. The computer prepares an image of the internal structure.\n7. The image is called a **sonogram**.\n\n**Uses**\n- Check kidneys and gallbladder stones.\n- Detect tumors of the brain and pancreas.\n- Check liver diseases.\n- Check intestinal problems.\n- Check uterine diseases.\n- Check the size and condition of the fetus.\n- Observe movement and abnormalities of organs.\n- Check the heartbeat and condition of heart valves through echocardiography."},{"g":"9","n":10,"c":"Wave","a":"wave waves तरङ्ग तरंग","t":"Wave – Exercise 4(k): Essay: Role of Electromagnetic Waves in Modern Life. | तरङ्ग अभ्यास 4(k)","q":"Essay: Role of Electromagnetic Waves in Modern Life.","o":"4(k)","s":"","x":"Chapter: Wave (तरङ्ग) – Class 9 Science. Exercise 4(k).\n\n**Role of Electromagnetic Waves in Modern Life**\n\nElectromagnetic waves play an important role in modern life. They can travel without a medium and can transmit energy over a large distance. Radio waves, microwaves, infrared rays, visible light, ultraviolet rays, X-rays and gamma rays are parts of the electromagnetic spectrum.\n\nRadio waves are used for communication through radio and television. Microwaves are used in microwave ovens, radar, satellite communication, mobile phones, Wi-Fi and Bluetooth technology. Infrared rays are used in remote controls, thermal imaging cameras, infrared CCTV cameras and radiation thermometers.\n\nVisible light helps us to see objects. It is also used in display screens and communication through optical fibers. Ultraviolet rays are used to kill microbes, sterilize materials and help in the formation of vitamin D in the skin.\n\nX-rays are very useful in medicine. They are used to check fractured bones, teeth, tumors and other internal problems. CT scans use X-rays and computer technology to produce detailed 2D and 3D images of internal organs. Gamma rays are used in radiotherapy, sterilization of surgical equipment and food preservation.\n\nThus, electromagnetic waves are widely used in communication, medicine, security, household technology, research and many other areas of modern life. They have made many activities easier and have greatly contributed to the development of science and technology."},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Electricity – Exercise 1(i): Which graph demonstrates Ohm's law? | विद्युत अभ्यास 1(i)","q":"Which graph demonstrates Ohm's law?","o":"1(i)","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Exercise 1(i).\n\nNote: The graph labels are not visible in the textbook text, so the option letter (A, B, C or D) cannot be identified.\n\n**Answer: The graph in which current (I) is directly proportional to potential difference (V), i.e. a straight line passing through the origin.**"},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Electricity – Exercise 1(ii): From which substance is the heating element in an electric heater made? | विद्युत अभ्यास 1(ii)","q":"From which substance is the heating element in an electric heater made?","o":"1(ii)","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Exercise 1(ii).\n\n**Answer: d) Nichrome**"},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Electricity – Exercise 1(iii): Why are electric loads connected in parallel in domestic circuits? | विद्युत अभ्यास 1(iii)","q":"Why are electric loads connected in parallel in domestic circuits?","o":"1(iii)","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Exercise 1(iii).\n\n**Answer: b) To connect all loads at the same potential difference**"},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Electricity – Exercise 1(iv): 220 V, 0.5 A is written on bulb A and 220 V, 0.45 A on bulb B. Which statement is true? | विद्युत अभ्यास 1(iv)","q":"220 V, 0.5 A is written on bulb A and 220 V, 0.45 A on bulb B. Which statement is true?","o":"1(iv)","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Exercise 1(iv).\n\nUsing P = VI:\n- Bulb A: P = 220 × 0.5 = 110 W\n- Bulb B: P = 220 × 0.45 = 99 W\n\nTherefore, A transforms more energy per second than B.\n\n**Answer: b) A transforms more energy per second than B.**"},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Electricity – Exercise 1(v): Find the value of R. | विद्युत अभ्यास 1(v)","q":"Find the value of R.","o":"1(v)","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Exercise 1(v).\n\nNote: The circuit figure and options are not clearly visible in the textbook text. The solution below follows the circuit as read: total voltage 6 V, voltage across the 6 Ω resistor 3 V.\n\nI = V / R = 3 / 6 = 0.5 A\nVoltage across R: V_R = 6 − 3 = 3 V\nR = V_R / I = 3 / 0.5 = 6 Ω\n\n**Answer: 6 Ω**"},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Electricity – Exercise 1(vi): How much electric energy is transformed when a 1 kW heater is used for 1 hour? | विद्युत अभ्यास 1(vi)","q":"How much electric energy is transformed when a 1 kW heater is used for 1 hour?","o":"1(vi)","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Exercise 1(vi).\n\nE = Pt = 1 kW × 1 h = 1 kWh\n1 kWh = 3.6 × 10⁶ J\n\n**Answer: 3.6 × 10⁶ J**"},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Electricity – Exercise 2(a): Differentiate between electromotive force and potential difference. | विद्युत अभ्यास 2(a)","q":"Differentiate between electromotive force and potential difference.","o":"2(a)","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Exercise 2(a).\n\n| Electromotive Force (e.m.f.) | Potential Difference (p.d.) |\n|---|---|\n| It is the electrical energy provided by a source to one coulomb of charge. | It is the electrical energy transformed when one coulomb of charge flows through a load. |\n| It is the cause of potential difference. | It is the effect of e.m.f. |\n| It is independent of external resistance. | It depends on external resistance. |\n| It is measured by a voltmeter. | It is measured by a voltmeter. |\n| SI unit is volt (V). | SI unit is volt (V). |"},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Electricity – Exercise 2(b): Differentiate between parallel and series combination. | विद्युत अभ्यास 2(b)","q":"Differentiate between parallel and series combination.","o":"2(b)","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Exercise 2(b).\n\n| Series Combination | Parallel Combination |\n|---|---|\n| Components are connected end-to-end. | Components are connected in separate branches. |\n| There is only one path for current. | There are multiple paths for current. |\n| Same current flows through every resistor. | Current is divided among the branches. |\n| Potential difference is divided among resistors. | Same potential difference acts across each branch. |\n| If one component fails, the whole circuit stops working. | If one component fails, other components can continue working. |\n| Separate switches cannot normally be used for each load. | Separate switches can be used for each load. |\n| Used in decorative lights. | Used in domestic wiring. |"},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Electricity – Exercise 3(a): Give reason: A bulb connected in series to two cells is brighter than a bulb connected to a single cell. | विद्युत अभ्यास 3(a)","q":"Give reason: A bulb connected in series to two cells is brighter than a bulb connected to a single cell.","o":"3(a)","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Exercise 3(a).\n\nWhen two cells are connected in series, their potential differences add together. Therefore, the potential difference supplied to the bulb increases. According to P = VI, the bulb receives more electrical energy per second and produces more light."},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Electricity – Exercise 3(b): Give reason: Nichrome wire is used in the heater. | विद्युत अभ्यास 3(b)","q":"Give reason: Nichrome wire is used in the heater.","o":"3(b)","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Exercise 3(b).\n\nNichrome has **high electrical resistance and a high melting point**. It produces a large amount of heat when current passes through it and does not easily melt at high temperature. Therefore, it is suitable for heating elements."},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Electricity – Exercise 3(c): Give reason: Parallel connection of loads is used in domestic circuits. | विद्युत अभ्यास 3(c)","q":"Give reason: Parallel connection of loads is used in domestic circuits.","o":"3(c)","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Exercise 3(c).\n\nIn a parallel connection, every appliance receives the same potential difference. Also, each appliance can be operated independently, and if one appliance stops working, the others can continue working."},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Electricity – Exercise 4(a): Define electric current. | विद्युत अभ्यास 4(a)","q":"Define electric current.","o":"4(a)","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Exercise 4(a).\n\n**Electric current is the rate of flow of electric charge through a conductor.**\n\nI = Q / t, where I is current, Q is charge and t is time.\n\nIts SI unit is **ampere (A)**."},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Electricity – Exercise 4(b): What is electromotive force? Is it similar to other forces in reality? Explain. | विद्युत अभ्यास 4(b)","q":"What is electromotive force? Is it similar to other forces in reality? Explain.","o":"4(b)","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Exercise 4(b).\n\n**Electromotive force (e.m.f.) is the amount of electrical energy supplied by an electric source to each coulomb of charge to make it flow through a circuit.**\n\ne.m.f. = W / Q. Its SI unit is **volt (V)**.\n\nDespite its name, **electromotive force is not a force in the mechanical sense**. It is a measure of energy supplied per unit charge by an electrical source such as a cell or battery."},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Electricity – Exercise 4(c): Mention the meaning of 1.5 V written on a dry cell. | विद्युत अभ्यास 4(c)","q":"Mention the meaning of 1.5 V written on a dry cell.","o":"4(c)","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Exercise 4(c).\n\nA dry cell marked **1.5 V** supplies **1.5 joules of energy to each coulomb of charge**.\n\n1.5 V = 1.5 J/C"},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Electricity – Exercise 4(d): State Ohm's law and establish V = IR. | विद्युत अभ्यास 4(d)","q":"State Ohm's law and establish V = IR.","o":"4(d)","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Exercise 4(d).\n\n**Ohm's law:** At constant temperature and other physical conditions, the current flowing through a conductor is directly proportional to the potential difference across its ends.\n\nI ∝ V, therefore V / I = constant.\n\nThe constant is called resistance R. Therefore, **V = IR**."},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Electricity – Exercise 4(e): What is electric resistance? Define 1 Ω. | विद्युत अभ्यास 4(e)","q":"What is electric resistance? Define 1 Ω.","o":"4(e)","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Exercise 4(e).\n\n**Electric resistance** is the opposition offered by a conductor to the flow of electric current.\n\nR = V / I\n\nIf a potential difference of **1 V** produces a current of **1 A** through a conductor, its resistance is **1 ohm**.\n\n**1 Ω = 1 V / 1 A**"},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Electricity – Exercise 4(f): Between thick and thin wires of the same length, which has more resistance? | विद्युत अभ्यास 4(f)","q":"Between thick and thin wires of the same length, which has more resistance?","o":"4(f)","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Exercise 4(f).\n\n**A thin wire has more resistance** than a thick wire of the same length and material because the thin wire has a smaller cross-sectional area."},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Electricity – Exercise 4(g): What is meant by heating effect of electricity? Mention any two appliances. | विद्युत अभ्यास 4(g)","q":"What is meant by heating effect of electricity? Mention any two appliances.","o":"4(g)","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Exercise 4(g).\n\nThe **heating effect of electricity** is the conversion of electrical energy into heat energy when electric current passes through a resistance.\n\nExamples: electric heater, electric iron. Other examples include rice cooker, electric kettle and immersion rod."},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Electricity – Exercise 4(h): What is electric power? If a mobile phone is rated as 5 W, what does it mean? | विद्युत अभ्यास 4(h)","q":"What is electric power? If a mobile phone is rated as 5 W, what does it mean?","o":"4(h)","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Exercise 4(h).\n\n**Electric power is the amount of electrical energy transformed by an appliance per unit time.**\n\nP = E / t, also P = VI\n\nIf a mobile phone is rated **5 W**, it means that it transforms or consumes **5 joules of electrical energy per second** under the specified operating condition."},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Electricity – Exercise 4(i): Suraj removed a bulb from a circuit connected to a 3 V source, and the remaining bulbs glowed brighter. Identify the connection and give reason. Draw the circuit. | विद्युत अभ्यास 4(i)","q":"Suraj removed a bulb from a circuit connected to a 3 V source, and the remaining bulbs glowed brighter. Identify the connection and give reason. Draw the circuit.","o":"4(i)","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Exercise 4(i).\n\nThe bulbs were connected in **series**.\n\nWhen one bulb was removed, the total resistance of the circuit decreased. Therefore, the current through the remaining circuit increased, making the remaining bulbs brighter.\n\n**Series circuit:**\n```text\n     ┌──(Bulb 1)──(Bulb 2)──(Bulb 3)──┐\n     │                                  │\n     └──────────── Battery ─────────────┘\n```"},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Electricity – Exercise 4(j): Two identical bulbs, two dry cells and connecting wires are given. How do you connect them to obtain maximum light? | विद्युत अभ्यास 4(j)","q":"Two identical bulbs, two dry cells and connecting wires are given. How do you connect them to obtain maximum light?","o":"4(j)","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Exercise 4(j).\n\nTo obtain maximum light, connect the **two cells in series** and connect the **two bulbs in parallel** across the cells.\n\nThe cells in series provide a greater total e.m.f., while parallel-connected bulbs each receive the full potential difference and operate independently.\n\n```text\n   ┌────────(Bulb 1)────────┐\n   │                        │\n (+)  two cells in series  (−)\n   │                        │\n   └────────(Bulb 2)────────┘\n```"},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Electricity – Exercise 5(a): Numerical: 10 mA current is flowing. Calculate the time for 0.2 C charge. | विद्युत अभ्यास 5(a)","q":"Numerical: 10 mA current is flowing. Calculate the time for 0.2 C charge.","o":"5(a)","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Exercise 5(a).\n\nGiven: I = 10 mA = 0.01 A, Q = 0.2 C\n\nI = Q / t, so t = Q / I = 0.2 / 0.01\n\n**t = 20 s**"},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Electricity – Exercise 5(b): Numerical: 5 mA current flows for 1 minute. Calculate the charge. | विद्युत अभ्यास 5(b)","q":"Numerical: 5 mA current flows for 1 minute. Calculate the charge.","o":"5(b)","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Exercise 5(b).\n\nGiven: I = 5 mA = 0.005 A, t = 1 min = 60 s\n\nQ = It = 0.005 × 60\n\n**Q = 0.3 C**"},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Electricity – Exercise 5(c): Numerical: A torchlight is rated 3 V, 500 mA. Find power and resistance. | विद्युत अभ्यास 5(c)","q":"Numerical: A torchlight is rated 3 V, 500 mA. Find power and resistance.","o":"5(c)","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Exercise 5(c).\n\nGiven: V = 3 V, I = 500 mA = 0.5 A\n\n**Power:** P = VI = 3 × 0.5 = **1.5 W**\n\n**Resistance:** R = V / I = 3 / 0.5 = **6 Ω**\n\n**Answer: Power = 1.5 W, Resistance = 6 Ω**"},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Electricity – Exercise 5(d): Numerical: A heater (1100 W) and a CFL (11 W) are used in a 220 V domestic circuit. Find the current and resistance of each. | विद्युत अभ्यास 5(d)","q":"Numerical: A heater (1100 W) and a CFL (11 W) are used in a 220 V domestic circuit. Find the current and resistance of each.","o":"5(d)","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Exercise 5(d).\n\n**Heater** (P = 1100 W, V = 220 V)\nI = P / V = 1100 / 220 = **5 A**\nR = V / I = 220 / 5 = **44 Ω**\n\n**CFL** (P = 11 W, V = 220 V)\nI = 11 / 220 = **0.05 A**\nR = 220 / 0.05 = **4400 Ω**\n\n**Final answer:** Heater: I = 5 A, R = 44 Ω. CFL: I = 0.05 A, R = 4400 Ω."},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Electricity – Exercise 5(e): Numerical: An electric kettle is connected to a 220 V domestic supply with maximum current 13.63 A. Find its maximum power (current) and the electricity consumed in 4 minutes. | विद्युत अभ्यास 5(e)","q":"Numerical: An electric kettle is connected to a 220 V domestic supply with maximum current 13.63 A. Find its maximum power (current) and the electricity consumed in 4 minutes.","o":"5(e)","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Exercise 5(e).\n\nNote: The full wording of the question is not visible in the textbook text. The textbook answer for maximum current is 13.63 A, which corresponds to a kettle of about 3 kW on a 220 V supply.\n\n**Maximum current:** I = P / V = 3000 / 220 ≈ **13.63 A**\n\n**Electricity consumed in 4 minutes**\n4 min = 4/60 h = 1/15 h\nE = Pt = 3 kW × 1/15 h = 0.2 kWh\nSince 1 kWh = 1 unit, **E = 0.2 unit**\n\n**Answer: Maximum current = 13.63 A; electricity consumed = 0.2 unit**"},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Electricity – Exercise 5(f): Numerical: Find the monthly electricity consumption and bill (at Rs. 10 per unit) for: i. 10 LED bulbs, 7 W, 6 h/day; ii. TV, 150 W, 8 h/day; iii. 4 fans, 150 W each, 10 h/day; iv. iron, 750 W, 40 min/week. | विद्युत अभ्यास 5(f)","q":"Numerical: Find the monthly electricity consumption and bill (at Rs. 10 per unit) for: i. 10 LED bulbs, 7 W, 6 h/day; ii. TV, 150 W, 8 h/day; iii. 4 fans, 150 W each, 10 h/day; iv. iron, 750 W, 40 min/week.","o":"5(f)","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Exercise 5(f).\n\nUse E = P × n × t (kWh), 30 days a month.\n\n**i. 10 LED bulbs:** 7 W = 0.007 kW. E = 0.007 × 10 × 6 = 0.42 kWh/day. Monthly: 0.42 × 30 = **12.6 kWh**\n\n**ii. TV:** 150 W = 0.15 kW. E = 0.15 × 1 × 8 = 1.2 kWh/day. Monthly: 1.2 × 30 = **36 kWh**\n\n**iii. 4 fans:** E = 0.15 × 4 × 10 = 6 kWh/day. Monthly: 6 × 30 = **180 kWh**\n\n**iv. Iron:** 750 W = 0.75 kW, 40 min = 2/3 h. Weekly: 0.75 × 2/3 = 0.5 kWh. For about 4 weeks: **2 kWh** (using 30/7 weeks it is about 2.14 kWh)\n\n**Total monthly consumption:** 12.6 + 36 + 180 + 2 = 230.6 kWh, which is approximately **230.7 kWh** using the textbook's weekly-to-monthly convention.\n\n**Monthly bill:** 230.7 × Rs. 10 = **Rs. 2,307**\n\nNote: If the textbook prints \"Rs. 2037\", that appears to be a digit swap; the consistent bill is Rs. 2,307."},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Electricity – Project Work: Survey five households and record their electricity consumption. | विद्युत परियोजना कार्य","q":"Project Work: Survey five households and record their electricity consumption.","o":"Project Work","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Project Work.\n\nSurvey **five households** and record their electricity consumption.\n\n| House No. | Electric Load | Power (kW) | Number | Duration (h) | Consumption (kWh) |\n|---|---|---|---|---|---|\n| 1 | LED bulb | 0.007 | 5 | 6 | 0.007 × 5 × 6 = 0.21 |\n| 2 | Fan | 0.075 | 3 | 8 | 0.075 × 3 × 8 = 1.8 |\n| 3 | TV | 0.15 | 1 | 5 | 0.15 × 1 × 5 = 0.75 |\n| 4 | Rice cooker | 0.9 | 1 | 1 | 0.9 × 1 × 1 = 0.9 |\n| 5 | Iron | 0.8 | 1 | 0.5 | 0.8 × 1 × 0.5 = 0.4 |\n\n(These are sample values. The electric bill is found by multiplying the units consumed by the rate per unit.)"},{"g":"9","n":11,"c":"Electricity","a":"electricity विद्युत बिजुली ohm's law","t":"Chapter 11 Electricity – Main formulas | विद्युत","q":"","o":"","s":"","x":"Chapter: Electricity (विद्युत) – Class 9 Science. Main formulas.\n\n**Main formulas to remember (Electricity)**\n\n- I = Q / t\n- V = IR\n- P = VI\n- E = Pt\n- E = P × n × t\n- 1 unit = 1 kWh = 3.6 × 10⁶ J"},{"g":"9","n":12,"c":"The Universe","a":"the universe universe ब्रह्माण्ड brahmanda","t":"The Universe – Exercise 1(a): Which is the main element found in the nebula? | ब्रह्माण्ड अभ्यास 1(a)","q":"Which is the main element found in the nebula?","o":"1(a)","s":"","x":"Chapter: The Universe (ब्रह्माण्ड) – Class 9 Science. Exercise 1(a).\n\n**Answer: iv) Hydrogen**"},{"g":"9","n":12,"c":"The Universe","a":"the universe universe ब्रह्माण्ड brahmanda","t":"The Universe – Exercise 1(b): What is the large explosion that occurs during the death of a star called? | ब्रह्माण्ड अभ्यास 1(b)","q":"What is the large explosion that occurs during the death of a star called?","o":"1(b)","s":"","x":"Chapter: The Universe (ब्रह्माण्ड) – Class 9 Science. Exercise 1(b).\n\n**Answer: iii) Supernova**"},{"g":"9","n":12,"c":"The Universe","a":"the universe universe ब्रह्माण्ड brahmanda","t":"The Universe – Exercise 1(c): Which is the correct order for the lifecycle of a star? | ब्रह्माण्ड अभ्यास 1(c)","q":"Which is the correct order for the lifecycle of a star?","o":"1(c)","s":"","x":"Chapter: The Universe (ब्रह्माण्ड) – Class 9 Science. Exercise 1(c).\n\n**Answer: iii) Nebula → Protostar → Star → Red supergiant → Supernova → Black hole**"},{"g":"9","n":12,"c":"The Universe","a":"the universe universe ब्रह्माण्ड brahmanda","t":"The Universe – Exercise 1(d): Which fact is related to the universe? | ब्रह्माण्ड अभ्यास 1(d)","q":"Which fact is related to the universe?","o":"1(d)","s":"","x":"Chapter: The Universe (ब्रह्माण्ड) – Class 9 Science. Exercise 1(d).\n\n**Answer: ii) All matter and energy of the universe originated from a common mass.**"},{"g":"9","n":12,"c":"The Universe","a":"the universe universe ब्रह्माण्ड brahmanda","t":"The Universe – Exercise 2(a): Differentiate between protostar and star. | ब्रह्माण्ड अभ्यास 2(a)","q":"Differentiate between protostar and star.","o":"2(a)","s":"","x":"Chapter: The Universe (ब्रह्माण्ड) – Class 9 Science. Exercise 2(a).\n\n| Protostar | Star |\n|---|---|\n| It is a huge mass formed by the collection of gases and dust in a nebula. | It is a celestial body that produces its own heat and light. |\n| Nuclear fusion has not yet properly started in its core. | Nuclear fusion occurs continuously in its core. |\n| Its core is becoming hotter and denser. | Its core has sufficient temperature and pressure for nuclear fusion. |\n| It is an early stage in the life of a star. | It is the developed stage after the protostar. |"},{"g":"9","n":12,"c":"The Universe","a":"the universe universe ब्रह्माण्ड brahmanda","t":"The Universe – Exercise 2(b): Differentiate between red giant and red supergiant. | ब्रह्माण्ड अभ्यास 2(b)","q":"Differentiate between red giant and red supergiant.","o":"2(b)","s":"","x":"Chapter: The Universe (ब्रह्माण्ड) – Class 9 Science. Exercise 2(b).\n\n| Red Giant | Red Supergiant |\n|---|---|\n| It develops from a relatively smaller or ordinary star. | It develops from a very massive star. |\n| It is very large compared with its original size. | It is enormously larger than its original size. |\n| It generally results from stars of lower mass. | It results from very massive stars. |\n| It may end in a nova. | It may undergo a supernova. |"},{"g":"9","n":12,"c":"The Universe","a":"the universe universe ब्रह्माण्ड brahmanda","t":"The Universe – Exercise 2(c): Differentiate between nova and supernova. | ब्रह्माण्ड अभ्यास 2(c)","q":"Differentiate between nova and supernova.","o":"2(c)","s":"","x":"Chapter: The Universe (ब्रह्माण्ड) – Class 9 Science. Exercise 2(c).\n\n| Nova | Supernova |\n|---|---|\n| It is an explosion of the outer layer of an old star. | It is a tremendously powerful explosion of a massive star. |\n| It is comparatively less powerful. | It is extremely powerful. |\n| It occurs in relatively smaller stars. | It generally occurs in massive stars. |\n| It scatters gases and dust into space. | It scatters a huge amount of matter and energy into space. |"},{"g":"9","n":12,"c":"The Universe","a":"the universe universe ब्रह्माण्ड brahmanda","t":"The Universe – Exercise 3(a): Give reason: Nebula is also known as a stellar nursery. | ब्रह्माण्ड अभ्यास 3(a)","q":"Give reason: Nebula is also known as a stellar nursery.","o":"3(a)","s":"","x":"Chapter: The Universe (ब्रह्माण्ड) – Class 9 Science. Exercise 3(a).\n\nA nebula contains large amounts of **gas and dust**, mainly hydrogen and helium. Under gravitational force, these materials collect together and form protostars, which later become stars. Therefore, a nebula is called a **stellar nursery**."},{"g":"9","n":12,"c":"The Universe","a":"the universe universe ब्रह्माण्ड brahmanda","t":"The Universe – Exercise 3(b): Give reason: All stars are not of the same colour. | ब्रह्माण्ड अभ्यास 3(b)","q":"Give reason: All stars are not of the same colour.","o":"3(b)","s":"","x":"Chapter: The Universe (ब्रह्माण्ड) – Class 9 Science. Exercise 3(b).\n\nStars have different **temperatures and ages**. Young, very hot stars appear blue, while cooler and older stars appear yellow, orange or red. Therefore, all stars are not of the same colour."},{"g":"9","n":12,"c":"The Universe","a":"the universe universe ब्रह्माण्ड brahmanda","t":"The Universe – Exercise 3(c): Give reason: A black hole is invisible. | ब्रह्माण्ड अभ्यास 3(c)","q":"Give reason: A black hole is invisible.","o":"3(c)","s":"","x":"Chapter: The Universe (ब्रह्माण्ड) – Class 9 Science. Exercise 3(c).\n\nA black hole has an extremely strong gravitational force because a huge mass is compressed into a very small volume. Its gravitational force is so strong that **even light cannot escape from it**. Since light cannot reach our eyes from it, it appears invisible."},{"g":"9","n":12,"c":"The Universe","a":"the universe universe ब्रह्माण्ड brahmanda","t":"The Universe – Exercise 3(d): Give reason: Jupiter is also known as a failed star. | ब्रह्माण्ड अभ्यास 3(d)","q":"Give reason: Jupiter is also known as a failed star.","o":"3(d)","s":"","x":"Chapter: The Universe (ब्रह्माण्ड) – Class 9 Science. Exercise 3(d).\n\nJupiter contains mainly hydrogen and helium like stars. However, it does not have enough mass, pressure and temperature in its core to start **sustained nuclear fusion**. Therefore, it could not become a star and is sometimes described as a **failed star**."},{"g":"9","n":12,"c":"The Universe","a":"the universe universe ब्रह्माण्ड brahmanda","t":"The Universe – Exercise 4(a): What is a nebula? | ब्रह्माण्ड अभ्यास 4(a)","q":"What is a nebula?","o":"4(a)","s":"","x":"Chapter: The Universe (ब्रह्माण्ड) – Class 9 Science. Exercise 4(a).\n\nA **nebula** is a huge cloud of gases and dust particles in space. It mainly contains **hydrogen and helium**. Under gravitational force, these gases and dust particles can collect together and form protostars."},{"g":"9","n":12,"c":"The Universe","a":"the universe universe ब्रह्माण्ड brahmanda","t":"The Universe – Exercise 4(b): What is a black hole? | ब्रह्माण्ड अभ्यास 4(b)","q":"What is a black hole?","o":"4(b)","s":"","x":"Chapter: The Universe (ब्रह्माण्ड) – Class 9 Science. Exercise 4(b).\n\nA **black hole** is a highly concentrated celestial object having extremely strong gravitational force, from which even light cannot escape.\n\nAccording to the textbook, when the core of a very massive star contracts into an extremely small volume after a supernova, it can form a black hole."},{"g":"9","n":12,"c":"The Universe","a":"the universe universe ब्रह्माण्ड brahmanda","t":"The Universe – Exercise 4(c): Explain, with a figure, the life cycle of a star. | ब्रह्माण्ड अभ्यास 4(c)","q":"Explain, with a figure, the life cycle of a star.","o":"4(c)","s":"","x":"Chapter: The Universe (ब्रह्माण्ड) – Class 9 Science. Exercise 4(c).\n\nA star begins its life in a **nebula**, which contains gases and dust. Gravitational attraction brings these materials together to form a **protostar**. As its temperature and pressure increase, nuclear fusion begins and a **star** is formed.\n\nAs the star becomes older and its hydrogen decreases, it expands and becomes a **red giant** or, for a massive star, a **red supergiant**. Eventually, the star may explode as a **nova** or **supernova**. The final stage depends mainly on the mass of the star.\n\n**Life cycle**\n```text\n                 NEBULA\n                    ↓\n                PROTOSTAR\n                    ↓\n                   STAR\n                    ↓\n             ┌──────┴──────┐\n             ↓             ↓\n         RED GIANT    RED SUPERGIANT\n             ↓             ↓\n           NOVA         SUPERNOVA\n             ↓             ↓\n        WHITE DWARF    ┌────┴─────┐\n             ↓         ↓          ↓\n        BLACK DWARF  NEUTRON   BLACK HOLE\n                       STAR\n```\n\nA **neutron star** may also be observed as a **pulsar** when it continuously emits radiation."},{"g":"9","n":12,"c":"The Universe","a":"the universe universe ब्रह्माण्ड brahmanda","t":"The Universe – Exercise 4(d): Explain the death of the Sun after the fuel finishes. | ब्रह्माण्ड अभ्यास 4(d)","q":"Explain the death of the Sun after the fuel finishes.","o":"4(d)","s":"","x":"Chapter: The Universe (ब्रह्माण्ड) – Class 9 Science. Exercise 4(d).\n\nThe Sun produces energy through the nuclear fusion of hydrogen into helium in its core. As the Sun ages, the hydrogen in its core gradually decreases.\n\nWhen the hydrogen fuel in the core becomes exhausted, the Sun enters another stage of nuclear fusion and expands greatly. Its outer layers expand and the Sun becomes a **red giant**.\n\nEventually, the outer layers are lost and the remaining core becomes a **white dwarf**. Over a very long period, the white dwarf cools and becomes a **black dwarf**.\n\nTherefore, according to the textbook's simplified life-cycle model: **Sun → Red Giant → White Dwarf → Black Dwarf**"},{"g":"9","n":12,"c":"The Universe","a":"the universe universe ब्रह्माण्ड brahmanda","t":"The Universe – Exercise 4(e): Mention some scientific facts about the universe. | ब्रह्माण्ड अभ्यास 4(e)","q":"Mention some scientific facts about the universe.","o":"4(e)","s":"","x":"Chapter: The Universe (ब्रह्माण्ड) – Class 9 Science. Exercise 4(e).\n\nSome important scientific facts are:\n\n1. The universe contains **matter, energy, space and time**.\n2. The universe is continuously **expanding**.\n3. The universe is believed to have originated about **13.8 billion years ago** according to the Big Bang theory.\n4. There are numerous **galaxies** in the universe.\n5. The **Milky Way** is the galaxy containing our Solar System.\n6. The Solar System originated about **4.6 billion years ago**.\n7. Stars produce heat and light mainly through **nuclear fusion**.\n8. Stars have different sizes, colours, temperatures and ages.\n9. The **Andromeda Galaxy** is a neighbouring galaxy of the Milky Way.\n10. New discoveries about the universe continue as astronomy and technology develop."},{"g":"9","n":12,"c":"The Universe","a":"the universe universe ब्रह्माण्ड brahmanda","t":"The Universe – Exercise 4(f): Why are units such as light-year and astronomical unit used in astronomy? | ब्रह्माण्ड अभ्यास 4(f)","q":"Why are units such as light-year and astronomical unit used in astronomy?","o":"4(f)","s":"","x":"Chapter: The Universe (ब्रह्माण्ड) – Class 9 Science. Exercise 4(f).\n\nCelestial bodies are extremely far from one another. Measuring such huge distances in metres or kilometres would result in very large and inconvenient numbers.\n\nTherefore, special units are used:\n- **Astronomical Unit (AU):** average distance between the Earth and the Sun. **1 AU = 1.5 × 10¹¹ m**\n- **Light-year (ly):** distance travelled by light in one year. **1 ly = 9.46 × 10¹⁵ m**\n\nAU is mainly useful for measuring distances within the Solar System, while light-years are useful for very large distances between stars and galaxies."},{"g":"9","n":12,"c":"The Universe","a":"the universe universe ब्रह्माण्ड brahmanda","t":"The Universe – Exercise 4(g): Describe the condition of cosmological study in Nepal. | ब्रह्माण्ड अभ्यास 4(g)","q":"Describe the condition of cosmological study in Nepal.","o":"4(g)","s":"","x":"Chapter: The Universe (ब्रह्माण्ड) – Class 9 Science. Exercise 4(g).\n\nCosmological and astronomical studies in Nepal are developing gradually. The **Nepal Academy of Science and Technology (NAST)** is a national organization established to promote science and technology research in Nepal.\n\nNAST has been involved in scientific research and has worked toward promoting astronomy and space-related studies. It has also been working toward establishing a **National Space Research Centre** for astronomical research.\n\nThe development of technology, research institutions and scientific education can further increase astronomical and cosmological research in Nepal."},{"g":"9","n":12,"c":"The Universe","a":"the universe universe ब्रह्माण्ड brahmanda","t":"The Universe – Exercise 4(h): Describe the role of NASA in astronomy. | ब्रह्माण्ड अभ्यास 4(h)","q":"Describe the role of NASA in astronomy.","o":"4(h)","s":"","x":"Chapter: The Universe (ब्रह्माण्ड) – Class 9 Science. Exercise 4(h).\n\n**NASA (National Aeronautics and Space Administration)** is a major organization involved in space exploration and astronomical research.\n\nIts major roles include:\n- Launching satellites and spacecraft for scientific research.\n- Exploring planets, moons, asteroids and comets.\n- Studying the Sun and other objects in space.\n- Operating and supporting space telescopes.\n- Sending robotic missions to Mars.\n- Supporting research about the possibility of life beyond Earth.\n- Operating missions such as the **Hubble Space Telescope** and **James Webb Space Telescope**.\n\nNASA's space missions provide scientists with information that helps them understand the Solar System and the wider universe."},{"g":"9","n":13,"c":"Information and Communication Technology","a":"information and communication technology ict सूचना तथा सञ्चार प्रविधि सूचना तथा सञ्चार सूचना र सञ्चार प्रविधि","t":"Information and Communication Technology – Exercise 1(i): On which orbit does a satellite remain relatively static and revolve above the equator? | सूचना तथा सञ्चार प्रविधि अभ्यास 1(i)","q":"On which orbit does a satellite remain relatively static and revolve above the equator?","o":"1(i)","s":"","x":"Chapter: Information and Communication Technology (सूचना तथा सञ्चार प्रविधि) – Class 9 Science. Exercise 1(i).\n\n**Answer: b. Geostationary orbit**"},{"g":"9","n":13,"c":"Information and Communication Technology","a":"information and communication technology ict सूचना तथा सञ्चार प्रविधि सूचना तथा सञ्चार सूचना र सञ्चार प्रविधि","t":"Information and Communication Technology – Exercise 1(ii): Which is the similar modulation characteristic shown in the figure for radio wave transference? | सूचना तथा सञ्चार प्रविधि अभ्यास 1(ii)","q":"Which is the similar modulation characteristic shown in the figure for radio wave transference?","o":"1(ii)","s":"","x":"Chapter: Information and Communication Technology (सूचना तथा सञ्चार प्रविधि) – Class 9 Science. Exercise 1(ii).\n\n**Answer: c. Broadcasted waves are limited for a fixed distance.**"},{"g":"9","n":13,"c":"Information and Communication Technology","a":"information and communication technology ict सूचना तथा सञ्चार प्रविधि सूचना तथा सञ्चार सूचना र सञ्चार प्रविधि","t":"Information and Communication Technology – Exercise 1(iii): Which syntax is suitable to search PowerPoint presentation slides of plant tissue? | सूचना तथा सञ्चार प्रविधि अभ्यास 1(iii)","q":"Which syntax is suitable to search PowerPoint presentation slides of plant tissue?","o":"1(iii)","s":"","x":"Chapter: Information and Communication Technology (सूचना तथा सञ्चार प्रविधि) – Class 9 Science. Exercise 1(iii).\n\n**Answer: c. Plant tissue filetype:pptx**"},{"g":"9","n":13,"c":"Information and Communication Technology","a":"information and communication technology ict सूचना तथा सञ्चार प्रविधि सूचना तथा सञ्चार सूचना र सञ्चार प्रविधि","t":"Information and Communication Technology – Exercise 1(iv): What do we understand from the term email? | सूचना तथा सञ्चार प्रविधि अभ्यास 1(iv)","q":"What do we understand from the term email?","o":"1(iv)","s":"","x":"Chapter: Information and Communication Technology (सूचना तथा सञ्चार प्रविधि) – Class 9 Science. Exercise 1(iv).\n\n**Answer: b. Electronic mail**"},{"g":"9","n":13,"c":"Information and Communication Technology","a":"information and communication technology ict सूचना तथा सञ्चार प्रविधि सूचना तथा सञ्चार सूचना र सञ्चार प्रविधि","t":"Information and Communication Technology – Exercise 1(v): If a student removes a message from social media harassing a friend and feels safe, which awareness does he/she lack? | सूचना तथा सञ्चार प्रविधि अभ्यास 1(v)","q":"If a student removes a message from social media harassing a friend and feels safe, which awareness does he/she lack?","o":"1(v)","s":"","x":"Chapter: Information and Communication Technology (सूचना तथा सञ्चार प्रविधि) – Class 9 Science. Exercise 1(v).\n\n**Answer: b. Digital footprint**"},{"g":"9","n":13,"c":"Information and Communication Technology","a":"information and communication technology ict सूचना तथा सञ्चार प्रविधि सूचना तथा सञ्चार सूचना र सञ्चार प्रविधि","t":"Information and Communication Technology – Exercise 2(a): Write the differences between firewall and antivirus. | सूचना तथा सञ्चार प्रविधि अभ्यास 2(a)","q":"Write the differences between firewall and antivirus.","o":"2(a)","s":"","x":"Chapter: Information and Communication Technology (सूचना तथा सञ्चार प्रविधि) – Class 9 Science. Exercise 2(a).\n\n| Firewall | Antivirus |\n|---|---|\n| A firewall controls and blocks unauthorized network signals. | Antivirus detects, prevents and removes computer viruses. |\n| It protects the computer from unauthorized network access. | It protects the computer from harmful or infected programs/files. |\n| It mainly monitors network traffic. | It mainly scans files, programs and storage devices. |\n| Example: Windows Firewall. | Example: Windows Defender. |"},{"g":"9","n":13,"c":"Information and Communication Technology","a":"information and communication technology ict सूचना तथा सञ्चार प्रविधि सूचना तथा सञ्चार सूचना र सञ्चार प्रविधि","t":"Information and Communication Technology – Exercise 2(b): Write the differences between amplitude modulation and frequency modulation. | सूचना तथा सञ्चार प्रविधि अभ्यास 2(b)","q":"Write the differences between amplitude modulation and frequency modulation.","o":"2(b)","s":"","x":"Chapter: Information and Communication Technology (सूचना तथा सञ्चार प्रविधि) – Class 9 Science. Exercise 2(b).\n\n| Amplitude Modulation (AM) | Frequency Modulation (FM) |\n|---|---|\n| The amplitude of the carrier wave is changed according to the audio signal. | The frequency of the carrier wave is changed according to the audio signal. |\n| The frequency of the carrier wave remains constant. | The amplitude of the carrier wave remains constant. |\n| AM waves can be reflected by the ionosphere. | FM waves are not easily reflected by the ionosphere. |\n| It can cover a long distance. | Its broadcasting distance is comparatively limited. |\n| It is more affected by external environmental noise. | It is less affected by external environmental noise. |\n| Example: AM radio broadcasting. | Example: FM radio broadcasting. |"},{"g":"9","n":13,"c":"Information and Communication Technology","a":"information and communication technology ict सूचना तथा सञ्चार प्रविधि सूचना तथा सञ्चार सूचना र सञ्चार प्रविधि","t":"Information and Communication Technology – Exercise 3(a): Give reason: Many countries of the world have launched communication satellites at geostationary orbit. | सूचना तथा सञ्चार प्रविधि अभ्यास 3(a)","q":"Give reason: Many countries of the world have launched communication satellites at geostationary orbit.","o":"3(a)","s":"","x":"Chapter: Information and Communication Technology (सूचना तथा सञ्चार प्रविधि) – Class 9 Science. Exercise 3(a).\n\nCommunication satellites are launched in geostationary orbit because they revolve above the equator with the same rotational period as the Earth. Therefore, they appear relatively stationary over a particular place on Earth. This makes them suitable for continuously transmitting television, telephone, mobile and internet signals over a large area."},{"g":"9","n":13,"c":"Information and Communication Technology","a":"information and communication technology ict सूचना तथा सञ्चार प्रविधि सूचना तथा सञ्चार सूचना र सञ्चार प्रविधि","t":"Information and Communication Technology – Exercise 3(b): Give reason: To broadcast long distance, radio waves are sent to communication satellites. | सूचना तथा सञ्चार प्रविधि अभ्यास 3(b)","q":"Give reason: To broadcast long distance, radio waves are sent to communication satellites.","o":"3(b)","s":"","x":"Chapter: Information and Communication Technology (सूचना तथा सञ्चार प्रविधि) – Class 9 Science. Exercise 3(b).\n\nRadio waves are sent to communication satellites because satellites can receive signals from one place and transmit them back to a large area of the Earth. In this way, communication signals can travel very long distances beyond the direct range of ground-based transmitters."},{"g":"9","n":13,"c":"Information and Communication Technology","a":"information and communication technology ict सूचना तथा सञ्चार प्रविधि सूचना तथा सञ्चार सूचना र सञ्चार प्रविधि","t":"Information and Communication Technology – Exercise 4(a): What is Information and Communication Technology? | सूचना तथा सञ्चार प्रविधि अभ्यास 4(a)","q":"What is Information and Communication Technology?","o":"4(a)","s":"","x":"Chapter: Information and Communication Technology (सूचना तथा सञ्चार प्रविधि) – Class 9 Science. Exercise 4(a).\n\n**Information and Communication Technology (ICT)** is a technology that uses electronic devices to store, process, transmit and communicate information. Computers, mobile phones, the internet, television, telephone and satellites are examples of ICT."},{"g":"9","n":13,"c":"Information and Communication Technology","a":"information and communication technology ict सूचना तथा सञ्चार प्रविधि सूचना तथा सञ्चार सूचना र सञ्चार प्रविधि","t":"Information and Communication Technology – Exercise 4(b): How do satellites revolve around the Earth continuously without the use of energy? | सूचना तथा सञ्चार प्रविधि अभ्यास 4(b)","q":"How do satellites revolve around the Earth continuously without the use of energy?","o":"4(b)","s":"","x":"Chapter: Information and Communication Technology (सूचना तथा सञ्चार प्रविधि) – Class 9 Science. Exercise 4(b).\n\nArtificial satellites are launched into space at a suitable height and speed. They continue to revolve around the Earth because there is very little atmospheric friction at their orbital height. Therefore, they do not need additional energy for their continuous revolution. Solar energy is mainly used to operate the computers and other equipment inside the satellite."},{"g":"9","n":13,"c":"Information and Communication Technology","a":"information and communication technology ict सूचना तथा सञ्चार प्रविधि सूचना तथा सञ्चार सूचना र सञ्चार प्रविधि","t":"Information and Communication Technology – Exercise 4(c): What is the name of the first satellite of Nepal? | सूचना तथा सञ्चार प्रविधि अभ्यास 4(c)","q":"What is the name of the first satellite of Nepal?","o":"4(c)","s":"","x":"Chapter: Information and Communication Technology (सूचना तथा सञ्चार प्रविधि) – Class 9 Science. Exercise 4(c).\n\nThe first satellite of Nepal is **NepaliSat-1**."},{"g":"9","n":13,"c":"Information and Communication Technology","a":"information and communication technology ict सूचना तथा सञ्चार प्रविधि सूचना तथा सञ्चार सूचना र सञ्चार प्रविधि","t":"Information and Communication Technology – Exercise 4(d): What is telecommunication? Write examples of telecommunication technology. | सूचना तथा सञ्चार प्रविधि अभ्यास 4(d)","q":"What is telecommunication? Write examples of telecommunication technology.","o":"4(d)","s":"","x":"Chapter: Information and Communication Technology (सूचना तथा सञ्चार प्रविधि) – Class 9 Science. Exercise 4(d).\n\n**Telecommunication** is a system in which communication signals are transferred from one place to another using technologies such as wires, optical fibres and electromagnetic waves.\n\n**Examples:** telephone, fax, mobile phone, internet, radio and television broadcasting."},{"g":"9","n":13,"c":"Information and Communication Technology","a":"information and communication technology ict सूचना तथा सञ्चार प्रविधि सूचना तथा सञ्चार सूचना र सञ्चार प्रविधि","t":"Information and Communication Technology – Exercise 4(e): For what purposes do you use telecommunication technology? | सूचना तथा सञ्चार प्रविधि अभ्यास 4(e)","q":"For what purposes do you use telecommunication technology?","o":"4(e)","s":"","x":"Chapter: Information and Communication Technology (सूचना तथा सञ्चार प्रविधि) – Class 9 Science. Exercise 4(e).\n\nWe use telecommunication technology for:\n- Talking and sending messages.\n- Sending and receiving emails.\n- Online learning and searching for information.\n- Watching television and listening to radio.\n- Video calling and online meetings.\n- Online banking and digital payments.\n- Sharing files and data.\n- Using GPS and navigation.\n- Reading online newspapers and news.\n- Entertainment and social networking."},{"g":"9","n":13,"c":"Information and Communication Technology","a":"information and communication technology ict सूचना तथा सञ्चार प्रविधि सूचना तथा सञ्चार सूचना र सञ्चार प्रविधि","t":"Information and Communication Technology – Exercise 4(f): Explain the action principles of telecommunication technology with examples. | सूचना तथा सञ्चार प्रविधि अभ्यास 4(f)","q":"Explain the action principles of telecommunication technology with examples.","o":"4(f)","s":"","x":"Chapter: Information and Communication Technology (सूचना तथा सञ्चार प्रविधि) – Class 9 Science. Exercise 4(f).\n\nTelecommunication technology generally works through **three main parts: transmitter, communication channel and receiver**.\n\nFirst, information such as sound, picture or computer data is given as an input to the **transmitter**. The transmitter processes the information and converts it into a suitable communication signal. The signal is then transmitted through a **communication channel**, such as radio waves, microwaves, metallic cables or optical fibre. Finally, the **receiver** receives the signal and converts it into the required form.\n\nFor example, while making a mobile phone call, the microphone converts our voice into an electrical signal. The signal is transmitted as radio waves through the mobile network. The receiving mobile phone receives the signal and converts it back into sound.\n\n**Principle: Information → Transmitter → Communication Channel → Receiver → Information**"},{"g":"9","n":13,"c":"Information and Communication Technology","a":"information and communication technology ict सूचना तथा सञ्चार प्रविधि सूचना तथा सञ्चार सूचना र सञ्चार प्रविधि","t":"Information and Communication Technology – Exercise 4(g): Identify the modulation for broadcasting radio-wave in the given figure. Write the purpose of such a modulation. | सूचना तथा सञ्चार प्रविधि अभ्यास 4(g)","q":"Identify the modulation for broadcasting radio-wave in the given figure. Write the purpose of such a modulation.","o":"4(g)","s":"","x":"Chapter: Information and Communication Technology (सूचना तथा सञ्चार प्रविधि) – Class 9 Science. Exercise 4(g).\n\nThe modulation shown in the figure is **Amplitude Modulation (AM)** if the amplitude of the carrier wave changes while its frequency remains constant.\n\nThe purpose of AM is to transmit audio signals over long distances by changing the amplitude of a high-frequency carrier wave according to the audio signal."},{"g":"9","n":13,"c":"Information and Communication Technology","a":"information and communication technology ict सूचना तथा सञ्चार प्रविधि सूचना तथा सञ्चार सूचना र सञ्चार प्रविधि","t":"Information and Communication Technology – Exercise 4(h): \"Internet communication is a modern communication technology.\" Clarify the statement with an example. | सूचना तथा सञ्चार प्रविधि अभ्यास 4(h)","q":"\"Internet communication is a modern communication technology.\" Clarify the statement with an example.","o":"4(h)","s":"","x":"Chapter: Information and Communication Technology (सूचना तथा सञ्चार प्रविधि) – Class 9 Science. Exercise 4(h).\n\nInternet communication is a modern communication technology because it allows people to communicate quickly over long distances using computers and smartphones. We can send emails, make audio and video calls, exchange files and communicate through social media using the internet.\n\nFor example, a student in Nepal can send an email containing a document to a teacher in another country within a few seconds. Therefore, the internet has made communication faster, easier and less expensive."},{"g":"9","n":13,"c":"Information and Communication Technology","a":"information and communication technology ict सूचना तथा सञ्चार प्रविधि सूचना तथा सञ्चार सूचना र सञ्चार प्रविधि","t":"Information and Communication Technology – Exercise 4(i): How do we get knowledge and information by the use of the internet? Explain with examples. | सूचना तथा सञ्चार प्रविधि अभ्यास 4(i)","q":"How do we get knowledge and information by the use of the internet? Explain with examples.","o":"4(i)","s":"","x":"Chapter: Information and Communication Technology (सूचना तथा सञ्चार प्रविधि) – Class 9 Science. Exercise 4(i).\n\nWe can get knowledge and information from the internet by using search engines, educational websites, online libraries, videos, e-books and other online resources. Search engines such as Google, Bing and Yahoo help us find relevant information quickly.\n\nFor example, a student can search for **\"Class 9 Science notes\"** to find learning materials. We can also watch educational videos, read online books, access research materials and use online learning platforms to increase our knowledge."},{"g":"9","n":13,"c":"Information and Communication Technology","a":"information and communication technology ict सूचना तथा सञ्चार प्रविधि सूचना तथा सञ्चार सूचना र सञ्चार प्रविधि","t":"Information and Communication Technology – Exercise 4(j): What is online security? Write the ways of online security. | सूचना तथा सञ्चार प्रविधि अभ्यास 4(j)","q":"What is online security? Write the ways of online security.","o":"4(j)","s":"","x":"Chapter: Information and Communication Technology (सूचना तथा सञ्चार प्रविधि) – Class 9 Science. Exercise 4(j).\n\n**Online security** means protecting the data and information stored, shared or used through the internet from unauthorized access, misuse, theft and cyber-attacks.\n\nWays of maintaining online security include:\n1. Use strong and unique passwords.\n2. Do not share passwords with others.\n3. Check whether a website is secure before entering personal information.\n4. Avoid clicking unknown or suspicious links.\n5. Do not accept unknown people on social media.\n6. Do not share unnecessary personal or private information online.\n7. Sign out after using online accounts on another device.\n8. Keep firewall protection turned on.\n9. Use updated antivirus software.\n10. Avoid saving passwords on public or other people's computers.\n11. Be careful while using online banking and online shopping.\n12. Report cyberbullying and suspicious activities to a trusted adult or appropriate authority."},{"g":"9","n":13,"c":"Information and Communication Technology","a":"information and communication technology ict सूचना तथा सञ्चार प्रविधि सूचना तथा सञ्चार सूचना र सञ्चार प्रविधि","t":"Information and Communication Technology – Exercise 4(k): What suggestions would you like to provide for a new user of the internet who has just started online banking, online trade and using social media? Write with reasons. | सूचना तथा सञ्चार प्रविधि अभ्यास 4(k)","q":"What suggestions would you like to provide for a new user of the internet who has just started online banking, online trade and using social media? Write with reasons.","o":"4(k)","s":"","x":"Chapter: Information and Communication Technology (सूचना तथा सञ्चार प्रविधि) – Class 9 Science. Exercise 4(k).\n\nA new internet user should use strong and unique passwords and should never share passwords or OTPs with other people. Before using online banking or online shopping, the user should check that the website or application is genuine and secure. Unknown links, lottery messages and suspicious offers should not be opened because they may be used to steal personal or financial information.\n\nThe user should avoid sharing sensitive personal information, photographs and financial details unnecessarily on social media. Unknown people should not be accepted as friends without checking their identity. The user should also keep antivirus and firewall protection active and regularly update devices and applications. After using online banking or social media on another device, the user should sign out. These precautions reduce the risk of hacking, fraud, identity theft, privacy leakage and other cybercrimes."},{"g":"9","n":13,"c":"Information and Communication Technology","a":"information and communication technology ict सूचना तथा सञ्चार प्रविधि सूचना तथा सञ्चार सूचना र सञ्चार प्रविधि","t":"Information and Communication Technology – Exercise 4(l): Essay: Use of Information and Communication Technology in Education. | सूचना तथा सञ्चार प्रविधि अभ्यास 4(l)","q":"Essay: Use of Information and Communication Technology in Education.","o":"4(l)","s":"","x":"Chapter: Information and Communication Technology (सूचना तथा सञ्चार प्रविधि) – Class 9 Science. Exercise 4(l).\n\n**Use of Information and Communication Technology in Education**\n\nInformation and Communication Technology (ICT) has become an important part of modern education. Computers, smartphones, the internet, projectors, online classes and digital learning materials have made teaching and learning easier and more effective.\n\nStudents can use the internet to search for educational information, read e-books, watch educational videos and access online learning materials. Teachers can prepare digital presentations, show pictures and videos, conduct online classes and share study materials with students. ICT also makes difficult topics easier to understand through animations, simulations and interactive activities.\n\nOnline communication allows students and teachers to communicate even when they are far from each other. Email, video conferencing and educational applications can be used to send assignments, discuss lessons and receive feedback. Digital libraries also provide access to a large amount of educational material.\n\nICT saves time and provides quick access to information. It also supports self-learning because students can study materials according to their own needs and pace. However, students should use technology responsibly and avoid harmful websites, cyberbullying, misinformation and unnecessary use of social media.\n\nTherefore, ICT has greatly changed the educational system by making learning more accessible, interactive and convenient. Proper and responsible use of ICT can help improve the quality of education."},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 1(i): What is the name of the smallest part when an element is split? | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 1(i)","q":"What is the name of the smallest part when an element is split?","o":"1(i)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 1(i).\n\n**Answer: b. Atom ✓**"},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 1(ii): What is the average diameter of an atom? | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 1(ii)","q":"What is the average diameter of an atom?","o":"1(ii)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 1(ii).\n\n**Answer: a. 10⁻¹⁰ m ✓**"},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 1(iii): Which of the following is a radioactive element? | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 1(iii)","q":"Which of the following is a radioactive element?","o":"1(iii)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 1(iii).\n\n**Answer: d. All of the above ✓**\n\nUranium, plutonium and thorium are radioactive elements."},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 1(iv): Which of the following compounds consists of a covalent bond? | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 1(iv)","q":"Which of the following compounds consists of a covalent bond?","o":"1(iv)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 1(iv).\n\n**Answer: b. H₂O ✓**\n\nWater is a covalent compound."},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 1(v): Which atom has valency 3? | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 1(v)","q":"Which atom has valency 3?","o":"1(v)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 1(v).\n\n**Answer: b. Aluminium ✓**\n\nAluminium has electronic configuration **2, 8, 3**, so its valency is 3."},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 1(vi): Which is the molecular formula of magnesium bicarbonate? | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 1(vi)","q":"Which is the molecular formula of magnesium bicarbonate?","o":"1(vi)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 1(vi).\n\n**Answer: b. Mg(HCO₃)₂ ✓**"},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 2(a): Fill in the blank: There is fixed energy in the shell or orbit of an atom. The scientist who found this fact is ____. | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 2(a)","q":"Fill in the blank: There is fixed energy in the shell or orbit of an atom. The scientist who found this fact is ____.","o":"2(a)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 2(a).\n\n**Niels Bohr**"},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 2(b): Fill in the blank: The process of formation of smaller nuclei by splitting the unstable atoms having high atomic number is called ____. | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 2(b)","q":"Fill in the blank: The process of formation of smaller nuclei by splitting the unstable atoms having high atomic number is called ____.","o":"2(b)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 2(b).\n\n**Nuclear fission**"},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 2(c): Fill in the blank: To gain octet state, the number of electrons calcium loses from its valence shell is ____. | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 2(c)","q":"Fill in the blank: To gain octet state, the number of electrons calcium loses from its valence shell is ____.","o":"2(c)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 2(c).\n\n**2**"},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 2(d): Fill in the blank: In a molecule of ammonia, ____ bond is formed. | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 2(d)","q":"Fill in the blank: In a molecule of ammonia, ____ bond is formed.","o":"2(d)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 2(d).\n\n**Covalent**"},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 2(e): Fill in the blank: The molecular formula of calcium chloride is ____. | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 2(e)","q":"Fill in the blank: The molecular formula of calcium chloride is ____.","o":"2(e)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 2(e).\n\n**CaCl₂**"},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 2(f): Fill in the blank: The molecular mass of sodium bicarbonate is ____. | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 2(f)","q":"Fill in the blank: The molecular mass of sodium bicarbonate is ____.","o":"2(f)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 2(f).\n\n**84 amu**\n\nCalculation: NaHCO₃ = 23 + 1 + 12 + (3 × 16) = 23 + 1 + 12 + 48 = **84 amu**"},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 3(a): Write the differences between duplet and octet. | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 3(a)","q":"Write the differences between duplet and octet.","o":"3(a)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 3(a).\n\n| Duplet | Octet |\n|---|---|\n| The stable state having 2 electrons in the outermost shell is called duplet state. | The stable state having 8 electrons in the outermost shell is called octet state. |\n| It mainly applies to atoms having only the K-shell. | It applies to atoms having more than one shell. |\n| Helium is an example of a duplet state. | Neon and argon are examples of octet states. |\n| The K-shell becomes stable with 2 electrons. | The outermost shell becomes stable with 8 electrons. |"},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 3(b): Write the differences between electrovalent bond and covalent bond. | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 3(b)","q":"Write the differences between electrovalent bond and covalent bond.","o":"3(b)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 3(b).\n\n| Electrovalent bond | Covalent bond |\n|---|---|\n| It is formed by the transfer of electrons. | It is formed by the sharing of electrons. |\n| It is generally formed between a metal and a non-metal. | It is generally formed between non-metal atoms. |\n| Positive and negative ions are formed. | Ions are generally not formed. |\n| The bond is due to attraction between oppositely charged ions. | The bond is due to sharing of electron pairs. |\n| Example: NaCl, MgO, CaCl₂. | Example: H₂O, HCl, CH₄, NH₃. |\n| Electrovalent compounds generally have high melting and boiling points. | Covalent compounds generally have low melting and boiling points. |"},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 4(a): Give reason: Atomic energy has both boons and banes. | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 4(a)","q":"Give reason: Atomic energy has both boons and banes.","o":"4(a)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 4(a).\n\nAtomic energy has many useful applications. It can be used to generate electricity, treat diseases such as cancer, sterilize food and medical equipment, and conduct scientific research. Therefore, it is a boon.\n\nHowever, radiation from nuclear reactions can be harmful to human beings and the environment. Nuclear accidents, radiation leakage and misuse for nuclear weapons can cause serious damage. Therefore, atomic energy can also be a bane."},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 4(b): Give reason: He and Ne elements do not take part in chemical reactions. | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 4(b)","q":"Give reason: He and Ne elements do not take part in chemical reactions.","o":"4(b)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 4(b).\n\nHelium has **2 electrons** in its K-shell and neon has **8 electrons** in its outermost shell. Their outermost shells are completely filled, so they have stable duplet or octet configurations. Therefore, they normally do not gain, lose or share electrons and do not take part in chemical reactions."},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 4(c): Give reason: Methane is a covalent compound. | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 4(c)","q":"Give reason: Methane is a covalent compound.","o":"4(c)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 4(c).\n\nMethane (CH₄) is formed from one carbon atom and four hydrogen atoms. Carbon shares one electron with each of the four hydrogen atoms. Thus, four pairs of electrons are shared between carbon and hydrogen. Since the compound is formed by sharing electrons between non-metal atoms, methane is a **covalent compound**."},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 5(a): What is an atom? | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 5(a)","q":"What is an atom?","o":"5(a)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 5(a).\n\nAn **atom** is the smallest particle of an element that can take part in a chemical reaction. It consists of subatomic particles called **protons, neutrons and electrons**."},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 5(b): What do you understand by subatomic particles? | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 5(b)","q":"What do you understand by subatomic particles?","o":"5(b)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 5(b).\n\nThe particles that make up an atom are called **subatomic particles**. They are **protons, neutrons and electrons**.\n\nProtons have a positive charge and neutrons have no charge. Both are present inside the nucleus. Electrons have a negative charge and revolve around the nucleus in different shells or orbits."},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 5(c): Explain about atomic models. | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 5(c)","q":"Explain about atomic models.","o":"5(c)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 5(c).\n\nAn atomic model is a representation used to explain the structure and arrangement of particles inside an atom.\n\nAccording to the model given in this chapter, an atom consists of a central **nucleus** containing protons and neutrons. Electrons revolve around the nucleus in different shells or orbits. The shells are represented as **K, L, M, N**, etc.\n\nFor example, the electronic configuration of sodium is: **Na = 11 electrons = 2, 8, 1**\n\nThe first shell contains 2 electrons, the second contains 8 and the third contains 1 electro
