n."},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 5(d): What is radioactive emission? Write its type. | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 5(d)","q":"What is radioactive emission? Write its type.","o":"5(d)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 5(d).\n\nThe emission of energetic radiation from an unstable radioactive nucleus to attain a more stable state is called **radioactive emission**.\n\nThe three main types are:\n1. **Alpha (α) radiation**\n2. **Beta (β) radiation**\n3. **Gamma (γ) radiation**"},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 5(e): Write about nuclear fusion and nuclear fission in short. | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 5(e)","q":"Write about nuclear fusion and nuclear fission in short.","o":"5(e)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 5(e).\n\n**Nuclear fusion**\n\nThe process of combining two or more lighter nuclei to form a heavier nucleus with the release of a large amount of energy is called **nuclear fusion**.\nFor example, hydrogen nuclei combine to form helium in the **Sun and other stars**.\n**Hydrogen → Helium + Energy**\n\n**Nuclear fission**\n\nThe process of splitting a heavy and unstable nucleus into two or more smaller nuclei with the release of a large amount of energy is called **nuclear fission**.\nFor example, uranium can undergo fission when bombarded with a high-speed neutron.\n**Uranium + neutron → smaller nuclei + neutrons + energy**"},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 5(f): What is octet and duplet state? Write with an example. | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 5(f)","q":"What is octet and duplet state? Write with an example.","o":"5(f)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 5(f).\n\n**Duplet state:** The stable state of an atom having **two electrons in its K-shell** is called the duplet state.\nExample: Helium (He) has electronic configuration **2**, so it has a duplet state.\n\n**Octet state:** The stable state of an atom having **eight electrons in its outermost shell** is called the octet state.\nExample: Neon (Ne) has electronic configuration **2, 8**, so it has an octet state."},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 5(g): What is a chemical bond? | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 5(g)","q":"What is a chemical bond?","o":"5(g)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 5(g).\n\nA **chemical bond** is the force that holds atoms of elements together to form a molecule or compound.\n\nFor example, sodium and chlorine are held together by an electrovalent bond in sodium chloride (NaCl)."},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 5(h): Explain the process of formation of electrovalent bond and covalent bond with one example of each. | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 5(h)","q":"Explain the process of formation of electrovalent bond and covalent bond with one example of each.","o":"5(h)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 5(h).\n\n**Electrovalent bond**\n\nAn electrovalent bond is formed by the **transfer of electrons** from one atom to another, usually between a metal and a non-metal.\n\nFor example, sodium has electronic configuration **2,8,1**, while chlorine has **2,8,7**.\n\nSodium loses one electron: **Na → Na⁺ + e⁻**\nChlorine gains that electron: **Cl + e⁻ → Cl⁻**\n\nThe attraction between Na⁺ and Cl⁻ forms an electrovalent bond: **Na⁺ + Cl⁻ → NaCl**\n\nThus, NaCl is an electrovalent compound.\n\n**Covalent bond**\n\nA covalent bond is formed by **sharing electrons** between two or more non-metal atoms.\n\nFor example, in hydrogen chloride (HCl), hydrogen and chlorine share one electron each: **H + Cl → H—Cl**\n\nHydrogen obtains a duplet and chlorine obtains an octet. Therefore, HCl is a covalent compound."},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 5(i): Explain the process of formation of molecules of ammonia, sodium chloride and magnesium chloride with figure. | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 5(i)","q":"Explain the process of formation of molecules of ammonia, sodium chloride and magnesium chloride with figure.","o":"5(i)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 5(i).\n\n**1. Formation of ammonia (NH₃)**\n\nNitrogen has electronic configuration **2,5**, so it needs three more electrons to achieve an octet. Each hydrogen atom has one electron and needs one more electron to achieve a duplet.\n\nNitrogen shares one electron with each of three hydrogen atoms. Thus, three covalent bonds are formed.\n\n```text\n       H\n       |\n   H — N — H\n```\nTherefore, the molecular formula is **NH₃**.\n\n**2. Formation of sodium chloride (NaCl)**\n\nSodium has electronic configuration **2,8,1**, while chlorine has **2,8,7**. Sodium transfers one electron to chlorine:\n\n```text\nNa  →  Na⁺ + e⁻\nCl + e⁻ → Cl⁻\nNa⁺ + Cl⁻ → NaCl\n```\nThe attraction between Na⁺ and Cl⁻ forms the electrovalent bond.\n\n**3. Formation of magnesium chloride (MgCl₂)**\n\nMagnesium has electronic configuration **2,8,2**. It loses two electrons to become Mg²⁺. Each chlorine atom needs one electron, so two chlorine atoms receive one electron each.\n\n```text\nMg → Mg²⁺ + 2e⁻\nCl + e⁻ → Cl⁻\nCl + e⁻ → Cl⁻\nMg²⁺ + 2Cl⁻ → MgCl₂\n```\nHence, the molecular formula of magnesium chloride is **MgCl₂**."},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 5(j): Define valency. | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 5(j)","q":"Define valency.","o":"5(j)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 5(j).\n\n**Valency** is the combining capacity of an atom with another atom. It is related to the number of electrons that an atom can lose, gain or share during a chemical reaction.\n\nFor example, sodium has one valence electron and therefore has **valency 1**, while magnesium has two valence electrons and has **valency 2**."},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 5(k): What is an ion? How are positive and negative ions formed? Write with an example. | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 5(k)","q":"What is an ion? How are positive and negative ions formed? Write with an example.","o":"5(k)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 5(k).\n\nAn **ion** is an electrically charged atom or group of atoms formed when an atom gains or loses electrons.\n\n**Positive ion (cation):** When an atom **loses one or more electrons**, it becomes positively charged.\nExample: **Na → Na⁺ + e⁻**. Therefore, Na⁺ is a positive ion or cation.\n\n**Negative ion (anion):** When an atom **gains one or more electrons**, it becomes negatively charged.\nExample: **Cl + e⁻ → Cl⁻**. Therefore, Cl⁻ is a negative ion or anion."},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 5(l): How do we write molecular formulas? Explain with examples. | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 5(l)","q":"How do we write molecular formulas? Explain with examples.","o":"5(l)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 5(l).\n\nMolecular formulas can be written by using the **criss-cross method**.\n\n**Steps**\n1. Write the symbols of the elements or ions. Example: magnesium chloride → Mg Cl\n2. Write their valencies above the symbols: Mg = 2, Cl = 1\n3. Exchange the valencies by criss-crossing them. The valency of Mg becomes the subscript of Cl, and the valency of Cl becomes the subscript of Mg → Mg₁Cl₂\n4. Do not write subscript 1. Therefore: **MgCl₂**\n\n**Another example: Calcium chloride.** Ca = 2, Cl = 1 → Ca₁Cl₂ → **CaCl₂**\n\nFor polyatomic ions, brackets are used when more than one ion is required.\nExample: Calcium bicarbonate. Ca = 2, HCO₃ = 1 → **Ca(HCO₃)₂**"},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Atomic Structure and Chemical Bond – Exercise 5(m): What is molecular mass? Calculate the molecular mass of: i. sodium chloride, ii. calcium carbonate, iii. ammonia, iv. carbon dioxide, v. magnesium sulphate. | परमाणु संरचना तथा रासायनिक बन्धन अभ्यास 5(m)","q":"What is molecular mass? Calculate the molecular mass of: i. sodium chloride, ii. calcium carbonate, iii. ammonia, iv. carbon dioxide, v. magnesium sulphate.","o":"5(m)","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Exercise 5(m).\n\n**Molecular mass** is the sum of the atomic masses of all the atoms present in one molecule of a compound. It is expressed in **amu**.\n\nAtomic masses used: H = 1, C = 12, N = 14, O = 16, Na = 23, Mg = 24, S = 32, Cl = 35.5, Ca = 40 (amu).\n\n**i. Sodium chloride (NaCl):** 23 + 35.5 = **58.5 amu**\n\n**ii. Calcium carbonate (CaCO₃):** 40 + 12 + (3 × 16) = 40 + 12 + 48 = **100 amu**\n\n**iii. Ammonia (NH₃):** 14 + (3 × 1) = 14 + 3 = **17 amu**\n\n**iv. Carbon dioxide (CO₂):** 12 + (2 × 16) = 12 + 32 = **44 amu**\n\n**v. Magnesium sulphate (MgSO₄):** 24 + 32 + (4 × 16) = 24 + 32 + 64 = **120 amu**"},{"g":"9","n":14,"c":"Atomic Structure and Chemical Bond","a":"atomic structure and chemical bond atomic structure chemical bond परमाणु संरचना तथा रासायनिक बन्धन परमाणु संरचना रासायनिक बन्धन","t":"Chapter 14 Atomic Structure and Chemical Bond – Important formulas and points | परमाणु संरचना तथा रासायनिक बन्धन","q":"","o":"","s":"","x":"Chapter: Atomic Structure and Chemical Bond (परमाणु संरचना तथा रासायनिक बन्धन) – Class 9 Science. Important points.\n\n**Important points from Chapter 14**\n\n| Topic | Important point |\n|---|---|\n| Atom | Smallest particle of an element that takes part in chemical reaction |\n| Subatomic particles | Proton, neutron and electron |\n| Average diameter of atom | 10⁻¹⁰ m |\n| Duplet | 2 electrons in K-shell |\n| Octet | 8 electrons in outermost shell |\n| Valency | Combining capacity of an atom |\n| Cation | Positive ion formed by loss of electrons |\n| Anion | Negative ion formed by gain of electrons |\n| Electrovalent bond | Bond formed by transfer of electrons |\n| Covalent bond | Bond formed by sharing of electrons |\n| Nuclear fission | Splitting of a heavy nucleus |\n| Nuclear fusion | Combining of lighter nuclei |\n| Radioactive emissions | α, β and γ |\n| NaCl molecular mass | 58.5 amu |\n| CaCO₃ molecular mass | 100 amu |\n| NH₃ molecular mass | 17 amu |\n| CO₂ molecular mass | 44 amu |\n| MgSO₄ molecular mass | 120 amu |"},{"g":"9","n":15,"c":"Chemical Reaction","a":"chemical reaction chemical reactions रासायनिक प्रतिक्रिया रासायनिक अभिक्रिया","t":"Chemical Reaction – Exercise 1(i): Which group provides examples of chemical change only? | रासायनिक प्रतिक्रिया अभ्यास 1(i)","q":"Which group provides examples of chemical change only?","o":"1(i)","s":"","x":"Chapter: Chemical Reaction (रासायनिक प्रतिक्रिया) – Class 9 Science. Exercise 1(i).\n\n**Answer: c. Cooking rice from rice, decaying dead animals, and digestion of food in the stomach**\n\nAll three processes form new substances, so they are chemical changes."},{"g":"9","n":15,"c":"Chemical Reaction","a":"chemical reaction chemical reactions रासायनिक प्रतिक्रिया रासायनिक अभिक्रिया","t":"Chemical Reaction – Exercise 1(ii): What occurs during a chemical reaction? | रासायनिक प्रतिक्रिया अभ्यास 1(ii)","q":"What occurs during a chemical reaction?","o":"1(ii)","s":"","x":"Chapter: Chemical Reaction (रासायनिक प्रतिक्रिया) – Class 9 Science. Exercise 1(ii).\n\nA chemical reaction may involve **exchange of atoms, association of atoms, and dissociation of molecules**.\n\n**Answer: d. A, B and C**"},{"g":"9","n":15,"c":"Chemical Reaction","a":"chemical reaction chemical reactions रासायनिक प्रतिक्रिया रासायनिक अभिक्रिया","t":"Chemical Reaction – Exercise 1(iii): What are the reactants in the incomplete reaction Zn + HCl → ZnCl₂ + H₂? | रासायनिक प्रतिक्रिया अभ्यास 1(iii)","q":"What are the reactants in the incomplete reaction Zn + HCl → ZnCl₂ + H₂?","o":"1(iii)","s":"","x":"Chapter: Chemical Reaction (रासायनिक प्रतिक्रिया) – Class 9 Science. Exercise 1(iii).\n\nThe reactants are zinc and hydrochloric acid.\n\n**Answer: d. Zinc and hydrochloric acid**"},{"g":"9","n":15,"c":"Chemical Reaction","a":"chemical reaction chemical reactions रासायनिक प्रतिक्रिया रासायनिक अभिक्रिया","t":"Chemical Reaction – Exercise 1(iv): Why does excessive heating occur when A and B are mixed? | रासायनिक प्रतिक्रिया अभ्यास 1(iv)","q":"Why does excessive heating occur when A and B are mixed?","o":"1(iv)","s":"","x":"Chapter: Chemical Reaction (रासायनिक प्रतिक्रिया) – Class 9 Science. Exercise 1(iv).\n\n**Answer: a. Due to exothermic reaction**\n\nAn exothermic reaction releases heat."},{"g":"9","n":15,"c":"Chemical Reaction","a":"chemical reaction chemical reactions रासायनिक प्रतिक्रिया रासायनिक अभिक्रिया","t":"Chemical Reaction – Exercise 2(a): Differentiate between balanced and unbalanced chemical equation. | रासायनिक प्रतिक्रिया अभ्यास 2(a)","q":"Differentiate between balanced and unbalanced chemical equation.","o":"2(a)","s":"","x":"Chapter: Chemical Reaction (रासायनिक प्रतिक्रिया) – Class 9 Science. Exercise 2(a).\n\n| Balanced chemical equation | Unbalanced chemical equation |\n|---|---|\n| Number of atoms of each element is equal on both sides. | Number of atoms of one or more elements is not equal on both sides. |\n| It follows the law of conservation of mass. | It does not yet satisfy the law of conservation of mass. |\n| Example: 2Mg + O₂ → 2MgO | Example: Mg + O₂ → MgO |"},{"g":"9","n":15,"c":"Chemical Reaction","a":"chemical reaction chemical reactions रासायनिक प्रतिक्रिया रासायनिक अभिक्रिया","t":"Chemical Reaction – Exercise 2(b): Differentiate between endothermic and exothermic chemical reaction. | रासायनिक प्रतिक्रिया अभ्यास 2(b)","q":"Differentiate between endothermic and exothermic chemical reaction.","o":"2(b)","s":"","x":"Chapter: Chemical Reaction (रासायनिक प्रतिक्रिया) – Class 9 Science. Exercise 2(b).\n\n| Endothermic reaction | Exothermic reaction |\n|---|---|\n| Absorbs heat from the surroundings. | Releases heat to the surroundings. |\n| Surroundings may become cooler. | Surroundings may become hotter. |\n| Example: CaCO₃ → CaO + CO₂ | Example: CaO + H₂O → Ca(OH)₂ + heat |\n| Cooking food involves endothermic chemical processes. | Combustion of fuel is exothermic. |"},{"g":"9","n":15,"c":"Chemical Reaction","a":"chemical reaction chemical reactions रासायनिक प्रतिक्रिया रासायनिक अभिक्रिया","t":"Chemical Reaction – Exercise 3(a): How does chemical change differ from physical change? | रासायनिक प्रतिक्रिया अभ्यास 3(a)","q":"How does chemical change differ from physical change?","o":"3(a)","s":"","x":"Chapter: Chemical Reaction (रासायनिक प्रतिक्रिया) – Class 9 Science. Exercise 3(a).\n\nA **physical change** is a change in which no new substance is formed. Usually, only the physical state, shape, size, or appearance of a substance changes. For example, melting of ice into water is a physical change.\n\nA **chemical change** is a change in which one or more new substances with different properties are formed. For example, rusting of iron and formation of curd from milk are chemical changes."},{"g":"9","n":15,"c":"Chemical Reaction","a":"chemical reaction chemical reactions रासायनिक प्रतिक्रिया रासायनिक अभिक्रिया","t":"Chemical Reaction – Exercise 3(b): What is a chemical equation? Clarify with an example. | रासायनिक प्रतिक्रिया अभ्यास 3(b)","q":"What is a chemical equation? Clarify with an example.","o":"3(b)","s":"","x":"Chapter: Chemical Reaction (रासायनिक प्रतिक्रिया) – Class 9 Science. Exercise 3(b).\n\nA **chemical equation** is the representation of a chemical reaction using the symbols and formulae of the reactants and products.\n\nFor example:\n**Zinc + Hydrochloric acid → Zinc chloride + Hydrogen**\n\nFormula equation: **Zn + 2HCl → ZnCl₂ + H₂**\n\nHere, Zn and HCl are the **reactants**, while ZnCl₂ and H₂ are the **products**."},{"g":"9","n":15,"c":"Chemical Reaction","a":"chemical reaction chemical reactions रासायनिक प्रतिक्रिया रासायनिक अभिक्रिया","t":"Chemical Reaction – Exercise 3(c): \"Our daily life was nearly impossible if there was no chemical reaction.\" Explain. | रासायनिक प्रतिक्रिया अभ्यास 3(c)","q":"\"Our daily life was nearly impossible if there was no chemical reaction.\" Explain.","o":"3(c)","s":"","x":"Chapter: Chemical Reaction (रासायनिक प्रतिक्रिया) – Class 9 Science. Exercise 3(c).\n\nChemical reactions are essential for our daily life. Digestion of food in our stomach occurs through chemical reactions. Respiration produces energy through chemical reactions. Plants prepare food by photosynthesis. Medicines work through chemical reactions in our bodies. Milk changes into curd through a chemical reaction, and fuels produce energy by combustion. Cooking food and many industrial processes also involve chemical reactions. Therefore, our daily life would be nearly impossible without chemical reactions."},{"g":"9","n":15,"c":"Chemical Reaction","a":"chemical reaction chemical reactions रासायनिक प्रतिक्रिया रासायनिक अभिक्रिया","t":"Chemical Reaction – Exercise 3(d): A person is cooking food in an oven by using firewood. Which are exothermic and endothermic chemical reactions? | रासायनिक प्रतिक्रिया अभ्यास 3(d)","q":"A person is cooking food in an oven by using firewood. Which are exothermic and endothermic chemical reactions?","o":"3(d)","s":"","x":"Chapter: Chemical Reaction (रासायनिक प्रतिक्रिया) – Class 9 Science. Exercise 3(d).\n\nThe **burning of firewood** is an **exothermic reaction** because it releases heat.\n\nThe **cooking of food** is an **endothermic process** because the food absorbs heat during cooking and chemical changes occur in it.\n\nTherefore:\n- Burning firewood → Exothermic reaction\n- Cooking food → Endothermic process"},{"g":"9","n":15,"c":"Chemical Reaction","a":"chemical reaction chemical reactions रासायनिक प्रतिक्रिया रासायनिक अभिक्रिया","t":"Chemical Reaction – Exercise 4: Change the following word equations into formula equations: a. Nitrogen + Hydrogen → Ammonia; b. Sodium + Oxygen → Sodium oxide; c. Magnesium + Nitrogen → Magnesium nitride; d. Calcium carbonate → Calcium oxide + Carbon dioxide; e. Zinc + Hydrochloric acid → Zinc chloride + Hydrogen; f. Aluminium + Nitrogen → Aluminium nitride; g. Potassium + Chlorine → Potassium chloride; h. Hydrogen + Chlorine → Hydrogen chloride | रासायनिक प्रतिक्रिया अभ्यास 4","q":"Change the following word equations into formula equations: a. Nitrogen + Hydrogen → Ammonia; b. Sodium + Oxygen → Sodium oxide; c. Magnesium + Nitrogen → Magnesium nitride; d. Calcium carbonate → Calcium oxide + Carbon dioxide; e. Zinc + Hydrochloric acid → Zinc chloride + Hydrogen; f. Aluminium + Nitrogen → Aluminium nitride; g. Potassium + Chlorine → Potassium chloride; h. Hydrogen + Chlorine → Hydrogen chloride","o":"4","s":"","x":"Chapter: Chemical Reaction (रासायनिक प्रतिक्रिया) – Class 9 Science. Exercise 4.\n\n**a.** N₂ + 3H₂ → 2NH₃\n**b.** 4Na + O₂ → 2Na₂O\n**c.** 3Mg + N₂ → Mg₃N₂\n**d.** CaCO₃ → CaO + CO₂\n**e.** Zn + 2HCl → ZnCl₂ + H₂\n**f.** 2Al + N₂ → 2AlN\n**g.** 2K + Cl₂ → 2KCl\n**h.** H₂ + Cl₂ → 2HCl"},{"g":"9","n":15,"c":"Chemical Reaction","a":"chemical reaction chemical reactions रासायनिक प्रतिक्रिया रासायनिक अभिक्रिया","t":"Chemical Reaction – Exercise 5: Write balanced formula equations: a. Na + O₂ → Na₂O; b. Hg + O₂ → HgO; c. Ca + N₂ → Ca₃N₂; d. Fe + O₂ → Fe₂O₃; e. Fe + CuSO₄ → FeSO₄ + Cu; f. HCl + NaOH → NaCl + H₂O; g. HCl + KOH → KCl + H₂O; h. HNO₃ + Ca(OH)₂ → Ca(NO₃)₂ + H₂O | रासायनिक प्रतिक्रिया अभ्यास 5","q":"Write balanced formula equations: a. Na + O₂ → Na₂O; b. Hg + O₂ → HgO; c. Ca + N₂ → Ca₃N₂; d. Fe + O₂ → Fe₂O₃; e. Fe + CuSO₄ → FeSO₄ + Cu; f. HCl + NaOH → NaCl + H₂O; g. HCl + KOH → KCl + H₂O; h. HNO₃ + Ca(OH)₂ → Ca(NO₃)₂ + H₂O","o":"5","s":"","x":"Chapter: Chemical Reaction (रासायनिक प्रतिक्रिया) – Class 9 Science. Exercise 5.\n\n**a.** 4Na + O₂ → 2Na₂O\n**b.** 2Hg + O₂ → 2HgO\n**c.** 3Ca + N₂ → Ca₃N₂\n**d.** 4Fe + 3O₂ → 2Fe₂O₃\n**e.** Fe + CuSO₄ → FeSO₄ + Cu (already balanced)\n**f.** HCl + NaOH → NaCl + H₂O (already balanced)\n**g.** HCl + KOH → KCl + H₂O (already balanced)\n**h.** 2HNO₃ + Ca(OH)₂ → Ca(NO₃)₂ + 2H₂O"},{"g":"9","n":15,"c":"Chemical Reaction","a":"chemical reaction chemical reactions रासायनिक प्रतिक्रिया रासायनिक अभिक्रिया","t":"Chemical Reaction – Exercise 6: Complete and balance the following equations: a. Fe + HCl → ___ + H₂; b. HCl + ___ → NaCl + H₂O; c. H₂SO₄ + NaOH → ___ + H₂O; d. Na + O₂ → Na₂O; e. Ca + O₂ → ___; f. ___ + O₂ → HgO; g. Fe + ___ → Fe₂O₃; h. ___ + Ca(OH)₂ → Ca(NO₃)₂ + H₂O; i. Al + N₂ → ___ | रासायनिक प्रतिक्रिया अभ्यास 6","q":"Complete and balance the following equations: a. Fe + HCl → ___ + H₂; b. HCl + ___ → NaCl + H₂O; c. H₂SO₄ + NaOH → ___ + H₂O; d. Na + O₂ → Na₂O; e. Ca + O₂ → ___; f. ___ + O₂ → HgO; g. Fe + ___ → Fe₂O₃; h. ___ + Ca(OH)₂ → Ca(NO₃)₂ + H₂O; i. Al + N₂ → ___","o":"6","s":"","x":"Chapter: Chemical Reaction (रासायनिक प्रतिक्रिया) – Class 9 Science. Exercise 6.\n\n**a.** Fe + 2HCl → FeCl₂ + H₂ (iron reacts with hydrochloric acid to form iron(II) chloride and hydrogen)\n**b.** HCl + NaOH → NaCl + H₂O (missing reactant: NaOH)\n**c.** H₂SO₄ + 2NaOH → Na₂SO₄ + 2H₂O (missing product: Na₂SO₄)\n**d.** 4Na + O₂ → 2Na₂O\n**e.** 2Ca + O₂ → 2CaO (product: calcium oxide)\n**f.** 2Hg + O₂ → 2HgO (missing reactant: mercury)\n**g.** 4Fe + 3O₂ → 2Fe₂O₃ (missing reactant: oxygen)\n**h.** 2HNO₃ + Ca(OH)₂ → Ca(NO₃)₂ + 2H₂O (missing reactant: nitric acid)\n**i.** 2Al + N₂ → 2AlN (product: aluminium nitride)"},{"g":"9","n":15,"c":"Chemical Reaction","a":"chemical reaction chemical reactions रासायनिक प्रतिक्रिया रासायनिक अभिक्रिया","t":"Chapter 15 Chemical Reaction – Important points to remember | रासायनिक प्रतिक्रिया","q":"","o":"","s":"","x":"Chapter: Chemical Reaction (रासायनिक प्रतिक्रिया) – Class 9 Science. Important points.\n\n**Important points to remember (Chemical Reaction)**\n\n- **Chemical reaction:** A process in which reactants change into new substances called products.\n- **Reactants:** Substances that take part in a chemical reaction.\n- **Products:** New substances formed after a chemical reaction.\n- **Chemical equation:** Representation of a chemical reaction using symbols and formulae.\n- **Balanced equation:** Equal number of atoms of each element on both sides.\n- **Exothermic reaction:** Reaction that releases heat.\n- **Endothermic reaction:** Reaction that absorbs heat.\n- **Law of conservation of mass:** Matter is neither created nor destroyed during a chemical reaction."},{"g":"9","n":16,"c":"Gas","a":"gas gases ग्यास ग्याँस ग्यास","t":"Gas – Exercise 1(a): Which compound is heated to obtain oxygen gas in the laboratory? | ग्यास अभ्यास 1(a)","q":"Which compound is heated to obtain oxygen gas in the laboratory?","o":"1(a)","s":"","x":"Chapter: Gas (ग्यास) – Class 9 Science. Exercise 1(a).\n\nThe compound heated is potassium chlorate, KClO₃, in the presence of manganese dioxide.\n\n**Answer: i. KClO₃**"},{"g":"9","n":16,"c":"Gas","a":"gas gases ग्यास ग्याँस ग्यास","t":"Gas – Exercise 1(b): Which compound is formed when magnesium is burnt with oxygen? | ग्यास अभ्यास 1(b)","q":"Which compound is formed when magnesium is burnt with oxygen?","o":"1(b)","s":"","x":"Chapter: Gas (ग्यास) – Class 9 Science. Exercise 1(b).\n\nMagnesium burns in oxygen to form magnesium oxide. 2Mg + O₂ → 2MgO\n\n**Answer: iii. Magnesium oxide**"},{"g":"9","n":16,"c":"Gas","a":"gas gases ग्यास ग्याँस ग्यास","t":"Gas – Exercise 1(c): When dry hydrogen is passed into hot metallic oxide, metal and water are formed. What is this process called? | ग्यास अभ्यास 1(c)","q":"When dry hydrogen is passed into hot metallic oxide, metal and water are formed. What is this process called?","o":"1(c)","s":"","x":"Chapter: Gas (ग्यास) – Class 9 Science. Exercise 1(c).\n\nHydrogen removes oxygen from the metallic oxide.\n\n**Answer: ii. Reduction**"},{"g":"9","n":16,"c":"Gas","a":"gas gases ग्यास ग्याँस ग्यास","t":"Gas – Exercise 1(d): Which is the main gas that depletes the ozone layer? | ग्यास अभ्यास 1(d)","q":"Which is the main gas that depletes the ozone layer?","o":"1(d)","s":"","x":"Chapter: Gas (ग्यास) – Class 9 Science. Exercise 1(d).\n\n**Answer: i. Chlorofluorocarbon (CFC)**"},{"g":"9","n":16,"c":"Gas","a":"gas gases ग्यास ग्याँस ग्यास","t":"Gas – Exercise 1(e): Which compound fits in the blank? C₆H₁₂O₆ + 6O₂ → ____ + 6H₂O + energy | ग्यास अभ्यास 1(e)","q":"Which compound fits in the blank? C₆H₁₂O₆ + 6O₂ → ____ + 6H₂O + energy","o":"1(e)","s":"","x":"Chapter: Gas (ग्यास) – Class 9 Science. Exercise 1(e).\n\nThe product is carbon dioxide.\n\n**Answer: ii. CO₂**"},{"g":"9","n":16,"c":"Gas","a":"gas gases ग्यास ग्याँस ग्यास","t":"Gas – Exercise 2(a): Give reason: Ozone layer is called a protective layer. | ग्यास अभ्यास 2(a)","q":"Give reason: Ozone layer is called a protective layer.","o":"2(a)","s":"","x":"Chapter: Gas (ग्यास) – Class 9 Science. Exercise 2(a).\n\nThe ozone layer is called a protective layer because it absorbs most of the harmful ultraviolet (UV) radiation coming from the Sun. This prevents excessive UV radiation from reaching the Earth's surface and protects humans, animals, plants and ecosystems from harmful effects."},{"g":"9","n":16,"c":"Gas","a":"gas gases ग्यास ग्याँस ग्यास","t":"Gas – Exercise 2(b): Give reason: Hydrogen and oxygen gas are collected by water displacement method. | ग्यास अभ्यास 2(b)","q":"Give reason: Hydrogen and oxygen gas are collected by water displacement method.","o":"2(b)","s":"","x":"Chapter: Gas (ग्यास) – Class 9 Science. Exercise 2(b).\n\nHydrogen and oxygen are collected by the water displacement method because they are only slightly soluble or practically insoluble in water. Therefore, they can be collected in a gas jar by displacing water without significant loss of gas."},{"g":"9","n":16,"c":"Gas","a":"gas gases ग्यास ग्याँस ग्यास","t":"Gas – Exercise 2(c): Give reason: The rate of melting ice in mountains is increasing. | ग्यास अभ्यास 2(c)","q":"Give reason: The rate of melting ice in mountains is increasing.","o":"2(c)","s":"","x":"Chapter: Gas (ग्यास) – Class 9 Science. Exercise 2(c).\n\nThe melting of mountain ice is increasing mainly because of the rise in Earth's average temperature due to global warming. Increased greenhouse gases trap more heat in the atmosphere, causing glaciers and snow to melt faster."},{"g":"9","n":16,"c":"Gas","a":"gas gases ग्यास ग्याँस ग्यास","t":"Gas – Exercise 3(a): Write the chemical equation used in laboratory preparation of hydrogen gas. | ग्यास अभ्यास 3(a)","q":"Write the chemical equation used in laboratory preparation of hydrogen gas.","o":"3(a)","s":"","x":"Chapter: Gas (ग्यास) – Class 9 Science. Exercise 3(a).\n\nHydrogen is prepared by reacting granulated zinc with dilute hydrochloric acid.\n\n**Zn + 2HCl → ZnCl₂ + H₂↑**\n\nZinc + Hydrochloric acid → Zinc chloride + Hydrogen"},{"g":"9","n":16,"c":"Gas","a":"gas gases ग्यास ग्याँस ग्यास","t":"Gas – Exercise 3(b): Draw a diagram of laboratory preparation of hydrogen gas and write the procedure stepwise. | ग्यास अभ्यास 3(b)","q":"Draw a diagram of laboratory preparation of hydrogen gas and write the procedure stepwise.","o":"3(b)","s":"","x":"Chapter: Gas (ग्यास) – Class 9 Science. Exercise 3(b).\n\n**Diagram**\n```text\n                    Thistle funnel\n                         │\n                         │\n                    Dil. HCl\n                         ↓\n                 ┌─────────────┐\n                 │   Woulff's  │\n                 │   bottle    │\n                 │ Zn + HCl    │\n                 └──────┬──────┘\n                        │\n                  Delivery tube\n                        │\n                        ↓\n                  ┌───────────┐\n                  │ Beehive   │\n                  │  shelf    │\n                  └─────┬─────┘\n                        │\n                 ┌──────┴──────┐\n                 │   H₂ gas    │\n                 │   gas jar   │\n                 └─────────────┘\n                     Water trough\n```\n\n**Procedure**\n1. Put some granulated zinc pieces into a clean Woulff's bottle.\n2. Fit a thistle funnel into one opening and a delivery tube into another opening.\n3. Make the apparatus airtight using corks.\n4. Place the end of the delivery tube under the water on the beehive shelf.\n5. Fill a gas jar completely with water and invert it over the beehive shelf.\n6. Pour dilute hydrochloric acid slowly through the thistle funnel.\n7. Hydrogen gas is produced when zinc reacts with hydrochloric acid.\n8. Collect the hydrogen gas in the gas jar by downward displacement of water.\n\n**Equation: Zn + 2HCl → ZnCl₂ + H₂↑**"},{"g":"9","n":16,"c":"Gas","a":"gas gases ग्यास ग्याँस ग्यास","t":"Gas – Exercise 3(c): Write any four physical properties and any four uses of hydrogen. | ग्यास अभ्यास 3(c)","q":"Write any four physical properties and any four uses of hydrogen.","o":"3(c)","s":"","x":"Chapter: Gas (ग्यास) – Class 9 Science. Exercise 3(c).\n\n**Physical properties of hydrogen**\n1. Hydrogen is a **colourless, odourless and tasteless** gas.\n2. It is **lighter than air**.\n3. It is **almost insoluble in water**.\n4. It is a **neutral gas** and does not affect litmus paper.\n\n**Uses of hydrogen**\n1. It is used to obtain metals from their metallic oxides.\n2. It is used to manufacture ammonia by the Haber process.\n3. It is used to convert vegetable oil into vegetable ghee by hydrogenation.\n4. It is used as a fuel in rockets."},{"g":"9","n":16,"c":"Gas","a":"gas gases ग्यास ग्याँस ग्यास","t":"Gas – Exercise 3(d): How do you identify hydrogen gas contained in a gas jar? | ग्यास अभ्यास 3(d)","q":"How do you identify hydrogen gas contained in a gas jar?","o":"3(d)","s":"","x":"Chapter: Gas (ग्यास) – Class 9 Science. Exercise 3(d).\n\nTake a burning candle or burning splint near the mouth of the gas jar. Hydrogen burns with a **blue flame and produces a characteristic \"pop\" sound**.\n\nTherefore, the pop sound confirms the presence of hydrogen gas.\n\n**Test: 2H₂ + O₂ → 2H₂O**"},{"g":"9","n":16,"c":"Gas","a":"gas gases ग्यास ग्याँस ग्यास","t":"Gas – Exercise 3(e): Which compounds are formed when the following substances react with hydrogen? i. Sodium, ii. Oxygen, iii. Calcium, iv. Ferric oxide | ग्यास अभ्यास 3(e)","q":"Which compounds are formed when the following substances react with hydrogen? i. Sodium, ii. Oxygen, iii. Calcium, iv. Ferric oxide","o":"3(e)","s":"","x":"Chapter: Gas (ग्यास) – Class 9 Science. Exercise 3(e).\n\n**i. Sodium:** forms **sodium hydride**. 2Na + H₂ → 2NaH\n\n**ii. Oxygen:** forms **water**. 2H₂ + O₂ → 2H₂O\n\n**iii. Calcium:** forms **calcium hydride**. Ca + H₂ → CaH₂\n\n**iv. Ferric oxide:** is reduced to **iron**, and water is formed. Fe₂O₃ + 3H₂ → 2Fe + 3H₂O"},{"g":"9","n":16,"c":"Gas","a":"gas gases ग्यास ग्याँस ग्यास","t":"Gas – Exercise 3(f): Explain the method of preparation of oxygen without heating in the laboratory with a diagram. | ग्यास अभ्यास 3(f)","q":"Explain the method of preparation of oxygen without heating in the laboratory with a diagram.","o":"3(f)","s":"","x":"Chapter: Gas (ग्यास) – Class 9 Science. Exercise 3(f).\n\nOxygen can be prepared without heating by decomposing hydrogen peroxide in the presence of manganese dioxide.\n\n**Chemical equation: 2H₂O₂ —(MnO₂)→ 2H₂O + O₂↑**\n\n**Diagram**\n```text\n             Thistle funnel\n                  │\n            H₂O₂   ↓\n                  │\n          ┌──────────────┐\n          │  Conical     │\n          │   flask      │\n          │    MnO₂      │\n          └──────┬───────┘\n                 │\n           Delivery tube\n                 │\n                 ↓\n          ┌──────────────┐\n          │ Beehive shelf│\n          └──────┬───────┘\n                 │\n          ┌──────┴───────┐\n          │   O₂ gas     │\n          │   Gas jar    │\n          └──────────────┘\n              Water trough\n```\n\n**Procedure**\n1. Put pure manganese dioxide into a clean conical flask.\n2. Fit the thistle funnel and delivery tube to the flask.\n3. Make the apparatus airtight.\n4. Pour hydrogen peroxide slowly through the thistle funnel.\n5. Hydrogen peroxide decomposes in the presence of manganese dioxide.\n6. Oxygen gas is produced.\n7. Collect the oxygen gas in a gas jar by downward displacement of water."},{"g":"9","n":16,"c":"Gas","a":"gas gases ग्यास ग्याँस ग्यास","t":"Gas – Exercise 3(g): Explain the method of preparation of oxygen by heating in the laboratory with a diagram. | ग्यास अभ्यास 3(g)","q":"Explain the method of preparation of oxygen by heating in the laboratory with a diagram.","o":"3(g)","s":"","x":"Chapter: Gas (ग्यास) – Class 9 Science. Exercise 3(g).\n\nOxygen is prepared by heating potassium chlorate in the presence of manganese dioxide.\n\n**Chemical equation: 2KClO₃ —(MnO₂, heat)→ 2KCl + 3O₂↑**\n\n**Diagram**\n```text\n             Heat\n              *\n               ↓\n        ┌──────────────┐\n        │ Hard glass   │\n        │ test tube    │\n        │ KClO₃ + MnO₂│\n        └──────┬───────┘\n               │\n        Delivery tube\n               │\n               ↓\n        ┌──────────────┐\n        │ Beehive shelf│\n        └──────┬───────┘\n               │\n        ┌──────┴───────┐\n        │    O₂ gas    │\n        │   Gas jar    │\n        └──────────────┘\n             Water\n```\n\n**Procedure**\n1. Take potassium chlorate and manganese dioxide in a clean hard-glass test tube.\n2. Fit a delivery tube and make the apparatus airtight.\n3. Keep the test tube slightly tilted.\n4. Place the other end of the delivery tube under water on a beehive shelf.\n5. Fill a gas jar completely with water and invert it over the beehive shelf.\n6. Heat the mixture gently.\n7. Oxygen gas is produced and collected in the gas jar by displacement of water."},{"g":"9","n":16,"c":"Gas","a":"gas gases ग्यास ग्याँस ग्यास","t":"Gas – Exercise 3(h): Write any four physical properties and four uses of oxygen. | ग्यास अभ्यास 3(h)","q":"Write any four physical properties and four uses of oxygen.","o":"3(h)","s":"","x":"Chapter: Gas (ग्यास) – Class 9 Science. Exercise 3(h).\n\n**Physical properties**\n1. Oxygen is **colourless, odourless and tasteless**.\n2. It is **slightly heavier than air**.\n3. It is **partially soluble in water**.\n4. It is a **neutral gas** and does not affect litmus paper.\n\n**Uses**\n1. Living beings use oxygen for **respiration**.\n2. It is used for **welding and cutting metals**.\n3. It is used for **artificial respiration** for patients having difficulty breathing.\n4. It is used in the **manufacture of steel**."},{"g":"9","n":16,"c":"Gas","a":"gas gases ग्यास ग्याँस ग्यास","t":"Gas – Exercise 3(i): How do you identify oxygen gas contained in a gas jar? | ग्यास अभ्यास 3(i)","q":"How do you identify oxygen gas contained in a gas jar?","o":"3(i)","s":"","x":"Chapter: Gas (ग्यास) – Class 9 Science. Exercise 3(i).\n\nInsert a **glowing splint or burning candle** into the gas jar.\n\nThe flame burns **more brightly** in oxygen because oxygen supports combustion.\n\nTherefore, the gas is identified as oxygen."},{"g":"9","n":16,"c":"Gas","a":"gas gases ग्यास ग्याँस ग्यास","t":"Gas – Exercise 3(j): Which compounds are formed when the following substances react with oxygen? i. Magnesium, ii. Carbon, iii. Methane, iv. Glucose | ग्यास अभ्यास 3(j)","q":"Which compounds are formed when the following substances react with oxygen? i. Magnesium, ii. Carbon, iii. Methane, iv. Glucose","o":"3(j)","s":"","x":"Chapter: Gas (ग्यास) – Class 9 Science. Exercise 3(j).\n\n**i. Magnesium:** forms **magnesium oxide**. 2Mg + O₂ → 2MgO\n\n**ii. Carbon:** forms **carbon dioxide**. C + O₂ → CO₂\n\n**iii. Methane:** forms **carbon dioxide and water**. CH₄ + 2O₂ → CO₂ + 2H₂O + energy\n\n**iv. Glucose:** forms **carbon dioxide and water**, releasing energy. C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energy. This reaction occurs during respiration."},{"g":"9","n":16,"c":"Gas","a":"gas gases ग्यास ग्याँस ग्यास","t":"Gas – Exercise 3(k): What is the ozone layer? How does its formation and depletion occur? Write with equations. | ग्यास अभ्यास 3(k)","q":"What is the ozone layer? How does its formation and depletion occur? Write with equations.","o":"3(k)","s":"","x":"Chapter: Gas (ग्यास) – Class 9 Science. Exercise 3(k).\n\nThe **ozone layer** is a thick layer of ozone gas present in the stratosphere, approximately 25–40 km above the Earth's surface. It absorbs harmful ultraviolet radiation from the Sun.\n\n**Formation of ozone**\nUltraviolet rays split oxygen molecules into oxygen atoms: **O₂ —(UV rays)→ O + O**\nThe oxygen atom then combines with an oxygen molecule: **O + O₂ → O₃**\nThus, ozone is formed.\n\n**Depletion of ozone**\nCFCs release chlorine atoms in the presence of UV radiation. These chlorine atoms react with ozone and destroy it. A simplified reaction is:\n**Cl + O₃ → ClO + O₂**\nThen: **ClO + O → Cl + O₂**\n\nThe chlorine can continue the cycle and destroy more ozone molecules."},{"g":"9","n":16,"c":"Gas","a":"gas gases ग्यास ग्याँस ग्यास","t":"Gas – Exercise 3(l): Write the role of the ozone layer in protecting living beings on Earth. | ग्यास अभ्यास 3(l)","q":"Write the role of the ozone layer in protecting living beings on Earth.","o":"3(l)","s":"","x":"Chapter: Gas (ग्यास) – Class 9 Science. Exercise 3(l).\n\nThe ozone layer protects living beings by absorbing harmful ultraviolet (UV) radiation from the Sun. It reduces the amount of UV radiation reaching Earth's surface. This helps protect humans from eye damage, skin damage and skin cancer. It also protects plants, animals, aquatic organisms and ecosystems from harmful radiation."},{"g":"9","n":16,"c":"Gas","a":"gas gases ग्यास ग्याँस ग्यास","t":"Gas – Exercise 3(m): \"Man is mainly responsible for the increase in radiation on the Earth.\" Justify with an example. | ग्यास अभ्यास 3(m)","q":"\"Man is mainly responsible for the increase in radiation on the Earth.\" Justify with an example.","o":"3(m)","s":"","x":"Chapter: Gas (ग्यास) – Class 9 Science. Exercise 3(m).\n\nHuman activities have released chemicals that damage the ozone layer. For example, **chlorofluorocarbons (CFCs)** used in some older refrigeration and aerosol systems can release chlorine in the stratosphere. Chlorine participates in reactions that destroy ozone. As the ozone layer becomes thinner, more harmful UV radiation can reach Earth's surface."},{"g":"9","n":16,"c":"Gas","a":"gas gases ग्यास ग्याँस ग्यास","t":"Gas – Exercise 3(n): In any place on Earth, increased radiation from the Sun is measured. Write its causes and effects. | ग्यास अभ्यास 3(n)","q":"In any place on Earth, increased radiation from the Sun is measured. Write its causes and effects.","o":"3(n)","s":"","x":"Chapter: Gas (ग्यास) – Class 9 Science. Exercise 3(n).\n\n**Causes**\n1. Depletion of the ozone layer.\n2. Excessive release of CFCs.\n3. Release of nitrogen oxides and other ozone-depleting substances.\n4. Human activities that release ozone-depleting chemicals.\n\n**Effects**\n1. Eye problems such as cataracts may increase.\n2. Skin damage and skin cancer may occur.\n3. The immune system may be weakened.\n4. Plant growth and photosynthesis can be affected.\n5. Agricultural production can decrease.\n6. Aquatic and terrestrial ecosystems can be disturbed."},{"g":"9","n":16,"c":"Gas","a":"gas gases ग्यास ग्याँस ग्यास","t":"Gas – Exercise 4: Complete the following chemical equations (i–viii). | ग्यास अभ्यास 4","q":"Complete the following chemical equations (i–viii).","o":"4","s":"","x":"Chapter: Gas (ग्यास) – Class 9 Science. Exercise 4.\n\n**i.** 2H₂ + O₂ → 2H₂O (Hydrogen + Oxygen → Water)\n**ii.** 2Na + H₂ → 2NaH (Sodium + Hydrogen → Sodium hydride)\n**iii.** 2KClO₃ → 2KCl + 3O₂↑\n**iv.** CH₄ + 2O₂ → CO₂ + 2H₂O + energy\n**v.** C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energy\n**vi.** 3Mg + N₂ → Mg₃N₂\n**vii.** 4P + 5O₂ → 2P₂O₅\n**viii.** Zn + H₂SO₄ → ZnSO₄ + H₂↑"},{"g":"9","n":16,"c":"Gas","a":"gas gases ग्यास ग्याँस ग्यास","t":"Chapter 16 Gas – Important equations to memorize | ग्यास","q":"","o":"","s":"","x":"Chapter: Gas (ग्यास) – Class 9 Science. Important equations.\n\n**Important equations to memorize (Gas)**\n\n| Reaction | Balanced equation |\n|---|---|\n| Preparation of hydrogen | Zn + 2HCl → ZnCl₂ + H₂ |\n| Preparation of oxygen by heating | 2KClO₃ → 2KCl + 3O₂ |\n| Preparation of oxygen without heating | 2H₂O₂ → 2H₂O + O₂ |\n| Hydrogen + oxygen | 2H₂ + O₂ → 2H₂O |\n| Magnesium + oxygen | 2Mg + O₂ → 2MgO |\n| Methane combustion | CH₄ + 2O₂ → CO₂ + 2H₂O + energy |\n| Glucose respiration | C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energy |\n| Ammonia preparation | N₂ + 3H₂ → 2NH₃ |\n| Calcium + nitrogen | 3Ca + N₂ → Ca₃N₂ |"},{"g":"9","n":17,"c":"Metals and Non-metals","a":"metals and non-metals metals and non metals metal and non-metal धातु तथा अधातु धातु र अधातु","t":"Metals and Non-metals – Exercise 1(i): Which of the following is an example of non-metal? | धातु तथा अधातु अभ्यास 1(i)","q":"Which of the following is an example of non-metal?","o":"1(i)","s":"","x":"Chapter: Metals and Non-metals (धातु तथा अधातु) – Class 9 Science. Exercise 1(i).\n\n**Answer: b. Bromine**\n\nBromine is a non-metal."},{"g":"9","n":17,"c":"Metals and Non-metals","a":"metals and non-metals metals and non metals metal and non-metal धातु तथा अधातु धातु र अधातु","t":"Metals and Non-metals – Exercise 1(ii): Which of the following is a characteristic of non-metal? | धातु तथा अधातु अभ्यास 1(ii)","q":"Which of the following is a characteristic of non-metal?","o":"1(ii)","s":"","x":"Chapter: Metals and Non-metals (धातु तथा अधातु) – Class 9 Science. Exercise 1(ii).\n\n**Answer: b. Brittle**\n\nMost non-metals are brittle and break easily."},{"g":"9","n":17,"c":"Metals and Non-metals","a":"metals and non-metals metals and non metals metal and non-metal धातु तथा अधातु धातु र अधातु","t":"Metals and Non-metals – Exercise 1(iii): Which metal is harmful to our body? | धातु तथा अधातु अभ्यास 1(iii)","q":"Which metal is harmful to our body?","o":"1(iii)","s":"","x":"Chapter: Metals and Non-metals (धातु तथा अधातु) – Class 9 Science. Exercise 1(iii).\n\n**Answer: d. Pb**\n\nPb is the chemical symbol for **lead**, which is harmful to the human body."},{"g":"9","n":17,"c":"Metals and Non-metals","a":"metals and non-metals metals and non metals metal and non-metal धातु तथा अधातु धातु र अधातु","t":"Metals and Non-metals – Exercise 1(iv): What is the harmful effect of mercury called? | धातु तथा अधातु अभ्यास 1(iv)","q":"What is the harmful effect of mercury called?","o":"1(iv)","s":"","x":"Chapter: Metals and Non-metals (धातु तथा अधातु) – Class 9 Science. Exercise 1(iv).\n\n**Answer: a. Hydrargyriasis**\n\nThe harmful effects caused by mercury poisoning are called **hydrargyriasis or mercurialism**."},{"g":"9","n":17,"c":"Metals and Non-metals","a":"metals and non-metals metals and non metals metal and non-metal धातु तथा अधातु धातु र अधातु","t":"Metals and Non-metals – Exercise 1(v): Metals can conduct current. What is the reason? | धातु तथा अधातु अभ्यास 1(v)","q":"Metals can conduct current. What is the reason?","o":"1(v)","s":"","x":"Chapter: Metals and Non-metals (धातु तथा अधातु) – Class 9 Science. Exercise 1(v).\n\n**Answer: a. Metal contains free electrons.**\n\nThe free electrons in metals can move and carry electric current."},{"g":"9","n":17,"c":"Metals and Non-metals","a":"metals and non-metals metals and non metals metal and non-metal धातु तथा अधातु धातु र अधातु","t":"Metals and Non-metals – Exercise 2(a): Differentiate between metal and non-metal on the basis of physical properties. | धातु तथा अधातु अभ्यास 2(a)","q":"Differentiate between metal and non-metal on the basis of physical properties.","o":"2(a)","s":"","x":"Chapter: Metals and Non-metals (धातु तथा अधातु) – Class 9 Science. Exercise 2(a).\n\n| Metals | Non-metals |\n|---|---|\n| Metals are generally malleable. | Non-metals are generally not malleable. |\n| Metals are ductile. | Non-metals are generally not ductile. |\n| Metals are good conductors of heat and electricity. | Non-metals are generally poor conductors of heat and electricity. |\n| Metals are generally hard. | Non-metals are generally soft and brittle. |\n| Metals are sonorous. | Non-metals are generally non-sonorous. |\n| Metals generally have high melting and boiling points. | Non-metals generally have lower melting and boiling points. |\n| Metals have lustre. | Non-metals generally lack metallic lustre. |\n\n**Exceptions:** Sodium and potassium are soft metals, while diamond is a very hard non-metal."},{"g":"9","n":17,"c":"Metals and Non-metals","a":"metals and non-metals metals and non metals metal and non-metal धातु तथा अधातु धातु र अधातु","t":"Metals and Non-metals – Exercise 2(b): Differentiate between malleability and ductility. | धातु तथा अधातु अभ्यास 2(b)","q":"Differentiate between malleability and ductility.","o":"2(b)","s":"","x":"Chapter: Metals and Non-metals (धातु तथा अधातु) – Class 9 Science. Exercise 2(b).\n\n| Malleability | Ductility |\n|---|---|\n| It is the property of a metal by which it can be beaten into thin sheets or foils. | It is the property of a metal by which it can be drawn into wires. |\n| It is related to the formation of sheets. | It is related to the formation of wires. |\n| Example: Aluminium can be made into aluminium foil. | Example: Copper can be drawn into electrical wires. |"},{"g":"9","n":17,"c":"Metals and Non-metals","a":"metals and non-metals metals and non metals metal and non-metal धातु तथा अधातु धातु र अधातु","t":"Metals and Non-metals – Exercise 3(a): Give reason: Metals can be turned into flat foil by beating and turn into wire by stretching. | धातु तथा अधातु अभ्यास 3(a)","q":"Give reason: Metals can be turned into flat foil by beating and turn into wire by stretching.","o":"3(a)","s":"","x":"Chapter: Metals and Non-metals (धातु तथा अधातु) – Class 9 Science. Exercise 3(a).\n\nMetals have metallic bonds that allow their atoms to shift their positions without completely breaking the bonding. Therefore, when metals are beaten, they can be converted into thin sheets. When they are stretched, they can be drawn into wires. This is why metals are **malleable and ductile**."},{"g":"9","n":17,"c":"Metals and Non-metals","a":"metals and non-metals metals and non metals metal and non-metal धातु तथा अधातु धातु र अधातु","t":"Metals and Non-metals – Exercise 3(b): Give reason: Melting point and boiling point of metals are high. | धातु तथा अधातु अभ्यास 3(b)","q":"Give reason: Melting point and boiling point of metals are high.","o":"3(b)","s":"","x":"Chapter: Metals and Non-metals (धातु तथा अधातु) – Class 9 Science. Exercise 3(b).\n\nThere is a strong force of attraction between the particles of metals due to metallic bonding. A large amount of heat energy is required to overcome these forces. Therefore, most metals have high melting and boiling points."},{"g":"9","n":17,"c":"Metals and Non-metals","a":"metals and non-metals metals and non metals metal and non-metal धातु तथा अधातु धातु र अधातु","t":"Metals and Non-metals – Exercise 3(c): Give reason: Mercury thermometer should not be given to children to take in their mouth. | धातु तथा अधातु अभ्यास 3(c)","q":"Give reason: Mercury thermometer should not be given to children to take in their mouth.","o":"3(c)","s":"","x":"Chapter: Metals and Non-metals (धातु तथा अधातु) – Class 9 Science. Exercise 3(c).\n\nMercury is a poisonous metal. If a thermometer breaks, mercury may enter the body and cause harmful effects. Mercury can damage the **brain, kidneys and lungs**, and may be particularly harmful to children. Therefore, a mercury thermometer should not be placed in a child's mouth."},{"g":"9","n":17,"c":"Metals and Non-metals","a":"metals and non-metals metals and non metals metal and non-metal धातु तथा अधातु धातु र अधातु","t":"Metals and Non-metals – Exercise 4(a): Make a list of physical properties of metals. | धातु तथा अधातु अभ्यास 4(a)","q":"Make a list of physical properties of metals.","o":"4(a)","s":"","x":"Chapter: Metals and Non-metals (धातु तथा अधातु) – Class 9 Science. Exercise 4(a).\n\nThe main physical properties of metals are:\n1. Metals are generally **lustrous**.\n2. Metals are **malleable**.\n3. Metals are **ductile**.\n4. Metals are good **conductors of electricity**.\n5. Metals are good **conductors of heat**.\n6. Metals produce a **sonorous sound** when beaten.\n7. Most metals are **hard**.\n8. Most metals have **high melting and boiling points**."},{"g":"9","n":17,"c":"Metals and Non-metals","a":"metals and non-metals metals and non metals metal and non-metal धातु तथा अधातु धातु र अधातु","t":"Metals and Non-metals – Exercise 4(b): \"Metals are good conductors of electricity.\" How do you prove? Clarify. | धातु तथा अधातु अभ्यास 4(b)","q":"\"Metals are good conductors of electricity.\" How do you prove? Clarify.","o":"4(b)","s":"","x":"Chapter: Metals and Non-metals (धातु तथा अधातु) – Class 9 Science. Exercise 4(b).\n\nWe can prove this by making a simple electric circuit using a cell, bulb and connecting wires.\n\nFirst, connect the two ends of the circuit through a metal such as **copper wire, aluminium wire or an iron nail**. The bulb glows because electric current passes through the metal.\n\nNow replace the metal with a non-metal such as **wood, paper, sulphur or coal**. The bulb does not glow because these substances generally do not allow electric current to pass through them.\n\nTherefore, the experiment proves that **metals are good conductors of electricity because they contain free electrons that can move through the metal.**"},{"g":"9","n":17,"c":"Metals and Non-metals","a":"metals and non-metals metals and non metals metal and non-metal धातु तथा अधातु धातु र अधातु","t":"Metals and Non-metals – Exercise 4(c): Write any three chemical properties of metals with chemical equations. | धातु तथा अधातु अभ्यास 4(c)","q":"Write any three chemical properties of metals with chemical equations.","o":"4(c)","s":"","x":"Chapter: Metals and Non-metals (धातु तथा अधातु) – Class 9 Science. Exercise 4(c).\n\n**1. Metals react with oxygen to form metallic oxides.**\nFor example, magnesium reacts with oxygen to form magnesium oxide.\n**2Mg + O₂ → 2MgO** (Metal + Oxygen → Metallic oxide)\n\n**2. Reactive metals react with dilute acids to produce salt and hydrogen gas.**\nFor example, magnesium reacts with hydrochloric acid.\n**Mg + 2HCl → MgCl₂ + H₂↑** (Magnesium + Hydrochloric acid → Magnesium chloride + Hydrogen)\n\n**3. Reactive metals react with water to form metallic hydroxide and hydrogen gas.**\nFor example, sodium reacts with water.\n**2Na + 2H₂O → 2NaOH + H₂↑** (Sodium + Water → Sodium hydroxide + Hydrogen)"},{"g":"9","n":17,"c":"Metals and Non-metals","a":"metals and non-metals metals and non metals metal and non-metal धातु तथा अधातु धातु र अधातु","t":"Metals and Non-metals – Exercise 4(d): Write any two negative effects of mercury and lead on the human body. | धातु तथा अधातु अभ्यास 4(d)","q":"Write any two negative effects of mercury and lead on the human body.","o":"4(d)","s":"","x":"Chapter: Metals and Non-metals (धातु तथा अधातु) – Class 9 Science. Exercise 4(d).\n\n**Mercury**\n1. Mercury and its compounds can seriously damage the **brain and nervous system**.\n2. Mercury can harm the **kidneys and lungs**.\n\n**Lead**\n1. Lead can cause **anemia and weakness**.\n2. In children, lead exposure can affect **brain development and learning ability**."},{"g":"9","n":17,"c":"Metals and Non-metals","a":"metals and non-metals metals and non metals metal and non-metal धातु तथा अधातु धातु र अधातु","t":"Metals and Non-metals – Exercise 4(e): Make a list of sources of metals required for the human body. | धातु तथा अधातु अभ्यास 4(e)","q":"Make a list of sources of metals required for the human body.","o":"4(e)","s":"","x":"Chapter: Metals and Non-metals (धातु तथा अधातु) – Class 9 Science. Exercise 4(e).\n\n| Metal | Sources |\n|---|---|\n| **Iron (Fe)** | Spinach, cereals, broccoli, plant seeds, fish and meat |\n| **Zinc (Zn)** | Pumpkin seeds, flax seeds, sunflower seeds, cereals, mushrooms, almonds, cashew nuts, milk products, meat, fish and eggs |\n| **Sodium (Na)** | Table salt, meat and eggs |\n| **Potassium (K)** | Fruits, soybean, vegetables, dairy products, banana, avocado, bamboo shoots (tama), milk and curd |\n\n**In short:**\n- Iron → spinach, cereals, fish, meat\n- Zinc → seeds, cereals, nuts, milk, meat, fish, eggs\n- Sodium → table salt, meat, eggs\n- Potassium → banana, fruits, vegetables, soybean, milk, curd"},{"g":"9","n":18,"c":"Carbon and its Compounds","a":"carbon and its compounds carbon and compounds कार्बन र यसका यौगिकहरू कार्बन र यसका यौगिक carbon compounds","t":"Carbon and its Compounds – Exercise 1(i): Which of the following is the characteristic of carbon? | कार्बन र यसका यौगिकहरू अभ्यास 1(i)","q":"Which of the following is the characteristic of carbon?","o":"1(i)","s":"","x":"Chapter: Carbon and its Compounds (कार्बन र यसका यौगिकहरू) – Class 9 Science. Exercise 1(i).\n\n**Answer: c. Turns solid into gas at high temperature**"},{"g":"9","n":18,"c":"Carbon and its Compounds","a":"carbon and its compounds carbon and compounds कार्बन र यसका यौगिकहरू कार्बन र यसका यौगिक carbon compounds","t":"Carbon and its Compounds – Exercise 1(ii): If we prepare polythene by the use of carbon compounds, which property of carbon is related to it? | कार्बन र यसका यौगिकहरू अभ्यास 1(ii)","q":"If we prepare polythene by the use of carbon compounds, which property of carbon is related to it?","o":"1(ii)","s":"","x":"Chapter: Carbon and its Compounds (कार्बन र यसका यौगिकहरू) – Class 9 Science. Exercise 1(ii).\n\n**Answer: b. Catenation**"},{"g":"9","n":18,"c":"Carbon and its Compounds","a":"carbon and its compounds carbon and compounds कार्बन र यसका यौगिकहरू कार्बन र यसका यौगिक carbon compounds","t":"Carbon and its Compounds – Exercise 1(iii): Which of the following is a group of organic compounds? | कार्बन र यसका यौगिकहरू अभ्यास 1(iii)","q":"Which of the following is a group of organic compounds?","o":"1(iii)","s":"","x":"Chapter: Carbon and its Compounds (कार्बन र यसका यौगिकहरू) – Class 9 Science. Exercise 1(iii).\n\n**Answer: c. Methane, methanol, chloroform, urea**"},{"g":"9","n":18,"c":"Carbon and its Compounds","a":"carbon and its compounds carbon and compounds कार्बन र यसका यौगिकहरू कार्बन र यसका यौगिक carbon compounds","t":"Carbon and its Compounds – Exercise 1(iv): The outer surface of the utensil used to cook food with firewood becomes black (sooty). What does it prove? | कार्बन र यसका यौगिकहरू अभ्यास 1(iv)","q":"The outer surface of the utensil used to cook food with firewood becomes black (sooty). What does it prove?","o":"1(iv)","s":"","x":"Chapter: Carbon and its Compounds (कार्बन र यसका यौगिकहरू) – Class 9 Science. Exercise 1(iv).\n\n**Answer: b. Firewood consists of carbon**"},{"g":"9","n":18,"c":"Carbon and its Compounds","a":"carbon and its compounds carbon and compounds कार्बन र यसका यौगिकहरू कार्बन र यसका यौगिक carbon compounds","t":"Carbon and its Compounds – Exercise 2(a): Differentiate between graphite and diamond. | कार्बन र यसका यौगिकहरू अभ्यास 2(a)","q":"Differentiate between graphite and diamond.","o":"2(a)","s":"","x":"Chapter: Carbon and its Compounds (कार्बन र यसका यौगिकहरू) – Class 9 Science. Exercise 2(a).\n\n| Basis | Graphite | Diamond |\n|---|---|---|\n| **Appearance** | Black and opaque | Colourless and transparent |\n| **Hardness** | Soft | Very hard |\n| **Electrical conductivity** | Good conductor of electricity | Bad conductor of electricity |\n| **Free electrons** | Has free electrons | No free electrons |\n| **Uses** | Pencil lead, electrodes, lubricant | Jewellery, cutting and drilling hard materials |"},{"g":"9","n":18,"c":"Carbon and its Compounds","a":"carbon and its compounds carbon and compounds कार्बन र यसका यौगिकहरू कार्बन र यसका यौगिक carbon compounds","t":"Carbon and its Compounds – Exercise 2(b): Differentiate between organic compound and inorganic compound. | कार्बन र यसका यौगिकहरू अभ्यास 2(b)","q":"Differentiate between organic compound and inorganic compound.","o":"2(b)","s":"","x":"Chapter: Carbon and its Compounds (कार्बन र यसका यौगिकहरू) – Class 9 Science. Exercise 2(b).\n\n| Basis | Organic compounds | Inorganic compounds |\n|---|---|---|\n| **Bond** | Mainly covalent bonds | Mainly electrovalent bonds |\n| **Ionization** | Generally do not ionize | Generally ionize in water |\n| **Solubility** | Mostly do not dissolve in water but dissolve in organic solvents | Many dissolve in water |\n| **Melting/boiling point** | Generally low | Generally high |\n| **Combustibility** | Generally burn easily | Generally do not burn easily |\n| **Examples** | Methane, petrol, sugar, urea | NaCl, HCl, CaCO₃, CO₂ |"},{"g":"9","n":18,"c":"Carbon and its Compounds","a":"carbon and its compounds carbon and compounds कार्बन र यसका यौगिकहरू कार्बन र यसका यौगिक carbon compounds","t":"Carbon and its Compounds – Exercise 3(a): Give reason: In winter, we should not burn coal/firewood while closing windows and doors. | कार्बन र यसका यौगिकहरू अभ्यास 3(a)","q":"Give reason: In winter, we should not burn coal/firewood while closing windows and doors.","o":"3(a)","s":"","x":"Chapter: Carbon and its Compounds (कार्बन र यसका यौगिकहरू) – Class 9 Science. Exercise 3(a).\n\nCoal and firewood may not burn completely when the supply of oxygen is insufficient. Incomplete combustion produces **carbon monoxide (CO)**, which is a poisonous gas. It can reduce the oxygen-carrying capacity of blood and may cause unconsciousness or even death. Therefore, doors and windows should not be completely closed while burning coal or firewood indoors."},{"g":"9","n":18,"c":"Carbon and its Compounds","a":"carbon and its compounds carbon and compounds कार्बन र यसका यौगिकहरू कार्बन र यसका यौगिक carbon compounds","t":"Carbon and its Compounds – Exercise 3(b): Give reason: Powder of graphite can be used as a dry lubricant. | कार्बन र यसका यौगिकहरू अभ्यास 3(b)","q":"Give reason: Powder of graphite can be used as a dry lubricant.","o":"3(b)","s":"","x":"Chapter: Carbon and its Compounds (कार्बन र यसका यौगिकहरू) – Class 9 Science. Exercise 3(b).\n\nGraphite has a **layered structure**. The layers can slide easily over one another because the forces between the layers are weak. Therefore, graphite powder reduces friction between surfaces and can be used as a dry lubricant."},{"g":"9","n":18,"c":"Carbon and its Compounds","a":"carbon and its compounds carbon and compounds कार्बन र यसका यौगिकहरू कार्बन र यसका यौगिक carbon compounds","t":"Carbon and its Compounds – Exercise 3(c): Give reason: Graphite and diamond are both allotropes of carbon. Graphite can conduct electricity but diamond cannot. | कार्बन र यसका यौगिकहरू अभ्यास 3(c)","q":"Give reason: Graphite and diamond are both allotropes of carbon. Graphite can conduct electricity but diamond cannot.","o":"3(c)","s":"","x":"Chapter: Carbon and its Compounds (कार्बन र यसका यौगिकहरू) – Class 9 Science. Exercise 3(c).\n\nIn graphite, each carbon atom forms bonds with three other carbon atoms, leaving **one electron free**. These free electrons can move and conduct electricity. In diamond, all four valence electrons of each carbon atom are involved in bonding, so there are no free electrons. Therefore, graphite conducts electricity but diamond does not."},{"g":"9","n":18,"c":"Carbon and its Compounds","a":"carbon and its compounds carbon and compounds कार्बन र यसका यौगिकहरू कार्बन र यसका यौगिक carbon compounds","t":"Carbon and its Compounds – Exercise 3(d): Give reason: The melting and boiling points of inorganic compounds are higher than those of organic compounds. | कार्बन र यसका यौगिकहरू अभ्यास 3(d)","q":"Give reason: The melting and boiling points of inorganic compounds are higher than those of organic compounds.","o":"3(d)","s":"","x":"Chapter: Carbon and its Compounds (कार्बन र यसका यौगिकहरू) – Class 9 Science. Exercise 3(d).\n\nMost inorganic compounds have **strong electrovalent/ionic bonds** between their particles. A large amount of heat is required to break these strong forces. Therefore, their melting and boiling points are generally higher than those of organic compounds."},{"g":"9","n":18,"c":"Carbon and its Compounds","a":"carbon and its compounds carbon and compounds कार्बन र यसका यौगिकहरू कार्बन र यसका यौगिक carbon compounds","t":"Carbon and its Compounds – Exercise 3(e): Give reason: While burning firewood, sometimes black smoke comes but sometimes it does not when burning properly. | कार्बन र यसका यौगिकहरू अभ्यास 3(e)","q":"Give reason: While burning firewood, sometimes black smoke comes but sometimes it does not when burning properly.","o":"3(e)","s":"","x":"Chapter: Carbon and its Compounds (कार्बन र यसका यौगिकहरू) – Class 9 Science. Exercise 3(e).\n\nWhen firewood gets **insufficient oxygen**, incomplete combustion occurs and produces tiny carbon particles, which appear as **black smoke or soot**. When sufficient oxygen is supplied, combustion is more complete and mainly produces carbon dioxide and water, so black smoke is greatly reduced."},{"g":"9","n":18,"c":"Carbon and its Compounds","a":"carbon and its compounds carbon and compounds कार्बन र यसका यौगिकहरू कार्बन र यसका यौगिक carbon compounds","t":"Carbon and its Compounds – Exercise 4(a): Define catenation and allotropy of carbon with examples. | कार्बन र यसका यौगिकहरू अभ्यास 4(a)","q":"Define catenation and allotropy of carbon with examples.","o":"4(a)","s":"","x":"Chapter: Carbon and its Compounds (कार्बन र यसका यौगिकहरू) – Class 9 Science. Exercise 4(a).\n\n**Catenation:** The property of carbon by which carbon atoms join with one another through covalent bonds to form long chains, branches or rings is called **catenation**.\nExamples: butane, pentane, polythene and PVC.\n\n**Allotropy:** The property of an element to exist in different forms having different physical properties but the same chemical composition is called **allotropy**. The different forms are called allotropes.\nExamples of carbon: diamond, graphite, fullerene, coal and charcoal."},{"g":"9","n":18,"c":"Carbon and its Compounds","a":"carbon and its compounds carbon and compounds कार्बन र यसका यौगिकहरू कार्बन र यसका यौगिक carbon compounds","t":"Carbon and its Compounds – Exercise 4(b): When we heat sugar continuously, it gives a black mass. What can we infer from this? | कार्बन र यसका यौगिकहरू अभ्यास 4(b)","q":"When we heat sugar continuously, it gives a black mass. What can we infer from this?","o":"4(b)","s":"","x":"Chapter: Carbon and its Compounds (कार्बन र यसका यौगिकहरू) – Class 9 Science. Exercise 4(b).\n\nWhen sugar is heated continuously, it becomes a black mass called **charcoal**. Since charcoal is a form of carbon, we can infer that **sugar contains carbon**."},{"g":"9","n":18,"c":"Carbon and its Compounds","a":"carbon and its compounds carbon and compounds कार्बन र यसका यौगिकहरू कार्बन र यसका यौगिक carbon compounds","t":"Carbon and its Compounds – Exercise 4(c): Give any two examples of crystalline and amorphous allotropes of carbon. | कार्बन र यसका यौगिकहरू अभ्यास 4(c)","q":"Give any two examples of crystalline and amorphous allotropes of carbon.","o":"4(c)","s":"","x":"Chapter: Carbon and its Compounds (कार्बन र यसका यौगिकहरू) – Class 9 Science. Exercise 4(c).\n\n**Crystalline allotropes:** 1. Diamond 2. Graphite\n\n**Amorphous allotropes:** 1. Coal 2. Charcoal"},{"g":"9","n":18,"c":"Carbon and its Compounds","a":"carbon and its compounds carbon and compounds कार्बन र यसका यौगिकहरू कार्बन र यसका यौगिक carbon compounds","t":"Carbon and its Compounds – Exercise 4(d): Write the condition of formation of carbon monoxide and carbon dioxide when carbon is burnt, and write chemical reactions. | कार्बन र यसका यौगिकहरू अभ्यास 4(d)","q":"Write the condition of formation of carbon monoxide and carbon dioxide when carbon is burnt, and write chemical reactions.","o":"4(d)","s":"","x":"Chapter: Carbon and its Compounds (कार्बन र यसका यौगिकहरू) – Class 9 Science. Exercise 4(d).\n\nWhen carbon burns in **excess oxygen**, carbon dioxide is formed:\n**C + O₂ → CO₂ + heat**\n\nWhen carbon burns in a **limited amount of oxygen**, carbon monoxide is formed:\n**2C + O₂ → 2CO + heat**"},{"g":"9","n":18,"c":"Carbon and its Compounds","a":"carbon and its compounds carbon and compounds कार्बन र यसका यौगिकहरू कार्बन र यसका यौगिक carbon compounds","t":"Carbon and its Compounds – Exercise 4(e): What is water gas? | कार्बन र यसका यौगिकहरू अभ्यास 4(e)","q":"What is water gas?","o":"4(e)","s":"","x":"Chapter: Carbon and its Compounds (कार्बन र यसका यौगिकहरू) – Class 9 Science. Exercise 4(e).\n\nThe mixture of **carbon monoxide (CO) and hydrogen (H₂)** obtained when steam is passed over heated carbon is called **water gas**."},{"g":"9","n":18,"c":"Carbon and its Compounds","a":"carbon and its compounds carbon and compounds कार्बन र यसका यौगिकहरू कार्बन र यसका यौगिक carbon compounds","t":"Carbon and its Compounds – Exercise 4(f): What happens when carbon is reacted with steam? Write a chemical reaction. | कार्बन र यसका यौगिकहरू अभ्यास 4(f)","q":"What happens when carbon is reacted with steam? Write a chemical reaction.","o":"4(f)","s":"","x":"Chapter: Carbon and its Compounds (कार्बन र यसका यौगिकहरू) – Class 9 Science. Exercise 4(f).\n\nWhen steam is passed over carbon heated to about **1000°C**, carbon reacts with steam to form **carbon monoxide and hydrogen**. The mixture formed is called water gas.\n\n**Chemical reaction: C + H₂O → CO + H₂**"},{"g":"9","n":18,"c":"Carbon and its Compounds","a":"carbon and its compounds carbon and compounds कार्बन र यसका यौगिकहरू कार्बन र यसका यौगिक carbon compounds","t":"Carbon and its Compounds – Exercise 4(g): Rohan's mother advised him to use petrol on the part of the clothes where grease has fallen. Will the problem of Rohan be solved? Explain. | कार्बन र यसका यौगिकहरू अभ्यास 4(g)","q":"Rohan's mother advised him to use petrol on the part of the clothes where grease has fallen. Will the problem of Rohan be solved? Explain.","o":"4(g)","s":"","x":"Chapter: Carbon and its Compounds (कार्बन र यसका यौगिकहरू) – Class 9 Science. Exercise 4(g).\n\n**Yes, the grease stain can be removed using petrol.**\n\nGrease is an **organic substance** and does not dissolve easily in water. Petrol is an **organic solvent**, so grease can dissolve in petrol. Therefore, applying a small amount of petrol can help remove the grease from the cloth.\n\nHowever, petrol is **highly inflammable**, so it should be used carefully and kept away from fire, flames and other sources of heat."},{"g":"9","n":18,"c":"Carbon and its Compounds","a":"carbon and its compounds carbon and compounds कार्बन र यसका यौगिकहरू कार्बन र यसका यौगिक carbon compounds","t":"Carbon and its Compounds – Exercise 4(h): Write any four examples of organic compounds which are used in daily life. | कार्बन र यसका यौगिकहरू अभ्यास 4(h)","q":"Write any four examples of organic compounds which are used in daily life.","o":"4(h)","s":"","x":"Chapter: Carbon and its Compounds (कार्बन र यसका यौगिकहरू) – Class 9 Science. Exercise 4(h).\n\nFour examples are:\n1. **Sugar** — used as food/sweetener.\n2. **Petrol** — used as fuel in vehicles.\n3. **Methane** — used as a fuel.\n4. **Urea** — used as a fertilizer."},{"g":"9","n":19,"c":"Materials Used in Agriculture","a":"materials used in agriculture agriculture materials कृषिमा प्रयोग हुने सामग्री कृषि सामग्री fertilizer and insecticide","t":"Materials Used in Agriculture – Exercise 1(i): Which domestic substance fulfills the deficiency of phosphorus in soil? | कृषिमा प्रयोग हुने सामग्री अभ्यास 1(i)","q":"Which domestic substance fulfills the deficiency of phosphorus in soil?","o":"1(i)","s":"","x":"Chapter: Materials Used in Agriculture (कृषिमा प्रयोग हुने सामग्री) – Class 9 Science. Exercise 1(i).\n\n**Answer: b. Powder of bone**\n\nBone powder contains phosphorus and can be used as an organic source of phosphorus."},{"g":"9","n":19,"c":"Materials Used in Agriculture","a":"materials used in agriculture agriculture materials कृषिमा प्रयोग हुने सामग्री कृषि सामग्री fertilizer and insecticide","t":"Materials Used in Agriculture – Exercise 1(ii): Which nutrient is deficient in the land shown by the growing maize plant? | कृषिमा प्रयोग हुने सामग्री अभ्यास 1(ii)","q":"Which nutrient is deficient in the land shown by the growing maize plant?","o":"1(ii)","s":"","x":"Chapter: Materials Used in Agriculture (कृषिमा प्रयोग हुने सामग्री) – Class 9 Science. Exercise 1(ii).\n\n**Answer: a. Nitrogen**\n\nNitrogen deficiency commonly causes yellowing of leaves and poor growth of maize plants."},{"g":"9","n":19,"c":"Materials Used in Agriculture","a":"materials used in agriculture agriculture materials कृषिमा प्रयोग हुने सामग्री कृषि सामग्री fertilizer and insecticide","t":"Materials Used in Agriculture – Exercise 1(iii): Which leaf indicates the lack of potassium in the soil? | कृषिमा प्रयोग हुने सामग्री अभ्यास 1(iii)","q":"Which leaf indicates the lack of potassium in the soil?","o":"1(iii)","s":"","x":"Chapter: Materials Used in Agriculture (कृषिमा प्रयोग हुने सामग्री) – Class 9 Science. Exercise 1(iii).\n\n**Answer: d. B**\n\n(The leaf figure is not visible in the textbook text; this is the printed answer.)"},{"g":"9","n":19,"c":"Materials Used in Agriculture","a":"materials used in agriculture agriculture materials कृषिमा प्रयोग हुने सामग्री कृषि सामग्री fertilizer and insecticide","t":"Materials Used in Agriculture – Exercise 1(iv): Which of the following is a group of insecticides? | कृषिमा प्रयोग हुने सामग्री अभ्यास 1(iv)","q":"Which of the following is a group of insecticides?","o":"1(iv)","s":"","x":"Chapter: Materials Used in Agriculture (कृषिमा प्रयोग हुने सामग्री) – Class 9 Science. Exercise 1(iv).\n\n**Answer: c. Dialdrin, DDT, methoxy chloride**"},{"g":"9","n":19,"c":"Materials Used in Agriculture","a":"materials used in agriculture agriculture materials कृषिमा प्रयोग हुने सामग्री कृषि सामग्री fertilizer and insecticide","t":"Materials Used in Agriculture – Exercise 2(a): Differentiate between chemical fertilizer and organic fertilizer. | कृषिमा प्रयोग हुने सामग्री अभ्यास 2(a)","q":"Differentiate between chemical fertilizer and organic fertilizer.","o":"2(a)","s":"","x":"Chapter: Materials Used in Agriculture (कृषिमा प्रयोग हुने सामग्री) – Class 9 Science. Exercise 2(a).\n\n| Basis | Chemical fertilizer | Organic fertilizer |\n|---|---|---|\n| **Source** | Manufactured chemically | Made from decayed plants, animals and their wastes |\n| **Nutrient content** | Contains particular nutrients in large amounts | Nutrients are generally present in smaller amounts |\n| **Solubility** | Usually easily soluble in water | Generally decomposes slowly |\n| **Effect** | Acts quickly | Acts slowly |\n| **Environmental effect** | Excessive use can pollute soil and water | Generally environment-friendly |\n| **Examples** | Urea, ammonium sulphate, potassium chloride | Compost manure, green manure, bone powder |"},{"g":"9","n":19,"c":"Materials Used in Agriculture","a":"materials used in agriculture agriculture materials कृषिमा प्रयोग हुने सामग्री कृषि सामग्री fertilizer and insecticide","t":"Materials Used in Agriculture – Exercise 2(b): Differentiate between chemical insecticides and bio-insecticides. | कृषिमा प्रयोग हुने सामग्री अभ्यास 2(b)","q":"Differentiate between chemical insecticides and bio-insecticides.","o":"2(b)","s":"","x":"Chapter: Materials Used in Agriculture (कृषिमा प्रयोग हुने सामग्री) – Class 9 Science. Exercise 2(b).\n\n| Basis | Chemical insecticides | Bio-insecticides |\n|---|---|---|\n| **Preparation** | Manufactured industrially | Prepared from natural materials such as plants |\n| **Environmental effect** | Can pollute soil, air and water | Generally cause less environmental pollution |\n| **Effect on useful organisms** | Can kill useful insects and organisms | Generally safer for useful organisms |\n| **Health effect** | May be harmful to human health | Generally safer when properly prepared and used |\n| **Examples** | DDT, BHC, Aldrin | Jholmol, neem leaves, ash |"},{"g":"9","n":19,"c":"Materials Used in Agriculture","a":"materials used in agriculture agriculture materials कृषिमा प्रयोग हुने सामग्री कृषि सामग्री fertilizer and insecticide","t":"Materials Used in Agriculture – Exercise 3(a): Give reason: Use of organic fertilizer is environment-friendly. | कृषिमा प्रयोग हुने सामग्री अभ्यास 3(a)","q":"Give reason: Use of organic fertilizer is environment-friendly.","o":"3(a)","s":"","x":"Chapter: Materials Used in Agriculture (कृषिमा प्रयोग हुने सामग्री) – Class 9 Science. Exercise 3(a).\n\nOrganic fertilizers are prepared from naturally decomposed plant and animal materials. They increase soil fertility and organic matter without causing serious long-term pollution when properly used. They are biodegradable and help maintain the quality of soil. Therefore, organic fertilizer is considered environment-friendly."},{"g":"9","n":19,"c":"Materials Used in Agriculture","a":"materials used in agriculture agriculture materials कृषिमा प्रयोग हुने सामग्री कृषि सामग्री fertilizer and insecticide","t":"Materials Used in Agriculture – Exercise 3(b): Give reason: Ecosystem is imbalanced by the use of DDT powder. | कृषिमा प्रयोग हुने सामग्री अभ्यास 3(b)","q":"Give reason: Ecosystem is imbalanced by the use of DDT powder.","o":"3(b)","s":"","x":"Chapter: Materials Used in Agriculture (कृषिमा प्रयोग हुने सामग्री) – Class 9 Science. Exercise 3(b).\n\nDDT is a chemical insecticide that does not easily break down in the environment. It can enter soil and water and affect organisms in the food chain. It can kill useful insects and affect birds, fish and other organisms. It may also reduce the reproductive ability of some organisms. Therefore, excessive use of DDT can disturb the balance of an ecosystem."},{"g":"9","n":19,"c":"Materials Used in Agriculture","a":"materials used in agriculture agriculture materials कृषिमा प्रयोग हुने सामग्री कृषि सामग्री fertilizer and insecticide","t":"Materials Used in Agriculture – Exercise 4(a): What is NPK fertilizer? Write its importance. | कृषिमा प्रयोग हुने सामग्री अभ्यास 4(a)","q":"What is NPK fertilizer? Write its importance.","o":"4(a)","s":"","x":"Chapter: Materials Used in Agriculture (कृषिमा प्रयोग हुने सामग्री) – Class 9 Science. Exercise 4(a).\n\n**NPK fertilizer** is a fertilizer that supplies the three major nutrients required by plants: **Nitrogen (N), Phosphorus (P) and Potassium (K).**\n\n**Importance**\n- **Nitrogen** helps in rapid growth and increases crop production.\n- **Phosphorus** helps in the growth and development of roots, flowers and seeds.\n- **Potassium** strengthens stems and roots and increases the resistance of plants to diseases.\n\nTherefore, NPK fertilizer helps in the proper growth, development and production of crops."},{"g":"9","n":19,"c":"Materials Used in Agriculture","a":"materials used in agriculture agriculture materials कृषिमा प्रयोग हुने सामग्री कृषि सामग्री fertilizer and insecticide","t":"Materials Used in Agriculture – Exercise 4(b): Give any two examples of nitrogenous, phosphatic and potassium fertilizers. | कृषिमा प्रयोग हुने सामग्री अभ्यास 4(b)","q":"Give any two examples of nitrogenous, phosphatic and potassium fertilizers.","o":"4(b)","s":"","x":"Chapter: Materials Used in Agriculture (कृषिमा प्रयोग हुने सामग्री) – Class 9 Science. Exercise 4(b).\n\n**Nitrogenous fertilizers:** 1. Urea 2. Ammonium nitrate\n\n**Phosphatic fertilizers:** 1. Ammonium phosphate 2. Triple superphosphate\n\n**Potassium fertilizers:** 1. Potassium chloride (KCl) 2. Potassium sulphate (K₂SO₄)"},{"g":"9","n":19,"c":"Materials Used in Agriculture","a":"materials used in agriculture agriculture materials कृषिमा प्रयोग हुने सामग्री कृषि सामग्री fertilizer and insecticide","t":"Materials Used in Agriculture – Exercise 4(c): The plants shown in the figure are produced from a similar seed. Study the development of the plants comparatively and give the reason for differential growth. Also suggest the solution. | कृषिमा प्रयोग हुने सामग्री अभ्यास 4(c)","q":"The plants shown in the figure are produced from a similar seed. Study the development of the plants comparatively and give the reason for differential growth. Also suggest the solution.","o":"4(c)","s":"","x":"Chapter: Materials Used in Agriculture (कृषिमा प्रयोग हुने सामग्री) – Class 9 Science. Exercise 4(c).\n\nThe plants have grown differently because the soil in which they were grown may have different amounts of **essential nutrients, acidity or basicity**. One plant may have received sufficient nutrients while another may have a deficiency of nitrogen, phosphorus, potassium or other nutrients.\n\n**Solution:** The farmer should test the soil to identify the deficiency and then apply the **appropriate fertilizer or organic manure** in the required amount. Proper irrigation and suitable farming practices should also be followed."},{"g":"9","n":19,"c":"Materials Used in Agriculture","a":"materials used in agriculture agriculture materials कृषिमा प्रयोग हुने सामग्री कृषि सामग्री fertilizer and insecticide","t":"Materials Used in Agriculture – Exercise 4(d): A farmer is in a dilemma whether to use chemical fertilizer or not to increase production. What suggestions would you give? | कृषिमा प्रयोग हुने सामग्री अभ्यास 4(d)","q":"A farmer is in a dilemma whether to use chemical fertilizer or not to increase production. What suggestions would you give?","o":"4(d)","s":"","x":"Chapter: Materials Used in Agriculture (कृषिमा प्रयोग हुने सामग्री) – Class 9 Science. Exercise 4(d).\n\nI would suggest that the farmer should **not completely avoid or excessively use chemical fertilizer**. First, the soil should be tested to identify the nutrients that are deficient. Then the required chemical fertilizer should be applied in the correct amount and
