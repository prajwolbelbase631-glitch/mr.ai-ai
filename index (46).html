<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CurriculumX Ai</title>
<style>
  :root {
    --bg: #ffffff; --side: #e9ebef; --card: #dfe2e8; --text: #1b1f2a; --muted: #5b6372;
    --line: #b9bec9; --link: #1a56c4; --main: #b71c1c; --good: #1f8f5f; --bad: #c0392b;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161a24; --side: #1f2431; --card: #2a3042; --text: #e8ecf5; --muted: #a0a9bd;
      --line: #3b4358; --link: #7fa8ff; --main: #ef6b6b; --good: #4cc38a; --bad: #ff7b6b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161a24; --side: #1f2431; --card: #2a3042; --text: #e8ecf5; --muted: #a0a9bd;
    --line: #3b4358; --link: #7fa8ff; --main: #ef6b6b; --good: #4cc38a; --bad: #ff7b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); display: flex; }

  /* left sidebar */
  #side { width: 230px; background: var(--side); border-right: 1px solid var(--line); padding: 12px; overflow-y: auto; flex-shrink: 0; }
  .menu { display: block; width: 100%; text-align: left; padding: 10px; margin-bottom: 4px; border: 0; border-radius: 6px;
          background: transparent; color: var(--text); font-size: 15px; cursor: pointer; }
  .menu:hover, .menu.on { background: var(--card); }
  #search { width: 100%; padding: 8px; margin: 10px 0; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
  .label { font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  a.chatitem { display: block; padding: 8px; border-radius: 6px; font-size: 14px; cursor: pointer; color: var(--link); text-decoration: underline; }
  a.chatitem:hover { background: var(--card); }

  /* main part */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { padding: 10px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  header h1 { margin: 0; font-size: 22px; }
  #view { flex: 1; overflow-y: auto; padding: 18px; }
  .center { max-width: 640px; margin: 0 auto; }
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 16px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px 10px; text-align: center; cursor: pointer; color: var(--text); font-size: 14px; }
  .tile b { display: block; font-size: 17px; margin: 6px 0 4px; }
  .bubble { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 8px 0; line-height: 1.5; }
  .me { background: var(--card); margin-left: 30px; }
  .ai h4 { margin: 0 0 4px; color: var(--main); }
  #bar { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; gap: 8px; }
  #ask { flex: 1; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 15px; min-width: 0; }
  button.go { background: var(--main); color: #fff; border: 0; border-radius: 6px; padding: 0 18px; font-size: 15px; cursor: pointer; }
  button.plain { padding: 10px 14px; border: 1px solid var(--main); background: var(--bg); color: var(--main); border-radius: 6px; font-size: 15px; cursor: pointer; }
  .opt { display: block; width: 100%; text-align: left; margin-top: 8px; padding: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 6px; font-size: 15px; cursor: pointer; }
  .opt.right { background: var(--good); color: #fff; border-color: var(--good); }
  .opt.wrong { background: var(--bad); color: #fff; border-color: var(--bad); }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .row > * { flex: 1; }
  .timer { font-size: 54px; text-align: center; margin: 20px 0; font-weight: bold; }
  .small { color: var(--muted); font-size: 13px; text-align: center; margin: 8px 0; }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 8px 8px; }


  /* on phones the sidebar goes on top */
  @media (max-width: 640px) {
    body { flex-direction: column; }
    #side { width: 100%; height: auto; max-height: 38%; border-right: 0; border-bottom: 1px solid var(--line); }
  }

  /* ---------- live voice assistant ---------- */
  #live { position: fixed; inset: 0; z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: space-between;
          background: var(--bg); color: var(--text); padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px)); }
  #live.on { display: flex; }
  #live .top { width: 100%; max-width: 640px; display: flex; justify-content: space-between; align-items: center; }
  #live select { padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--text); font-size: 14px; }
  #orbwrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  #orb { width: 150px; height: 150px; border-radius: 50%; border: 0; cursor: pointer; background: var(--main); color: #fff; font-size: 52px;
         box-shadow: 0 0 0 0 var(--main); transition: transform .2s, background .3s; }
  #orb.listening { background: var(--good); animation: pulse 1.4s infinite; }
  #orb.thinking { background: var(--muted); animation: spin 1s linear infinite; border-radius: 40%; }
  #orb.speaking { background: var(--link); animation: talk .7s ease-in-out infinite alternate; }
  #orb.connecting { background: transparent; border: 8px solid var(--line); border-top-color: var(--main); border-radius: 50%; animation: spin 1s linear infinite; cursor: default; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(76,195,138,.55); } 100% { box-shadow: 0 0 0 38px rgba(76,195,138,0); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes talk { from { transform: scale(1); } to { transform: scale(1.14); } }
  #lstate { font-size: 20px; font-weight: bold; }
  #ltext { max-width: 640px; width: 100%; text-align: center; color: var(--muted); font-size: 16px; line-height: 1.5; min-height: 70px; max-height: 28vh; overflow-y: auto; }
  #ltext b { color: var(--text); }
  #live .btns { display: flex; gap: 10px; }

  a.menu { color: var(--link); text-decoration: underline; }
  .menu.on { font-weight: bold; }
  .tools { display: flex; gap: 8px; margin-top: 10px; }
  .tool { padding: 5px 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 6px; font-size: 13px; cursor: pointer; }
  .tool:hover { background: var(--card); }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; text-align: center; font-size: 14px; }
  .stat b { display: block; font-size: 20px; margin: 4px 0; }
  .bar { height: 8px; border-radius: 4px; background: var(--main); }
  details.mon { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 8px 0; }
  details.mon summary { cursor: pointer; font-weight: bold; }
  .dayrow { display: flex; align-items: center; gap: 10px; font-size: 14px; margin: 6px 0; }
  .dayrow .d { width: 92px; flex-shrink: 0; color: var(--muted); }
  .dayrow .t { width: 70px; text-align: right; flex-shrink: 0; }
  .dayrow .track { flex: 1; }

  /* chat answers use the full width (no empty side space) */
  .center.wide { max-width: none; }
  a.chatitem { white-space: normal; overflow-wrap: anywhere; line-height: 1.35; }

  /* tables (difference between ...), diagrams and lists inside answers */
  .tblwrap { overflow-x: auto; margin: 10px 0; }
  table.md { border-collapse: collapse; width: 100%; font-size: 14px; }
  table.md th, table.md td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  table.md thead th { background: var(--card); }
  table.md td:first-child { font-weight: bold; width: 18%; }
  pre.code { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin: 10px 0;
             overflow-x: auto; white-space: pre; font-family: Consolas, "Courier New", monospace; font-size: 14px; line-height: 1.5; }
  ul.md { margin: 6px 0; padding-left: 22px; }
</style>
</head>
<body>

<div id="side">
  <a href="#new" class="menu" onclick="go('new');return false;">+ New Chat</a>
  <a href="#study" class="menu" id="m-study" onclick="go('study');return false;">Self Study</a>
  <a href="#quiz" class="menu" id="m-quiz" onclick="go('quiz');return false;">Quiz</a>
  <a href="#robo" class="menu" id="m-robo" onclick="go('robo');return false;">Mr.Belbase Robo</a>
  <a href="#web" class="menu" id="m-web" onclick="go('web');return false;">YouTube / Google</a>
  <input id="search" placeholder="Search chats" oninput="drawChats()">
  <div class="label">Chats</div>
  <div id="chatlist"></div>
</div>

<div id="main">
  <header><h1>CurriculumX Ai</h1></header>
  <div id="view"></div>
  <div id="bar">
    <input id="ask" placeholder="Ask from Class 9 or 10 Science…" onkeydown="if(event.key==='Enter')send()">
    <button class="go" onclick="send()">Send</button>
  </div>
  <footer>Copyrighted by Curriculum X AI</footer>
</div>


<div id="live">
  <div class="top">
    <b style="font-size:18px">Mr.Belbase Robo</b>
    <select id="llang" onchange="liveLang()">
      <option value="en-US">English</option>
      <option value="en-IN">English (India)</option>
      <option value="ne-NP">नेपाली</option>
      <option value="hi-IN">हिन्दी</option>
    </select>
    <button class="plain" onclick="closeLive()">End</button>
  </div>
  <div id="orbwrap">
    <button id="orb" onclick="orbTap()" aria-label="Talk"></button>
    <div id="lstate">Tap to start</div>
  </div>
  <div id="ltext">Ask anything from Class 9 or 10 Science, just talk.</div>
  <div class="btns"><button class="plain" id="lmute" onclick="toggleMute()">Mute mic</button></div>
</div>

<script>
// ---------- 1. NOTES (the "syllabus"). Add your own topics here ----------
// All syllabus data: g = class, n = chapter no, c = chapter, a = other names, t = title, q = question, o = question no, s = section, x = text
var notes = [{"g":"10","n":99,"c":"","a":"","t":"Heat – Basic definitions (heat, temperature, thermal energy) | ताप, तापक्रम, ताप ऊर्जा","q":"","o":"","s":"","x":"Chapter: Heat (ताप) – Class 10 Science, SEE.\nHeat (ताप): A form of energy that flows from a body at a higher temperature to a body at a lower temperature because of the temperature difference.\nTemperature (तापक्रम): The degree of hotness or coldness of a body. It decides the direction of heat flow.\nThermal energy (ताप ऊर्जा): The total kinetic energy and potential energy of the molecules that make up a substance.\nKey point: heat is energy in transfer, temperature is the measure of hotness or coldness. Heat flows from high temperature to low temperature until both bodies reach the same temperature."},{"g":"10","n":99,"c":"","a":"","t":"Heat – Effects of heat | तापका असरहरू","q":"","o":"","s":"","x":"Effects of heat (तापका असरहरू):\n1. Change in temperature: adding or removing heat changes the temperature (thermal state) of a body.\n2. Change in state: heat can change the state of matter – solid to liquid (melting), liquid to gas (boiling/vaporization), and the reverse when heat is removed.\n3. Change in volume (expansion): most substances expand (विस्तार) when heated and contract (संकुचन) when cooled."},{"g":"10","n":99,"c":"","a":"","t":"Heat – Anomalous expansion of water | पानीको असामान्य प्रसार","q":"","o":"","s":"","x":"Anomalous expansion of water (पानीको असामान्य प्रसार):\nMost liquids keep expanding when heated and keep contracting when cooled. Water behaves unusually between 0°C and 4°C.\nWhen water is heated from 0°C to 4°C it contracts instead of expanding.\nThe density of water is maximum at 4°C: 1 g/cm³ or 1000 kg/m³.\nAbove 4°C water expands normally when heated.\nResult: in cold regions the top of a lake freezes first while the water near the bottom stays at about 4°C, so fish and other aquatic life survive under the ice."},{"g":"10","n":99,"c":"","a":"","t":"Heat – Specific heat capacity and Q = mcΔt | विशिष्ट ताप धारिता","q":"","o":"","s":"","x":"Specific heat capacity (विशिष्ट ताप धारिता):\nThe amount of heat energy required to raise the temperature of a unit mass (1 kg) of a substance by 1°C (or 1 K).\nFormula: Q = m × c × Δt\nwhere Q = heat absorbed or released, m = mass, c = specific heat capacity, Δt = change in temperature (final temperature − initial temperature).\nUnit of c: J/kg°C (or J/kg K). Water has a high specific heat capacity, 4200 J/kg°C.\nNumerical method: write the given values, write the formula Q = mcΔt, substitute, and give the answer with the unit."},{"g":"10","n":99,"c":"","a":"","t":"Heat – Thermometry, fixed points and temperature scales | तापक्रम मापन","q":"","o":"","s":"","x":"Thermometry and calibration (तापक्रम मापन):\nFixed points of a thermometer:\n- Lower fixed point (ice point / हिमाङ्क): temperature of pure melting ice = 0°C = 32°F = 273 K.\n- Upper fixed point (steam point / क्वथनाङ्क): temperature of steam from pure boiling water at standard pressure = 100°C = 212°F = 373 K.\nTemperature scales: Celsius (°C), Fahrenheit (°F) and Kelvin (K).\nScale conversion: C/100 = (F − 32)/180 = (K − 273)/100, which simplifies to C/5 = (F − 32)/9 = (K − 273)/5.\nFundamental interval: Celsius scale 100 divisions, Fahrenheit scale 180 divisions, Kelvin scale 100 divisions."},{"g":"10","n":99,"c":"","a":"","t":"Heat – Reasoning question: Why should you not put your hand directly over boiling water? | उमालिएको पानीमाथि हात किन नराख्ने?","q":"","o":"","s":"","x":"Question: Why should you not put your hand directly over boiling water?\nAnswer: Boiling water produces steam. Steam has extra latent heat of vaporization along with high kinetic energy of its molecules. When steam touches the skin it condenses and releases this large amount of latent heat, so it burns the skin more severely than boiling water at the same temperature. Therefore we should never put our hand directly over boiling water or its steam."},{"g":"10","n":99,"c":"","a":"","t":"Heat – Reasoning question: Why do we feel warm after entering a room from a cold outside environment? | चिसो बाहिरबाट कोठाभित्र पस्दा किन तातो महसुस हुन्छ?","q":"","o":"","s":"","x":"Question: Why do we feel warm after entering a room from a cold outside environment?\nAnswer: Our sense of hotness or coldness depends on how fast heat flows between our body and the surroundings, not on the actual temperature. Outside, the air is much colder than our body, so our body loses heat quickly and we feel cold. Inside the room the air is warmer, so heat flows away from our body more slowly (and the room, clothes or blanket keep the heat around us). Because we lose less heat, we feel warm."},{"g":"10","n":1,"c":"Scientific Learning","a":"scientific study वैज्ञानिक अध्ययन वैज्ञानिक सिकाइ","t":"Scientific Study – Exercise 1(a): Which of the following is a fundamental unit? | वैज्ञानिक अध्ययन अभ्यास 1(a)","q":"Which of the following is a fundamental unit?","o":"1(a)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 10 Science, SEE. Exercise 1(a).\n\nOptions: i. Newton  ii. Pascal  iii. Kilogram  iv. Joule\n\n**Answer: iii. kilogram**"},{"g":"10","n":1,"c":"Scientific Learning","a":"scientific study वैज्ञानिक अध्ययन वैज्ञानिक सिकाइ","t":"Scientific Study – Exercise 1(b): Which of the following physical quantities has the unit m s⁻¹? | वैज्ञानिक अध्ययन अभ्यास 1(b)","q":"Which of the following physical quantities has the unit m s⁻¹?","o":"1(b)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 10 Science, SEE. Exercise 1(b).\n\nOptions: i. Acceleration  ii. Velocity  iii. Force  iv. Density\n\n**Answer: ii. velocity**"},{"g":"10","n":1,"c":"Scientific Learning","a":"scientific study वैज्ञानिक अध्ययन वैज्ञानिक सिकाइ","t":"Scientific Study – Exercise 1(c): Which of the following is a derived unit? | वैज्ञानिक अध्ययन अभ्यास 1(c)","q":"Which of the following is a derived unit?","o":"1(c)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 10 Science, SEE. Exercise 1(c).\n\nOptions: i. Candela  ii. Ampere  iii. Joule  iv. Kelvin\n\n**Answer: iii. joule**"},{"g":"10","n":1,"c":"Scientific Learning","a":"scientific study वैज्ञानिक अध्ययन वैज्ञानिक सिकाइ","t":"Scientific Study – Exercise 1(d): Which of the following units denote Newton? | वैज्ञानिक अध्ययन अभ्यास 1(d)","q":"Which of the following units denote Newton?","o":"1(d)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 10 Science, SEE. Exercise 1(d).\n\nOptions: i. kg m s⁻²  ii. kg m² s⁻²  iii. kg m⁻² s⁻²  iv. kg m s⁻¹\n\n**Answer: i. kg m s⁻²**\n\nBecause,\nF = ma\nN = kg × m s⁻² = kg m s⁻²"},{"g":"10","n":1,"c":"Scientific Learning","a":"scientific study वैज्ञानिक अध्ययन वैज्ञानिक सिकाइ","t":"Scientific Study – Exercise 2(a): Give reason: Joule is the derived unit of work. | वैज्ञानिक अध्ययन अभ्यास 2(a)","q":"Give reason: Joule is the derived unit of work.","o":"2(a)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 10 Science, SEE. Exercise 2(a).\n\nWork is given by:\nW = F × d\n\nThe SI unit of force is newton:\nN = kg m s⁻²\n\nDistance has the unit metre (m).\n\nTherefore,\nJ = N × m\nJ = kg m s⁻² × m\n**J = kg m² s⁻²**\n\nThus, joule is a derived unit because it is formed from the fundamental units kilogram, metre and second."},{"g":"10","n":1,"c":"Scientific Learning","a":"scientific study वैज्ञानिक अध्ययन वैज्ञानिक सिकाइ","t":"Scientific Study – Exercise 2(b): Give reason: Some variables should be controlled while performing an experiment. | वैज्ञानिक अध्ययन अभ्यास 2(b)","q":"Give reason: Some variables should be controlled while performing an experiment.","o":"2(b)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 10 Science, SEE. Exercise 2(b).\n\nSome variables are controlled so that they do not affect the result of the experiment. If several variables change at the same time, it becomes difficult to know which variable caused the change in the result. Therefore, controlling other variables makes the experiment valid, reliable and accurate."},{"g":"10","n":1,"c":"Scientific Learning","a":"scientific study वैज्ञानिक अध्ययन वैज्ञानिक सिकाइ","t":"Scientific Study – Exercise 2(c): Give reason: v² = ut is not a valid relation. | वैज्ञानिक अध्ययन अभ्यास 2(c)","q":"Give reason: v² = ut is not a valid relation.","o":"2(c)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 10 Science, SEE. Exercise 2(c).\n\nWe check the units of both sides.\n\nLeft side:\nv² = (m s⁻¹)² = m² s⁻²\n\nRight side:\nut = (m s⁻¹) × s = m\n\nTherefore,\nm² s⁻² ≠ m\n\nThe units on both sides are not the same. Hence, **v² = ut is not a valid relation.**"},{"g":"10","n":1,"c":"Scientific Learning","a":"scientific study वैज्ञानिक अध्ययन वैज्ञानिक सिकाइ","t":"Scientific Study – Exercise 3(a): Differentiate between independent variable and dependent variable. | वैज्ञानिक अध्ययन अभ्यास 3(a)","q":"Differentiate between independent variable and dependent variable.","o":"3(a)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 10 Science, SEE. Exercise 3(a).\n\n|  | Independent variable | Dependent variable |\n|---|---|---|\n| Change | It is changed or manipulated by the researcher. | Its value changes because of the independent variable. |\n| Role | It is the causative factor. | It is the effect. |\n| Graph | It is usually plotted on the x-axis. | It is usually plotted on the y-axis. |\n| Also called | It is also called the x-variable. | It is also called the y-variable. |\n| Example | Amount of sunlight given to a plant. | Growth/height of the plant. |"},{"g":"10","n":1,"c":"Scientific Learning","a":"scientific study वैज्ञानिक अध्ययन वैज्ञानिक सिकाइ","t":"Scientific Study – Exercise 3(b): Differentiate between fundamental unit and derived unit. | वैज्ञानिक अध्ययन अभ्यास 3(b)","q":"Differentiate between fundamental unit and derived unit.","o":"3(b)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 10 Science, SEE. Exercise 3(b).\n\n|  | Fundamental unit | Derived unit |\n|---|---|---|\n| Existence | It has an independent existence. | It is formed from fundamental units. |\n| Expressed in | It cannot be expressed in terms of simpler units. | It can be expressed in terms of fundamental units. |\n| Number | There are seven SI fundamental units. | There are many derived units. |\n| Examples | Metre, kilogram, second. | Newton, joule, pascal. |"},{"g":"10","n":1,"c":"Scientific Learning","a":"scientific study वैज्ञानिक अध्ययन वैज्ञानिक सिकाइ","t":"Scientific Study – Exercise 4(a): What is a unit? | वैज्ञानिक अध्ययन अभ्यास 4(a)","q":"What is a unit?","o":"4(a)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 10 Science, SEE. Exercise 4(a).\n\nA unit is a fixed standard quantity used for measuring a physical quantity.\n\nExample: metre is the standard unit used to measure length."},{"g":"10","n":1,"c":"Scientific Learning","a":"scientific study वैज्ञानिक अध्ययन वैज्ञानिक सिकाइ","t":"Scientific Study – Exercise 4(b): Write the SI units of mass, temperature, energy and density. | वैज्ञानिक अध्ययन अभ्यास 4(b)","q":"Write the SI units of mass, temperature, energy and density.","o":"4(b)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 10 Science, SEE. Exercise 4(b).\n\n| Physical quantity | SI unit |\n|---|---|\n| Mass | kilogram (kg) |\n| Temperature | kelvin (K) |\n| Energy | joule (J) |\n| Density | kilogram per cubic metre (kg/m³) |"},{"g":"10","n":1,"c":"Scientific Learning","a":"scientific study वैज्ञानिक अध्ययन वैज्ञानिक सिकाइ","t":"Scientific Study – Exercise 4(c): How is the validity of an equation checked? Write an example. | वैज्ञानिक अध्ययन अभ्यास 4(c)","q":"How is the validity of an equation checked? Write an example.","o":"4(c)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 10 Science, SEE. Exercise 4(c).\n\nThe validity of an equation is checked by unit analysis. The units on both sides of a valid equation must be the same.\n\nFor example: s = vt\n\nUnit of left side: [s] = m\nUnit of right side: [vt] = m s⁻¹ × s = m\n\nSince both sides have the same unit, the equation is valid.\n**s = vt is valid.**"},{"g":"10","n":1,"c":"Scientific Learning","a":"scientific study वैज्ञानिक अध्ययन वैज्ञानिक सिकाइ","t":"Scientific Study – Exercise 4(d): Mention the fundamental units involved in the unit of pressure. | वैज्ञानिक अध्ययन अभ्यास 4(d)","q":"Mention the fundamental units involved in the unit of pressure.","o":"4(d)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 10 Science, SEE. Exercise 4(d).\n\nPressure is: P = F / A\n\nForce: F = kg m s⁻²\nArea: A = m²\n\nTherefore,\nP = (kg m s⁻²) / m²\nP = kg m⁻¹ s⁻²\n\nThus, the fundamental units involved in pressure are: **kg, m, s**"},{"g":"10","n":1,"c":"Scientific Learning","a":"scientific study वैज्ञानिक अध्ययन वैज्ञानिक सिकाइ","t":"Scientific Study – Exercise 4(e): Find the fundamental units involved in the given derived units: newton (N), watt (W), joule (J), pascal (Pa). | वैज्ञानिक अध्ययन अभ्यास 4(e)","q":"Find the fundamental units involved in the given derived units: newton (N), watt (W), joule (J), pascal (Pa).","o":"4(e)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 10 Science, SEE. Exercise 4(e).\n\n**i. Newton (N)**\nWe know: F = ma\nTherefore, N = kg × m s⁻²\n**N = kg m s⁻²**\nFundamental units: kg, m and s\n\n**ii. Watt (W)**\nPower: P = W / t\nWork: W = kg m² s⁻²\nTherefore, W = (kg m² s⁻²) / s\n**W = kg m² s⁻³**\nFundamental units: kg, m and s\n\n**iii. Joule (J)**\nWork: W = F × d\nJ = (kg m s⁻²) × m\n**J = kg m² s⁻²**\nFundamental units: kg, m and s\n\n**iv. Pascal (Pa)**\nPressure: P = F / A\nPa = (kg m s⁻²) / m²\n**Pa = kg m⁻¹ s⁻²**\nFundamental units: kg, m and s"},{"g":"10","n":1,"c":"Scientific Learning","a":"scientific study वैज्ञानिक अध्ययन वैज्ञानिक सिकाइ","t":"Scientific Study – Exercise 4(f): Check the validity of P = mv² and P = mv/A by unit analysis. | वैज्ञानिक अध्ययन अभ्यास 4(f)","q":"Check the validity of P = mv² and P = mv/A by unit analysis.","o":"4(f)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 10 Science, SEE. Exercise 4(f).\n\nThere are two formulae given.\n\n**1. P = mv²**\nHere, P represents power.\nThe unit of power is: [P] = kg m² s⁻³\n\nRight side: [mv²]\nMass: [m] = kg\nVelocity: [v] = m s⁻¹\nTherefore, [mv²] = kg (m s⁻¹)² = kg m² s⁻²\n\nThus, kg m² s⁻³ ≠ kg m² s⁻²\nTherefore, **P = mv² is invalid.**\n\n**2. P = mv / A**\nHere, P represents pressure.\nUnit of pressure: [P] = kg m⁻¹ s⁻²\n\nRight side: [mv / A] = (kg × m s⁻¹) / m² = kg m⁻¹ s⁻¹\n\nSince, kg m⁻¹ s⁻² ≠ kg m⁻¹ s⁻¹\nTherefore, **P = mv / A is invalid.**"},{"g":"10","n":1,"c":"Scientific Learning","a":"scientific study वैज्ञानिक अध्ययन वैज्ञानिक सिकाइ","t":"Scientific Study – Exercise 4(g): Describe independent, dependent and controlled variables with examples. | वैज्ञानिक अध्ययन अभ्यास 4(g)","q":"Describe independent, dependent and controlled variables with examples.","o":"4(g)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 10 Science, SEE. Exercise 4(g).\n\n**Independent variable**\nThe variable which is deliberately changed or manipulated by the researcher is called the independent variable.\nExample: If we study the effect of sunlight on plant growth, the amount of sunlight is the independent variable.\n\n**Dependent variable**\nThe variable whose value depends on the independent variable is called the dependent variable.\nExample: The height or growth of the plant is the dependent variable.\n\n**Controlled variable**\nThe variables that are kept constant throughout an experiment are called controlled variables.\nExample: In the plant experiment, the type of plant, amount of water, amount of manure, soil and size of the pots can be controlled variables."},{"g":"10","n":1,"c":"Scientific Learning","a":"scientific study वैज्ञानिक अध्ययन वैज्ञानिक सिकाइ","t":"Scientific Study – Exercise 4(h): Karma's dry-cell and wire experiment: how the thickness of wire affects the life span of a dry cell. Identify the variables. | वैज्ञानिक अध्ययन अभ्यास 4(h)","q":"Karma's dry-cell and wire experiment: how the thickness of wire affects the life span of a dry cell. Identify the variables.","o":"4(h)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 10 Science, SEE. Exercise 4(h).\n\nKarma wants to find how the thickness of wire affects the life span of a dry cell.\n\n**Independent variable:** Thickness of the wire (because Karma changes the thickness of the wire).\n\n**Dependent variable:** Life span of the dry cell (because it depends on the thickness of the wire).\n\n**Controlled variables:**\n- Same type of dry cell\n- Same voltage/rating of dry cell\n- Same bulb\n- Same length of wire\n- Same material of wire\n- Same environmental conditions\n\nTherefore:\nIndependent = thickness of wire\nDependent = life span of dry cell\nControlled = type of cell, bulb, wire length, material, etc."},{"g":"10","n":1,"c":"Scientific Learning","a":"scientific study वैज्ञानिक अध्ययन वैज्ञानिक सिकाइ","t":"Scientific Study – Exercise 4(i): Chandani's plant experiment: identify the independent, dependent and controlled variables, and explain why she used 3 pots for each experiment. | वैज्ञानिक अध्ययन अभ्यास 4(i)","q":"Chandani's plant experiment: identify the independent, dependent and controlled variables, and explain why she used 3 pots for each experiment.","o":"4(i)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 10 Science, SEE. Exercise 4(i).\n\n**i. Variables**\nChandani is investigating the effect of different substances mixed with soil on plant growth.\n\n**Independent variable:** Type of substance mixed with the soil, for example:\n- Lime\n- Urea fertilizer\n- Common salt\n- Compost manure\n\n**Dependent variable:** Growth/height of the plant (because the plant growth depends on the substance added to the soil).\n\n**Controlled variables:**\n- Same type of seed\n- Same amount of soil\n- Same size of pots\n- Same amount of substance\n- Same amount of water\n- Same amount of sunlight\n- Same environmental conditions\n- Same type of plant\n\n**ii. Why did Chandani use 3 pots for each experiment?**\nChandani used three pots for each experiment to make the result more reliable and accurate.\nIf only one pot were used, an unusual result in that pot could affect the conclusion. By using three pots, she can compare the results and obtain a more reliable average."},{"g":"10","n":1,"c":"Scientific Learning","a":"scientific study वैज्ञानिक अध्ययन वैज्ञानिक सिकाइ","t":"Scientific Study – Exercise 4(j): Subodh's experiment: how the colour of an object affects its ability to hold heat. Identify the variables. | वैज्ञानिक अध्ययन अभ्यास 4(j)","q":"Subodh's experiment: how the colour of an object affects its ability to hold heat. Identify the variables.","o":"4(j)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 10 Science, SEE. Exercise 4(j).\n\nSubodh wants to study how the colour of an object affects its ability to hold heat.\n\n**Independent variable:** Colour of the flask (black, white, green, red). The colour is changed by Subodh.\n\n**Dependent variable:** Temperature of the water (the temperature changes according to the colour of the flask).\n\n**Controlled variables:** Subodh should keep the following the same:\n- Same type and size of flask\n- Same amount of water\n- Same type of water\n- Same type of cork\n- Same exposure time in sunlight\n- Same position/environment\n- Same initial temperature of water"},{"g":"10","n":1,"c":"Scientific Learning","a":"scientific study वैज्ञानिक अध्ययन वैज्ञानिक सिकाइ","t":"Scientific Study – Exercise 4(k): Manisha's dog experiment: what is wrong with the experiment and how can she correct it? (amount of food and time of giving food vs eating speed) | वैज्ञानिक अध्ययन अभ्यास 4(k)","q":"Manisha's dog experiment: what is wrong with the experiment and how can she correct it? (amount of food and time of giving food vs eating speed)","o":"4(k)","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 10 Science, SEE. Exercise 4(k).\n\nManisha wants to study how both the amount of food and the time of giving food affect the speed at which the dog eats.\n\n**What is wrong with the experiment?**\nThere are two independent variables:\n- Amount of food\n- Time of giving food\n\nIf both are changed, it becomes difficult to determine which factor caused the change in the dog's eating speed. A scientific experiment should normally change only one independent variable at a time.\n\n**How can she correct it?**\nShe should conduct separate experiments.\n\n**Experiment 1:** Keep the feeding time constant and change only the amount of food. Then observe the eating speed.\n\n**Experiment 2:** Keep the amount of food constant and change only the feeding time. Then observe the eating speed.\n\nOther factors such as the same dog, type of food, feeding place and environmental conditions should be controlled."},{"g":"10","n":1,"c":"Scientific Learning","a":"scientific study वैज्ञानिक अध्ययन वैज्ञानिक सिकाइ","t":"Scientific Study – Exercise 5: Prove that the unit of electrical resistance is Ω = kg m² s⁻³ A⁻². | वैज्ञानिक अध्ययन अभ्यास 5","q":"Prove that the unit of electrical resistance is Ω = kg m² s⁻³ A⁻².","o":"5","s":"","x":"Chapter: Scientific Study (वैज्ञानिक अध्ययन) – Class 10 Science, SEE. Exercise 5.\n\nWe know from Ohm's law:\nR = V / I\nwhere R = resistance, V = potential difference, I = electric current.\n\nWe know that:\nV = W / Q\n\nThe unit of work is: J = kg m² s⁻²\nThe unit of electric charge is: C = A s\n\nTherefore,\nV = (kg m² s⁻²) / (A s)\nV = kg m² s⁻³ A⁻¹\n\nNow, R = V / I\nR = (kg m² s⁻³ A⁻¹) / A\n**R = kg m² s⁻³ A⁻²**\n\nHence, **Ω = kg m² s⁻³ A⁻²**\n\nProved."},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 1(a): What are the main features of organisms under kingdom Plantae? | जीवहरूको वर्गीकरण अभ्यास 1(a)","q":"What are the main features of organisms under kingdom Plantae?","o":"1(a)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 1(a).\n\n**Answer: iii. Eukaryotic cell, cell with cell wall, autotrophs**"},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 1(b): Why is Cycas kept in gymnosperm? | जीवहरूको वर्गीकरण अभ्यास 1(b)","q":"Why is Cycas kept in gymnosperm?","o":"1(b)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 1(b).\n\n**Answer: iii. Bears cones instead of flowers, seeds are naked without fruit**"},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 1(c): Why are the animals shown in the figure grouped under the same kingdom? | जीवहरूको वर्गीकरण अभ्यास 1(c)","q":"Why are the animals shown in the figure grouped under the same kingdom?","o":"1(c)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 1(c).\n\n**Answer: ii. Multicellular and heterotrophic**"},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 1(d): Based on evolution, which groups of organisms are closely related? | जीवहरूको वर्गीकरण अभ्यास 1(d)","q":"Based on evolution, which groups of organisms are closely related?","o":"1(d)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 1(d).\n\n**Answer: iv. Platyhelminthes, Nemathelminthes, Annelida**"},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 1(e): What is the main reason for classifying whales in the class Mammalia? | जीवहरूको वर्गीकरण अभ्यास 1(e)","q":"What is the main reason for classifying whales in the class Mammalia?","o":"1(e)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 1(e).\n\n**Answer: iv. Gives birth and suckle milk to young ones**"},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 1(f): Why are club mosses more advanced than mosses? | जीवहरूको वर्गीकरण अभ्यास 1(f)","q":"Why are club mosses more advanced than mosses?","o":"1(f)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 1(f).\n\n**Answer: iii. Xylem and phloem tissue are found in clubmoss.**"},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 1(g): To which kingdom do organisms having cell walls belong? | जीवहरूको वर्गीकरण अभ्यास 1(g)","q":"To which kingdom do organisms having cell walls belong?","o":"1(g)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 1(g).\n\n**Answer: iv. Fungi, Plantae, Monera**"},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 1(h): To which class do egg-laying animals with a four-chambered heart and body covered with feathers belong? | जीवहरूको वर्गीकरण अभ्यास 1(h)","q":"To which class do egg-laying animals with a four-chambered heart and body covered with feathers belong?","o":"1(h)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 1(h).\n\n**Answer: iii. Aves**"},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 1(i): Which group of plants belongs to angiosperm? | जीवहरूको वर्गीकरण अभ्यास 1(i)","q":"Which group of plants belongs to angiosperm?","o":"1(i)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 1(i).\n\n**Answer: iv. Paddy, banana, mango**"},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 1(j): Which division do the plants having vascular tissue belong to? | जीवहरूको वर्गीकरण अभ्यास 1(j)","q":"Which division do the plants having vascular tissue belong to?","o":"1(j)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 1(j).\n\n**Answer: iii. Tracheophyta**"},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 2(a): Differentiate between plant kingdom and animal kingdom. | जीवहरूको वर्गीकरण अभ्यास 2(a)","q":"Differentiate between plant kingdom and animal kingdom.","o":"2(a)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 2(a).\n\n|  | Plant kingdom | Animal kingdom |\n|---|---|---|\n| Cells | They have eukaryotic cells with cell wall. | They have eukaryotic cells without cell wall. |\n| Nutrition | They are generally autotrophs. | They are heterotrophs. |\n| Chlorophyll | They contain chlorophyll in green plants. | They do not contain chlorophyll. |\n| Classification | They are classified into Algae, Bryophyta and Tracheophyta. | They are classified into different phyla such as Porifera, Coelenterata, Annelida, Arthropoda, Chordata, etc. |"},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 2(b): Differentiate between fish and starfish. | जीवहरूको वर्गीकरण अभ्यास 2(b)","q":"Differentiate between fish and starfish.","o":"2(b)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 2(b).\n\n|  | Fish | Starfish |\n|---|---|---|\n| Group | Fish belongs to class Pisces. | Starfish belongs to phylum Echinodermata. |\n| Vertebral column | It has a vertebral column. | It has no vertebral column. |\n| Other features | It has a two-chambered heart. | The textbook states that echinoderms have a developed digestive system and tube feet. |\n| Respiration | It breathes through gills. | It respires through gills. |\n| Locomotion | It has fins for locomotion. | It moves with the help of tube feet. |"},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 2(c): Differentiate between jellyfish and cuttlefish. | जीवहरूको वर्गीकरण अभ्यास 2(c)","q":"Differentiate between jellyfish and cuttlefish.","o":"2(c)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 2(c).\n\n|  | Jellyfish | Cuttlefish |\n|---|---|---|\n| Phylum | It belongs to phylum Coelenterata. | It belongs to phylum Mollusca. |\n| Body | It is diploblastic. | It is a soft-bodied mollusc. |\n| Tentacles | It has tentacles containing stinging cells or nematocysts. | It has tentacles in the head. |\n| Other features | It has a coelenteron. | It has muscular feet for locomotion. |\n| Symmetry | It shows radial symmetry. | Its body is asymmetrical. |"},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 2(d): Differentiate between moss and club moss. | जीवहरूको वर्गीकरण अभ्यास 2(d)","q":"Differentiate between moss and club moss.","o":"2(d)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 2(d).\n\n|  | Moss | Club moss |\n|---|---|---|\n| Group | Moss belongs to Bryophyta. | Club moss belongs to Pteridophyta. |\n| Vascular tissue | It has no vascular tissue. | It has developed xylem and phloem. |\n| Plant body | Its plant body may be differentiated into rhizoid, stem and simple leaf. | Its plant body is differentiated into root, stem and leaf. |\n| Dominant phase | Gametophytic phase is dominant. | Sporophytic phase is dominant. |\n| Other features | It grows only a few centimetres high or spreads on the substratum. | It has developed vascular tissue. |"},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 2(e): Differentiate between Pinus and Peepal. | जीवहरूको वर्गीकरण अभ्यास 2(e)","q":"Differentiate between Pinus and Peepal.","o":"2(e)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 2(e).\n\n|  | Pinus | Peepal |\n|---|---|---|\n| Group | Pinus belongs to Gymnosperm. | Peepal belongs to Angiosperm. |\n| Flowers | It bears cones instead of flowers. | It bears real flowers. |\n| Seeds | Its seeds are naked. | Its seeds are enclosed inside fruits. |\n| Leaves | Its leaves are needle-like. | Its leaves have reticulate venation. |\n| Ovary and fruit | It has no ovary and hence no fruit. | It has ovary and fruit. |"},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 2(f): Differentiate between fish and whale. | जीवहरूको वर्गीकरण अभ्यास 2(f)","q":"Differentiate between fish and whale.","o":"2(f)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 2(f).\n\n|  | Fish | Whale |\n|---|---|---|\n| Class | Fish belongs to class Pisces. | Whale belongs to class Mammalia. |\n| Respiration | It breathes through gills. | It breathes through lungs. |\n| Heart | Its heart is two-chambered. | Its heart is four-chambered. |\n| Body temperature | It is poikilothermic. | It is homeothermic. |\n| Reproduction | It is mostly oviparous. | It is viviparous. |"},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 2(g): Differentiate between dove and bat. | जीवहरूको वर्गीकरण अभ्यास 2(g)","q":"Differentiate between dove and bat.","o":"2(g)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 2(g).\n\n|  | Dove | Bat |\n|---|---|---|\n| Class | Dove belongs to class Aves. | Bat belongs to class Mammalia. |\n| Body covering | Its body is covered with feathers. | Its body is covered with hair. |\n| Forelimbs | Its forelimbs are modified into wings. | It has forelimbs modified for flying. |\n| Reproduction | It is oviparous. | It is viviparous. |\n| Heart | It has a four-chambered heart. | It has a four-chambered heart. |"},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 3(a): Give reason: Living beings need to be classified. | जीवहरूको वर्गीकरण अभ्यास 3(a)","q":"Give reason: Living beings need to be classified.","o":"3(a)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 3(a).\n\nLiving beings need to be classified because there are various types of organisms with different structures, characteristics and forms. Classification is the process of grouping organisms on the basis of their similarities and differences. It makes the study of living beings easier and systematic."},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 3(b): Give reason: Fucus and Marchantia look alike, but Fucus is classified as algae while Marchantia is classified as bryophyta. | जीवहरूको वर्गीकरण अभ्यास 3(b)","q":"Give reason: Fucus and Marchantia look alike, but Fucus is classified as algae while Marchantia is classified as bryophyta.","o":"3(b)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 3(b).\n\nFucus is classified as algae because its plant body is a thallus and root, stem and leaf cannot be differentiated. Marchantia is classified as Bryophyta because it is more developed than algae and belongs to bryophytes. Thus, they are placed in different divisions on the basis of their characteristics."},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 3(c): Give reason: Gymnosperms do not bear fruit. | जीवहरूको वर्गीकरण अभ्यास 3(c)","q":"Give reason: Gymnosperms do not bear fruit.","o":"3(c)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 3(c).\n\nGymnosperms bear cones instead of flowers. There is no ovary in the cone. Since fruit develops from the ovary, gymnosperms do not bear fruits. Their seeds remain naked."},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 3(d): Give reason: Although a crocodile has a four-chambered heart, it belongs to the reptilian class. | जीवहरूको वर्गीकरण अभ्यास 3(d)","q":"Give reason: Although a crocodile has a four-chambered heart, it belongs to the reptilian class.","o":"3(d)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 3(d).\n\nCrocodiles have a four-chambered heart, but they have other characteristics of reptiles. Their body is covered with dry and horny scales, they are poikilothermic, breathe through lungs and are oviparous. Therefore, crocodiles belong to Reptilia."},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 3(e): Give reason: Although bats and whales have dissimilar characteristics, they belong to the same class. | जीवहरूको वर्गीकरण अभ्यास 3(e)","q":"Give reason: Although bats and whales have dissimilar characteristics, they belong to the same class.","o":"3(e)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 3(e).\n\nBats and whales belong to Mammalia because their bodies are covered with hair, they have developed mammary glands, breathe through lungs, are homeothermic, have four-chambered hearts, undergo internal fertilization and are viviparous."},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 3(f): Give reason: Riccia is an amphibian plant. | जीवहरूको वर्गीकरण अभ्यास 3(f)","q":"Give reason: Riccia is an amphibian plant.","o":"3(f)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 3(f).\n\nRiccia is a bryophyte. Bryophytes need water for fertilization. Therefore, they are called amphibian plants. Hence, Riccia is called an amphibian plant."},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 3(g): Give reason: Fern, Cycas and banana are kept in the same division although they are different. | जीवहरूको वर्गीकरण अभ्यास 3(g)","q":"Give reason: Fern, Cycas and banana are kept in the same division although they are different.","o":"3(g)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 3(g).\n\nFern, Cycas and banana have a plant body differentiated into root, stem and leaf and contain vascular tissues such as xylem and phloem. Therefore, all three are included in the division Tracheophyta. They are further classified into Pteridophyta, Gymnosperm and Angiosperm respectively."},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 4(a): Into how many divisions are the organisms in plant kingdom divided? | जीवहरूको वर्गीकरण अभ्यास 4(a)","q":"Into how many divisions are the organisms in plant kingdom divided?","o":"4(a)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 4(a).\n\nThe organisms in kingdom Plantae are divided into **three divisions**:\n\n1. Algae\n2. Bryophyta\n3. Tracheophyta"},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 4(b): Write the main features of kingdom Plantae. | जीवहरूको वर्गीकरण अभ्यास 4(b)","q":"Write the main features of kingdom Plantae.","o":"4(b)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 4(b).\n\nThe main features of kingdom Plantae are:\n\n- They have green pigments called chlorophyll.\n- They include unicellular as well as multicellular green plants.\n- Their cell wall is made up of cellulose.\n- They are autotrophs.\n- Some plants are flowering and some are non-flowering."},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 4(c): Write the similarities of plants which belong to gymnosperm and angiosperm. | जीवहरूको वर्गीकरण अभ्यास 4(c)","q":"Write the similarities of plants which belong to gymnosperm and angiosperm.","o":"4(c)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 4(c).\n\nThe similarities are:\n\n- Both belong to subdivision Tracheophyta.\n- Both are seed-producing plants.\n- Both have well-developed plant bodies.\n- Both have vascular tissues.\n- Both have roots, stems and leaves."},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 4(d): If you are given only the leaves of some plants in tracheophyta, is it possible to distinguish their subdivisions? | जीवहरूको वर्गीकरण अभ्यास 4(d)","q":"If you are given only the leaves of some plants in tracheophyta, is it possible to distinguish their subdivisions?","o":"4(d)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 4(d).\n\nYes, to some extent, the leaves can help in distinguishing the subdivisions.\n\nPteridophytes generally have feather-like leaves and may have sori on the lower surface. Gymnosperms generally have elongated and needle-like leaves. Angiosperms may have different types of leaves; monocotyledons have parallel venation whereas dicotyledons have reticulate venation.\n\nHowever, the textbook gives several characteristics for classification, so observation of only leaves may not always be sufficient."},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 4(e): What are the main characteristics of Pteridophyta? | जीवहरूको वर्गीकरण अभ्यास 4(e)","q":"What are the main characteristics of Pteridophyta?","o":"4(e)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 4(e).\n\nThe main characteristics of Pteridophyta are:\n\n- They are generally found in moist and shady places.\n- They do not produce seeds.\n- Their plant body is differentiated into root, stem and leaf.\n- Their leaves are feather-like.\n- Their stem is generally an underground rhizome.\n- They have developed vascular tissues, xylem and phloem.\n- Sori are found on the lower surface of many leaves.\n- Sori contain sporangia which produce spores.\n- Their plant body is a sporophyte.\n- Their life cycle shows alternation of generation.\n- Sporophytic phase is dominant and lasts longer.\n\nExamples: fern, fiddlehead fern, Lycopodium, Selaginella and Pteris."},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 4(f): Is observation of only flowers a right way to identify monocotyledon? | जीवहरूको वर्गीकरण अभ्यास 4(f)","q":"Is observation of only flowers a right way to identify monocotyledon?","o":"4(f)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 4(f).\n\nNo. Observation of only flowers is not a sufficient way to identify a monocotyledon.\n\nAccording to the textbook, monocotyledons have several characteristics such as parallel venation in leaves, fibrous roots, scattered vascular tissues in the stem, floral parts in three or multiples of three, and seeds with one cotyledon. Therefore, only observing flowers cannot provide all the required characteristics."},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 4(g): Compare the two plants shown in the picture. | जीवहरूको वर्गीकरण अभ्यास 4(g)","q":"Compare the two plants shown in the picture.","o":"4(g)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 4(g).\n\nThis question is based on a figure in the textbook. Compare the two plants shown in the figure on these points:\n\n- root, stem and leaf\n- vascular tissues\n- seeds\n- flowers\n- fruits\n- method of reproduction\n\nThen identify their subdivisions according to these characteristics."},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 4(h): In which group does fish belong to? | जीवहरूको वर्गीकरण अभ्यास 4(h)","q":"In which group does fish belong to?","o":"4(h)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 4(h).\n\nFish belongs to:\n\n**D — Aquatic vertebrates**\n\nFish lives in water and has a vertebral column."},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 4(i): Digestive system is not developed in Porifera. How do they digest food? | जीवहरूको वर्गीकरण अभ्यास 4(i)","q":"Digestive system is not developed in Porifera. How do they digest food?","o":"4(i)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 4(i).\n\nAnimals of phylum Porifera have pores in their body. Water enters through the small pores called ostia and exits through the larger pore called osculum. They obtain food from the water entering their body through the water canal system."},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 4(j): How can Rakesh identify the phylum of an animal? | जीवहरूको वर्गीकरण अभ्यास 4(j)","q":"How can Rakesh identify the phylum of an animal?","o":"4(j)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 4(j).\n\nRakesh can identify the phylum by observing its external and internal characteristics. He can observe:\n\n- body shape and structure\n- symmetry\n- presence or absence of vertebral column\n- segmentation\n- body covering\n- appendages\n- type of locomotion\n- habitat\n- digestive and respiratory structures\n\nThen he can compare these characteristics with the characteristics of the different animal phyla and classify the animal accordingly."},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 4(k): Shark and whale both live in water. Which is more developed? Explain. | जीवहरूको वर्गीकरण अभ्यास 4(k)","q":"Shark and whale both live in water. Which is more developed? Explain.","o":"4(k)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 4(k).\n\nAccording to the classification given in the textbook, whale is more developed than shark.\n\nShark belongs to class Pisces. Fish have a two-chambered heart and are poikilothermic.\n\nWhale belongs to class Mammalia. Mammals have a four-chambered heart, are homeothermic, breathe through lungs, have developed mammary glands and are viviparous.\n\nTherefore, the characteristics of whale show a more advanced level of development."},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 4(l): Compare the two animals shown in the figure (phylum and class, two similarities and two differences, relation with evolution). | जीवहरूको वर्गीकरण अभ्यास 4(l)","q":"Compare the two animals shown in the figure (phylum and class, two similarities and two differences, relation with evolution).","o":"4(l)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 4(l).\n\nThis question is based on a figure in the textbook. The answer should contain:\n\n**i. Phylum and class**\nIdentify each animal according to its body structure and characteristics.\n\n**ii. Two similarities and two differences**\nCompare their body structure, respiration, reproduction, heart, habitat or other textbook characteristics.\n\n**iii. Relation with evolution**\nTheir similarities show common characteristics, while their differences show that organisms developed new characteristics during evolution. Classification therefore helps to understand evolutionary relationships."},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 4(m): Explain the relation between classification of living beings and evolution. | जीवहरूको वर्गीकरण अभ्यास 4(m)","q":"Explain the relation between classification of living beings and evolution.","o":"4(m)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 4(m).\n\nClassification of living beings is the process of grouping organisms on the basis of their similarities and differences. Evolution is the process of gradual change of living beings from a simpler to a more complex form.\n\nClassification shows that organisms have common characteristics and common ancestry. According to the textbook, prokaryotic organisms evolved first and are now included in Monera. Later, eukaryotic organisms evolved and are included in Protista. Other multicellular organisms such as fungi, plants and animals developed gradually.\n\nFor example, Pisces has a two-chambered heart, reptiles generally have a three-chambered heart, while aves and mammals have four-chambered hearts. Such differences indicate gradual development during evolution.\n\nThus, classification and evolution are related because similarities and differences among organisms help to show their evolutionary relationships."},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 4(n): Draw a chart to show classification of kingdom Plantae according to five kingdom system. | जीवहरूको वर्गीकरण अभ्यास 4(n)","q":"Draw a chart to show classification of kingdom Plantae according to five kingdom system.","o":"4(n)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 4(n).\n\n**Kingdom Plantae**\n\n```text\nKingdom Plantae\n│\n├── Algae\n│\n├── Bryophyta\n│\n└── Tracheophyta\n    │\n    ├── Pteridophyta\n    │\n    ├── Gymnosperm\n    │\n    └── Angiosperm\n        │\n        ├── Monocotyledon\n        │\n        └── Dicotyledon\n```"},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 4(o): Draw a chart to show classification of kingdom Animalia according to five kingdom system. | जीवहरूको वर्गीकरण अभ्यास 4(o)","q":"Draw a chart to show classification of kingdom Animalia according to five kingdom system.","o":"4(o)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 4(o).\n\n**Kingdom Animalia**\n\n```text\nKingdom Animalia\n│\n├── Invertebrates\n│   │\n│   ├── Porifera\n│   ├── Coelenterata\n│   ├── Platyhelminthes\n│   ├── Nemathelminthes\n│   ├── Annelida\n│   ├── Arthropoda\n│   ├── Mollusca\n│   └── Echinodermata\n│\n└── Chordata\n    │\n    └── Vertebrata\n        │\n        ├── Pisces\n        ├── Amphibia\n        ├── Reptilia\n        ├── Aves\n        └── Mammalia\n```\n\nThere are altogether **nine phyla** in kingdom Animalia: eight invertebrate phyla and Chordata."},{"g":"10","n":2,"c":"Classification of Living Beings","a":"जीवहरूको वर्गीकरण जीवको वर्गीकरण classification of living","t":"Classification of Living Beings – Exercise 4(p): Look at the picture and answer: which animal has a two-chambered heart, which suckles milk, two similarities between frogs and snakes, which have air sacs. | जीवहरूको वर्गीकरण अभ्यास 4(p)","q":"Look at the picture and answer: which animal has a two-chambered heart, which suckles milk, two similarities between frogs and snakes, which have air sacs.","o":"4(p)","s":"","x":"Chapter: Classification of Living Beings (जीवहरूको वर्गीकरण) – Class 10 Science, SEE. Exercise 4(p).\n\nThis question is based on a picture in the textbook. Answers from the characteristics given in the chapter:\n\n**i. Which animal has a two-chambered heart?**\nFish\n\n**ii. Which animal suckles milk to its young?**\nMammals, such as the whale.\n\n**iii. Write any two similarities between frogs and snakes.**\n- Both are vertebrates.\n- Both are poikilothermic.\n\n**iv. Which of these animals have air sacs in their bodies?**\nFish and birds (Aves) are described in the textbook as having air sacs in their bodies."},{"g":"10","n":3,"c":"Honey Bee","a":"honeybee मौरी मौरीपालन मौरी पालन","t":"Honey Bee – Exercise 1(a): Which bee contains only 16 chromosomes? | मौरी अभ्यास 1(a)","q":"Which bee contains only 16 chromosomes?","o":"1(a)","s":"","x":"Chapter: Honey Bee (मौरी) – Class 10 Science, SEE. Exercise 1(a).\n\n**Answer: iii. Drone bee**"},{"g":"10","n":3,"c":"Honey Bee","a":"honeybee मौरी मौरीपालन मौरी पालन","t":"Honey Bee – Exercise 1(b): From where is royal jelly produced? | मौरी अभ्यास 1(b)","q":"From where is royal jelly produced?","o":"1(b)","s":"","x":"Chapter: Honey Bee (मौरी) – Class 10 Science, SEE. Exercise 1(b).\n\n**Answer: iii. From the gland at the head of worker bee**"},{"g":"10","n":3,"c":"Honey Bee","a":"honeybee मौरी मौरीपालन मौरी पालन","t":"Honey Bee – Exercise 1(c): Which bee is formed when the larva is fed royal jelly continuously? | मौरी अभ्यास 1(c)","q":"Which bee is formed when the larva is fed royal jelly continuously?","o":"1(c)","s":"","x":"Chapter: Honey Bee (मौरी) – Class 10 Science, SEE. Exercise 1(c).\n\n**Answer: i. Queen**"},{"g":"10","n":3,"c":"Honey Bee","a":"honeybee मौरी मौरीपालन मौरी पालन","t":"Honey Bee – Exercise 1(d): Which stage of the bee is shown in the given diagram? | मौरी अभ्यास 1(d)","q":"Which stage of the bee is shown in the given diagram?","o":"1(d)","s":"","x":"Chapter: Honey Bee (मौरी) – Class 10 Science, SEE. Exercise 1(d).\n\n**Answer: iii. Pupa**"},{"g":"10","n":3,"c":"Honey Bee","a":"honeybee मौरी मौरीपालन मौरी पालन","t":"Honey Bee – Exercise 1(e): Why is honey bee called a social insect? | मौरी अभ्यास 1(e)","q":"Why is honey bee called a social insect?","o":"1(e)","s":"","x":"Chapter: Honey Bee (मौरी) – Class 10 Science, SEE. Exercise 1(e).\n\n**Answer: iii. It lives in colony**"},{"g":"10","n":3,"c":"Honey Bee","a":"honeybee मौरी मौरीपालन मौरी पालन","t":"Honey Bee – Exercise 1(f): When the pollen baskets in the legs of worker bees are broken, which function cannot be performed? | मौरी अभ्यास 1(f)","q":"When the pollen baskets in the legs of worker bees are broken, which function cannot be performed?","o":"1(f)","s":"","x":"Chapter: Honey Bee (मौरी) – Class 10 Science, SEE. Exercise 1(f).\n\n**Answer: iv. Collecting pollen from flower**"},{"g":"10","n":3,"c":"Honey Bee","a":"honeybee मौरी मौरीपालन मौरी पालन","t":"Honey Bee – Exercise 1(g): Which of the following is the characteristic of the drone bee? | मौरी अभ्यास 1(g)","q":"Which of the following is the characteristic of the drone bee?","o":"1(g)","s":"","x":"Chapter: Honey Bee (मौरी) – Class 10 Science, SEE. Exercise 1(g).\n\n**Answer: ii. Haploid, fertile, medium sized, hairy**"},{"g":"10","n":3,"c":"Honey Bee","a":"honeybee मौरी मौरीपालन मौरी पालन","t":"Honey Bee – Exercise 1(h): Where does the queen bee store the sperms received from the drone bee after the nuptial flight? | मौरी अभ्यास 1(h)","q":"Where does the queen bee store the sperms received from the drone bee after the nuptial flight?","o":"1(h)","s":"","x":"Chapter: Honey Bee (मौरी) – Class 10 Science, SEE. Exercise 1(h).\n\n**Answer: iii. Sperm sac**"},{"g":"10","n":3,"c":"Honey Bee","a":"honeybee मौरी मौरीपालन मौरी पालन","t":"Honey Bee – Exercise 2(a): Differentiate between drone bee and worker bee. | मौरी अभ्यास 2(a)","q":"Differentiate between drone bee and worker bee.","o":"2(a)","s":"","x":"Chapter: Honey Bee (मौरी) – Class 10 Science, SEE. Exercise 2(a).\n\n|  | Drone bee | Worker bee |\n|---|---|---|\n| Size | Drone is smaller than the queen but larger than the worker. | Worker bee is the smallest bee in the hive. |\n| Body | It is blackish and hairy. | Its legs are densely covered with hair. |\n| Sting | It has no sting. | It has a sting gland for protecting the hive. |\n| Pollen basket | It has no pollen basket. | It has pollen baskets on its legs. |\n| Wax glands | It has no wax-producing glands. | It has four pairs of wax glands. |\n| Chromosomes | It is haploid and has 16 chromosomes. | It is diploid and has 32 chromosomes. |\n| Function | Its main function is to fertilize the queen bee. | It collects nectar and pollen, constructs the hive, nurses young ones and protects the hive. |"},{"g":"10","n":3,"c":"Honey Bee","a":"honeybee मौरी मौरीपालन मौरी पालन","t":"Honey Bee – Exercise 2(b): Differentiate between queen bee and worker bee. | मौरी अभ्यास 2(b)","q":"Differentiate between queen bee and worker bee.","o":"2(b)","s":"","x":"Chapter: Honey Bee (मौरी) – Class 10 Science, SEE. Exercise 2(b).\n\n|  | Queen bee | Worker bee |\n|---|---|---|\n| Size | It is the largest and elongated bee in the hive. | It is the smallest bee in the hive. |\n| Number | Generally, there is only one queen in a hive. | About 20,000–80,000 worker bees may be found in a hive. |\n| Main function | Its main function is to lay eggs. | It performs different works in the hive. |\n| Control and work | It controls the activities of the hive by pheromones. | It collects nectar and pollen, constructs the hive, feeds larvae and protects the hive. |\n| Life span | It lives about 2–5 years. | It lives about 6 weeks to 6 months. |\n| Chromosomes | It is diploid with 32 chromosomes. | It is diploid with 32 chromosomes. |"},{"g":"10","n":3,"c":"Honey Bee","a":"honeybee मौरी मौरीपालन मौरी पालन","t":"Honey Bee – Exercise 2(c): Differentiate between queen bee and drone bee. | मौरी अभ्यास 2(c)","q":"Differentiate between queen bee and drone bee.","o":"2(c)","s":"","x":"Chapter: Honey Bee (मौरी) – Class 10 Science, SEE. Exercise 2(c).\n\n|  | Queen bee | Drone bee |\n|---|---|---|\n| Size | Queen is the largest bee in the hive. | Drone is smaller than the queen. |\n| Body | It is elongated. | It is blackish and hairy. |\n| Sting | It has a sting. | It does not have a sting. |\n| Function | Its main function is to lay eggs. | Its function is to fertilize the queen. |\n| Chromosomes | It is diploid and has 32 chromosomes. | It is haploid and has 16 chromosomes. |\n| Life span | It lives about 2–5 years. | It survives for about two months. |"},{"g":"10","n":3,"c":"Honey Bee","a":"honeybee मौरी मौरीपालन मौरी पालन","t":"Honey Bee – Exercise 3(a): Give reason: Honey bee is called a social insect. | मौरी अभ्यास 3(a)","q":"Give reason: Honey bee is called a social insect.","o":"3(a)","s":"","x":"Chapter: Honey Bee (मौरी) – Class 10 Science, SEE. Exercise 3(a).\n\nHoney bees live in large colonies in a hive. There are three types of bees—queen, worker and drone. They have a high level of understanding, discipline and division of labour. Therefore, honey bee is called a social insect."},{"g":"10","n":3,"c":"Honey Bee","a":"honeybee मौरी मौरीपालन मौरी पालन","t":"Honey Bee – Exercise 3(b): Give reason: Pasture land is required for bee farming. | मौरी अभ्यास 3(b)","q":"Give reason: Pasture land is required for bee farming.","o":"3(b)","s":"","x":"Chapter: Honey Bee (मौरी) – Class 10 Science, SEE. Exercise 3(b).\n\nHoney bees collect nectar and pollen from flowers to make honey and feed the colony. Therefore, flowering plants and pasture land are required near the beekeeping area so that bees can collect sufficient nectar and pollen."},{"g":"10","n":3,"c":"Honey Bee","a":"honeybee मौरी मौरीपालन मौरी पालन","t":"Honey Bee – Exercise 3(c): Give reason: Drone dies after mating. | मौरी अभ्यास 3(c)","q":"Give reason: Drone dies after mating.","o":"3(c)","s":"","x":"Chapter: Honey Bee (मौरी) – Class 10 Science, SEE. Exercise 3(c).\n\nAfter mating, the genital organs of the drone are forcibly pulled during mating. Therefore, the drone dies after mating."},{"g":"10","n":3,"c":"Honey Bee","a":"honeybee मौरी मौरीपालन मौरी पालन","t":"Honey Bee – Exercise 3(d): Give reason: Bees are multipurpose insects. | मौरी अभ्यास 3(d)","q":"Give reason: Bees are multipurpose insects.","o":"3(d)","s":"","x":"Chapter: Honey Bee (मौरी) – Class 10 Science, SEE. Exercise 3(d).\n\nBees are multipurpose insects because they provide several benefits. They produce honey and beeswax, help in pollination of plants and can provide income through apiculture and extraction of royal jelly."},{"g":"10","n":3,"c":"Honey Bee","a":"honeybee मौरी मौरीपालन मौरी पालन","t":"Honey Bee – Exercise 4(a): Write the various types of bee found in the hive. | मौरी अभ्यास 4(a)","q":"Write the various types of bee found in the hive.","o":"4(a)","s":"","x":"Chapter: Honey Bee (मौरी) – Class 10 Science, SEE. Exercise 4(a).\n\nThere are three types of bees found in a hive:\n\n1. **Queen bee**\n2. **Drone bee**\n3. **Worker bee**"},{"g":"10","n":3,"c":"Honey Bee","a":"honeybee मौरी मौरीपालन मौरी पालन","t":"Honey Bee – Exercise 4(b): What is the function of the drone bee? | मौरी अभ्यास 4(b)","q":"What is the function of the drone bee?","o":"4(b)","s":"","x":"Chapter: Honey Bee (मौरी) – Class 10 Science, SEE. Exercise 4(b).\n\nThe main function of the drone bee is to **fertilize the queen bee**.\n\nAccording to the textbook, drones also help to make the hive warm."},{"g":"10","n":3,"c":"Honey Bee","a":"honeybee मौरी मौरीपालन मौरी पालन","t":"Honey Bee – Exercise 4(c): If the queen bee dies for some reason, who will control the hive? | मौरी अभ्यास 4(c)","q":"If the queen bee dies for some reason, who will control the hive?","o":"4(c)","s":"","x":"Chapter: Honey Bee (मौरी) – Class 10 Science, SEE. Exercise 4(c).\n\nThe textbook states that the **queen bee controls the activities of all bees in the hive** and that worker bees form a new queen by feeding royal jelly to a larva.\n\nTherefore, if the queen dies, the **worker bees prepare a new queen** by feeding royal jelly to a suitable larva."},{"g":"10","n":3,"c":"Honey Bee","a":"honeybee मौरी मौरीपालन मौरी पालन","t":"Honey Bee – Exercise 4(d): How does the queen bee control other members of the hive? | मौरी अभ्यास 4(d)","q":"How does the queen bee control other members of the hive?","o":"4(d)","s":"","x":"Chapter: Honey Bee (मौरी) – Class 10 Science, SEE. Exercise 4(d).\n\nThe queen bee controls the activities of other bees by producing a special scented substance called **pheromone**. Pheromones are also used for communication and to find the location of the hive."},{"g":"10","n":3,"c":"Honey Bee","a":"honeybee मौरी मौरीपालन मौरी पालन","t":"Honey Bee – Exercise 4(e): Write the uses of honey. | मौरी अभ्यास 4(e)","q":"Write the uses of honey.","o":"4(e)","s":"","x":"Chapter: Honey Bee (मौरी) – Class 10 Science, SEE. Exercise 4(e).\n\nHoney is used:\n\n- In Ayurvedic medicine.\n- To make candy.\n- To make cakes.\n- To make bread.\n- As a nutritious food."},{"g":"10","n":3,"c":"Honey Bee","a":"honeybee मौरी मौरीपालन मौरी पालन","t":"Honey Bee – Exercise 4(f): Describe the structure of the queen bee. | मौरी अभ्यास 4(f)","q":"Describe the structure of the queen bee.","o":"4(f)","s":"","x":"Chapter: Honey Bee (मौरी) – Class 10 Science, SEE. Exercise 4(f).\n\nThe queen bee is the **largest and elongated bee** in the hive. Its head is smaller and more rounded than those of the other bees. Its proboscis is short and covered with hairs. A sting is present at the end of its abdomen.\n\nGenerally, only one queen bee is found in a hive. Its main function is to lay eggs. It produces pheromones that help control the activities of the hive and communicate with other bees.\n\nA queen bee can live for about **2–5 years**."},{"g":"10","n":3,"c":"Honey Bee","a":"honeybee मौरी मौरीपालन मौरी पालन","t":"Honey Bee – Exercise 4(g): Mention the functions of the worker bee. | मौरी अभ्यास 4(g)","q":"Mention the functions of the worker bee.","o":"4(g)","s":"","x":"Chapter: Honey Bee (मौरी) – Class 10 Science, SEE. Exercise 4(g).\n\nThe functions of worker bees include:\n\n- Cleaning the hive.\n- Providing warmth to eggs, larvae and pupae.\n- Feeding larvae.\n- Producing royal jelly.\n- Constructing the honeycomb.\n- Collecting nectar.\n- Collecting pollen.\n- Collecting water.\n- Protecting the hive.\n- Nursing young ones.\n- Sealing larval and honey cells."},{"g":"10","n":3,"c":"Honey Bee","a":"honeybee मौरी मौरीपालन मौरी पालन","t":"Honey Bee – Exercise 4(h): Explain how the division of labour occurs in bees. | मौरी अभ्यास 4(h)","q":"Explain how the division of labour occurs in bees.","o":"4(h)","s":"","x":"Chapter: Honey Bee (मौरी) – Class 10 Science, SEE. Exercise 4(h).\n\nThere is a high degree of division of labour among honey bees according to their type and age.\n\n**Drone bee**\nThroughout its life, the drone fertilizes the queen bee and helps make the hive warm.\n\n**Queen bee**\nThroughout its life, the queen lays eggs and regulates hive activities by secreting pheromones.\n\n**Worker bee**\n- **1–3 days:** Cleans the hive and provides warmth to eggs, larvae and pupae.\n- **4–6 days:** Feeds honey bread to larvae.\n- **7–11 days:** Produces royal jelly from the royal gland and feeds it to larvae and the queen.\n- **12–17 days:** Uses wax glands to make honeycomb and seal larval and honey cells.\n- **18–20 days:** Protects the hive using its sting gland.\n- **After 21 days:** Collects nectar, pollen, water and other materials.\n\nThus, different bees and different age groups of worker bees perform different tasks."},{"g":"10","n":3,"c":"Honey Bee","a":"honeybee मौरी मौरीपालन मौरी पालन","t":"Honey Bee – Exercise 4(i): Explain the life cycle of honey bee with diagram. | मौरी अभ्यास 4(i)","q":"Explain the life cycle of honey bee with diagram.","o":"4(i)","s":"","x":"Chapter: Honey Bee (मौरी) – Class 10 Science, SEE. Exercise 4(i).\n\nHoney bees complete their life cycle in **four stages**:\n\n**Egg → Larva → Pupa → Adult**\n\n**1. Egg**\nThe queen lays eggs in the brood cells. The eggs are white and elongated. The egg stage lasts for **3 days**.\nFertilized eggs develop into queen and worker bees, while unfertilized eggs develop into drones.\n\n**2. Larva**\nAfter three days, the egg hatches into a larva. The larval stage lasts about:\n- Queen — 5.5 days\n- Worker — 6 days\n- Drone — 7 days\n\nThe larva actively feeds during this stage and moults five times.\n\n**3. Pupa**\nThe pupa is an inactive stage. It does not feed or move, but structural changes occur in its body. Legs, wings and mouthparts develop during this stage.\nThe pupal stage lasts:\n- Queen — 7.5 days\n- Worker — 12 days\n- Drone — 14 days\n\n**4. Adult**\nAfter the changes are completed, the pupa becomes an adult bee. The adult comes out of the brood cell by chewing the wax covering.\n\n**Life-cycle diagram**\n\n```text\n             ┌─────────────┐\n             │     Egg     │\n             └──────┬──────┘\n                    ↓\n             ┌─────────────┐\n             │    Larva    │\n             └──────┬──────┘\n                    ↓\n             ┌─────────────┐\n             │    Pupa     │\n             └──────┬──────┘\n                    ↓\n             ┌─────────────┐\n             │    Adult    │\n             └──────┬──────┘\n                    │\n                    └────────→ Egg\n```\n\nThis complete transformation is called **complete metamorphosis**."},{"g":"10","n":3,"c":"Honey Bee","a":"honeybee मौरी मौरीपालन मौरी पालन","t":"Honey Bee – Exercise 4(j): What is the process called in which a drone is developed from an unfertilized egg? (parthenogenesis) | मौरी अभ्यास 4(j)","q":"What is the process called in which a drone is developed from an unfertilized egg? (parthenogenesis)","o"
